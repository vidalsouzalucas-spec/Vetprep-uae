<!DOCTYPE html>
<html lang="en">
<head>

<title>VetPrep UAE - Small Animal Clinical Trainer</title>

<style>
:root{
  --bg:#f4f7f6; --card:#ffffff; --ink:#1f2d32; --muted:#64757c; --line:#e3eae8; --line2:#c6d1ce; --soft:#eef2f1; --soft2:#fafcfb; --bg-t:rgba(244,247,246,.92); --abn-bg:#fff5f4;
  --teal-ink:#1f7f74; --coral-ink:#b5533a; --violet-ink:#5a4bb8; --blue-ink:#2f6fa8; --warn-ink:#9a6412;
  --teal:#2a9d8f; --teal-d:#1f7f74; --teal-bg:#e4f3f0;
  --coral:#e07a5f; --coral-bg:#fbe9e3;
  --violet:#7b6cd9; --violet-bg:#ebe8f9;
  --blue:#3d8bd4; --blue-bg:#e3eff9;
  --amber:#d98e2b; --amber-bg:#fbefdc; --amber-ink:#9a6412; --gray-ink:#64757c;
  --rose:#c65d8a; --rose-bg:#f9e4ec; --rose-ink:#9c3f69;
  --sage:#5f9e4a; --sage-bg:#e8f3e1; --sage-ink:#3e7a2c;
  --ok:#2a9d8f; --ok-bg:#e4f3f0; --bad:#d9534f; --bad-bg:#fbe6e5; --warn:#e9a23b; --warn-bg:#fdf1dc;
  --r:16px; --shadow:0 1px 3px rgba(20,40,45,.06),0 4px 14px rgba(20,40,45,.05);
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#111a1d; --card:#1a2529; --ink:#e4ecee; --muted:#95a6ad; --line:#2a3a40; --line2:#3b4d54; --soft:#223035; --soft2:#1f2b30; --bg-t:rgba(17,26,29,.92); --abn-bg:#2b2224;
  --teal:#3fb8a8; --teal-d:#5fcfc0; --teal-bg:#17352f; --teal-ink:#7fd9cb;
  --coral:#e8886e; --coral-bg:#3b241e; --coral-ink:#f0a28c;
  --violet:#9a8cf0; --violet-bg:#28244a; --violet-ink:#bdb3f7;
  --blue:#5aa0e6; --blue-bg:#1a2c40; --blue-ink:#8fc0f3;
  --amber:#e5a24a; --amber-bg:#3a2d16; --amber-ink:#f0c27a;
  --rose:#e07aa6; --rose-bg:#3d2230; --rose-ink:#f2a6c6;
  --sage:#7fc06a; --sage-bg:#20341a; --sage-ink:#a9dd98;
  --ok:#3fb8a8; --ok-bg:#17352f; --bad:#e8706b; --bad-bg:#3a2222; --warn:#e9b454; --warn-bg:#3a2f16; --warn-ink:#f0c27a; --gray-ink:#95a6ad;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input,select{font:inherit}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg-t);backdrop-filter:blur(8px);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px}
.topbar h1{font-size:17px;margin:0;flex:1;font-weight:650;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:600;background:var(--teal);color:#fff;transition:transform .05s, background .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.icon{padding:8px;width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:14px}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px}
p{margin:0 0 10px}
ul{margin:0 0 8px;padding-left:20px}
li{margin-bottom:4px}
/* home */
.hero{padding:22px 16px 8px}
.hero h2{font-size:26px}
.modes{display:grid;grid-template-columns:1fr;gap:12px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);width:100%}
.mode .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.mode .t{flex:1}
.mode .t b{display:block;font-size:17px}
.mode .t span{display:block;color:var(--muted);font-size:13.5px}
.mode .pct{font-size:13px;font-weight:600;color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.prog > div{height:100%;border-radius:6px;transition:width .3s}
.c-quiz{--mc:var(--teal);--mcb:var(--teal-bg)}
.c-cases{--mc:var(--coral);--mcb:var(--coral-bg)}
.c-lab{--mc:var(--violet);--mcb:var(--violet-bg)}
.c-fluids{--mc:var(--blue);--mcb:var(--blue-bg)}
.c-drugs{--mc:var(--amber);--mcb:var(--amber-bg)}
.c-cyto{--mc:var(--rose);--mcb:var(--rose-bg)}
.c-cyto .mode-chip{color:var(--rose-ink)}
.c-basic{--mc:var(--sage);--mcb:var(--sage-bg)}
.c-basic .mode-chip{color:var(--sage-ink)}
.basictabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px;scrollbar-width:none}.basictabs::-webkit-scrollbar{display:none}
.basictabs button{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.basictabs button.on{background:var(--sage);border-color:var(--sage);color:#fff}
.basictabs button small{opacity:.8;font-weight:500;margin-left:4px}
.mode .ic,.chip.mode-chip{background:var(--mcb);color:var(--mc)}
.prog > div{background:var(--mc,var(--teal))}
/* generic */
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--teal-bg);color:var(--teal-ink)}
.chip.gray{background:var(--soft);color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.space{justify-content:space-between}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.stats b{color:var(--ink)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;line-height:1.4;transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--line2)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.6}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px;line-height:1.5}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.info{background:var(--blue-bg);border-left:4px solid var(--blue)}
.fb.warn{background:var(--warn-bg);border-left:4px solid var(--warn)}
.fb b{display:block;margin-bottom:4px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.sel{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;max-width:100%}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding-left:32px;margin-bottom:8px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--blue-bg);color:var(--blue-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stepper{display:flex;gap:6px;margin-bottom:10px}
.stepper span{flex:1;height:5px;border-radius:5px;background:var(--line)}
.stepper span.on{background:var(--mc,var(--teal))}
/* cases */
.section-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 0 4px}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card);width:100%;text-align:left}
.check .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.check.on{border-color:var(--coral);background:var(--coral-bg)}
.check.on .box{background:var(--coral);border-color:var(--coral)}
.result{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.result .nm{font-weight:650;display:flex;justify-content:space-between;gap:8px;align-items:center}
.result .rs{margin:4px 0;font-size:15px}
.result .nt{font-size:13.5px;color:var(--muted)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
.tag.key{background:var(--ok-bg);color:var(--teal-ink)}
.tag.low{background:var(--soft);color:var(--muted)}
.tag.miss{background:var(--warn-bg);color:var(--warn-ink)}
/* lab */
table.lab{width:100%;border-collapse:collapse;font-size:14.5px}
table.lab th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.lab td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.lab tr.sel-row{cursor:pointer}
table.lab tr.flag td{background:var(--violet-bg)}
table.lab tr.hi td.val,table.lab tr.lo td.val{font-weight:700}
table.lab tr.hi td.val{color:var(--bad)}
table.lab tr.lo td.val{color:var(--blue)}
table.lab tr.abn td{background:var(--abn-bg)}
table.lab td.val{white-space:nowrap}
table.lab td.ref{color:var(--muted);font-size:13px;white-space:nowrap}
.mark{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px}
.mark.hit{background:var(--ok-bg);color:var(--teal-ink)}
.mark.miss{background:var(--warn-bg);color:var(--warn-ink)}
.mark.fp{background:var(--soft);color:var(--muted)}
.legend{font-size:13px;color:var(--muted)}
/* fluids calc */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.out{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out .box{background:var(--blue-bg);border-radius:12px;padding:10px 12px}
.out .box small{display:block;color:var(--muted);font-size:12.5px}
.out .box b{font-size:20px;color:var(--blue-ink)}
.out .box.big{grid-column:1/-1;background:var(--blue);color:#fff}
.out .box.big small,.out .box.big b{color:#fff}
.out .box.big b{font-size:28px}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.ans{display:flex;gap:8px;align-items:center}
.ans input{flex:1;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:18px;background:var(--card);color:var(--ink)}
.ans span{color:var(--muted);font-size:14px}
.done-banner{text-align:center;padding:28px 16px}
.done-banner .big{font-size:40px}
footer{padding:14px 16px 28px;color:var(--muted);font-size:12.5px;text-align:center}
textarea{background:var(--soft2);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--soft);border-radius:12px;padding:10px 12px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi small{color:var(--muted);font-size:12px}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.bar .lbl{flex:0 0 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{flex:1;height:9px;background:var(--line);border-radius:9px;overflow:hidden}
.bar .trk > div{height:100%;border-radius:9px}
.bar .val{flex:0 0 64px;text-align:right;color:var(--muted);font-size:13px;white-space:nowrap}
.weak{display:flex;gap:8px;flex-wrap:wrap}
.weak button{padding:6px 12px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);font-weight:600;font-size:13px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13.5px}
.mini span{display:flex;justify-content:space-between;padding:6px 8px;background:var(--soft);border-radius:8px}
@media (min-width:520px){.modes{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div id="topbar" class="topbar"></div><div id="topprog"></div></header>
  <main id="main"></main>
  <footer>Study aid for exam preparation. Doses and protocols are examples; always confirm against current formularies and local MOCCAE regulations.</footer>
</div>
<script>
// ===== QUIZ DATA =====
// c: category, q: question, o: options (index 0 is always correct; options are shuffled at render), e: explanation
const QUIZ = [
// ---------- GI ----------
{c:"GI", q:"A 10-week-old unvaccinated puppy presents with acute vomiting, foul-smelling hemorrhagic diarrhea and marked leukopenia (WBC 1.2 x10^9/L). Most likely diagnosis?",
 o:["Canine parvovirus enteritis","Canine coronavirus enteritis","Giardiasis","Acute hemorrhagic diarrhea syndrome (AHDS)"],
 e:"Parvovirus destroys rapidly dividing cells (intestinal crypts + bone marrow), so hemorrhagic diarrhea plus neutropenia/leukopenia in an unvaccinated puppy is classic. Coronavirus causes milder, self-limiting diarrhea without leukopenia; Giardia causes chronic soft stools without leukopenia; AHDS typically affects adult small-breed dogs with hemoconcentration (PCV >60%) and normal WBC."},
{c:"GI", q:"Which test has the best sensitivity and specificity for diagnosing acute pancreatitis in a dog?",
 o:["Spec cPL (canine pancreatic lipase immunoreactivity)","Serum amylase and total lipase","Serum TLI (trypsin-like immunoreactivity)","Abdominal radiographs"],
 e:"Spec cPL is pancreas-specific and the recommended serum test (SNAP cPL is a point-of-care screen; a normal SNAP makes pancreatitis unlikely). Amylase/total lipase are non-specific (renal, GI, hepatic disease all raise them). TLI is the test for exocrine pancreatic insufficiency, not pancreatitis. Radiographs have low sensitivity (loss of serosal detail in the right cranial abdomen at best)."},
{c:"GI", q:"Which clinical feature is most consistent with large-bowel (colonic) diarrhea rather than small-bowel diarrhea?",
 o:["Small volumes passed frequently with tenesmus and mucus","Large volumes of watery stool 2-3 times daily","Melena","Marked weight loss with steatorrhea"],
 e:"Large-bowel diarrhea: increased frequency, small volume, tenesmus, mucus and fresh blood (hematochezia). Large volume, melena, weight loss and steatorrhea point to small-intestinal disease (malabsorption/maldigestion)."},
{c:"GI", q:"An owner reports that their dog 'vomits' food shortly after eating. Which feature indicates regurgitation rather than vomiting?",
 o:["Passive expulsion of undigested food with no abdominal effort or prodromal nausea","Retching and abdominal contractions before expulsion","Presence of bile in the material","Hypersalivation and lip licking before the event"],
 e:"Regurgitation is passive (esophageal), with no retching, no bile and no prodromal signs; it suggests megaesophagus, esophagitis or a stricture. Abdominal contractions, bile and nausea signs (hypersalivation, lip licking) indicate true vomiting, a centrally mediated reflex."},
{c:"GI", q:"Maropitant (Cerenia) prevents vomiting by acting as a:",
 o:["Neurokinin-1 (NK1) receptor antagonist","Dopamine D2 receptor antagonist","5-HT3 receptor antagonist","Histamine H1 receptor antagonist"],
 e:"Maropitant blocks substance P at NK1 receptors in the emetic center and CRTZ, so it works against both central and peripheral causes of vomiting. Metoclopramide is a D2 antagonist (plus prokinetic), ondansetron is a 5-HT3 antagonist, and H1 antagonists (diphenhydramine) mainly help motion sickness."},
{c:"GI", q:"Which radiographic finding is diagnostic of gastric dilatation-volvulus (GDV) in a deep-chested dog?",
 o:["Compartmentalization of the gas-filled stomach (double-bubble / 'reverse C') on a right lateral view","Generalized small-intestinal gas distension","Loss of serosal detail in the cranial abdomen","Gravel sign in the stomach"],
 e:"In GDV the pylorus moves dorsally and to the left; on a right lateral view a soft-tissue band divides the dilated stomach into two gas compartments. Diffuse SI gas suggests obstruction or ileus; loss of serosal detail suggests effusion; gravel sign suggests a chronic partial obstruction."},
{c:"GI", q:"A cat presents with vomiting and a string seen under the tongue. What is the correct action?",
 o:["Do NOT pull the string; image the abdomen and prepare for surgical removal (linear foreign body)","Pull the string gently to remove it","Induce emesis with xylazine","Feed a high-fiber diet to help it pass"],
 e:"A linear foreign body anchored at the tongue base causes intestinal plication; pulling can saw through the mesenteric border and perforate the bowel. Emesis is contraindicated. Surgery (or cutting the anchor only if very recent and no plication, under veterinary judgement) is required."},
{c:"GI", q:"A young German Shepherd has chronic weight loss despite polyphagia and voluminous greasy stools. Serum TLI is 1.8 ug/L (ref 5-35). Treatment?",
 o:["Powdered pancreatic enzyme supplement with each meal + cobalamin if low","Lifelong prednisolone","Tylosin for 6 weeks","Low-fat diet only"],
 e:"A low TLI confirms exocrine pancreatic insufficiency. Treatment is enzyme replacement with every meal; many dogs are hypocobalaminemic and need parenteral B12. Steroids and tylosin treat IBD/antibiotic-responsive enteropathy, not EPI."},
// ---------- DERMATOLOGY ----------
{c:"Dermatology", q:"A pruritic dog has alopecia and papules concentrated on the dorsal lumbosacral area and tail base. The most likely cause is:",
 o:["Flea allergy dermatitis","Sarcoptic mange","Atopic dermatitis","Demodicosis"],
 e:"Caudal-dorsal distribution (rump, tail base, caudal thighs) is the hallmark of flea allergy. Sarcoptes favors ear margins, elbows and hocks; atopy affects face, feet, axillae and ventrum; demodicosis is typically non-pruritic unless secondarily infected."},
{c:"Dermatology", q:"Which finding is most suggestive of sarcoptic mange (Sarcoptes scabiei) in a dog?",
 o:["Intense pruritus on ear margins and elbows with a positive pinnal-pedal reflex","Non-pruritic focal alopecia on the face of a puppy","Greasy, malodorous skin with lichenification","Symmetric truncal alopecia without pruritus"],
 e:"Sarcoptes causes intense pruritus with crusted ear margins, elbows, hocks and ventrum; the pinnal-pedal reflex is ~80% sensitive. Skin scrapings are often negative, so treatment trial (isoxazoline) is justified. It is zoonotic (transient papules in owners). The other descriptions suggest demodicosis, Malassezia dermatitis and endocrine alopecia."},
{c:"Dermatology", q:"Generalized juvenile demodicosis is diagnosed in a 6-month-old dog. Which is an appropriate first-line treatment?",
 o:["An oral isoxazoline (e.g., fluralaner or sarolaner)","Prednisolone 1 mg/kg to reduce inflammation","Ivermectin in a Collie without MDR1 testing","Topical chlorhexidine shampoo alone"],
 e:"Isoxazolines are highly effective and safe for demodicosis. Glucocorticoids are contraindicated (immunosuppression worsens Demodex). Ivermectin must never be used in herding breeds without ABCB1/MDR1 genotyping. Shampoos help secondary pyoderma but do not kill mites."},
{c:"Dermatology", q:"Tape-strip cytology from a dog's interdigital skin shows numerous peanut-shaped budding organisms. Diagnosis?",
 o:["Malassezia dermatitis","Dermatophytosis","Staphylococcal pyoderma","Demodicosis"],
 e:"Malassezia pachydermatis is a peanut/footprint-shaped yeast seen on cytology. Dermatophytes are not seen on tape cytology (need trichogram, culture or PCR); cocci indicate bacterial pyoderma; Demodex is found in deep scrapings/hair plucks."},
{c:"Dermatology", q:"A kitten has circular alopecia with scaling on the face; a child in the house has a ring-shaped lesion on the arm. Most likely cause and best confirmatory test?",
 o:["Microsporum canis; fungal culture (DTM) or dermatophyte PCR","Sarcoptes; skin scraping","Malassezia; tape cytology","Feline acne; bacterial culture"],
 e:"Dermatophytosis (mostly M. canis in cats) is zoonotic. Wood's lamp fluoresces only ~50% of M. canis strains, so a negative lamp does not rule it out; culture or PCR confirms. Treatment: itraconazole or terbinafine plus topical lime sulfur/enilconazole and environmental decontamination."},
{c:"Dermatology", q:"Which drug is a monoclonal antibody that neutralizes IL-31 for canine atopic dermatitis?",
 o:["Lokivetmab (Cytopoint)","Oclacitinib (Apoquel)","Ciclosporin (Atopica)","Hydroxyzine"],
 e:"Lokivetmab is a caninized anti-IL-31 antibody given SC every 4-8 weeks. Oclacitinib is a JAK1 inhibitor (oral), ciclosporin a calcineurin inhibitor, and hydroxyzine an antihistamine with limited efficacy."},
{c:"Dermatology", q:"First-line systemic antibiotic for superficial bacterial folliculitis (pyoderma) in a dog, pending culture?",
 o:["Cefalexin / cephalexin 22-30 mg/kg PO q12h for 3-4 weeks","Enrofloxacin 5 mg/kg PO q24h","Metronidazole 15 mg/kg PO q12h","Doxycycline 5 mg/kg PO q12h"],
 e:"First-tier agents for Staphylococcus pseudintermedius are cefalexin, amoxicillin-clavulanate, clindamycin or cefadroxil. Fluoroquinolones are reserved for culture-proven need (antimicrobial stewardship). Metronidazole has no activity against staphylococci; doxycycline is a second-tier option."},
// ---------- RENAL / UROLOGY ----------
{c:"Renal/Urinary", q:"According to IRIS guidelines, staging of chronic kidney disease should be based on:",
 o:["Fasting serum creatinine (and SDMA) measured at least twice in a stable, hydrated patient","A single creatinine value on the day of presentation","BUN alone","Urine specific gravity alone"],
 e:"IRIS staging uses creatinine/SDMA from a stable patient (not dehydrated, not acutely ill) on at least two occasions, then sub-stages by proteinuria (UPC) and blood pressure. SDMA rises when ~40% of GFR is lost (creatinine ~75%), so it detects earlier disease."},
{c:"Renal/Urinary", q:"A male cat with urethral obstruction has a heart rate of 120 bpm, absent P waves and tall peaked T waves on ECG. The life-saving first drug is:",
 o:["Calcium gluconate 10% 0.5-1.5 ml/kg IV slowly over 10-20 min with ECG monitoring","Furosemide 2 mg/kg IV","Enrofloxacin IV","Prazosin PO"],
 e:"These ECG changes indicate severe hyperkalemia. Calcium gluconate does not lower potassium but immediately stabilizes the myocardial membrane. Then lower K+ with IV fluids, dextrose +/- regular insulin, and relieve the obstruction. Furosemide is useless with no urine outflow."},
{c:"Renal/Urinary", q:"Struvite uroliths in dogs are most often associated with:",
 o:["Urinary tract infection with urease-producing bacteria (Staphylococcus, Proteus)","Hypercalciuria","Portosystemic shunt","Acidic urine pH"],
 e:"Canine struvite is usually infection-induced: urease splits urea, raising pH and ammonium. They can be dissolved with a dissolution diet plus appropriate antibiotics. Hypercalciuria favors calcium oxalate (not dissolvable); PSS causes urate stones; acidic urine favors oxalate/urate."},
{c:"Renal/Urinary", q:"A dog has BUN 60 mg/dL and creatinine 2.2 mg/dL. Which urine specific gravity best supports a PRErenal cause?",
 o:["1.045","1.012","1.018","1.008"],
 e:"With prerenal azotemia the kidneys concentrate urine appropriately (dogs >1.030, cats >1.035). Isosthenuria (1.008-1.012) or inadequate concentration with azotemia suggests renal failure (unless a concentrating defect such as Addison's, diuretics or hypercalcemia is present)."},
{c:"Renal/Urinary", q:"A urine protein:creatinine ratio (UPC) is considered proteinuric in dogs when it is:",
 o:[">0.5 (cats >0.4), on an inactive sediment",">0.1",">2.0 only",">5.0 only"],
 e:"IRIS defines proteinuria as UPC >0.5 in dogs and >0.4 in cats; 0.2-0.5 (dogs) is borderline. Persistent renal proteinuria is treated with an ACE inhibitor (benazepril) or ARB (telmisartan) plus a renal diet and omega-3."},
{c:"Renal/Urinary", q:"A dog from a farm presents with acute azotemia, icterus and thrombocytopenia. The staff should be warned because the most likely disease is zoonotic. Which drug clears the renal carrier state?",
 o:["Doxycycline 5 mg/kg PO q12h for 14 days","Amoxicillin for 5 days only","Enrofloxacin","Metronidazole"],
 e:"Leptospirosis causes AKI + hepatopathy and is zoonotic (urine). Penicillins or doxycycline treat the leptospiremic phase; doxycycline for 2 weeks is needed to eliminate renal shedding. Fluoroquinolones and metronidazole are not recommended."},
// ---------- ENDOCRINE ----------
{c:"Endocrine", q:"A 14-year-old cat has weight loss with polyphagia, tachycardia and a palpable cervical nodule. Best initial diagnostic test?",
 o:["Serum total T4","Serum cortisol","Fructosamine","Thyroid scintigraphy as first step"],
 e:"Total T4 is elevated in >90% of hyperthyroid cats; if normal with strong suspicion, repeat or measure free T4 by equilibrium dialysis. Scintigraphy is useful but not a first step. Treatment options: methimazole, radioiodine, thyroidectomy or an iodine-restricted diet."},
{c:"Endocrine", q:"Which insulin is generally recommended for initial management of a newly diagnosed diabetic cat?",
 o:["Glargine or protamine zinc insulin (PZI), starting ~0.25 U/kg q12h","Regular (short-acting) insulin SC q12h","Lente (porcine) insulin q24h","Oral glipizide as first choice"],
 e:"Long-acting insulins (glargine, PZI) give the best remission rates in cats when combined with a low-carbohydrate diet. Regular insulin is for DKA CRIs. Once-daily lente is insufficient in most cats. Oral hypoglycemics have low efficacy and delay proper control."},
{c:"Endocrine", q:"In a dog with diabetic ketoacidosis, which should be corrected BEFORE starting the insulin CRI?",
 o:["Fluid deficit and serum potassium (supplement KCl as insulin will drive K+ into cells)","Serum phosphorus must be normalized first","Blood glucose must be under 200 mg/dL first","Nothing; insulin is the first drug"],
 e:"Rehydrate for 1-2 h first and ensure K+ is >3.5 mmol/L; insulin shifts potassium (and phosphate) intracellularly and can cause fatal hypokalemia. Phosphate is supplemented if <1.5 mg/dL during therapy. Glucose is lowered gradually (~50 mg/dL/h) with dextrose added to fluids as needed."},
{c:"Endocrine", q:"Which test is recommended as the most sensitive screening test for canine hyperadrenocorticism?",
 o:["Low-dose dexamethasone suppression test (LDDST)","ACTH stimulation test","Urine cortisol:creatinine ratio (UCCR) as a confirmatory test","Baseline cortisol"],
 e:"LDDST has ~90-95% sensitivity and can also help differentiate pituitary from adrenal disease. ACTH stimulation is less sensitive (~80%) but is the test to monitor trilostane therapy and to diagnose iatrogenic Cushing's. UCCR is sensitive but non-specific, so it is used to RULE OUT disease, not to confirm."},
{c:"Endocrine", q:"A young dog in collapse has Na 126 mmol/L, K 7.1 mmol/L (Na:K ratio 17.7), bradycardia and no stress leukogram. Which glucocorticoid should be given while an ACTH stimulation test is still pending?",
 o:["Dexamethasone, because it does not cross-react with the cortisol assay","Prednisolone sodium succinate","Hydrocortisone","Any glucocorticoid is fine; the test is unaffected"],
 e:"Addisonian crisis: give 0.9% NaCl boluses and dexamethasone (0.1-0.5 mg/kg IV). Prednisolone and hydrocortisone are measured as cortisol and would invalidate the ACTH stimulation test. Long-term: desoxycorticosterone pivalate (DOCP) or fludrocortisone plus low-dose prednisolone."},
{c:"Endocrine", q:"A lethargic, obese dog with bilateral symmetric alopecia has low total T4 and HIGH cTSH. Appropriate action?",
 o:["Start levothyroxine ~0.02 mg/kg PO q12h (max 0.8 mg) and recheck T4 4-6 h post-pill in 4 weeks","Repeat T4 in 6 months; low T4 is probably sick euthyroid syndrome","Start methimazole","Start prednisolone for the dermatosis"],
 e:"Low T4 + elevated TSH in a dog with compatible signs confirms primary hypothyroidism (sick euthyroid dogs usually have low T4 with NORMAL TSH). Levothyroxine is the treatment; methimazole is for hyperthyroidism, and steroids further suppress thyroid hormone."},
// ---------- INFECTIOUS ----------
{c:"Infectious", q:"A 3-month-old kitten with severe vomiting and diarrhea has WBC 0.9 x10^9/L. Its littermate shows intention tremors and a wide-based stance. Which agent explains both?",
 o:["Feline panleukopenia virus (parvovirus) - in utero infection causes cerebellar hypoplasia","Feline coronavirus","Feline leukemia virus","Toxoplasma gondii"],
 e:"Feline panleukopenia virus destroys crypt cells and bone marrow (profound leukopenia) and, in late gestation or neonatal infection, cerebellar Purkinje cells, producing permanent non-progressive cerebellar ataxia. The canine parvo SNAP test cross-reacts and can be used."},
{c:"Infectious", q:"Abdominal effusion from a young cat is straw-colored, viscous, with total protein 5.8 g/dL, low cellularity and an albumin:globulin ratio of 0.3. Most compatible diagnosis?",
 o:["Effusive feline infectious peritonitis (FIP)","Congestive heart failure","Septic peritonitis","Hepatic cirrhosis with hypoalbuminemia"],
 e:"FIP effusions are protein-rich (>3.5 g/dL) but poorly cellular, with A:G <0.4-0.6 and a positive Rivalta test; immunocytochemistry/RT-PCR of the fluid supports diagnosis. CHF and hypoalbuminemia give low-protein transudates; septic effusions are highly cellular with degenerate neutrophils and bacteria. Antivirals (GS-441524 / remdesivir) now achieve high cure rates."},
{c:"Infectious", q:"A 4-month-old kitten tests positive for FIV antibody on a point-of-care ELISA. How should this be interpreted?",
 o:["Possibly maternal antibodies; retest after 6 months of age (or run PCR)","Confirmed infection; the kitten will develop immunodeficiency","Cross-reaction with FeLV; test for FeLV instead","False positive because kittens cannot be infected"],
 e:"FIV tests detect antibody, and kittens under 6 months may carry passive maternal antibodies from an infected or vaccinated queen. FeLV tests detect p27 antigen, so a positive FeLV result in a kitten is more reliable but should also be confirmed (repeat or PCR)."},
{c:"Infectious", q:"A 5-month-old unvaccinated dog has mucopurulent oculonasal discharge, pneumonia, hyperkeratosis of the nasal planum and footpads, and rhythmic jerking of the jaw muscles. Most likely diagnosis?",
 o:["Canine distemper virus","Canine infectious respiratory disease complex (Bordetella)","Rabies","Toxoplasmosis"],
 e:"Distemper combines respiratory, GI, dermatologic (hard pad disease) and neurologic signs; myoclonus is almost pathognomonic. Kennel cough stays respiratory. Rabies causes behavior change and progressive paralysis without hyperkeratosis."},
{c:"Infectious", q:"A healthy adult dog develops a harsh, honking, paroxysmal cough 5 days after boarding, with no systemic signs. Most appropriate management?",
 o:["Supportive care and rest; most cases of infectious tracheobronchitis are self-limiting in 1-2 weeks","Immediate doxycycline and prednisolone for all cases","Thoracic radiographs and bronchoscopy as first step","Isolation for 6 months"],
 e:"Uncomplicated canine infectious respiratory disease (Bordetella bronchiseptica, parainfluenza, adenovirus-2, etc.) is self-limiting. Doxycycline is reserved for cases with fever, mucopurulent discharge or lasting >10 days; steroids are avoided. Isolate from other dogs for ~2 weeks."},
// ---------- REPRODUCTIVE ----------
{c:"Reproductive", q:"An 8-year-old intact bitch is lethargic, polyuric and vomiting 5 weeks after estrus. Ultrasound shows fluid-filled uterine horns. The treatment of choice is:",
 o:["IV fluids, IV antibiotics and ovariohysterectomy as soon as she is stabilized","Antibiotics alone for 4 weeks","Prostaglandin F2-alpha alone in a closed-cervix pyometra","Wait until the next estrus and reassess"],
 e:"Pyometra is a surgical emergency: OHE after rapid stabilization. Medical management (aglepristone +/- low-dose prostaglandin) is reserved for stable, young, valuable breeding bitches with an OPEN cervix. Prostaglandins alone in a closed pyometra risk uterine rupture."},
{c:"Reproductive", q:"Which situation during whelping requires immediate veterinary intervention?",
 o:["Green-black vaginal discharge (uteroverdin) with no puppy delivered within 2-4 h","Clear discharge 24 h before the first puppy","10 minutes between puppies","Rectal temperature drop to 37.2 C 12 h before whelping"],
 e:"Uteroverdin before the first puppy indicates placental separation; a puppy must follow soon or fetal hypoxia ensues. Other red flags: >30 min of strong contractions without a puppy, >4 h between puppies with weak contractions, or >24 h since the temperature drop with no labor. The other options are normal findings."},
{c:"Reproductive", q:"A 4-year-old intact male dog has a retained abdominal testicle. The main reason to recommend removal is:",
 o:["High risk of Sertoli cell tumor (with feminization) and torsion; the condition is also heritable","Risk of prostatic abscess","It will cause urinary incontinence","Cryptorchid testicles are usually fertile and should be preserved"],
 e:"Retained testicles have a ~10-fold higher neoplasia risk (Sertoli cell tumor, seminoma) and can torse. Cryptorchidism is heritable, so the dog should be neutered (both testicles removed) rather than bred."},
{c:"Reproductive", q:"A small-breed bitch 3 weeks postpartum with a large litter develops panting, tremors, stiffness and hyperthermia (40.5 C). Treatment?",
 o:["Slow IV 10% calcium gluconate (0.5-1.5 ml/kg) with ECG monitoring, then oral calcium and wean puppies","IV diazepam only","Oxytocin","NSAIDs for the hyperthermia"],
 e:"Puerperal hypocalcemia (eclampsia) is treated with slow IV calcium gluconate while monitoring for bradycardia/arrhythmia. Diazepam may be needed for seizures but does not treat the cause. Antenatal calcium supplementation is NOT recommended (it suppresses parathyroid function and predisposes to eclampsia)."},
{c:"Reproductive", q:"An intact male dog has hematuria, tenesmus and a symmetrically enlarged, non-painful prostate. Best definitive treatment?",
 o:["Castration (prostate shrinks ~50% within weeks)","Long-term enrofloxacin","Prostatectomy","Estrogen therapy"],
 e:"Benign prostatic hyperplasia is androgen-dependent; castration is curative. Osaterone or finasteride are options when castration is declined. Antibiotics are for prostatitis (painful, febrile, with inflammatory prostatic fluid). Estrogens cause bone marrow suppression and squamous metaplasia."},
// ---------- EMERGENCY / TOXICOLOGY ----------
{c:"Emergency", q:"A dog in hypovolemic shock weighs 25 kg. A reasonable initial isotonic crystalloid bolus is:",
 o:["10-20 ml/kg (250-500 ml) over 15-20 min, then reassess perfusion parameters","90 ml/kg (2250 ml) as fast as possible without reassessment","2 ml/kg/h maintenance rate","5 ml/kg of 7.5% hypertonic saline as the only fluid"],
 e:"The full shock dose (dogs 80-90 ml/kg, cats 50-60 ml/kg) is given in incremental boluses of about one-quarter, reassessing heart rate, pulse quality, mucous membranes, CRT, lactate and blood pressure after each. Cats get 5-10 ml/kg boluses and are prone to volume overload."},
{c:"Emergency", q:"A dog develops facial swelling, hypotension and collapse minutes after a vaccine. The drug of choice is:",
 o:["Epinephrine 0.01 mg/kg IM (0.01 ml/kg of 1:1000)","Diphenhydramine 2 mg/kg IM as the only drug","Dexamethasone 0.5 mg/kg IV as the only drug","Furosemide 2 mg/kg IV"],
 e:"Anaphylaxis with cardiovascular collapse requires epinephrine (IM, or IV at 0.001-0.01 mg/kg if in shock), plus IV fluids and oxygen. Antihistamines and glucocorticoids are adjuncts with slow onset and do not treat hypotension or bronchospasm."},
{c:"Emergency", q:"A dog ingested antifreeze (ethylene glycol) 2 hours ago. Which treatment and finding are correct?",
 o:["Fomepizole (4-MP) IV; calcium oxalate monohydrate crystalluria appears within hours","Activated charcoal is the mainstay; crystals are struvite","N-acetylcysteine; expect Heinz bodies","Vitamin K1; expect prolonged PT"],
 e:"Fomepizole inhibits alcohol dehydrogenase and is the antidote in dogs (ethanol in cats or if fomepizole is unavailable; in cats fomepizole needs a higher dose within 3 h). Charcoal binds EG poorly. Early signs: ataxia, PU/PD, high osmolal gap, hypocalcemia; then AKI with calcium oxalate monohydrate crystals."},
{c:"Emergency", q:"Which type of chocolate has the HIGHEST theobromine content per gram?",
 o:["Baking (unsweetened) chocolate","Milk chocolate","White chocolate","Chocolate-flavored cereal"],
 e:"Baking chocolate contains ~14-16 mg/g theobromine, dark ~5 mg/g, milk ~2 mg/g, and white chocolate almost none. Mild signs appear at ~20 mg/kg, cardiotoxicity at 40-60 mg/kg. Treat with emesis (if early), activated charcoal, fluids, and beta-blockers for tachyarrhythmias."},
{c:"Emergency", q:"A dog ate sugar-free chewing gum 1 hour ago. The owner should be warned about:",
 o:["Xylitol-induced hypoglycemia (within 30-60 min) and possible acute hepatic necrosis","Theobromine toxicity","Methemoglobinemia","Hypercalcemia"],
 e:"Xylitol triggers massive insulin release in dogs (hypoglycemia at >0.1 g/kg) and hepatic necrosis at >0.5 g/kg. Induce emesis if asymptomatic, then monitor glucose for 12-24 h, give dextrose, and hepatoprotectants (SAMe, N-acetylcysteine). Cats are not clinically affected."},
{c:"Emergency", q:"An indoor cat chewed on a lily (Lilium sp.) bouquet 6 hours ago and is vomiting. Which is TRUE?",
 o:["All parts (even pollen) are nephrotoxic; decontaminate and give IV fluid diuresis for 48-72 h","Only the bulb is toxic; monitor at home","It causes hepatic failure; give SAMe","Dogs are affected equally"],
 e:"Lilium and Hemerocallis species cause acute kidney injury in cats only (dogs get GI upset). Aggressive IV fluids started within 18 h greatly improve the prognosis; anuric AKI by 24-72 h carries a grave prognosis."},
{c:"Emergency", q:"A cat develops generalized muscle tremors and seizures hours after the owner applied a dog spot-on flea product. Most likely toxin and key treatment?",
 o:["Permethrin (pyrethroid); methocarbamol IV for tremors, bathe with mild detergent, +/- intravenous lipid emulsion","Fipronil; atropine","Organophosphate; pralidoxime","Ivermectin; naloxone"],
 e:"Cats are deficient in glucuronidation and highly sensitive to concentrated permethrin. Methocarbamol controls tremors (diazepam/propofol for seizures), decontamination removes residual product, and ILE may shorten recovery. Fipronil is safe in cats; atropine is for organophosphates."},
{c:"Emergency", q:"According to the RECOVER CPR guidelines, which is correct for a 20 kg dog in cardiopulmonary arrest?",
 o:["Chest compressions 100-120/min, 1/3-1/2 chest width, uninterrupted 2-min cycles; low-dose epinephrine 0.01 mg/kg IV every other cycle","Compressions 60/min and ventilation 30 breaths/min","High-dose epinephrine (0.1 mg/kg) from the first cycle","Stop compressions every 30 s to check the pulse"],
 e:"RECOVER: 100-120 compressions/min, ventilate 10 breaths/min, 2-minute cycles with a brief pause for ECG check, epinephrine 0.01 mg/kg IV/IO every 3-5 min (high-dose only after prolonged CPR), atropine for vagally mediated arrest, and defibrillation for VF/pulseless VT."},
// ---------- PHARMACOLOGY ----------
{c:"Pharmacology", q:"Which drug combination is contraindicated because of the high risk of gastrointestinal ulceration and perforation?",
 o:["Meloxicam + prednisolone","Meloxicam + omeprazole","Amoxicillin-clavulanate + metronidazole","Maropitant + omeprazole"],
 e:"Concurrent NSAIDs and glucocorticoids markedly increase GI ulceration, perforation and AKI risk; never combine them, and keep a washout (several days) when switching. Omeprazole is a gastroprotectant often used with NSAIDs; the other pairs are routine combinations."},
{c:"Pharmacology", q:"Doxycycline tablets given dry to a cat can cause:",
 o:["Esophagitis and esophageal stricture; always follow with water/food or use a liquid formulation","Retinal degeneration","Hepatic lipidosis","Methemoglobinemia"],
 e:"Dry doxycycline (and clindamycin) tablets can lodge in the feline esophagus and cause ulceration and stricture. Retinal degeneration is the classic adverse effect of high-dose enrofloxacin in cats (>5 mg/kg/day)."},
{c:"Pharmacology", q:"Why should enrofloxacin not exceed 5 mg/kg q24h in cats?",
 o:["Risk of acute, often irreversible retinal degeneration and blindness","Risk of hepatic necrosis","Risk of nephrotoxicity","Risk of bone marrow suppression"],
 e:"Enrofloxacin at high doses causes retinal toxicity in cats (pradofloxacin and marbofloxacin are safer). Fluoroquinolones also damage cartilage in growing animals, so they are avoided in puppies/kittens."},
{c:"Pharmacology", q:"A Collie develops ataxia, mydriasis, hypersalivation and coma after an off-label dose of ivermectin. The underlying cause is:",
 o:["ABCB1 (MDR1) gene mutation causing P-glycoprotein deficiency, so the drug accumulates in the brain","Hepatic cytochrome P450 deficiency","Glucuronidation deficiency","Pseudocholinesterase deficiency"],
 e:"Herding breeds (Collies, Australian Shepherds, Shelties, etc.) often carry the MDR1 mutation; without P-glycoprotein at the blood-brain barrier, macrocyclic lactones (at high doses), loperamide, some chemotherapeutics and acepromazine cause CNS toxicity. Genotype before using such drugs."},
{c:"Pharmacology", q:"A cat given paracetamol (acetaminophen) by its owner presents with brown mucous membranes, dyspnea and facial edema. The antidote is:",
 o:["N-acetylcysteine (140 mg/kg loading, then 70 mg/kg q6h) plus oxygen; ascorbic acid as adjunct","Vitamin K1","Atropine","Fomepizole"],
 e:"Cats cannot glucuronidate acetaminophen; the toxic metabolite oxidizes hemoglobin (methemoglobinemia, Heinz bodies) and damages hepatocytes. NAC replenishes glutathione; also give oxygen, IV fluids and consider transfusion. Even 1 regular tablet (500 mg) can be fatal in a cat."},
{c:"Pharmacology", q:"A dog on prolonged high-dose metronidazole (>60 mg/kg/day) develops vertical nystagmus, ataxia and head tilt. Management?",
 o:["Stop metronidazole; diazepam 0.5 mg/kg PO q8h for 3 days shortens recovery","Increase the dose to treat the suspected CNS infection","Add enrofloxacin","Start prednisolone 2 mg/kg"],
 e:"Metronidazole neurotoxicity (central vestibular signs, seizures) is dose-related and reversible on withdrawal; diazepam acts on GABA receptors and speeds recovery. Keep total doses at 10-15 mg/kg q12h to avoid it."},
{c:"Pharmacology", q:"Which antimicrobial class is both nephrotoxic and ototoxic and must never be given to a dehydrated patient?",
 o:["Aminoglycosides (gentamicin, amikacin)","Cephalosporins","Macrolides","Tetracyclines"],
 e:"Aminoglycosides accumulate in renal tubular cells; give once daily (concentration-dependent killing, less toxicity) only in well-hydrated patients and monitor urine sediment for casts. Cephalosporins and macrolides are relatively safe; tetracyclines can discolor teeth in young animals and should be dose-adjusted in renal disease (except doxycycline)."},
// ---------- ZOONOSES & RABIES ----------
{c:"Zoonoses/Rabies", q:"A vaccinated dog bites a person in Abu Dhabi. According to standard rabies control practice, what should be done with the dog?",
 o:["Confine and observe for 10 days; if it stays healthy it was not shedding rabies virus at the time of the bite","Euthanize immediately and submit the head for testing","Nothing, because it is vaccinated","Give a rabies booster and release without observation"],
 e:"Dogs, cats and ferrets shed virus in saliva only within ~10 days of showing clinical signs, so a 10-day observation period (reported to the municipality/MOCCAE) is standard. Euthanasia and direct fluorescent antibody testing of brain tissue is reserved for suspect, unvaccinated or sick animals. Immediate wound washing and medical referral of the person for post-exposure prophylaxis are essential."},
{c:"Zoonoses/Rabies", q:"Which statement about rabies diagnosis in animals is correct?",
 o:["There is no reliable ante-mortem test; confirmation requires post-mortem brain tissue (direct fluorescent antibody test)","A serum antibody titer confirms active infection","Saliva PCR is the gold standard in live animals","Negri bodies are present in 100% of cases"],
 e:"Diagnosis is post-mortem on brain (brainstem, cerebellum, hippocampus) by dFA or PCR. Serology indicates vaccination response, not infection (used for pet travel, e.g., the RNATT titer >=0.5 IU/ml required by many countries including the UAE for imports from high-risk countries). Negri bodies are inconsistent."},
{c:"Zoonoses/Rabies", q:"A pregnant client asks whether she must rehome her healthy indoor cat because of toxoplasmosis. The best advice is:",
 o:["No; have someone else clean the litter tray daily (oocysts need 1-5 days to sporulate), wash hands, and avoid undercooked meat and unwashed vegetables","Yes; cats shed oocysts continuously for life","Yes; test the cat and rehome if seropositive","No, but feed the cat raw meat to boost immunity"],
 e:"Cats shed oocysts for only 1-3 weeks after their first infection, and fresh feces are not infective. A seropositive cat has usually already stopped shedding. Undercooked meat and contaminated soil/vegetables are the main human sources. Keep the cat indoors and avoid raw feeding."},
{c:"Zoonoses/Rabies", q:"A dog that has access to sheep offal in a rural area is a risk for which zoonosis causing hydatid cysts in humans?",
 o:["Echinococcus granulosus - treat dogs with praziquantel and prevent access to raw offal","Dipylidium caninum","Toxocara canis","Giardia duodenalis"],
 e:"Dogs are the definitive host of E. granulosus; eggs in feces infect humans and livestock (liver/lung cysts). Praziquantel every 4-6 weeks in endemic areas. Toxocara causes larva migrans; Dipylidium needs a flea intermediate host; Giardia causes diarrhea."},
{c:"Zoonoses/Rabies", q:"Cat scratch disease in humans is caused by which organism, and what is its vector among cats?",
 o:["Bartonella henselae, transmitted between cats by fleas (Ctenocephalides felis)","Pasteurella multocida, transmitted by ticks","Francisella tularensis, transmitted by mosquitoes","Capnocytophaga canimorsus, transmitted by mites"],
 e:"Bartonella henselae causes regional lymphadenopathy in people; cats (especially kittens and strays) are usually asymptomatic. Flea control is the key preventive measure. Pasteurella is the common bite-wound pathogen but is not flea-borne."},
{c:"Zoonoses/Rabies", q:"A breeding kennel reports late-term abortions and infertility; the owner has unexplained fever. The zoonotic agent to test for is:",
 o:["Brucella canis (serology/PCR; infected dogs should be neutered or euthanized and never bred)","Canine herpesvirus","Neospora caninum","Leptospira interrogans"],
 e:"B. canis causes abortion at 45-59 days, epididymitis, discospondylitis and is zoonotic (handling of aborted material). Treatment rarely clears infection. Herpesvirus and Neospora cause reproductive losses but are not significant zoonoses."},
{c:"Zoonoses/Rabies", q:"Which coronavirus relevant to the Arabian Peninsula has dromedary camels as its reservoir and is a zoonotic risk for veterinarians?",
 o:["MERS-CoV (Middle East respiratory syndrome coronavirus)","Feline coronavirus (FIP)","Canine enteric coronavirus","Bovine coronavirus"],
 e:"MERS-CoV circulates in dromedaries in the Gulf region; people in contact with camels (nasal secretions, raw milk) are at risk. Feline and canine coronaviruses are species-specific and not zoonotic."},
// ---------- VECTOR-BORNE & HEAT ----------
{c:"Vector-borne/Heat", q:"A dog imported from Spain has weight loss, exfoliative dermatitis with periocular alopecia, onychogryphosis, lymphadenopathy, hyperglobulinemia and proteinuria. First-line treatment for this disease?",
 o:["Meglumine antimoniate (50 mg/kg SC q12h for 4 weeks) + allopurinol (10 mg/kg PO q12h for 6-12 months)","Doxycycline 10 mg/kg for 28 days","Prednisolone 2 mg/kg q24h","Imidocarb dipropionate 6.6 mg/kg IM x2"],
 e:"This is canine leishmaniosis (Leishmania infantum, transmitted by Phlebotomus sandflies). Antimonials or miltefosine (2 mg/kg PO q24h, 28 days) combined with allopurinol are first-line; proteinuria is managed with a renal diet and benazepril. Doxycycline treats Ehrlichia; imidocarb treats Babesia; steroids are reserved for immune-mediated complications."},
{c:"Vector-borne/Heat", q:"Which finding has the highest diagnostic value for canine leishmaniosis?",
 o:["Amastigotes inside macrophages on lymph node or bone marrow cytology, or a high quantitative antibody titer (IFAT/ELISA) with compatible signs","A low positive titer in a healthy dog from an endemic area","Hyperglobulinemia alone","Positive Wood's lamp"],
 e:"Definitive diagnosis: visualization of amastigotes or PCR on tissue, or a high antibody titer with compatible clinical/laboratory signs (LeishVet staging). Low titers in endemic areas may reflect exposure without disease and need PCR/monitoring. Hyperglobulinemia is supportive but non-specific (also ehrlichiosis, FIP, myeloma)."},
{c:"Vector-borne/Heat", q:"A dog with a history of Rhipicephalus sanguineus ticks presents with epistaxis, fever, lymphadenopathy and platelets 35 x10^9/L. Treatment of choice?",
 o:["Doxycycline 10 mg/kg PO q24h for 28 days","Amoxicillin-clavulanate for 10 days","Prednisolone alone","Imidocarb as the only drug"],
 e:"Ehrlichia canis (and Anaplasma platys) are transmitted by the brown dog tick and cause thrombocytopenia; doxycycline for 4 weeks is the standard. Chronic ehrlichiosis can progress to pancytopenia with poor prognosis. Prednisolone is added only for severe immune-mediated thrombocytopenia."},
{c:"Vector-borne/Heat", q:"A dog has acute pale mucous membranes, fever, icterus, port-wine urine and a regenerative anemia with spherocytes absent; blood smear shows large paired piriform organisms inside erythrocytes. Treatment?",
 o:["Imidocarb dipropionate 6.6 mg/kg IM, repeated in 14 days (large Babesia, e.g., B. canis/vogeli)","Doxycycline for 28 days as monotherapy","Atovaquone + azithromycin is the only option","Prednisolone alone"],
 e:"Large Babesia species respond to imidocarb (atropine pre-treatment reduces cholinergic side effects). Small Babesia (B. gibsoni) need atovaquone + azithromycin. Hemoglobinuria distinguishes intravascular hemolysis from IMHA, although secondary IMHA can coexist. Transfuse if PCV <15-20%."},
{c:"Vector-borne/Heat", q:"Heartworm (Dirofilaria immitis) is transmitted by:",
 o:["Mosquitoes; prevention is a monthly macrocyclic lactone and adulticide treatment uses melarsomine with pre-treatment doxycycline","Rhipicephalus ticks; prevention is an isoxazoline","Sandflies; prevention is a deltamethrin collar","Fleas; prevention is an oral isoxazoline"],
 e:"Mosquito-borne; in warm climates year-round prevention is advised. Diagnosis: antigen test + microfilaria check (cats: antigen + antibody + echocardiography). American Heartworm Society protocol: doxycycline (kills Wolbachia) + macrocyclic lactone, then 3-dose melarsomine with strict exercise restriction."},
{c:"Vector-borne/Heat", q:"An English Bulldog is found collapsed in a parked car in August (ambient 45 C). Rectal temperature is 42.6 C. Which cooling approach is recommended?",
 o:["Active cooling with room-temperature water and fans (evaporative/convective), IV fluids, and STOP active cooling at ~39.5 C to avoid rebound hypothermia","Ice-water immersion until temperature is 37 C","NSAIDs (meloxicam) to lower the temperature","Cold water enemas and ice packs on the chest only"],
 e:"Ice water causes peripheral vasoconstriction and shivering, which slow heat loss. Antipyretics do not work (the hypothalamic set-point is normal) and worsen renal and GI injury. Monitor for the sequelae of heatstroke: DIC/coagulopathy, AKI, hepatic injury, GI translocation/sepsis, cerebral edema and arrhythmias; nucleated RBCs and hypoglycemia at admission carry a worse prognosis."},
{c:"Vector-borne/Heat", q:"Which patient has the highest risk of heatstroke during a summer walk in the UAE?",
 o:["A brachycephalic, obese dog with laryngeal/airway compromise","A lean Saluki accustomed to the climate","An indoor cat with air conditioning","A young Labrador walked at dawn with water"],
 e:"Brachycephalic conformation, obesity, thick coats, laryngeal paralysis, cardiac disease, previous heatstroke and lack of acclimatization are major risk factors. Dogs lose heat mainly by panting, so upper airway obstruction is critical. Advise walks before sunrise/after sunset and never leave animals in vehicles."},
{c:"Vector-borne/Heat", q:"Hepatozoon canis is acquired by the dog through:",
 o:["Ingestion of an infected Rhipicephalus sanguineus tick","The bite of the tick","A sandfly bite","Mosquito bite"],
 e:"Unlike Ehrlichia and Babesia (transmitted via tick saliva), Hepatozoon canis is transmitted when the dog eats the tick. Gamonts are seen in neutrophils; treatment is imidocarb. Tick control (including preventing ingestion) is the key."}
];
// ===== QUIZ DATA - BLOCK 2 =====
QUIZ.push(
// ---------- GI ----------
{c:"GI", q:"A 12-year-old cat has chronic vomiting, weight loss and diffusely thickened small-intestinal muscularis on ultrasound with mesenteric lymphadenopathy. Which is required to distinguish inflammatory bowel disease from small-cell (low-grade) lymphoma?",
 o:["Intestinal biopsies with histopathology plus immunohistochemistry and/or PCR for clonality (PARR)","Serum cobalamin and folate","Abdominal ultrasound measurements alone","Response to a hypoallergenic diet"],
 e:"IBD and small-cell alimentary lymphoma overlap clinically and on imaging; biopsies (endoscopic or full-thickness) with immunophenotyping (CD3 T-cell) and clonality testing are needed. Low cobalamin is common to both. Lymphoma is treated with chlorambucil + prednisolone and has a median survival of 2-3 years."},
{c:"GI", q:"An obese cat that stopped eating 10 days ago after a house move is icteric. ALP is 950 U/L, GGT 4 U/L (normal), bilirubin 6 mg/dL. Most likely diagnosis and cornerstone of treatment?",
 o:["Hepatic lipidosis; aggressive enteral nutrition via esophagostomy tube (start at 25-30% of RER and increase over 3-4 days)","Cholangitis; prednisolone","Extrahepatic bile duct obstruction; surgery","Lymphoma; chemotherapy"],
 e:"Marked ALP elevation with a normal GGT is characteristic of feline hepatic lipidosis (in cholangitis and obstruction GGT rises with ALP). Treatment is nutritional (a high-protein diet via feeding tube), with fluids, potassium, B12, and thiamine; refeeding syndrome must be avoided by gradual increase."},
{c:"GI", q:"A Yorkshire Terrier with chronic diarrhea has albumin 1.6 g/dL, globulins 2.0 g/dL, cholesterol 85 mg/dL and lymphocytes 0.6 x10^9/L. Urinalysis and liver function are normal. Most likely process?",
 o:["Protein-losing enteropathy (e.g., intestinal lymphangiectasia)","Protein-losing nephropathy","Hepatic insufficiency","Hypoadrenocorticism"],
 e:"Panhypoproteinemia (both albumin and globulins low) with hypocholesterolemia and lymphopenia is the classic PLE triad, especially lymphangiectasia in Yorkshire Terriers. PLN lowers albumin only (globulins normal) with proteinuria; liver failure shows low BUN, glucose and bile acid abnormalities."},
{c:"GI", q:"In a stable dog with chronic diarrhea (>3 weeks) and no alarm signs, what is the recommended FIRST therapeutic trial after excluding parasites?",
 o:["An elimination diet (hydrolyzed or novel single protein) for 2-4 weeks","Prednisolone 2 mg/kg/day","Metronidazole for 4 weeks","Tylosin for 6 weeks"],
 e:"Food-responsive enteropathy is the most common chronic enteropathy (50-60% respond). Diet trial comes before antibiotics (now discouraged because of dysbiosis and resistance) and before immunosuppression, which requires biopsy confirmation of IBD first."},
{c:"GI", q:"A dog on meloxicam develops melena and hematemesis. Which acid suppressant regimen is most effective for healing a suspected gastric ulcer?",
 o:["Omeprazole 1 mg/kg PO q12h (plus stopping the NSAID; sucralfate as adjunct)","Famotidine 0.5 mg/kg q24h","Ranitidine 2 mg/kg q12h","Misoprostol alone"],
 e:"Twice-daily proton-pump inhibitors produce superior and sustained gastric acid suppression compared with H2 blockers; famotidine loses efficacy within days (tachyphylaxis) and ranitidine is ineffective in dogs. Misoprostol prevents NSAID ulcers but is not the treatment of choice for an established bleed."},
{c:"GI", q:"A 5-year-old German Shepherd develops regurgitation; radiographs show a generalized megaesophagus. Which test is most important to find a treatable cause?",
 o:["Acetylcholine receptor antibody titer (acquired myasthenia gravis)","Serum amylase","Fecal flotation","Abdominal ultrasound"],
 e:"Acquired myasthenia gravis is the most common identifiable cause of adult-onset megaesophagus (~25%) and is treatable with pyridostigmine. Also test for hypoadrenocorticism and hypothyroidism. Management includes upright feeding (Bailey chair) and watching for aspiration pneumonia."},
// ---------- DERMATOLOGY ----------
{c:"Dermatology", q:"A cat has a non-painful, well-demarcated ulcer on the upper lip ('rodent ulcer') and linear plaques on the caudal thighs. What is the first step in management?",
 o:["Strict flea control and an allergy work-up (eosinophilic granuloma complex is a reaction pattern, usually allergic)","Wide surgical excision","Long-term antibiotics only","Radiotherapy"],
 e:"The eosinophilic granuloma complex (indolent ulcer, eosinophilic plaque, eosinophilic granuloma) is a cutaneous reaction pattern driven mainly by flea, food or environmental allergy. Control the trigger; glucocorticoids or ciclosporin control lesions. Biopsy if atypical (squamous cell carcinoma is a differential for lip lesions)."},
{c:"Dermatology", q:"Cytology of a chronic, purulent ear discharge shows numerous rods and neutrophils. The tympanic membrane cannot be visualized. Which topical cleaner is specifically useful as an adjunct against Pseudomonas?",
 o:["Tris-EDTA (potentiates antibiotics by damaging the bacterial cell wall), followed by a culture-guided topical antibiotic","Chlorhexidine 2% at high concentration","Any aminoglycoside drop regardless of eardrum status","Acetic acid 50%"],
 e:"Pseudomonas otitis needs cleaning, Tris-EDTA (also safe if the eardrum is ruptured), culture-based topical therapy (e.g., fluoroquinolone, polymyxin B, silver sulfadiazine) and treatment of the primary cause (allergy, otitis media). Aminoglycosides and chlorhexidine at high concentration are ototoxic when the eardrum is ruptured."},
{c:"Dermatology", q:"How is cutaneous adverse food reaction (food allergy) reliably diagnosed in a dog?",
 o:["An 8-week elimination diet with a novel or hydrolyzed protein, followed by provocation with the original diet","Serum food-specific IgE panel","Intradermal skin testing","Hair and saliva allergy tests"],
 e:"Serum IgE, intradermal, hair and saliva tests have poor accuracy for food allergy. Only a strict elimination diet (no treats, flavored medications or chews) with relapse on challenge is diagnostic. Food allergy often causes non-seasonal pruritus with otitis and GI signs."},
{c:"Dermatology", q:"An 8-week-old Golden Retriever puppy presents with acute swelling of the muzzle and eyelids, pustules on the face, submandibular lymphadenopathy and fever. Cytology shows pyogranulomatous inflammation without bacteria. Treatment?",
 o:["Immunosuppressive prednisolone (2 mg/kg/day) tapered over weeks, plus antibiotics if secondary infection","Antibiotics alone for 6 weeks","Ivermectin for demodicosis","Surgical drainage only"],
 e:"Juvenile cellulitis (puppy strangles) is a sterile, immune-mediated disease of puppies 3 weeks to 4 months old; it responds to glucocorticoids and can scar or become life-threatening if untreated. Always rule out demodicosis (skin scrapings) before steroids."},
{c:"Dermatology", q:"A dog has dorsal scaling that appears to move ('walking dandruff'), and the owner has itchy papules on the forearms. Most likely parasite?",
 o:["Cheyletiella spp.","Otodectes cynotis","Demodex canis","Trombicula autumnalis"],
 e:"Cheyletiella mites live on the skin surface and are zoonotic (transient papular dermatitis in people). Diagnose by tape strip or superficial scraping; treat all in-contact animals with isoxazolines or selamectin. Otodectes causes otitis, Demodex is not zoonotic, and Trombicula (harvest mites) cause seasonal interdigital/ear lesions."},
// ---------- RENAL / UROLOGY ----------
{c:"Renal/Urinary", q:"A 3-year-old indoor female cat has recurrent episodes of hematuria, pollakiuria and periuria that resolve in 5-7 days; urine culture is negative and radiographs show no stones. Best management?",
 o:["Multimodal environmental modification (litter trays, resources, play, reduced stress), increased water intake / wet food, and analgesia during flares; no antibiotics","Amoxicillin-clavulanate 14 days per episode","Prophylactic antibiotics for 6 months","Urethrostomy"],
 e:"This is feline idiopathic cystitis (~60-65% of feline lower urinary tract disease in young cats); it is sterile and stress-related. Antibiotics are not indicated with a negative culture. Analgesia (buprenorphine), possibly short courses of gabapentin, and MEMO reduce recurrences."},
{c:"Renal/Urinary", q:"A 6-year-old spayed Labrador leaks urine while sleeping but urinates normally when awake; urinalysis and culture are normal. Most likely diagnosis and first-line drug?",
 o:["Urethral sphincter mechanism incompetence; phenylpropanolamine (or estriol)","Ectopic ureter; surgery","Bacterial cystitis; antibiotics","Diabetes insipidus; desmopressin"],
 e:"USMI affects up to 20% of spayed medium/large bitches, typically with nocturnal/recumbent leakage. Alpha-agonists (phenylpropanolamine) or estrogens (estriol) are effective in ~85%. Ectopic ureters cause incontinence from birth/juvenile age."},
{c:"Renal/Urinary", q:"Which finding most strongly favors ACUTE kidney injury over chronic kidney disease in an azotemic dog?",
 o:["Normal-to-enlarged, often painful kidneys with good body condition and no anemia","Non-regenerative anemia","Small, irregular kidneys","Long history of weight loss and PU/PD"],
 e:"AKI patients usually have normal body condition, normal HCT (no time for erythropoietin deficiency), normal-to-large kidneys and often oliguria/anuria with a rapid creatinine rise (IRIS AKI grading starts at a 0.3 mg/dL increase within 48 h). CKD shows the chronic signs listed in the other options."},
{c:"Renal/Urinary", q:"Ultrasound of a vomiting, azotemic cat shows one small end-stage kidney and one enlarged kidney with pelvic dilation and a proximal ureteral calculus ('big kidney-little kidney'). Most appropriate definitive treatment?",
 o:["Decompression of the obstructed kidney (subcutaneous ureteral bypass device or ureteral stent) after medical stabilization","Dissolution diet for 3 months","Nephrectomy of the obstructed kidney","Furosemide and wait for passage"],
 e:"Calcium oxalate ureteroliths (the vast majority in cats) cannot be dissolved; a solitary functional kidney with obstruction is an emergency. Medical management (fluids, mannitol/prazosin) rarely works for >24-48 h; SUB devices or stents preserve renal function. Never remove the only kidney with recoverable function."},
{c:"Renal/Urinary", q:"Which statement about calcium oxalate uroliths in cats is correct?",
 o:["They cannot be dissolved medically; prevention relies on urine dilution (wet food), avoiding acidifying diets and treating hypercalcemia if present","They dissolve with an acidifying struvite-dissolution diet","They are usually caused by urinary tract infection","They are radiolucent"],
 e:"Calcium oxalate stones are radiopaque, sterile and non-dissolvable (removed by cystotomy or voiding urohydropropulsion if small). Acidifying diets promote oxalate formation; the goal is USG <1.030-1.035 and a neutral urine pH. Check ionized calcium - idiopathic hypercalcemia is a recognized cause in cats."},
// ---------- ENDOCRINE ----------
{c:"Endocrine", q:"A dog has episodic weakness and seizures; blood glucose during an episode is 42 mg/dL with a serum insulin of 38 uU/mL (reference 5-20). Most likely diagnosis?",
 o:["Insulinoma (inappropriately high insulin during hypoglycemia)","Hypoadrenocorticism","Hepatic failure","Sepsis"],
 e:"Insulin should be undetectable when glucose is <60 mg/dL; a normal or high insulin level at that moment confirms an insulin-secreting pancreatic tumor. Treat episodes with small frequent meals and glucose, then surgery (partial pancreatectomy) and/or prednisolone, diazoxide; metastasis to liver/lymph nodes is common."},
{c:"Endocrine", q:"A 10-year-old dog has PU/PD, total calcium 14.2 mg/dL, ionized calcium elevated and a low PTH; rectal examination reveals a 2 cm mass dorsolateral to the anus. Most likely cause of the hypercalcemia?",
 o:["Apocrine gland anal sac adenocarcinoma secreting PTH-related peptide (humoral hypercalcemia of malignancy)","Primary hyperparathyroidism","Vitamin D intoxication","Hypoadrenocorticism"],
 e:"Lymphoma and anal sac adenocarcinoma are the leading malignant causes of hypercalcemia in dogs (PTHrP-mediated, with suppressed PTH). Primary hyperparathyroidism shows an inappropriately normal/high PTH. Remember HARDIONS: Hyperparathyroidism, Addison's, Renal, vitamin D, Idiopathic (cats), Osteolytic, Neoplasia, Spurious."},
{c:"Endocrine", q:"How should a dog on trilostane for hyperadrenocorticism be monitored (ACVIM-aligned approach)?",
 o:["Clinical signs plus an ACTH stimulation test (or pre-pill cortisol) 10-14 days after starting and after each dose change, timed 2-4 h post-pill; target post-ACTH cortisol roughly 1.5-5.5 ug/dL","Low-dose dexamethasone suppression test monthly","Urine cortisol:creatinine ratio weekly","Serum ALP every 3 months"],
 e:"Trilostane inhibits 3-beta-HSD; monitoring is by clinical response and ACTH stimulation (or pre-pill cortisol) with electrolytes to detect iatrogenic hypoadrenocorticism (hyperkalemia, hyponatremia, lethargy, vomiting). LDDST and UCCR are diagnostic, not monitoring, tests."},
{c:"Endocrine", q:"A diabetic cat requires more than 1.5-2 U/kg of insulin per dose without control, is gaining weight, and has broad facial features and a prognathic jaw. Which test is indicated?",
 o:["Serum IGF-1 (feline acromegaly / hypersomatotropism)","Fructosamine only","Urine culture only","Total T4"],
 e:"Up to 25% of diabetic cats have hypersomatotropism from a pituitary adenoma; IGF-1 is the screening test (confirm with pituitary CT/MRI). Other causes of insulin resistance: steroid exposure, hyperthyroidism, UTI, dental disease, hyperadrenocorticism. Treatment: hypophysectomy, radiotherapy, or high insulin doses."},
{c:"Endocrine", q:"What is considered the treatment of choice (highest cure rate, single treatment) for feline hyperthyroidism when available and not contraindicated?",
 o:["Radioactive iodine (I-131)","Lifelong methimazole","Bilateral thyroidectomy without pre-treatment","Iodine-restricted diet alone"],
 e:"I-131 cures ~95% of cats with one subcutaneous dose and treats ectopic tissue; it requires isolation facilities. Methimazole controls but does not cure (adverse effects: facial excoriation, hepatopathy, cytopenias). Thyroidectomy risks hypoparathyroidism. Always evaluate renal function first because treatment can unmask CKD."},
// ---------- INFECTIOUS ----------
{c:"Infectious", q:"A cat has conjunctivitis, blepharospasm and a branching (dendritic) corneal ulcer. Most likely agent and treatment?",
 o:["Feline herpesvirus-1; oral famciclovir (plus topical antivirals or antibiotics for secondary infection)","Chlamydia felis; doxycycline","Feline calicivirus; supportive care","Mycoplasma; topical gentamicin"],
 e:"Dendritic ulcers are pathognomonic for FHV-1. Famciclovir (e.g., 90 mg/kg PO q12h) is the systemic antiviral of choice; L-lysine is no longer recommended. Topical corticosteroids are contraindicated with corneal ulceration. Stress reduction and vaccination (core) reduce recrudescence."},
{c:"Infectious", q:"Several kittens in a shelter have bilateral conjunctivitis with chemosis and no corneal ulcers; cytology shows intracytoplasmic inclusions in epithelial cells. Treatment?",
 o:["Doxycycline 10 mg/kg PO q24h for 4 weeks, treating all in-contact cats","Topical antibiotics for 5 days","Famciclovir","Enrofloxacin for 7 days"],
 e:"Chlamydia felis causes conjunctivitis in young cats (often unilateral then bilateral, marked chemosis). Systemic doxycycline for at least 4 weeks clears infection; treat the whole group. Amoxicillin-clavulanate is an alternative in kittens. It is a minor zoonosis (conjunctivitis in people)."},
{c:"Infectious", q:"Which oral ulceration pattern with lameness ('limping kitten syndrome') is most typical of feline calicivirus?",
 o:["Ulcers on the tongue and hard palate with transient polyarthritis/lameness","Dendritic corneal ulcers","Chemosis without oral lesions","Hyperkeratotic footpads"],
 e:"FCV causes oral vesicles/ulcers, upper respiratory signs and a transient febrile lameness; virulent systemic FCV causes edema, jaundice and high mortality. Core vaccination reduces severity but not infection. Supportive care; antibiotics only for secondary bacterial disease."},
{c:"Infectious", q:"A recently rehomed cat has pale mucous membranes, fever and a regenerative anemia; PCR is positive for Mycoplasma haemofelis. Treatment?",
 o:["Doxycycline 10 mg/kg PO q24h for 2-4 weeks (+/- prednisolone if immune-mediated hemolysis is suspected), transfusion if severe","Penicillin G","Imidocarb","Fenbendazole"],
 e:"Feline hemotropic mycoplasmosis (formerly Haemobartonella) is diagnosed by PCR (blood smears are insensitive). Doxycycline (or marbofloxacin/pradofloxacin) is effective; test for FeLV/FIV and control fleas (likely vector). Carrier status may persist."},
{c:"Infectious", q:"According to WSAVA guidelines, which vaccines are CORE for all dogs regardless of lifestyle?",
 o:["Canine distemper, adenovirus (CAV-2) and parvovirus - plus rabies wherever it is endemic or legally required (as in the UAE)","Bordetella and parainfluenza","Leptospira and Lyme","Canine coronavirus"],
 e:"Core: CDV, CAV, CPV (and rabies where required). Puppy series every 2-4 weeks until >=16 weeks, booster at 6-12 months, then every 3 years (rabies according to local law - annual registration requirements apply in the Emirates). Leptospira, Bordetella, parainfluenza and Lyme are non-core; coronavirus is not recommended."},
{c:"Infectious", q:"A dog with a healing paw wound develops a stiff gait, erect ears, wrinkled forehead and 'risus sardonicus' with trismus. Treatment?",
 o:["Wound debridement, metronidazole or penicillin, tetanus antitoxin, sedation/muscle relaxants in a dark quiet room, nutritional and respiratory support","Phenobarbital alone","Prednisolone","Doxycycline for 28 days"],
 e:"Tetanus (Clostridium tetani toxin) causes generalized muscle rigidity; dogs are relatively resistant but cases occur after wounds or dental eruption. Antitoxin neutralizes unbound toxin; metronidazole/penicillin kill the organism; supportive care for 3-4 weeks determines outcome."},
// ---------- REPRODUCTIVE ----------
{c:"Reproductive", q:"Serial serum progesterone in a bitch rises above 2 ng/mL on day 9 of proestrus and reaches 5-8 ng/mL on day 11. When should natural mating or fresh semen insemination take place?",
 o:["About 2-4 days after ovulation, i.e., around days 13-15 (progesterone 4-10 ng/mL marks ovulation; oocytes need ~48 h to mature)","On the first day of vulvar bleeding","On the day progesterone first exceeds 2 ng/mL","After progesterone falls below 1 ng/mL"],
 e:"The LH surge coincides with progesterone ~2 ng/mL; ovulation occurs ~48 h later (4-10 ng/mL); oocytes mature 2-3 days later and are fertile for ~2-3 days. Fertile window = ovulation + 2 to + 5 days (frozen semen: + 3 to + 4 days)."},
{c:"Reproductive", q:"Which statement about mammary tumors in dogs and cats is correct?",
 o:["About 50% of canine and 85-90% of feline mammary tumors are malignant; spaying before the first estrus reduces risk to <1% in dogs","Most canine mammary tumors are benign and never require surgery","Spaying has no effect on mammary tumor risk","Feline mammary tumors are usually benign fibroadenomas"],
 e:"Risk increases with each estrus (0.5% before the first, 8% after the first, 26% after the second heat). Cats have mostly aggressive adenocarcinomas; treatment is radical mastectomy (chain mastectomy in cats) and staging with thoracic radiographs and lymph node evaluation."},
{c:"Reproductive", q:"An owner requests termination of an unwanted pregnancy in a bitch confirmed at day 30 by ultrasound. The drug of choice in Europe/Middle East is:",
 o:["Aglepristone (progesterone receptor antagonist) 10 mg/kg SC on two consecutive days","Diethylstilbestrol (estrogen) for 5 days","Oxytocin","Prostaglandin F2-alpha alone at high dose"],
 e:"Aglepristone is effective up to day 45 with few side effects; confirm abortion by ultrasound 7-10 days later. Estrogens risk bone marrow aplasia and pyometra; prostaglandins alone cause marked side effects (vomiting, hypersalivation) and require repeated doses."},
{c:"Reproductive", q:"From which day of gestation can fetal skeletons be seen on radiographs to count puppies before whelping?",
 o:["From ~day 42-45 after the LH surge (best after day 50)","From day 20","From day 30","Only after day 60"],
 e:"Ultrasound detects pregnancy from day 20-25 and assesses viability (heart rates >200 bpm; <180 bpm = fetal distress). Relaxin is detectable from ~day 25. Radiographs after day 45-50 give the most accurate puppy count and are recommended before whelping to recognize dystocia (retained puppies)."},
{c:"Reproductive", q:"A free-roaming intact dog presents with a friable, cauliflower-like, bleeding mass on the penis. Cytology shows round cells with vacuolated cytoplasm. Treatment of choice?",
 o:["Vincristine 0.5-0.7 mg/m2 IV once weekly for 3-6 weeks (transmissible venereal tumor)","Wide surgical excision with penile amputation","Doxycycline","Cryotherapy only"],
 e:"TVT is a transplantable round-cell tumor spread by coitus or licking/sniffing, common where stray dogs are numerous (including the Gulf region). It is highly chemosensitive: vincristine achieves >90% cure; surgery alone has high recurrence. Monitor CBC for neutropenia."},
// ---------- EMERGENCY / TOXICOLOGY ----------
{c:"Emergency", q:"A Great Dane with GDV has a plasma lactate of 8.1 mmol/L at admission that fails to decrease after fluid resuscitation. What does this suggest?",
 o:["Higher likelihood of gastric wall necrosis and a worse prognosis; surgery and partial gastrectomy may be needed","Hepatic failure","Renal failure","No prognostic meaning"],
 e:"Initial lactate >6 mmol/L and especially failure to clear by >50% after resuscitation correlate with gastric necrosis and mortality. Management: decompression (trocarization/orogastric tube), IV fluids via cephalic catheters, then surgery with derotation, viability assessment and incisional gastropexy."},
{c:"Emergency", q:"A Golden Retriever collapses with muffled heart sounds, jugular distension, weak pulses that disappear on inspiration and an enlarged globoid cardiac silhouette. Correct emergency treatment?",
 o:["Pericardiocentesis (right 4th-5th intercostal space) under ECG monitoring; avoid diuretics","Furosemide 4 mg/kg IV","Pimobendan and ACE inhibitor","Dobutamine CRI"],
 e:"Cardiac tamponade depends on preload; diuretics and vasodilators lower venous return and can cause collapse. Pericardiocentesis is both diagnostic and life-saving. Common causes: hemangiosarcoma (right atrium), chemodectoma, idiopathic pericarditis."},
{c:"Emergency", q:"A dog in Al Ain is bitten by a saw-scaled viper (Echis carinatus). Which is the most likely systemic effect and the specific treatment?",
 o:["Consumptive coagulopathy with spontaneous bleeding; species-appropriate antivenom plus IV fluids, analgesia (avoid NSAIDs) and monitoring of PT/aPTT and platelets","Neurotoxic paralysis; neostigmine","Hyperkalemia; calcium gluconate","Methemoglobinemia; N-acetylcysteine"],
 e:"Echis venom is hemotoxic (procoagulant enzymes cause defibrination, thrombocytopenia and local tissue necrosis). Antivenom is the only specific therapy; corticosteroids have no benefit, and NSAIDs worsen bleeding and renal injury. Keep the limb below heart level and avoid tourniquets/incisions."},
{c:"Emergency", q:"A 1.2 kg Chihuahua puppy is found collapsed and hypothermic with a blood glucose of 30 mg/dL. Immediate treatment?",
 o:["IV dextrose bolus 0.5-1 ml/kg of 50% dextrose diluted 1:2-1:4 with saline, then a 2.5-5% dextrose CRI and warming","Insulin","Oral honey only while it is unconscious","Prednisolone"],
 e:"Toy-breed puppies have limited glycogen stores; juvenile hypoglycemia is treated with diluted IV dextrose (undiluted 50% is hyperosmolar and phlebitic). If no IV access, rub glucose/honey on the gums (an unconscious animal must not swallow). Look for an underlying cause (sepsis, parasites, portosystemic shunt)."},
{c:"Emergency", q:"A dog hit by a car has abdominal effusion. Which comparison confirms a uroabdomen?",
 o:["Effusion creatinine >2x serum creatinine (and potassium >1.4x serum)","Effusion glucose > blood glucose","Effusion lactate < blood lactate","Effusion bilirubin < serum bilirubin"],
 e:"Creatinine is a large molecule that equilibrates slowly, so a fluid:serum ratio >2:1 is diagnostic of urine leakage; potassium ratio >1.4:1 also supports it. Low fluid glucose and high fluid lactate suggest septic peritonitis; high fluid bilirubin suggests bile peritonitis. Manage with urinary diversion then surgical repair."},
{c:"Emergency", q:"A dog has been seizing continuously for 8 minutes. First-line treatment?",
 o:["Diazepam or midazolam 0.5 mg/kg IV (intranasal or rectal if no access), repeatable, then load levetiracetam 60 mg/kg IV or phenobarbital","Phenobarbital 2 mg/kg PO","Potassium bromide loading","Propofol CRI as the first drug"],
 e:"Benzodiazepines stop most seizures within minutes; if two doses fail, load a longer-acting drug and consider propofol or ketamine CRI for refractory status. Check glucose, calcium, toxins (e.g., permethrin, metaldehyde), and control hyperthermia. Oral drugs are useless during status epilepticus."},
{c:"Emergency", q:"Why must every cat be blood-typed before its first transfusion, even in an emergency?",
 o:["Type B cats have strong, naturally occurring anti-A alloantibodies, so a single mismatched transfusion can be fatal","Cats have no blood groups","Because type A is extremely rare","Because feline blood cannot be cross-matched"],
 e:"Feline AB system: most cats are type A, but type B is frequent in some breeds (British Shorthair, Devon Rex, Birman) and B cats have high-titer anti-A antibodies (acute hemolysis, death). Also consider Mik antigens; cross-match before second transfusions. Dogs can receive one DEA 1-untyped transfusion but typing is still recommended."},
{c:"Emergency", q:"Where should a needle be placed for thoracocentesis in a dyspneic dog with suspected pleural effusion?",
 o:["7th-9th intercostal space, cranial to the rib (vessels and nerves run caudal to each rib), ventral third for fluid / dorsal third for air","2nd intercostal space, caudal to the rib","At the costochondral junction of the 12th rib","Through the sternum"],
