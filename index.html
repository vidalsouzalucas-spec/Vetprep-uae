 id:"rabies", title:"Stray cat that bit a child", species:"Cat",
 signalment:"Adult intact male Domestic Shorthair of unknown age, ~3.5 kg, captured by the municipality after biting a 7-year-old child on the forearm in a residential compound.",
 history:"Neighbors report the cat was friendly and fed by residents until 3 days ago, when it became aggressive, attacked a dog, and today bit the child unprovoked. No vaccination history. The cat is now in a quarantine cage at the clinic.",
 pe:["Observed from a distance: ataxic, intermittently aggressive, lunging at the cage bars","Hypersalivation, inability to swallow (dysphagia), hoarse vocalization","Dilated pupils, anisocoria","Weakness of the hindlimbs progressing over the day; intermittent tremors","Handling attempted only with catch pole and heavy gloves"],
 tests:[
  {name:"Notify the competent authority (Abu Dhabi municipality / MOCCAE) and record the exposure", key:true, result:"Case registered; authorities direct that the animal be euthanized and the head submitted to the reference laboratory.", note:"Rabies is a notifiable disease; the veterinarian must report immediately. This is the legally required 'first test' in any suspected case and determines the next steps."},
  {name:"Refer the child immediately for medical assessment (wound care + rabies post-exposure prophylaxis)", key:true, result:"The child receives wound washing (15 min soap and water), rabies immunoglobulin infiltrated into the wound and a vaccine series started the same day.", note:"PEP must never wait for the animal's test results in a symptomatic suspect; rabies is almost 100% fatal once clinical, and PEP is nearly 100% effective if started promptly."},
  {name:"Post-mortem direct fluorescent antibody test (dFA) on brain tissue", key:true, result:"Positive for rabies virus antigen in brainstem and cerebellum; confirmed by RT-PCR.", note:"The gold-standard diagnostic test. Requires euthanasia (never shoot/damage the head) and refrigerated (not frozen/fixed) shipment of the head or brain under biosafety conditions."},
  {name:"FeLV/FIV test", key:false, result:"Both negative.", note:"Adds nothing to the management of a rabies suspect and requires handling that endangers staff."},
  {name:"Serum rabies antibody titer (FAVN/RFFIT)", key:false, result:"Not performed - the laboratory advises it is not valid for diagnosing clinical rabies.", note:"Serology measures vaccine response; animals with clinical rabies may be seronegative and vaccinated animals seropositive. It is NOT a diagnostic test for infection."},
  {name:"CSF tap and analysis", key:false, result:"Not performed.", note:"Requires general anesthesia of a rabies suspect (staff risk) and yields non-specific findings; contraindicated."},
  {name:"CBC and serum biochemistry", key:false, result:"Unremarkable apart from mild dehydration.", note:"Non-specific; would be reasonable only for a low-risk differential, and needs unsafe handling."},
  {name:"Toxoplasma serology", key:false, result:"IgG low positive (exposure).", note:"Toxoplasmosis can cause neurological signs in cats but does not explain the furious behavior and biting; low priority."},
  {name:"Skull radiographs", key:false, result:"No abnormalities.", note:"No diagnostic value for encephalitis."}
 ],
 testsSummary:"A symptomatic unvaccinated biting animal is a public-health emergency: report, protect the exposed person (PEP), protect staff, and confirm by post-mortem brain testing. Clinical pathology and serology do not diagnose rabies.",
 ddx:{q:"Most likely diagnosis?", options:[
  {t:"Furious rabies progressing to the paralytic phase (unvaccinated free-roaming cat with behavior change, hypersalivation, dysphagia, ataxia and progressive paresis)", ok:true, fb:"Correct. Sudden aggression in a previously friendly animal, pharyngeal paralysis and progressive neurological decline in an unvaccinated stray in a region where rabies occurs in wildlife and stray animals."},
  {t:"Feline infectious peritonitis (neurological form)", ok:false, fb:"Neurological FIP causes ataxia, seizures and vestibular signs over weeks in young cats, usually with weight loss, uveitis or fever, not acute furious aggression with dysphagia."},
  {t:"Lead or organophosphate toxicity", ok:false, fb:"Toxicoses can cause tremors and behavioral changes, but unprovoked attacks, pharyngeal paralysis and relentless progression in a biting stray mean rabies must be assumed until excluded."},
  {t:"Pain-induced aggression from an abscess", ok:false, fb:"Abscesses cause localized pain and fever but not ataxia, dysphagia and hindlimb paresis. The clinician must never assume a benign cause in a biting, neurologically abnormal, unvaccinated animal."}
 ]},
 tx:{q:"Best course of action?", options:[
  {t:"Isolate without handling; notify the authorities immediately; ensure the child starts PEP today; euthanize the symptomatic suspect humanely (sedation by injection pole, then IV euthanasia solution) and submit the head/brain for dFA testing; identify all other exposed people and animals (the attacked dog: booster if vaccinated and observe 45 days, or euthanasia/strict 4-6 month quarantine if unvaccinated per regulations); ensure staff are vaccinated and record titers", ok:true, fb:"Correct. This follows WHO/WOAH and UAE practice: a clinically rabid animal cannot be kept for observation, and a positive diagnosis triggers contact tracing. All veterinary staff handling animals in rabies-endemic regions should be pre-exposure vaccinated."},
  {t:"Confine the cat for a 10-day observation period before deciding anything, and advise the family to wait for the result", ok:false, fb:"The 10-day observation applies to HEALTHY dogs, cats and ferrets that bite. A symptomatic animal must be euthanized and tested immediately, and the child's PEP must begin without delay."},
  {t:"Treat with antibiotics, diazepam and fluids and re-evaluate in 48 h", ok:false, fb:"There is no treatment for clinical rabies; keeping the animal alive exposes staff and delays confirmation and contact tracing."},
  {t:"Vaccinate the cat against rabies now and release it after it recovers", ok:false, fb:"Vaccination after clinical onset is useless and release is illegal and dangerous. Clinical rabies is virtually always fatal within days."}
 ]},
 pearls:["Healthy dog/cat/ferret that bites: 10-day observation; ill or stray with signs: euthanasia and testing. Wildlife or unavailable animal: treat the exposure as rabies.","Never freeze or fix the brain in formalin for dFA; refrigerate and ship under chain of custody with the authority's forms.","PEP for people: immediate thorough wound washing, rabies immunoglobulin (category III exposures) and vaccine series; do not wait for lab results.","Veterinarians in the UAE must report suspected rabies, and all animals registered with the municipality require current rabies vaccination."]
}

  {name:"Vector-borne disease panel (Babesia PCR, Ehrlichia/Anaplasma/Leishmania serology)", key:true, result:"All negative.", note:"Essential in the Gulf: Babesia and Ehrlichia cause secondary (associative) IMHA, and steroids without antiparasitic treatment would be harmful."},
  {name:"Thoracic radiographs + abdominal ultrasound", key:true, result:"No masses; mild splenomegaly with a homogeneous parenchyma; no pulmonary thromboembolism signs.", note:"Screens for neoplasia (a cause of secondary IMHA) and provides a baseline, as pulmonary thromboembolism is the main cause of death in IMHA."},
  {name:"Coagulation profile + D-dimers", key:false, result:"PT 8 s, aPTT 15 s (normal), D-dimers elevated.", note:"Reasonable: IMHA is a hypercoagulable state and DIC can develop; elevated D-dimers support thromboprophylaxis but do not change the diagnosis."},
  {name:"Direct Coombs test", key:false, result:"Positive (IgG).", note:"Supportive but unnecessary when agglutination is already positive; it is also negative in ~30% of true IMHA cases."},
  {name:"Urinalysis", key:false, result:"Bilirubinuria 3+, no hemoglobinuria, USG 1.035.", note:"Bilirubinuria confirms hemolytic/hepatic icterus; absence of hemoglobinuria indicates predominantly extravascular hemolysis."},
  {name:"Bone marrow aspirate", key:false, result:"Erythroid hyperplasia.", note:"Not indicated in a regenerative anemia; reserved for non-regenerative cases (precursor-targeted immune anemia)."}
 ],
 testsSummary:"The ACVIM consensus diagnostic approach: confirm hemolysis (spherocytes, bilirubin), prove immune mediation (persistent agglutination or Coombs), and exclude secondary causes (vector-borne disease, neoplasia, drugs). The recent vaccine is a possible trigger but does not change management.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Primary (non-associative) immune-mediated hemolytic anemia, predominantly extravascular, with a hypercoagulable state", ok:true, fb:"Correct. Regenerative anemia, spherocytes, persistent agglutination, hyperbilirubinemia, negative infectious screen and no neoplasia. The Cocker Spaniel is a classic breed."},
  {t:"Babesiosis", ok:false, fb:"Babesia causes hemolysis with hemoglobinuria and often secondary IMHA, but the PCR is negative and no piroplasms were seen; still keep it on the list in any Gulf dog with ticks."},
  {t:"Acute blood loss (hemoabdomen)", ok:false, fb:"Total solids are normal, no free fluid was seen and the dog is icteric - findings of hemolysis, not hemorrhage."},
  {t:"Zinc or onion toxicity (oxidative hemolysis)", ok:false, fb:"No exposure history, no Heinz bodies/eccentrocytes and no metallic foreign body on radiographs; oxidative hemolysis does not produce persistent agglutination."}
 ]},
 tx:{q:"Best treatment plan?", options:[
  {t:"Packed RBC transfusion (DEA 1 typed/cross-matched) because the dog is clinically compromised at PCV 14%; immunosuppression with prednisolone 2 mg/kg/day (or 50-60 mg/m2 in large dogs), adding a second agent (mycophenolate, ciclosporin or azathioprine) if no response in 5-7 days or if severe; thromboprophylaxis with clopidogrel +/- heparin from day 1; gastroprotection only if needed; recheck PCV daily then weekly and taper steroids over 4-6 months", ok:true, fb:"Correct. The ACVIM consensus recommends glucocorticoids as the backbone, a second-line drug for severe or non-responsive cases, and antithrombotic therapy in all dogs (thromboembolism causes most deaths). Transfuse based on clinical signs rather than a fixed PCV cut-off."},
  {t:"Doxycycline and imidocarb before any steroids, then re-evaluate in 2 weeks", ok:false, fb:"Appropriate only if Babesia/Ehrlichia were positive or testing was unavailable. With a negative panel and a life-threatening anemia, immunosuppression must not be delayed."},
  {t:"Splenectomy as first-line treatment", ok:false, fb:"Splenectomy is a salvage option for refractory cases; it is not first-line and increases infection risk (Babesia, Mycoplasma)."},
  {t:"Prednisolone only, with no antithrombotic because platelets are normal", ok:false, fb:"IMHA dogs are hypercoagulable regardless of platelet count; omitting thromboprophylaxis ignores the leading cause of death."}
 ]},
 pearls:["Triad to confirm IMHA: anemia + evidence of hemolysis (bilirubin, spherocytes, hemoglobinuria) + immune marker (agglutination/Coombs).","Always exclude vector-borne disease and neoplasia before calling IMHA primary, especially in the Middle East.","Thromboprophylaxis (clopidogrel) is standard; monitor for dyspnea (pulmonary thromboembolism).","Taper immunosuppressants slowly (no faster than 25% every 3-4 weeks); relapses occur in ~15-20%."]
},
{
 id:"cushing", title:"Pot-bellied Dachshund drinking a lot", species:"Dog",
 signalment:"10-year-old neutered male Dachshund, 11 kg.",
 history:"Eight months of polyuria/polydipsia (drinks ~1.5 L/day), polyphagia, panting at rest, a pendulous abdomen, thinning coat on the flanks and recurrent skin infections. No steroid medications (including eye or ear drops).",
 pe:["Pendulous abdomen, hepatomegaly, muscle wasting over the back","Bilateral symmetric truncal alopecia, thin skin with comedones and calcinosis cutis on the dorsum, superficial pyoderma","Panting; HR 110; SBP 170 mmHg","T 38.4 C, BCS 6/9","Prostate small (neutered); no other abnormalities"],
 tests:[
  {name:"Serum biochemistry", key:true, result:"ALP 1,350 U/L, ALT 150 U/L, cholesterol 420 mg/dL, glucose 128 mg/dL, BUN 10, creatinine 0.7, phosphorus 4.0.", note:"Markedly elevated ALP (steroid-induced isoenzyme), hypercholesterolemia and mild hyperglycemia with a low-normal BUN are the typical Cushingoid chemistry profile."},
  {name:"Urinalysis + culture", key:true, result:"USG 1.008, protein 1+, UPC 0.7, no active sediment; culture: E. coli 10^5 CFU/mL (no clinical signs).", note:"Hyposthenuria and proteinuria are frequent; occult UTI occurs in up to 50% of Cushingoid dogs because glucocorticoids suppress the inflammatory response - culture even with a bland sediment."},
  {name:"CBC", key:true, result:"WBC 16 x10^9/L: mature neutrophilia, lymphopenia 0.5, eosinopenia 0.02, monocytosis; HCT 52%; platelets 480.", note:"Stress (glucocorticoid) leukogram with mild erythrocytosis and thrombocytosis."},
  {name:"Low-dose dexamethasone suppression test", key:true, result:"Basal cortisol 6.2 ug/dL, 4 h 2.1 ug/dL, 8 h 3.4 ug/dL (cut-off 1.4).", note:"Lack of suppression at 8 h confirms hyperadrenocorticism (sensitivity ~95%). Partial suppression at 4 h (<50% of basal) is consistent with pituitary-dependent disease."},
  {name:"Abdominal ultrasound", key:true, result:"Bilaterally symmetric adrenal enlargement (7-8 mm), hepatomegaly with hyperechoic parenchyma (steroid hepatopathy), mildly distended bladder.", note:"Differentiates pituitary-dependent (bilateral, symmetric) from adrenal-dependent (unilateral mass with contralateral atrophy) disease and screens for comorbidities."},
  {name:"Blood pressure", key:true, result:"SBP 170 mmHg (repeated).", note:"Hypertension is present in >50% of Cushingoid dogs; often improves with disease control but may need amlodipine/ACE inhibitor."},
  {name:"ACTH stimulation test", key:false, result:"Pre 7 ug/dL, post 28 ug/dL (exaggerated).", note:"Acceptable screening test (sensitivity ~80%) and the test of choice for iatrogenic Cushing's and for monitoring trilostane; here the LDDST was already diagnostic."},
  {name:"Urine cortisol:creatinine ratio", key:false, result:"Markedly elevated.", note:"High sensitivity but low specificity: a normal result rules out Cushing's, but a high value must be confirmed with LDDST or ACTH stim."},
  {name:"Endogenous ACTH", key:false, result:"High-normal (consistent with pituitary origin).", note:"Used to differentiate PDH from ADH when ultrasound is equivocal; sample handling is demanding."},
  {name:"Pituitary MRI", key:false, result:"6 mm pituitary adenoma (microadenoma).", note:"Indicated when neurological signs suggest a macroadenoma or if hypophysectomy/radiotherapy is considered; not routine."},
  {name:"Total T4", key:false, result:"1.0 ug/dL (low-normal).", note:"T4 is often suppressed by hypercortisolism (euthyroid sick); do not start levothyroxine on this basis."}
 ],
 testsSummary:"Screen with chemistry, CBC and urinalysis; confirm with LDDST (or ACTH stimulation); differentiate PDH from ADH with ultrasound (+/- endogenous ACTH). Check blood pressure and urine culture because of frequent comorbidities.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Pituitary-dependent hyperadrenocorticism (Cushing's disease) with secondary hypertension, proteinuria, calcinosis cutis and occult bacteriuria", ok:true, fb:"Correct. Compatible signs, Cushingoid chemistry, failure to suppress on LDDST with partial 4 h suppression, and bilaterally symmetric adrenal enlargement."},
  {t:"Adrenal-dependent hyperadrenocorticism", ok:false, fb:"An adrenal tumor shows a unilateral mass with atrophy of the contralateral gland and usually no suppression at 4 h."},
  {t:"Diabetes mellitus", ok:false, fb:"Glucose is only mildly elevated and there is no glucosuria; however, 10% of Cushingoid dogs become diabetic, so monitor glucose."},
  {t:"Hypothyroidism", ok:false, fb:"Hypothyroid dogs are lethargic with weight gain and no PU/PD or dilute urine; the low-normal T4 here is secondary to cortisol excess."}
 ]},
 tx:{q:"Best management?", options:[
  {t:"Trilostane ~1-2 mg/kg PO once daily with food (e.g., 10-20 mg), ACTH stimulation test (or pre-pill cortisol) at 10-14 days, 4 weeks, 12 weeks and then every 3-6 months, adjusting the dose; treat the pyoderma and bacteriuria (culture-guided, since this dog has calcinosis cutis and skin infections), recheck blood pressure and UPC after control; educate the owner on signs of hypoadrenocorticism (vomiting, lethargy, anorexia: stop the drug and call)", ok:true, fb:"Correct. Trilostane is the licensed first-line treatment; monitoring prevents iatrogenic Addison's. Hypertension and proteinuria often improve with control. The asymptomatic bacteriuria is a debated point, but in a dog with chronic skin infections and immunosuppression many clinicians treat it."},
  {t:"Mitotane induction at 50 mg/kg/day until water intake drops, then weekly maintenance", ok:false, fb:"Mitotane is an acceptable alternative (adrenolytic) but has a narrower safety margin and more adverse effects; it is generally second choice where trilostane is available."},
  {t:"Bilateral adrenalectomy", ok:false, fb:"Surgery is for adrenal tumors; removing both glands in PDH creates lifelong Addison's and carries high perioperative mortality."},
  {t:"No treatment: Cushing's is cosmetic and the dog is eating well", ok:false, fb:"Untreated hyperadrenocorticism leads to hypertension, proteinuric nephropathy, thromboembolism, diabetes, recurrent infections and pancreatitis; treatment improves quality of life and lifespan."}
 ]},
 pearls:["Never test a dog for Cushing's without compatible clinical signs: specificity falls in sick dogs (false positives).","LDDST: most sensitive screening; ACTH stim: best for iatrogenic disease and for trilostane monitoring.","Comorbidities to manage: hypertension, proteinuria, UTI, diabetes, gallbladder mucocele, pulmonary thromboembolism.","Calcinosis cutis resolves slowly with disease control; avoid steroids in any form, including topical."]
},
{
 id:"pyothorax", title:"Outdoor cat breathing with difficulty", species:"Cat",
 signalment:"3-year-old intact male Domestic Shorthair, 4.2 kg, free-roaming in a villa community.",
 history:"Five days of lethargy and anorexia, now open-mouth breathing. The owner recalls a cat fight 3 weeks ago with a wound over the chest that 'healed'. Not vaccinated, no parasite control.",
 pe:["Severe inspiratory effort with a restrictive, shallow pattern; RR 68; open-mouth breathing","Heart and lung sounds muffled ventrally on both sides; dull on percussion ventrally","T 40.2 C, HR 220, mucous membranes muddy, CRT 2.5 s","Thin (BCS 3/9), dehydrated ~7%","Small healed puncture scar over the left thoracic wall"],
 tests:[
  {name:"Oxygen + point-of-care thoracic ultrasound (TFAST)", key:true, result:"Large bilateral pleural effusion with echogenic, swirling fluid and fibrin strands; no pericardial effusion; heart appears compressed but structurally normal.", note:"In a dyspneic cat, ultrasound in the oxygen cage without restraint confirms effusion and guides immediate thoracocentesis; radiographs come later."},
  {name:"Therapeutic + diagnostic thoracocentesis", key:true, result:"Removed 110 mL (right) and 90 mL (left) of foul-smelling, turbid brown fluid; breathing improved markedly.", note:"Thoracocentesis is both the most important stabilizing step and the source of the diagnostic sample."},
  {name:"Pleural fluid analysis: cytology + culture (aerobic and anaerobic)", key:true, result:"Protein 5.1 g/dL, nucleated cells 85,000/uL, mostly degenerate neutrophils with intracellular mixed bacteria (filamentous rods and cocci); culture: Pasteurella multocida plus obligate anaerobes (Fusobacterium, Bacteroides).", note:"Septic exudate confirms pyothorax. Mixed oropharyngeal flora from a bite wound is the classic feline etiology; always request anaerobic culture."},
  {name:"CBC", key:true, result:"WBC 32 x10^9/L with 5 bands and toxic change; HCT 29%.", note:"Inflammatory leukogram with left shift and anemia of inflammation - sepsis risk."},
  {name:"Serum biochemistry + electrolytes", key:true, result:"Albumin 2.0 g/dL, globulins 5.2, glucose 68, BUN 42, creatinine 1.7 (prerenal), potassium 3.4, ALT 95.", note:"Hypoalbuminemia from the exudate and sepsis, mild hypoglycemia, prerenal azotemia: guide fluid and nutritional support."},
  {name:"Thoracic radiographs (after thoracocentesis)", key:true, result:"Residual bilateral pleural effusion with pleural fissure lines; rounded lung lobe margins; no masses; no pneumothorax.", note:"Taken once stable to assess residual fluid, lung re-expansion, masses or foreign bodies, and to plan chest tubes."},
  {name:"FeLV/FIV test", key:false, result:"FIV antibody positive.", note:"Relevant: FIV increases the risk of recurrent infections and influences long-term counseling, but it does not alter the acute plan. Reasonable to order."},
  {name:"Echocardiography", key:false, result:"Structurally normal heart; no effusion in the pericardium.", note:"Cardiac disease is a key differential for feline pleural effusion, but the septic fluid and TFAST already excluded it; a full echo is low priority here."},
  {name:"Fluid triglycerides", key:false, result:"Fluid triglycerides lower than serum.", note:"Would identify chylothorax (milky fluid with triglycerides > serum); not relevant for a purulent sample."},
  {name:"CT of the thorax", key:false, result:"Not performed.", note:"Reserved for refractory cases or suspected foreign body/abscess needing surgery."}
 ],
 testsSummary:"Oxygen and TFAST, then thoracocentesis for relief and for fluid analysis with aerobic AND anaerobic culture; CBC/chemistry assess sepsis; radiographs after stabilization. Retroviral status matters for prognosis.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Bilateral pyothorax from a penetrating bite wound (mixed Pasteurella/anaerobic infection) with sepsis and FIV co-infection", ok:true, fb:"Correct. Septic exudate with intracellular mixed oropharyngeal bacteria, bite history, fever and a left-shifted leukogram."},
  {t:"Chylothorax", ok:false, fb:"Chyle is milky/pink with high triglycerides and mature lymphocytes, not a foul brown fluid with degenerate neutrophils and bacteria."},
  {t:"Congestive heart failure", ok:false, fb:"Cardiac effusions are modified transudates (low cellularity, protein 2.5-3.5 g/dL) and the heart was normal on ultrasound."},
  {t:"Feline infectious peritonitis (effusive)", ok:false, fb:"FIP fluid is straw-colored, viscous, protein-rich but low in cells, and sterile; it does not contain bacteria or smell foul."}
 ]},
 tx:{q:"Best treatment plan?", options:[
  {t:"Oxygen; IV fluids and dextrose; bilateral thoracostomy tubes placed under sedation/anesthesia after initial drainage, with intermittent drainage and lavage (10-20 mL/kg warm saline) 2-4 times daily until the fluid is clear and cytology is non-septic (typically 3-7 days); IV ampicillin-sulbactam or amoxicillin-clavulanate plus metronidazole (anaerobes), adjusted to culture, continued orally for 4-6 weeks; analgesia (buprenorphine), nutritional support (esophagostomy tube if anorexic); surgery only if a foreign body, abscess or failure of medical management", ok:true, fb:"Correct. Medical management with chest tubes and lavage cures 80-95% of feline pyothorax; most cases do not need thoracotomy. Fluoroquinolones alone are inadequate for anaerobes."},
  {t:"Single thoracocentesis and oral antibiotics at home", ok:false, fb:"Without continuous drainage the thick exudate re-accumulates and loculates; mortality is high with single-tap management."},
  {t:"Immediate exploratory thoracotomy with lung lobectomy", ok:false, fb:"Surgery is indicated for foreign bodies, abscesses, or failure of 3-7 days of medical therapy; operating on an unstable septic cat first carries higher mortality."},
  {t:"Furosemide and oxygen", ok:false, fb:"Diuretics do not remove an infected exudate and worsen dehydration/hypovolemia in a septic cat."}
 ]},
 pearls:["Dyspneic cat: oxygen first, TFAST, thoracocentesis - radiographs later.","Pleural fluid classification: transudate, modified transudate, exudate (septic/non-septic), chyle, hemorrhage - cytology plus protein, cells and triglycerides.","Feline pyothorax: bite wounds and oropharyngeal flora; canine pyothorax: migrating grass awns/foreign bodies (Actinomyces, Nocardia) - more often surgical.","Advise neutering, vaccination and reducing fighting/roaming to prevent recurrence; FIV cats need indoor management."]
},

 id:"ehrlichia", title:"Imported Husky with a nosebleed", species:"Dog",
 signalment:"4-year-old intact male Siberian Husky, 24 kg, moved from Egypt to Dubai 8 months ago.",
 history:"Two weeks of lethargy and reduced appetite; two episodes of epistaxis this week; the owner has seen ticks on the dog and in the garden. Ate well until recently. No tick prevention. Vaccinated.",
 pe:["Quiet; T 39.9 C; mucous membranes pale with petechiae on the gums; CRT 2 s","Dried blood at the nostrils; small ecchymoses on the ventral abdomen","Generalized lymphadenomegaly (popliteal, prescapular 2-3x normal); mild splenomegaly","Several engorged brown ticks in the ear folds and interdigital spaces","HR 100, no murmur, lungs clear; ocular examination: mild anterior uveitis OU"],
 tests:[
  {name:"CBC with blood smear review", key:true, result:"HCT 31%, non-regenerative (reticulocytes 20 x10^9/L); WBC 6.4 x10^9/L; platelets 18 x10^9/L (confirmed on smear, no clumps); occasional morulae inside monocytes.", note:"Severe thrombocytopenia explains the bleeding. Morulae in monocytes are seen in the acute phase only (low sensitivity but high specificity)."},
  {name:"Serum biochemistry + protein electrophoresis", key:true, result:"Total protein 8.6 g/dL, albumin 2.5, globulins 6.1 (polyclonal gammopathy), ALT 80, ALP 240, creatinine 1.0, BUN 22.", note:"Polyclonal hyperglobulinemia with hypoalbuminemia is typical of chronic antigenic stimulation (Ehrlichia, Leishmania). Renal values are normal - important for prognosis."},
  {name:"Ehrlichia canis / Anaplasma platys serology (ELISA SNAP) + PCR", key:true, result:"E. canis antibody strongly positive; E. canis PCR positive; Anaplasma negative.", note:"PCR confirms active infection; serology can be negative in the first 1-3 weeks of acute disease and can remain positive after cure. Both together are ideal."},
  {name:"Leishmania infantum serology + Babesia PCR", key:true, result:"Leishmania IFAT negative; Babesia spp. PCR negative.", note:"Co-infections are frequent in dogs from North Africa/Middle East and change treatment; Leishmania also causes epistaxis and hyperglobulinemia."},
  {name:"Urinalysis + UPC", key:true, result:"USG 1.030, protein 1+, UPC 0.6, hematuria (from thrombocytopenia).", note:"Mild proteinuria can accompany ehrlichiosis (immune-complex glomerulonephritis) and should be rechecked after treatment; hematuria reflects bleeding."},
  {name:"Coagulation profile (PT/aPTT)", key:false, result:"Both normal.", note:"Reasonable to exclude rodenticide toxicity in a dog with epistaxis, but thrombocytopenia already explains the bleeding and the times are normal."},
  {name:"Buccal mucosal bleeding time", key:false, result:"Prolonged (>5 min).", note:"Expected with platelets <50 x10^9/L; it adds little and may cause bleeding in a thrombocytopenic dog."},
  {name:"Bone marrow aspirate", key:false, result:"Mildly hypocellular marrow with plasma cell infiltration.", note:"Reserved for pancytopenic (chronic phase) dogs with unclear diagnosis; not needed when PCR is positive."},
  {name:"Thoracic + nasal radiographs", key:false, result:"Unremarkable.", note:"Epistaxis work-up in an older dog may need nasal imaging, but a systemic coagulopathy/thrombocytopenia should be excluded first - which already explains it here."},
  {name:"Fundic examination", key:false, result:"Mild anterior uveitis, no retinal hemorrhage or detachment.", note:"Useful: ocular signs are common in ehrlichiosis and retinal hemorrhage indicates risk of blindness."}
 ],
 testsSummary:"Epistaxis in a tick-exposed dog: CBC with smear (platelets!), biochemistry/electrophoresis, specific serology + PCR for Ehrlichia and co-infections (Leishmania, Babesia, Anaplasma), and urinalysis/UPC for renal involvement.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Canine monocytic ehrlichiosis (Ehrlichia canis), acute to subacute phase, with severe thrombocytopenia, non-regenerative anemia, polyclonal hyperglobulinemia and uveitis", ok:true, fb:"Correct. Tick exposure, fever, lymphadenomegaly, morulae in monocytes, positive PCR/serology, and a preserved (not pancytopenic) marrow response - a good prognosis if treated now."},
  {t:"Primary immune-mediated thrombocytopenia", ok:false, fb:"Primary ITP is a diagnosis of exclusion; here there is a proven infectious cause. Treating with steroids alone would worsen the infection."},
  {t:"Anticoagulant rodenticide toxicity", ok:false, fb:"Rodenticides prolong PT/aPTT with normal platelets; this dog has normal clotting times and severe thrombocytopenia."},
  {t:"Multiple myeloma", ok:false, fb:"Myeloma produces a monoclonal spike and lytic bone lesions; this gammopathy is polyclonal with an infectious cause confirmed."}
 ]},
 tx:{q:"Best treatment plan?", options:[
  {t:"Doxycycline 10 mg/kg PO q24h for 28 days (with food/water to avoid esophagitis); remove ticks and start an isoxazoline plus environmental acaricide treatment of the garden/kennel; supportive care (fluids if needed), cage rest while platelets are low, topical steroid for the uveitis; recheck platelets at 1-2 weeks (should rise within days) and CBC, globulins, UPC at 1 and 3 months; consider a short course of prednisolone only if platelets fail to rise within 7 days (secondary immune-mediated component); treat the intact status/roaming to reduce future exposure", ok:true, fb:"Correct. Doxycycline is the drug of choice; platelet counts typically improve within 3-7 days. Persistent PCR positivity after therapy or relapse may require a second course. Serology stays positive for months to years and should not be used to judge cure."},
  {t:"Prednisolone 2 mg/kg/day for immune-mediated thrombocytopenia, then reassess in 2 weeks", ok:false, fb:"Immunosuppression without antibiotics allows Ehrlichia to proliferate and can precipitate the chronic, fatal pancytopenic form."},
  {t:"Imidocarb dipropionate 6.6 mg/kg IM, repeated in 14 days, as monotherapy", ok:false, fb:"Imidocarb is for Babesia; its efficacy against E. canis is poor and it is not a substitute for doxycycline."},
  {t:"Enrofloxacin for 14 days", ok:false, fb:"Fluoroquinolones have no reliable activity against Ehrlichia; doxycycline (or minocycline) is required."}
 ]},
 pearls:["Thrombocytopenia + epistaxis + ticks in the Gulf: think Ehrlichia canis first; test for co-infections (Anaplasma platys, Babesia, Leishmania, Hepatozoon).","Three phases: acute (responsive), subclinical (persistent mild thrombocytopenia), chronic (pancytopenia, poor prognosis).","Doxycycline 10 mg/kg/day for 4 weeks; recheck platelets early - a failure to respond suggests a wrong diagnosis or chronic marrow failure.","Rhipicephalus sanguineus lives indoors and in kennels: treat the environment as well as the dog, all year round."]
},
{
 id:"lily-cat", title:"Indoor cat after chewing a bouquet", species:"Cat",
 signalment:"2-year-old spayed female Persian, 3.9 kg, strictly indoor.",
 history:"A lily bouquet (Lilium 'Stargazer') was delivered 10 hours ago; the owner found chewed leaves and pollen on the cat's face. The cat vomited twice within 2 hours and has been quiet since. No other toxins. Fully vaccinated.",
 pe:["Quiet but responsive; T 38.3 C; HR 190","Mild dehydration (~5%); mucous membranes pink; orange pollen on the muzzle and paws","Abdomen soft, kidneys normal size, non-painful","No neurological deficits","Bladder small"],
 tests:[
  {name:"Baseline serum biochemistry (creatinine, BUN, phosphorus, potassium)", key:true, result:"Creatinine 1.1 mg/dL, BUN 26, phosphorus 4.2, potassium 4.1 - all normal at 10 h.", note:"Baseline values are essential: azotemia usually develops 24-72 h after ingestion; a normal panel now does NOT exclude injury."},
  {name:"Urinalysis (baseline and serial)", key:true, result:"USG 1.052 at 10 h; at 24 h: USG 1.018 with glucosuria (1+), proteinuria and granular/epithelial casts.", note:"Loss of concentrating ability, glucosuria with normal blood glucose and casts are the EARLIEST indicators of tubular injury, appearing before creatinine rises."},
  {name:"Serial creatinine/SDMA at 24, 48 and 72 h", key:true, result:"24 h: creatinine 1.8 mg/dL, SDMA 22; 48 h: creatinine 2.4; 72 h: 2.0 (declining on fluids).", note:"Serial monitoring defines whether AKI develops and whether it responds to diuresis. SDMA rises earlier than creatinine."},
  {name:"Blood pressure and body weight q8-12h", key:true, result:"SBP 130 mmHg; weight stable; urine output 2.5 mL/kg/h.", note:"Monitoring urine output and weight during aggressive diuresis prevents fluid overload and detects oliguria early (the main negative prognostic sign)."},
  {name:"Decontamination assessment (emesis/activated charcoal)", key:true, result:"Emesis induced with dexmedetomidine produced plant material; activated charcoal given; muzzle and paws washed to remove pollen.", note:"Decontamination is worthwhile within ~6-12 h (and bathing removes pollen the cat would groom off); the cat vomited already but residual material was still recovered."},
  {name:"CBC", key:false, result:"Unremarkable.", note:"Low yield in lily toxicity; acceptable as baseline."},
  {name:"Abdominal ultrasound", key:false, result:"Kidneys normal size with mildly hyperechoic cortices and perirenal fluid at 48 h.", note:"Perirenal effusion and cortical hyperechogenicity support AKI but do not change management; mainly excludes other causes (obstruction, pyelonephritis)."},
  {name:"Ethylene glycol test", key:false, result:"Negative.", note:"A reasonable differential for AKI in cats, but the lily exposure is documented and the test is time-sensitive; low priority here."},
  {name:"Calcium oxalate crystal check", key:false, result:"No crystals.", note:"Oxalate crystalluria points to ethylene glycol, not lilies."},
  {name:"Thoracic radiographs", key:false, result:"Unremarkable.", note:"Not indicated."}
 ],
 testsSummary:"Decontaminate, then monitor for AKI with baseline and serial creatinine/SDMA, urinalysis (casts, glucosuria, USG) and urine output. Early fluids started within 18 h of exposure give an excellent prognosis.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Lily (Lilium spp.) nephrotoxicity with developing acute kidney injury (IRIS AKI grade II, non-oliguric)", ok:true, fb:"Correct. All parts of true lilies (Lilium, Hemerocallis), including pollen and vase water, are nephrotoxic to cats; the sequence of vomiting, then tubular injury markers at 24 h and a creatinine rise of >0.3 mg/dL, fits."},
  {t:"Ethylene glycol intoxication", ok:false, fb:"Causes hypocalcemia, high anion gap acidosis, oxalate crystals and usually a history of garage/antifreeze access; the lily exposure is documented and the EG test is negative."},
  {t:"Chronic kidney disease", ok:false, fb:"A 2-year-old cat with a normal baseline creatinine and USG 1.052 at presentation has acute, not chronic, disease."},
  {t:"Simple dietary indiscretion (plant-induced gastritis)", ok:false, fb:"Non-toxic plants cause self-limiting vomiting; the development of casts, glucosuria and azotemia proves renal injury."}
 ]},
 tx:{q:"Best management?", options:[
  {t:"Hospitalize for IV isotonic crystalloid diuresis at ~2-3x maintenance (adjusted to urine output and weight) for 48-72 h, antiemetics (maropitant), gastroprotection, nutritional support, and monitoring of creatinine, potassium, urine output and blood pressure; if oliguria/anuria develops despite rehydration, refer for hemodialysis/CRRT; discharge when creatinine is stable and the cat eats, with recheck in 1-2 weeks", ok:true, fb:"Correct. Fluid diuresis started within 18 h prevents or limits AKI in most cats; oliguric AKI by 24-72 h carries a grave prognosis and needs renal replacement therapy. Furosemide/mannitol do not improve outcome and are used only to convert oliguria after volume repletion."},
  {t:"Outpatient subcutaneous fluids once daily and recheck in a week", ok:false, fb:"SC fluids cannot deliver the diuresis needed; the critical window is the first 48-72 h and the cat needs monitoring of urine output and potassium."},
  {t:"Furosemide 2 mg/kg IV q8h to 'flush the kidneys' without IV fluids", ok:false, fb:"Diuretics in a dehydrated cat worsen renal hypoperfusion; volume replacement first, diuretics only for documented oliguria after rehydration."},
  {t:"Observe at home because the baseline bloods were normal", ok:false, fb:"Normal values at 10 h are expected; the kidney injury manifests at 24-72 h. Waiting for azotemia before treating loses the window for prevention."}
 ]},

{
 id:"dystocia", title:"French Bulldog in labor for hours", species:"Dog",
 signalment:"3-year-old intact female French Bulldog, 12 kg, first pregnancy, mated 63 days ago (ovulation timed by progesterone).",
 history:"Rectal temperature dropped to 37.0 C 30 hours ago. She has been restless and nesting since last night; strong, visible abdominal contractions started 2 hours ago but no puppy has been delivered. A greenish-black vulvar discharge appeared 45 minutes ago. Pre-whelping radiographs at day 55 showed 5 fetuses.",
 pe:["Anxious, panting, intermittent strong straining; HR 140; mucous membranes pink; T 38.1 C","Abdomen large; fetal movement palpable","Vulva relaxed; dark green (uteroverdin) discharge; digital vaginal exam: cervix open, a fetal head is palpable at the pelvic inlet but not advancing - the fetus feels large relative to the pelvic canal","Mammary glands developed with colostrum","Mild dehydration"],
 tests:[
  {name:"Fetal heart rates by ultrasound", key:true, result:"Five fetuses; heart rates: 150, 160, 165, 210, 215 bpm (normal >200; 180-220 = early stress, <160 = severe distress).", note:"Fetal heart rate is the single best indicator of fetal distress and the most important factor in deciding how urgently to intervene."},
  {name:"Abdominal radiographs (lateral + VD)", key:true, result:"Five fetuses; the leading fetus is in cranial presentation with a skull width exceeding the pelvic inlet diameter; no gas within fetal structures (no fetal death >24 h).", note:"Radiographs show fetal number, size relative to the pelvis, position/presentation and signs of fetal death (gas, collapse of the skull, spinal overlap)."},
  {name:"Ionized calcium and blood glucose", key:true, result:"Ionized calcium 1.08 mmol/L (ref 1.2-1.4; mildly low); glucose 76 mg/dL.", note:"Hypocalcemia and hypoglycemia contribute to uterine inertia; measure before deciding on oxytocin/calcium therapy."},
  {name:"Digital vaginal examination (feathering)", key:true, result:"Cervix open; fetal head engaged but not progressing with contractions; Ferguson reflex present.", note:"Confirms obstruction versus inertia: strong contractions with an engaged, non-advancing fetus = obstructive dystocia."},
  {name:"PCV/TS, electrolytes", key:true, result:"PCV 40%, TS 6.2, potassium 3.8, sodium 145.", note:"Pre-anesthetic baseline; pregnant bitches have physiologic anemia and lower protein. Needed before cesarean section."},
  {name:"Serum progesterone", key:false, result:"1.5 ng/mL (fallen).", note:"Confirms that luteolysis has occurred (labor is physiologically appropriate) but does not change the management of an obstructed labor already in progress."},
  {name:"Vaginal cytology", key:false, result:"Non-diagnostic.", note:"Not useful during parturition."},
  {name:"Thoracic radiographs", key:false, result:"Normal.", note:"Not needed in a young bitch without respiratory disease; brachycephalic airway should be noted for anesthesia instead."},
  {name:"CBC", key:false, result:"Mild neutrophilia (stress).", note:"Non-contributory."}
 ],
 testsSummary:"Decide between medical and surgical management with: fetal heart rates (ultrasound), radiographs (fetal size/position/viability), vaginal exam (obstruction vs inertia) and ionized calcium/glucose. Pre-anesthetic PCV/TS and electrolytes if a cesarean is likely.",
 ddx:{q:"Assessment?", options:[
  {t:"Obstructive dystocia due to feto-maternal disproportion (brachycephalic pelvis, large-headed fetus) with early fetal distress and uteroverdin discharge without delivery - a surgical emergency", ok:true, fb:"Correct. Criteria for dystocia met: >30 min of strong contractions without a puppy, green discharge without a puppy, fetal heart rates falling below 180 in several fetuses, and an engaged fetus that does not advance. Brachycephalic breeds have very high cesarean rates (>80% in French Bulldogs)."},
  {t:"Primary uterine inertia", ok:false, fb:"Primary inertia means no effective contractions at all; this bitch has strong contractions against an obstruction, so oxytocin would be dangerous."},
  {t:"Normal stage I labor; wait another 6-12 hours", ok:false, fb:"Stage II (active straining) has begun and the green discharge indicates placental separation; waiting risks fetal death and uterine rupture."},
  {t:"Pyometra", ok:false, fb:"She is at term with viable fetuses and an open cervix in labor; this is parturition, not infection."}
 ]},
 tx:{q:"Best management?", options:[
  {t:"Emergency cesarean section: pre-oxygenate, IV fluids, induce with propofol or alfaxalone (no premedication opioids until the puppies are out, or use short-acting ones), maintain with isoflurane/sevoflurane, line block with lidocaine, rapid delivery; neonatal resuscitation (clear airways, rub, warm, naloxone if opioids used, no 'swinging'); consider ovariohysterectomy with owner consent if no further breeding is planned; postoperative oxytocin for involution, analgesia compatible with nursing (opioids short term, NSAID single dose with caution)", ok:true, fb:"Correct. Feto-maternal disproportion with fetal distress is an absolute indication for cesarean. Brachycephalic bitches need careful airway management (rapid intubation, extubate fully awake, head up). Puppies should be put to the mammae as soon as the bitch is awake for colostrum."},
  {t:"Oxytocin 10 IU IM and calcium gluconate, repeat every 30 min", ok:false, fb:"Oxytocin with an obstructed fetus causes uterine rupture, placental separation and fetal death; calcium/oxytocin are for inertia WITHOUT obstruction and with fetal heart rates normal."},
  {t:"Manual extraction of the fetus with forceps and lubricant", ok:false, fb:"Digital manipulation is acceptable only for a fetus already in the vaginal canal; forceps on a fetus at the pelvic inlet in a brachycephalic bitch risks fetal and maternal trauma."},
  {t:"Prostaglandin F2-alpha to increase contractions", ok:false, fb:"Prostaglandins are not labor inducers in the bitch and cause marked side effects; they have no role in dystocia."}
 ]},
 pearls:["Indicators for intervention: >30 min strong contractions without a puppy; >4 h between puppies with weak contractions; green/black discharge without a puppy; fetal HR <180 bpm; >24-36 h since the temperature drop with no labor.","Calcium and oxytocin only when the canal is clear, the fetus is not oversized, and fetal heart rates are normal; use low oxytocin doses (0.5-2 IU).","Brachycephalic breeds: plan elective cesareans with ovulation timing (day 62-63 from ovulation) and have neonatal care ready.","Neonates: dry, warm (hypothermia is the main killer), clear airways with suction, stimulate; doxapram is no longer recommended routinely."]
},

 id:"chf-cavalier", title:"Cavalier coughing at night, now breathless", species:"Dog",
 signalment:"10-year-old neutered male Cavalier King Charles Spaniel, 9 kg.",
 history:"A heart murmur has been noted at vaccinations for 3 years but never investigated. Two weeks of coughing at night and after excitement, now restless, unable to settle, and breathing fast at rest (owner counted 60 breaths/min while sleeping).",
 pe:["Tachypnea 64/min at rest with increased effort, orthopneic posture, crackles over both caudal lung fields","Grade V/VI left apical holosystolic murmur, HR 170, no arrhythmia","Mucous membranes pink-pale, CRT 2 s; pulses fair; no jugular distension","T 38.5 C; mild weight loss, muscle wasting over the spine","Abdomen non-distended"],
 tests:[
  {name:"Thoracic radiographs (after oxygen and initial furosemide)", key:true, result:"Marked cardiomegaly (VHS 12.5), left atrial enlargement with dorsal displacement of the trachea and compression of the left mainstem bronchus, bilateral perihilar-to-caudal alveolar pattern with air bronchograms, enlarged pulmonary veins.", note:"Confirms cardiogenic pulmonary edema and left atrial enlargement; radiographs are the standard to diagnose CHF, but take them only once the dog can tolerate positioning."},
  {name:"Echocardiography", key:true, result:"Thickened, prolapsing mitral valve leaflets with severe mitral regurgitation; LA:Ao 2.6; LVIDDn 2.1; preserved systolic function; estimated pulmonary artery pressure mildly elevated.", note:"Defines the cause (myxomatous mitral valve disease), stage, and chamber sizes; also screens for pulmonary hypertension and left atrial tears."},
  {name:"Point-of-care lung ultrasound (B-lines) + NT-proBNP", key:true, result:"Numerous confluent B-lines bilaterally; NT-proBNP markedly elevated (>3,000 pmol/L).", note:"Fast, low-stress confirmation of pulmonary edema in a dyspneic dog; NT-proBNP helps distinguish cardiac from respiratory causes of cough when radiographs are equivocal."},
  {name:"Serum biochemistry + electrolytes", key:true, result:"Creatinine 1.3 mg/dL, BUN 30, potassium 4.0, sodium 143, chloride 108, ALT 85.", note:"Baseline before diuretics, ACE inhibitors and spironolactone; recheck in 5-7 days to monitor for azotemia/electrolyte shifts."},
  {name:"Blood pressure", key:true, result:"SBP 120 mmHg.", note:"Needed before starting vasodilators (ACE inhibitor, pimobendan); hypotension would contraindicate aggressive afterload reduction."},
  {name:"ECG", key:false, result:"Sinus tachycardia, P-mitrale (wide P waves), no ectopy.", note:"Useful to rule out atrial fibrillation or supraventricular tachycardia (treatable triggers of decompensation), but not diagnostic of CHF."},
  {name:"CBC", key:false, result:"Mild stress leukogram.", note:"Low yield."},
  {name:"Heartworm antigen test", key:false, result:"Negative.", note:"Reasonable in an unprotected dog in a mosquito area, but the mitral disease clearly explains the signs."},
  {name:"Bronchoscopy / airway lavage", key:false, result:"Not performed.", note:"Contraindicated in acute CHF (anesthesia); airway disease is a differential for cough in small breeds once edema is excluded."},
  {name:"Thoracocentesis", key:false, result:"No pleural effusion on ultrasound.", note:"Not indicated: the problem is alveolar edema, not pleural fluid (which is typical of right-sided or feline CHF)."}
 ],
 testsSummary:"Stabilize first (oxygen, furosemide), then confirm CHF with lung ultrasound/radiographs and characterize the disease with echocardiography; chemistry and blood pressure before starting the chronic regimen.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Myxomatous mitral valve disease, ACVIM stage C: acute left-sided congestive heart failure with cardiogenic pulmonary edema and bronchial compression by the enlarged left atrium", ok:true, fb:"Correct. Breed, long-standing apical murmur, LA:Ao 2.6 with severe regurgitation, and alveolar edema with a resting respiratory rate >40 breaths/min."},
  {t:"Chronic bronchitis / tracheal collapse", ok:false, fb:"Airway disease causes cough but not an alveolar pattern with venous distension, B-lines and high NT-proBNP; it can coexist and is reconsidered if cough persists after edema resolves."},
  {t:"Pneumonia", ok:false, fb:"Pneumonia typically gives fever, a cranioventral alveolar pattern and a left-shifted leukogram, with a normal NT-proBNP."},
  {t:"Dilated cardiomyopathy", ok:false, fb:"DCM shows a dilated, poorly contractile ventricle in large breeds; this dog has a primary valvular lesion with preserved contractility."}
 ]},
 tx:{q:"Best treatment plan?", options:[
  {t:"Acute: oxygen, furosemide 2 mg/kg IV repeated every 1-2 h until respiratory rate falls (or CRI), pimobendan 0.25-0.3 mg/kg PO q12h, butorphanol for anxiety, minimal handling, no IV fluids; chronic: furosemide (or torsemide) at the lowest effective dose, pimobendan, an ACE inhibitor (benazepril) and spironolactone ('quadruple therapy'), home resting respiratory rate monitoring (<30/min), mild sodium restriction, recheck renal values/electrolytes in 1 week and every 3-6 months; cough suppressants if bronchial compression cough persists", ok:true, fb:"Correct. This is the ACVIM stage C standard; pimobendan improves survival (QUEST), and spironolactone/ACE inhibitors add benefit. Owner-measured sleeping respiratory rate is the best early warning of recurrence."},
  {t:"Antibiotics and a corticosteroid for the cough, recheck in 2 weeks", ok:false, fb:"Steroids cause sodium retention and worsen CHF; the cough here is cardiogenic edema plus bronchial compression, not infection."},
  {t:"IV crystalloids to improve perfusion plus a beta-blocker to slow the heart", ok:false, fb:"Fluids increase preload and worsen edema; beta-blockers are negative inotropes contraindicated in acute decompensated CHF."},
  {t:"Furosemide alone, lifelong, with no other drugs", ok:false, fb:"Diuretic monotherapy relieves congestion but activates the renin-angiotensin-aldosterone system; adding pimobendan and RAAS blockade prolongs survival."}
 ]},
 pearls:["ACVIM staging: A (at risk), B1 (murmur, no remodeling), B2 (remodeling: LA:Ao >=1.6, LVIDDn >=1.7 - start pimobendan), C (CHF), D (refractory).","Sleeping respiratory rate >30/min at home predicts decompensation before the owner notices cough.","In acute CHF the triad is oxygen, furosemide, pimobendan - and avoid stress and fluids.","Monitor creatinine and potassium: azotemia is the price of adequate diuresis; use the lowest effective dose."]
},

 id:"atopic-dog", title:"Itchy Westie with smelly ears", species:"Dog",
 signalment:"3-year-old neutered male West Highland White Terrier, 9 kg.",
 history:"Pruritus for 18 months (paw licking, face rubbing, scratching the axillae), worse in the humid summer months but now year-round; two episodes of otitis in the last year; previous responses to short courses of prednisolone. Fed a chicken-based kibble with assorted treats. On a monthly isoxazoline since 6 months ago; no other pets. Pruritus score 7/10.",
 pe:["Erythema and lichenification of the axillae, ventral abdomen, inguinal region and interdigital spaces; salivary staining of the paws","Erythematous, greasy, malodorous bilateral otitis externa with brown exudate; ear canals stenotic","Multiple epidermal collarettes and papules on the ventrum (superficial pyoderma)","Periocular erythema; no lesions on the dorsum or tail base","Lymph nodes normal; otherwise healthy"],
 tests:[
  {name:"Skin cytology (tape strips + impression smears) and ear cytology", key:true, result:"Skin: numerous cocci (intracellular in neutrophils) and Malassezia 4-6 per high-power field; ears: Malassezia >10/hpf with few cocci.", note:"Cytology is the first and most important test in every pruritic dog: secondary bacterial and yeast infections must be identified and treated because they amplify pruritus."},
  {name:"Deep and superficial skin scrapings + trichogram", key:true, result:"No Demodex, no Sarcoptes (3 negative sites).", note:"Rules out parasitic pruritus. Negative Sarcoptes scrapings do not exclude it, but the dog has received isoxazolines for 6 months, which is an adequate therapeutic trial."},
  {name:"Flea combing / evaluation of flea control", key:true, result:"No fleas or flea dirt; isoxazoline administered monthly with confirmed compliance.", note:"Flea allergy dermatitis must be excluded before atopy is diagnosed; the lesion distribution (ventral, not dorsolumbar) also argues against it."},
  {name:"Strict elimination diet trial (hydrolyzed or novel protein, 8 weeks) with re-challenge", key:true, result:"After 8 weeks on a hydrolyzed diet (with infections treated and no treats/flavored medications): pruritus improved from 7/10 to 5/10 only; re-challenge with the original diet caused no flare.", note:"The only reliable way to exclude food allergy; the partial improvement reflects infection control, and the negative re-challenge confirms that food is not a trigger."},
  {name:"Otoscopy of both ear canals (after cleaning)", key:true, result:"Erythematous, stenotic canals with intact tympanic membranes; no foreign body or masses.", note:"Confirms the eardrum status (safety of topical drugs) and excludes polyps/foreign bodies; otitis externa is a manifestation of the allergic skin disease."},
  {name:"Bacterial culture of the skin", key:false, result:"Staphylococcus pseudintermedius, methicillin-susceptible.", note:"Not required for a first-episode superficial pyoderma that shows cocci on cytology; reserve culture for recurrent, deep or non-responsive infections (MRSP risk)."},
  {name:"Serum allergen-specific IgE panel", key:false, result:"Positive to house dust mites and storage mites.", note:"Does NOT diagnose atopic dermatitis (healthy dogs test positive too); it is used only to select allergens for immunotherapy once atopy has been diagnosed clinically."},
  {name:"Thyroid panel (T4/TSH)", key:false, result:"Normal.", note:"Hypothyroidism causes non-pruritic alopecia and recurrent pyoderma, not primary pruritus in a 3-year-old; low priority."},
  {name:"Skin biopsy", key:false, result:"Chronic hyperplastic perivascular dermatitis (non-specific).", note:"Histopathology does not diagnose allergy; it is reserved for atypical lesions or suspected neoplasia/autoimmune disease."},
  {name:"Fungal culture (dermatophytes)", key:false, result:"Negative.", note:"Dermatophytosis is usually non-pruritic with focal alopecia; low yield in this presentation."}

 testsSummary:"Atopic dermatitis is a clinical diagnosis of exclusion: cytology for infections, scrapings/parasite control, flea control, an 8-week elimination diet with re-challenge, and ear examination. Allergen testing is for immunotherapy planning, not diagnosis.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Canine atopic dermatitis (environmental allergens, likely house dust mites) with secondary Malassezia dermatitis, superficial staphylococcal pyoderma and bilateral Malassezia otitis externa", ok:true, fb:"Correct. Favrot's criteria are met (onset <3 years, indoor, steroid-responsive pruritus, affected front feet and pinnae, spared ear margins and dorsolumbar area), after exclusion of parasites, fleas and food."},
  {t:"Sarcoptic mange", ok:false, fb:"Sarcoptes targets ear margins, elbows and hocks with intense pruritus; this dog has 6 months of isoxazoline therapy and negative scrapings."},
  {t:"Cutaneous adverse food reaction", ok:false, fb:"A properly conducted elimination diet with a negative re-challenge rules it out; residual pruritus persisted on the diet."},
  {t:"Primary Malassezia dermatitis", ok:false, fb:"Malassezia overgrowth is almost always secondary to an underlying allergy or endocrine disease; treating the yeast alone leads to relapse."}
 ]},
 tx:{q:"Best long-term plan?", options:[
  {t:"Treat infections: topical chlorhexidine/miconazole shampoo 2-3x weekly and an ear cleaner plus a topical otic combination (antifungal + steroid) for 2-3 weeks, systemic antibiotics only if topical therapy fails; control pruritus with oclacitinib (0.4-0.6 mg/kg q12h for 14 days then q24h) or lokivetmab injections, with short steroid courses only for flares; skin barrier support (essential fatty acids, emollient sprays); continue monthly isoxazoline; offer allergen-specific immunotherapy based on the IgE results as the only disease-modifying treatment; recheck cytology every 4-8 weeks until controlled", ok:true, fb:"Correct. The ICADA guidelines combine infection control, barrier repair, allergen avoidance, symptomatic anti-pruritic therapy (oclacitinib, lokivetmab, ciclosporin) and immunotherapy (effective in ~60-70%). Long-term glucocorticoids are avoided."},
  {t:"Prednisolone 1 mg/kg daily long term and cephalexin for 3 weeks", ok:false, fb:"Chronic steroids cause iatrogenic Cushing's, worsen infections and calcinosis; Westies also need yeast control. Modern targeted drugs achieve the same relief more safely."},
  {t:"Change to a grain-free diet and use antihistamines only", ok:false, fb:"Food has been excluded, and 'grain-free' has no role; antihistamines have minimal efficacy in canine atopic dermatitis (though they are safe adjuncts)."},
  {t:"Enrofloxacin for the pyoderma and oral ketoconazole indefinitely", ok:false, fb:"Fluoroquinolones are inappropriate first-line for staphylococcal pyoderma (stewardship), and indefinite systemic azoles are unnecessary when the underlying allergy is controlled; topical therapy is preferred for Malassezia."}
 ]},
 pearls:["Pruritus work-up order: cytology → parasites/fleas → elimination diet → then atopy; infections can account for half of the pruritus score.","Atopic distribution: face, feet, axillae, ventrum, ears; flea allergy: dorsolumbar/tail base; Sarcoptes: ear margins, elbows, hocks.","Allergen tests select immunotherapy allergens; they never diagnose atopy.","In the Gulf, house dust and storage mites dominate; humidity and air-conditioned indoor living increase mite exposure - advise mattress/bedding control."]
}

const CY = (function(){
  const C = { bg:"#f6f1ea", rbc:"#f2a08e", rbcEdge:"#d9806e", rbcDark:"#e07f6c", nuc:"#5a3d8f", nucLight:"#7d63b0", cyto:"#d9e6f3", cyto2:"#cdd8ea", bact:"#3a2a6b", yeast:"#6f4fa6", ker:"#e9b7c9", kerN:"#6b4a8a", gran:"#7e4fb6", mite:"#c9ad7c", miteEdge:"#8e7646", hair:"#8c6b4a", crystal:"#8fb3c7", crystalEdge:"#4f7d96", plt:"#b7a3d1", eos:"#e58a6d", amast:"#4b3580" };
  function rng(seed){ let t=seed>>>0; return ()=>{ t+=0x6D2B79F5; let r=Math.imul(t^t>>>15,1|t); r^=r+Math.imul(r^r>>>7,61|r); return ((r^r>>>14)>>>0)/4294967296; }; }
  function hashSeed(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  class Field {
    constructor(seed){ this.r=rng(hashSeed(seed)); this.parts=[]; this.ann=[]; this.placed=[]; this.cx=200; this.cy=150; this.R=140; }
    rand(a,b){ return a+this.r()*(b-a); }
    spot(radius, tries=60){ // random non-overlapping position inside the circular field
      for(let i=0;i<tries;i++){ const a=this.r()*Math.PI*2, d=Math.sqrt(this.r())*(this.R-radius-4); const x=this.cx+Math.cos(a)*d, y=this.cy+Math.sin(a)*d;
        if(this.placed.every(p=>Math.hypot(p.x-x,p.y-y)>p.r+radius+2)){ this.placed.push({x,y,r:radius}); return {x,y}; } }
      return null;

    add(s){ this.parts.push(s); }
    note(x,y,label){ this.ann.push({x,y,label}); }
    // ---- cells ----
    rbc(x,y,o={}){ const r=o.r||11, col=o.col||C.rbc; const rot=this.rand(0,360); this.add(`<g transform="translate(${x},${y}) rotate(${rot})"><ellipse rx="${r}" ry="${r*0.95}" fill="${col}" stroke="${C.rbcEdge}" stroke-width="0.8"/>${o.pallor!==false?`<ellipse rx="${r*0.42}" ry="${r*0.4}" fill="${C.bg}" opacity="0.85"/>`:""}${o.extra||""}</g>`); }

    nrbc(x,y){ this.add(`<circle cx="${x}" cy="${y}" r="10" fill="#d5a6b8" stroke="${C.rbcEdge}" stroke-width="0.8"/><circle cx="${x}" cy="${y}" r="5" fill="${C.nuc}"/>`); }
    heinz(x,y){ const rot=this.rand(0,360); this.add(`<g transform="translate(${x},${y}) rotate(${rot})"><ellipse rx="11" ry="10.5" fill="${C.rbc}" stroke="${C.rbcEdge}" stroke-width="0.8"/><ellipse rx="4.5" ry="4.2" fill="${C.bg}" opacity="0.85"/><circle cx="10.5" cy="0" r="3.2" fill="#b65d7a"/></g>`); }
    eccentro(x,y){ const rot=this.rand(0,360); this.add(`<g transform="translate(${x},${y}) rotate(${rot})"><ellipse rx="11" ry="10.5" fill="${C.bg}" stroke="${C.rbcEdge}" stroke-width="0.9"/><path d="M-11 0 A11 10.5 0 0 1 11 0 L 2 0 Z" fill="${C.rbcDark}"/></g>`); }
    babesiaLarge(x,y){ this.rbc(x,y,{r:12,pallor:false,extra:`<path d="M-1 -1 C -6 -5 -5 2 -3 3 Z" fill="${C.amast}"/><path d="M1 -1 C 6 -5 5 2 3 3 Z" fill="${C.amast}"/>`}); }
    babesiaSmall(x,y){ this.rbc(x,y,{r:11,pallor:false,extra:`<circle cx="3" cy="-2" r="2.2" fill="none" stroke="${C.amast}" stroke-width="1.2"/><circle cx="4.2" cy="-3" r="0.8" fill="${C.amast}"/>`}); }
    platelet(x,y,o={}){ this.add(`<ellipse cx="${x}" cy="${y}" rx="3.5" ry="2.6" fill="${C.plt}" transform="rotate(${this.rand(0,180)} ${x} ${y})"/>${o.incl?`<circle cx="${x}" cy="${y}" r="1.3" fill="${C.nuc}"/>`:""}`); }
    neutrophil(x,y,o={}){ const r=o.r||15; const cytoCol=o.degenerate?"#e4ecf5":C.cyto; let nuc="";

      else { nuc=`<ellipse cx="-6" cy="-2" rx="4.2" ry="3.6" fill="${C.nuc}"/><ellipse cx="0" cy="3" rx="4" ry="3.4" fill="${C.nuc}"/><ellipse cx="6" cy="-2" rx="4" ry="3.4" fill="${C.nuc}"/><path d="M-3 0 L -1 2 M 3 1 L 4 -1" stroke="${C.nuc}" stroke-width="2.2"/>`; }

    eosinophil(x,y){ let g=""; for(let i=0;i<14;i++){ g+=`<circle cx="${(this.r()-0.5)*22}" cy="${(this.r()-0.5)*22}" r="1.6" fill="${C.eos}"/>`; } this.add(`<g transform="translate(${x},${y})"><circle r="15" fill="#f3e5df" stroke="#d6b7a8" stroke-width="0.6"/><ellipse cx="-5" cy="-1" rx="4" ry="3.5" fill="${C.nuc}"/><ellipse cx="5" cy="1" rx="4" ry="3.5" fill="${C.nuc}"/>${g}</g>`); }
    plasmacell(x,y){ this.add(`<g transform="translate(${x},${y}) rotate(${this.rand(0,360)})"><ellipse rx="15" ry="11" fill="#b9c7e8" stroke="#8fa3cc" stroke-width="0.6"/><circle cx="-7" cy="0" r="6" fill="${C.nuc}"/><circle cx="1" cy="0" r="4.5" fill="#dfe6f3"/></g>`); }
    tvtcell(x,y){ let v=""; for(let i=0;i<5;i++){ v+=`<circle cx="${(this.r()-0.5)*18}" cy="${(this.r()-0.5)*18}" r="2.2" fill="#f6f1ea"/>`; } this.add(`<g transform="translate(${x},${y})"><circle r="14" fill="#c7d3ea" stroke="#9fb4cc" stroke-width="0.6"/><circle cx="1" cy="-1" r="7.5" fill="${C.nucLight}"/><circle cx="2" cy="-2" r="2" fill="${C.nuc}"/>${v}</g>`); }

    sarcoptes(x,y){ const rot=this.rand(0,360); let legs=""; for(let i=0;i<4;i++){ const a=(i<2?-0.5:0.6)+(i%2)*0.35; legs+=`<path d="M${Math.cos(a)*14} ${Math.sin(a)*12} l ${Math.cos(a)*5} ${Math.sin(a)*5}" stroke="${C.miteEdge}" stroke-width="1.6" stroke-linecap="round"/><path d="M${-Math.cos(a)*14} ${Math.sin(a)*12} l ${-Math.cos(a)*5} ${Math.sin(a)*5}" stroke="${C.miteEdge}" stroke-width="1.6" stroke-linecap="round"/>`; }
      this.add(`<g transform="translate(${x},${y}) rotate(${rot})"><ellipse rx="15" ry="13" fill="${C.mite}" stroke="${C.miteEdge}" stroke-width="1"/><path d="M-10 -4 Q 0 -1 10 -4 M-10 2 Q 0 5 10 2 M-8 8 Q 0 10 8 8" stroke="${C.miteEdge}" stroke-width="0.6" fill="none"/>${legs}<ellipse cx="0" cy="-14" rx="4" ry="2.5" fill="${C.mite}" stroke="${C.miteEdge}" stroke-width="0.9"/></g>`); }
    otodectes(x,y){ const rot=this.rand(0,360); let legs=""; [[-0.9,1],[-0.4,1],[0.4,1],[0.9,1]].forEach(([a,s])=>{ legs+=`<path d="M${Math.cos(a)*16} ${-Math.sin(a)*8-6} l ${Math.cos(a)*14} ${-Math.abs(Math.sin(a))*10-4}" stroke="${C.miteEdge}" stroke-width="1.6" stroke-linecap="round"/>`; });
      this.add(`<g transform="translate(${x},${y}) rotate(${rot})"><ellipse rx="17" ry="20" fill="${C.mite}" stroke="${C.miteEdge}" stroke-width="1"/>${legs}<ellipse cx="0" cy="-20" rx="5" ry="3" fill="${C.mite}" stroke="${C.miteEdge}" stroke-width="0.9"/></g>`); }
    hair(x,y,o={}){ const rot=this.rand(-30,30); let spores=""; if(o.spores){ for(let i=0;i<40;i++){ spores+=`<circle cx="${(this.r()-0.5)*110}" cy="${(this.r()>0.5?1:-1)*(5+this.r()*4)}" r="1.4" fill="${C.yeast}" opacity="0.9"/>`; } }
      this.add(`<g transform="translate(${x},${y}) rotate(${rot})"><rect x="-60" y="-4" width="120" height="8" rx="3" fill="${C.hair}" opacity="0.85"/><rect x="-60" y="-1" width="120" height="2" fill="#5b4330" opacity="0.6"/>${spores}</g>`); }
    struvite(x,y){ const rot=this.rand(0,360); this.add(`<g transform="translate(${x},${y}) rotate(${rot})"><polygon points="-16,-6 -6,-12 14,-8 16,4 6,10 -14,6" fill="${C.crystal}" stroke="${C.crystalEdge}" stroke-width="1"/><path d="M-6 -12 L -4 6 M14 -8 L 16 4 M-6 -12 L 14 -8 M-4 6 L 16 4" stroke="${C.crystalEdge}" stroke-width="0.7" fill="none"/></g>`); }
    oxalateDi(x,y){ const rot=this.rand(0,360); this.add(`<g transform="translate(${x},${y}) rotate(${rot})"><rect x="-9" y="-9" width="18" height="18" fill="${C.crystal}" stroke="${C.crystalEdge}" stroke-width="1"/><path d="M-9 -9 L 9 9 M 9 -9 L -9 9" stroke="${C.crystalEdge}" stroke-width="1"/></g>`); }
    oxalateMono(x,y){ const rot=this.rand(0,360); this.add(`<g transform="translate(${x},${y}) rotate(${rot})"><path d="M-12 -3 L -4 -1 L 4 -1 L 12 -3 L 12 3 L 4 1 L -4 1 L -12 3 Z" fill="${C.crystal}" stroke="${C.crystalEdge}" stroke-width="1"/></g>`); }
    biurate(x,y){ let sp=""; for(let i=0;i<14;i++){ const a=i/14*Math.PI*2; sp+=`<path d="M${Math.cos(a)*7} ${Math.sin(a)*7} L ${Math.cos(a)*11} ${Math.sin(a)*11}" stroke="#8a6d2a" stroke-width="1.4" stroke-linecap="round"/>`; } this.add(`<g transform="translate(${x},${y})"><circle r="7.5" fill="#c9a24a" stroke="#8a6d2a" stroke-width="1"/>${sp}</g>`); }
    cast(x,y){ const rot=this.rand(-20,20); let g=""; for(let i=0;i<30;i++){ g+=`<circle cx="${(this.r()-0.5)*50}" cy="${(this.r()-0.5)*10}" r="1.2" fill="#7a6a5a" opacity="0.7"/>`; } this.add(`<g transform="translate(${x},${y}) rotate(${rot})"><rect x="-28" y="-7" width="56" height="14" rx="7" fill="#d9cfc2" stroke="#a89a88" stroke-width="0.8"/>${g}</g>`); }
    render(mag, showAnn){ return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;border-radius:14px;background:#1d1f24">
      <defs><clipPath id="fld"><circle cx="200" cy="150" r="140"/></clipPath><radialGradient id="vig" cx="50%" cy="50%" r="50%"><stop offset="70%" stop-color="${C.bg}"/><stop offset="100%" stop-color="#e6ddd0"/></radialGradient></defs>
      <circle cx="200" cy="150" r="140" fill="url(#vig)"/><g clip-path="url(#fld)">${this.parts.join("")}</g>
      <circle cx="200" cy="150" r="140" fill="none" stroke="#0f1013" stroke-width="6"/>
      <text x="14" y="288" fill="#c8ccd6" font-size="11" font-family="monospace">${mag}</text><text x="386" y="288" fill="#c8ccd6" font-size="11" font-family="monospace" text-anchor="end">schematic</text>${showAnn?this.renderAnnotations():""}</svg>`; }
    renderAnnotations(){ if(!this.ann.length) return ""; const items=this.ann.slice(0,4); let s=""; items.forEach((a,i)=>{ const lx = a.x<200? 30 : 370, ly = 28+i*22; const anchor=a.x<200?"start":"end"; s+=`<line x1="${a.x}" y1="${a.y}" x2="${lx}" y2="${ly}" stroke="#ffd166" stroke-width="1.5"/><circle cx="${a.x}" cy="${a.y}" r="4" fill="none" stroke="#ffd166" stroke-width="1.5"/><rect x="${a.x<200?lx-4:lx-4-a.label.length*6.3}" y="${ly-11}" width="${a.label.length*6.3+8}" height="15" rx="4" fill="#1d1f24" opacity="0.9"/><text x="${lx}" y="${ly}" fill="#ffd166" font-size="11" font-family="sans-serif" text-anchor="${anchor}">${a.label}</text>`; }); return s; }
  }
  return {Field, C};
})();

  e:"Degenerate (swollen, pale-nucleus) neutrophils with intracellular cocci confirm bacterial infection; cocci on canine skin are almost always Staphylococcus pseudintermedius. Pemphigus shows acantholytic cells with non-degenerate neutrophils and no bacteria; Malassezia are budding yeasts." },
{ id:"pemphigus", title:"Pustule cytology, crusted nasal planum and pinnae", mag:"Diff-Quik, 100x oil", prep:"Contents of an intact pustule",

{ id:"demodex", title:"Deep skin scraping, 5-month-old puppy with alopecia", mag:"Mineral oil, 10x", prep:"Deep scraping until capillary bleeding",

  q:"Identify the parasite.", o:["Demodex canis","Sarcoptes scabiei","Otodectes cynotis","Cheyletiella yasguri"],
  e:"Demodex canis is elongated ('cigar-shaped', ~250 um) with four pairs of short stubby legs on the anterior body and a long striated opisthosoma; it lives in hair follicles, so deep scrapings or hair plucks are needed. Sarcoptes and Otodectes are round/oval with longer legs; Cheyletiella has prominent hooked mouthparts." },
{ id:"sarcoptes", title:"Superficial scraping, ear margin of an intensely pruritic dog", mag:"Mineral oil, 10x", prep:"Broad superficial scraping of crusted ear margin",

{ id:"otodectes", title:"Ear debris, kitten with dark crumbly discharge", mag:"Mineral oil, 4x", prep:"Ear debris smeared in mineral oil",

{ id:"imha", title:"Blood smear, weak icteric Cocker Spaniel", mag:"Wright stain, 100x oil", prep:"Peripheral blood, monolayer",
