BASIC_QUIZ.push(
// ---- Inpatient monitoring ----
{c:"Inpatient Monitoring", q:"What do the letters of a SOAP hospital note stand for?",
 o:["Subjective, Objective, Assessment, Plan","Signs, Observations, Analysis, Prescription","Status, Orders, Actions, Progress","Summary, Outcome, Advice, Prognosis"],
 e:"Subjective (demeanor, appetite, how the patient seems), Objective (vital signs, weight, exam findings, lab results), Assessment (problem list and how each problem is evolving) and Plan (treatments, monitoring, tests, owner update). Written at least once a day on every inpatient, and the plan is what the nursing sheet is built from."},
{c:"Inpatient Monitoring", q:"A hospitalized dog's weight falls 6% in 24 h while on IV fluids. Most likely meaning?",
 o:["Ongoing fluid losses not covered: reassess the fluid plan","Normal loss of fat during hospitalization","The scale is wrong; ignore it","Fluid overload"],
 e:"Acute weight change in hospital is water, not tissue: a loss means the fluid plan is not covering losses (vomiting, diarrhea, polyuria, third-spacing); a gain over 5-10% suggests overload. Weigh on the same scale at the same time twice daily and record it."},
{c:"Inpatient Monitoring", q:"Which pain scale is validated for acute pain in hospitalized cats?",
 o:["Feline Grimace Scale or UNESP-Botucatu","Glasgow Composite Measure Pain Scale (canine form)","Body condition score 1-9","Visual analog scale by the owner"],
 e:"Cats: Feline Grimace Scale (ear position, orbital tightening, muzzle tension, whisker change, head position) or the UNESP-Botucatu scale. Dogs: Glasgow short form (intervention when the score is 6/24 or more, 5/20 if the mobility item cannot be assessed). Score every 4-6 h and 30-60 min after each analgesic."},
{c:"Inpatient Monitoring", q:"A 5 kg cat on a CRI of fluids has a respiratory rate that rose from 24 to 48 at rest and a new serous nasal discharge. First action?",
 o:["Stop the fluids and call the veterinarian: suspected overload","Increase the fluid rate to improve perfusion","Give furosemide 4 mg/kg IV yourself","Record it and recheck in 4 hours"],
 e:"Rising resting respiratory rate, nasal discharge, chemosis, weight gain and new crackles are the signs of fluid overload, which cats develop easily. Stop the pump, assess, inform the vet; diuretics and oxygen are the vet's decision."},
{c:"Inpatient Monitoring", q:"When should blood glucose be checked in a hospitalized diabetic patient starting insulin?",
 o:["Every 2 h for a glucose curve, and whenever weak or seizuring","Once daily before the morning meal","Only if the urine dipstick shows glucose","Every 15 minutes around the clock"],
 e:"A 12-24 h glucose curve (every 2 h) shows the nadir and duration of the insulin; any weakness, ataxia, tremor or seizure in a diabetic means check glucose immediately and give dextrose or honey on the gums if under 60 mg/dL. Use a veterinary glucometer; record all values with the time and the insulin dose given."},
{c:"Inpatient Monitoring", q:"A recumbent large-breed dog has been hospitalized for 48 h. Which nursing measure prevents decubital ulcers and pneumonia?",
 o:["Turn every 4 h, thick padded bedding, keep dry, passive limb movement","Keep in lateral recumbency on the same side to rest the lungs","Restrict water to reduce urine scald","Tight bandages over all bony prominences"],
 e:"Recumbent care: turn every 4 h (sternal when possible), thick padding, keep skin clean and dry (urine scald), check pressure points (hips, elbows, hocks), passive range-of-motion, help to stand/sling walk, offer food and water in sternal position, and watch for aspiration."},
{c:"Inpatient Monitoring", q:"A post-operative patient's rectal temperature is 36.2 C two hours after surgery. What is appropriate?",
 o:["Active warming (warm-air blanket, warmed fluids) and recheck every 30 min","Nothing; mild hypothermia is expected and resolves alone","An electric heating pad directly under the patient","A hot-water bath"],
 e:"Below 37 C after anesthesia delays recovery and drug metabolism and increases infection risk: warm actively with forced air, wrapped warm bags or warmed fluids, recheck every 30 min until over 37.5 C. Never an electric pad in direct contact with an immobile animal or a water bath."},
{c:"Inpatient Monitoring", q:"Which finding on a hospitalized patient's catheter limb requires removing the catheter now?",
 o:["Swelling, pain or heat above the catheter, or fluid leaking under the bandage","The bandage is slightly loose","The patient chewed the tape","The catheter was placed 48 h ago"],
 e:"Phlebitis signs (swelling, pain, heat, a venous cord), extravasation (swelling and fluid under the bandage, pump occlusion alarms) or a catheter that no longer flushes mean remove it and replace it in another vein. Loose bandages and chewed tape are redressed; routine replacement is at 72-96 h."},
{c:"Inpatient Monitoring", q:"Which hospitalized patient needs a feeding plan rather than 'wait until he eats'?",
 o:["A cat that has eaten nothing for 3 days","A dog that ate half of its ration this morning","A puppy that vomited once but is eating","A cat eating 80% of its RER"],
 e:"Three days without food (or intake below 50-80% of RER for more than 2-3 days) means assisted feeding: appetite stimulants (mirtazapine, capromorelin) and then an esophagostomy or nasoesophageal tube, especially in cats, which risk hepatic lipidosis. Record intake as grams or % of RER on every round."},
{c:"Inpatient Monitoring", q:"What should be checked on a fluid pump at every round?",
 o:["Rate, volume infused vs prescribed, bag contents/additive label, line patency, catheter site","Only that the alarm is off","Only the remaining volume in the bag","The pump brand and serial number"],
 e:"Pump rounds: prescribed rate matches the screen, volume infused matches the elapsed time, bag correctly labeled (additives, time hung, initials), line free of air and kinks, catheter site clean and not swollen, and the patient's weight/RR/urine output trend. Bags with additives hang for a maximum of 24 h."},
{c:"Inpatient Monitoring", q:"Which of these must be recorded on the hospitalization sheet, not just remembered?",
 o:["Every drug given with dose, route, time and initials, and every observation","Only drugs that are controlled substances","Only abnormal findings","Only the vet's orders"],
 e:"If it is not written, it did not happen: every drug (dose, route, time, initials), vital signs, food and water intake, urination/defecation, vomiting, pain scores, catheter checks and owner communications. This is also what protects you legally and lets the next shift continue without guessing."},
{c:"Inpatient Monitoring", q:"Owner communication for a hospitalized patient: good practice?",
 o:["A scheduled daily update by the same vet, written in the record, with costs updated","Only call if something goes wrong","Let the owner visit any time without notice","Give updates only at discharge"],
 e:"One update a day at an agreed time (plus any significant change), consistent messenger, written summary in the file, running estimate of costs and written consent for any new procedure. Visits are arranged at set times so they do not interrupt treatments."},
// ---- Basic lab interpretation ----
{c:"Basic Lab Interpretation", q:"Neutrophilia with lymphopenia, eosinopenia and mild monocytosis in a dog is called:",
 o:["Stress (steroid) leukogram","Inflammatory leukogram with left shift","Leukemoid reaction","Degenerative left shift"],
 e:"Endogenous or exogenous corticosteroids: mature neutrophilia (no bands), lymphopenia, eosinopenia, monocytosis (dog). Very common in sick or stressed hospital patients and after prednisolone; it does not by itself mean infection. In cats stress more often gives lymphocytosis from excitement."},
{c:"Basic Lab Interpretation", q:"What defines a left shift on the CBC?",
 o:["Increased band (immature) neutrophils","Increased lymphocytes","Increased eosinophils","Increased mature neutrophils only"],
 e:"Bands above the reference range indicate active inflammation demanding neutrophils (pyometra, pyothorax, peritonitis, pneumonia). Regenerative left shift: bands fewer than mature neutrophils with neutrophilia (good); degenerative left shift: bands exceed mature neutrophils, often with normal or low total count (overwhelming demand, poorer prognosis). Toxic change in neutrophils supports sepsis."},
{c:"Basic Lab Interpretation", q:"A dog has PCV 22% with reticulocytes 180 x10^9/L. Classification?",
 o:["Regenerative anemia (hemorrhage or hemolysis)","Non-regenerative anemia","Normal for a dog","Polycythemia"],
 e:"Absolute reticulocytes above about 60-80 x10^9/L in the dog (above 50 aggregate in the cat) mean the marrow is responding: look for blood loss or hemolysis. Non-regenerative anemia (low reticulocytes after 3-5 days) points to chronic disease, kidney disease, marrow problems or FeLV. Also check MCV, total protein and plasma color."},
{c:"Basic Lab Interpretation", q:"Platelets 25 x10^9/L on an EDTA sample from a dog with no petechiae. First step?",
 o:["Examine the smear for platelet clumps and estimate the count manually","Start a transfusion of platelet-rich plasma","Diagnose immune thrombocytopenia","Start prednisolone immediately"],
 e:"Analyzers undercount platelets when they clump (very frequent in cats and in slowly drawn samples) or when platelets are large (Cavalier King Charles Spaniels). Check the smear: 8-15 platelets per 100x field is roughly a normal count (each platelet per field ~15-20 x10^9/L). Spontaneous bleeding usually appears only below 30-50 x10^9/L."},
{c:"Basic Lab Interpretation", q:"Which pattern indicates PRERENAL azotemia?",
 o:["High BUN/creatinine with concentrated urine (USG > 1.030 dog / > 1.035 cat) and dehydration","High creatinine with dilute urine (USG 1.008-1.012)","High creatinine with a very large bladder","Normal creatinine with low USG"],
 e:"Prerenal: the kidney is concentrating normally but perfusion is poor (dehydration, shock, heart failure) and azotemia resolves with fluids. Renal: azotemia with inadequate concentration (isosthenuria). Postrenal: azotemia with obstruction or urinary tract rupture, often hyperkalemia and a distended or absent bladder."},
{c:"Basic Lab Interpretation", q:"Which liver enzyme is more specific for hepatocellular injury in dogs and cats?",
 o:["ALT","ALP","GGT","Amylase"],
 e:"ALT rises with hepatocyte damage (half-life about 2-3 days in dogs, hours in cats, so in cats any rise matters). ALP is induced by cholestasis, steroids (dog isoenzyme) and bone growth in young animals, and is very non-specific in dogs; in cats ALP has a short half-life and no steroid isoenzyme, so a raised feline ALP is significant (lipidosis, cholangitis). Bilirubin and bile acids assess function."},
{c:"Basic Lab Interpretation", q:"A 6-month-old puppy has ALP three times the reference range and is otherwise normal. Interpretation?",
 o:["Bone isoenzyme from growth: normal in young animals","Hepatic neoplasia","Cholestasis requiring ultrasound today","Pancreatitis"],
 e:"Growing animals have a high ALP (and phosphorus) from bone turnover; it is interpreted against age. Do not launch a liver workup for an isolated ALP in a healthy puppy; recheck after growth or if signs appear."},
{c:"Basic Lab Interpretation", q:"Low albumin with low globulins (panhypoproteinemia) suggests which group of causes?",
 o:["Blood loss, protein-losing enteropathy, severe burns or exudative skin disease","Liver failure","Protein-losing nephropathy","Dehydration"],
 e:"Both fractions fall together with hemorrhage or gut loss (PLE). Albumin alone falls with liver failure (synthesis), protein-losing nephropathy (glomerular loss, check urine protein:creatinine) or inflammation (negative acute-phase protein). High globulins with low albumin suggest chronic inflammation, FIP, ehrlichiosis or leishmaniosis."},
{c:"Basic Lab Interpretation", q:"Potassium 7.8 mmol/L with sodium 128 mmol/L in a young dog with vomiting and weakness. Think of:",
 o:["Hypoadrenocorticism (Addison's disease)","Hyperadrenocorticism (Cushing's)","Diabetes mellitus","Hypothyroidism"],
 e:"Na:K ratio below 27 with hyperkalemia and hyponatremia in a sick young to middle-aged dog screams Addison's; often with azotemia, hypoglycemia, absence of a stress leukogram, bradycardia and mild hypercalcemia. Confirm with basal cortisol (over 2 ug/dL rules it out) or ACTH stimulation. Also consider urethral obstruction, uroabdomen, whipworms and hemolysis artifact."},
{c:"Basic Lab Interpretation", q:"Blood glucose 45 mg/dL in a 1.2 kg Yorkshire puppy that is wobbly. Most likely cause and first action?",
 o:["Juvenile hypoglycemia (fasting, stress, parasites): dextrose on the gums or IV, then feed","Insulinoma: refer for surgery","Addison's disease: give steroids","Laboratory error: repeat tomorrow"],
 e:"Toy-breed puppies have small glycogen stores; fasting, cold, parasites or diarrhea drop their glucose. Give 50% dextrose diluted 1:2-1:4 IV at 0.5-1 mL/kg (or honey/glucose syrup on the gums if no IV), then small frequent meals and investigate the trigger. Insulinoma is a disease of middle-aged to older dogs."},
{c:"Basic Lab Interpretation", q:"Total calcium of 13.5 mg/dL in a middle-aged dog. Which is the single most useful next test?",
 o:["Ionized calcium (and then check for lymphoma, Addison's, hypercalcemia of malignancy, kidney disease)","Repeat total calcium next month","Urine dipstick","Thyroid T4"],
 e:"Total calcium is affected by albumin and lipemia; ionized calcium confirms true hypercalcemia. In dogs the common causes are neoplasia (lymphoma, anal sac adenocarcinoma: palpate lymph nodes and do a rectal exam), hypoadrenocorticism, chronic kidney disease, primary hyperparathyroidism and vitamin D toxicity (rodenticide, creams); in cats idiopathic hypercalcemia and CKD."},
{c:"Basic Lab Interpretation", q:"Urine dipstick in a dog: which pads are unreliable and should be ignored?",
 o:["Leukocytes, nitrite and specific gravity","pH and glucose","Protein and blood","Ketones and bilirubin"],
 e:"The leukocyte pad gives false negatives in dogs and false positives in cats; the nitrite pad does not work in animals; specific gravity must be read with a refractometer. Bilirubin can be normal in small amounts in concentrated male dog urine but is always abnormal in cats. Protein is interpreted against USG and confirmed with a UPC."},
{c:"Basic Lab Interpretation", q:"A dog has urine specific gravity 1.010, creatinine 3.2 mg/dL and has been polyuric for months. Stage?",
 o:["Chronic kidney disease: stage by IRIS creatinine/SDMA once stable and hydrated, substage by UPC and blood pressure","Acute kidney injury: dialysis","Prerenal azotemia: just fluids","Postrenal: obstruction"],
 e:"Chronic history, isosthenuria and azotemia = CKD. IRIS staging (creatinine or SDMA) is done on a stable, hydrated patient, with substaging by proteinuria (UPC) and blood pressure. Look for a treatable cause (pyelonephritis, stones) and start renal diet, phosphate control and hydration."},
{c:"Basic Lab Interpretation", q:"Which parameter is most useful to confirm pancreatitis in a vomiting dog with cranial abdominal pain?",
 o:["Specific canine pancreatic lipase (cPL/Spec cPL) plus abdominal ultrasound","Serum amylase alone","ALT alone","Total protein"],
 e:"Amylase and total lipase are non-specific (kidney, gut, steroids). Spec cPL (or SNAP cPL as screen) with ultrasound is the current approach; in cats fPL. Pancreatitis is treated with fluids, analgesia, maropitant and early feeding."},
// ---- Pharmacy & clinical records ----
{c:"Pharmacy & Records", q:"How must vaccines and insulin be stored in the clinic?",
 o:["Refrigerator at 2-8 C with a logged thermometer, never in the door or freezer","Room temperature in a dark cupboard","Freezer at -20 C","Anywhere, as long as the box is closed"],
 e:"Cold chain 2-8 C with a min/max thermometer read and logged daily, items not touching the back wall or in the door; a broken cold chain means the vaccine or insulin is discarded. Reconstituted vaccines are used within an hour; opened insulin vials are dated (generally 28-42 days)."},
{c:"Pharmacy & Records", q:"A multi-dose vial of injectable was opened 3 weeks ago and has no written date. What do you do?",
 o:["Discard it; label every vial with the opening date and discard date from now on","Use it if it looks clear","Use it only for large dogs","Add it to the controlled-drug log"],
 e:"Opened vials carry the opening date, initials and discard date (manufacturer's in-use period, often 28 days unless stated). Undated or cloudy vials are discarded. Draw with a fresh needle each time, swab the stopper, never leave a needle in the stopper."},
{c:"Pharmacy & Records", q:"What must a dispensed medication label include?",
 o:["Patient and owner name, drug, strength, quantity, dose/frequency/duration, date, clinic and vet, warnings","Only the drug name","The drug and the price","The patient's name and 'as directed'"],
 e:"A complete label (and a counselled owner) prevents the most common home errors: 'give 1 tablet (50 mg) by mouth twice daily with food for 7 days'. Record the dispensing in the clinical record with the batch when required, and never say 'as directed' alone."},
{c:"Pharmacy & Records", q:"Prescription written as 'Amoxicillin-clavulanate 250 mg PO BID 7 d' for a 10 kg dog (12.5-25 mg/kg). Is the dose appropriate?",
 o:["Yes: 25 mg/kg twice daily, at the top of the range","No: it is ten times too high","No: BID is wrong for this drug","Cannot tell without the tablet color"],
 e:"250 mg / 10 kg = 25 mg/kg, within 12.5-25 mg/kg q12h. Always recalculate the mg/kg from the body weight before dispensing or giving; checking a colleague's dose is expected, not rude. Abbreviations: SID/q24h, BID/q12h, TID/q8h, QID/q6h, PO oral, SC, IM, IV, PRN as needed."},
{c:"Pharmacy & Records", q:"Which drugs commonly need a weight-based dilution before IV use in cats and small dogs?",
 o:["Potassium chloride, 50% dextrose, and many opioids/sedatives drawn in tiny volumes","Lactated Ringer's","Sterile saline","Oral metronidazole"],
 e:"KCl is never given undiluted (added to the bag, max 0.5 mEq/kg/h), 50% dextrose is diluted at least 1:2 to avoid phlebitis, and small-volume drugs (medetomidine, buprenorphine, methadone for a 3 kg cat) are diluted with saline so a 0.05 mL dose can actually be measured accurately."},
{c:"Pharmacy & Records", q:"The clinic's practice management system: which habit matters most for a new vet?",
 o:["Enter every exam finding, treatment, dispensed item and owner conversation in the record the same day","Only enter invoices","Write notes on paper and transcribe weekly","Let the receptionist enter clinical notes"],
 e:"Same-day complete notes (SOAP), itemized treatments and charges, consent forms uploaded, and every phone call or owner discussion logged. In a licensing environment like the UAE, records are what the authority, the owner and your colleagues will rely on."},
{c:"Pharmacy & Records", q:"A controlled drug (e.g., methadone) ampoule is opened and 0.3 mL is used; 0.7 mL remains. What happens to the remainder?",
 o:["Discarded in front of a witness and recorded in the register with both signatures","Kept in the fridge for the next patient","Taken home by the vet","Poured down the sink without recording"],
 e:"Each withdrawal from the controlled-drug register records date, patient, amount used, amount wasted, balance and two signatures; wastage is witnessed. Discrepancies are reported, not corrected quietly. In the UAE, controlled-drug regulation is strict and licences depend on it."},
// ---- Surgery basics ----
{c:"Surgery Basics", q:"Correct order of a surgical hand scrub/rub and gowning?",
 o:["Mask and cap on, scrub/rub hands to elbows, dry towel hands to elbows, gown, closed gloving","Gloves first, then scrub, then gown","Scrub, then put on the mask, then gloves","Gown, then scrub, then open gloving"],
 e:"Mask and cap before scrubbing, nails short and no jewelry, 3-5 min scrub or alcohol rub per protocol, hands kept above elbows, dry from fingers to elbow with separate towel halves, gown without touching the outside, closed gloving. Anything below the waist or behind you is not sterile."},
{c:"Surgery Basics", q:"How is the surgical site prepared?",
 o:["Wide clip, gross clean, then alternating chlorhexidine scrub and alcohol/saline from center outward, at least 3 cycles, final chlorhexidine solution","Clip tightly around the incision only and wipe once with alcohol","Shave with a razor blade and apply iodine once","Clip after the drapes are in place"],
 e:"Clip widely (clipper blade 40) with the animal in the prep area, remove debris, scrub in concentric circles from the incision outward never returning to the center, alternating antiseptic and alcohol (or sterile saline), minimum 3 cycles or until swabs are clean, then a final solution left to dry. Chlorhexidine 2-4% scrub for skin; avoid alcohol near the eyes and open wounds."},
{c:"Surgery Basics", q:"Which instrument is used to hold tissue delicately during soft-tissue surgery?",
 o:["DeBakey or Adson-Brown thumb forceps","Rochester-Carmalt forceps","Towel clamp (Backhaus)","Rongeurs"],
 e:"DeBakey (atraumatic) and Adson-Brown (fine teeth) thumb forceps handle tissue; Carmalts and Rochester-Pean are crushing hemostats for pedicles (ovariohysterectomy); Backhaus clamps fix drapes; Metzenbaum scissors cut tissue, Mayo scissors cut fascia and sutures; Allis forceps are traumatic and only for tissue being removed."},
{c:"Surgery Basics", q:"Which suture is absorbable and commonly used for ligatures and subcutaneous closure?",
 o:["Polyglactin 910 (Vicryl) or poliglecaprone 25 (Monocryl)","Nylon","Polypropylene (Prolene)","Silk"],
 e:"Absorbable: polyglactin 910 (braided, 2-3 weeks of strength), poliglecaprone 25 (monofilament, 1-2 weeks), polydioxanone PDS (monofilament, 6 weeks, for linea alba in large dogs). Non-absorbable: nylon and polypropylene for skin and vascular work. Size: 3-0 for cats and small dogs, 2-0 for medium, 0 for large-dog linea alba."},
{c:"Surgery Basics", q:"When is the first dose of perioperative antibiotic given for a clean surgery that needs one?",
 o:["IV 30-60 min before the incision, repeated every 90-120 min during surgery, not continued after 24 h","After the surgery is finished, orally for 7 days","Only if the wound becomes infected","At the time of skin closure"],
 e:"Clean procedures under 90 min in healthy patients usually need no antibiotic at all; when indicated (long surgery, implant, contaminated field) cefazolin 22 mg/kg IV 30-60 min before incision, repeated intraoperatively, stopped within 24 h. Post-operative 'cover' courses select resistance without reducing infection."},
{c:"Surgery Basics", q:"Minimum monitoring of a routine spay/neuter patient in the first hour after surgery?",
 o:["Temperature, HR, RR, mucous membranes, pain score and incision check every 15 min until sternal, then every 30-60 min","One check at the end of the day","Only when the owner arrives","Leave to sleep undisturbed for 4 hours"],
 e:"Recovery is the highest-risk anesthetic period (most deaths occur in the first 3 h). Monitor every 15 min until sternal and swallowing, keep warm, check the incision for bleeding, score pain, offer water once fully awake and food within a few hours, and confirm urination before discharge."},
{c:"Surgery Basics", q:"Which discharge instructions after a routine ovariohysterectomy are correct?",
 o:["E-collar until suture removal (10-14 days), no licking, no baths, short leash walks only, check incision daily, NSAID as prescribed with food","Free running from day 2 to prevent stiffness","Remove the collar at night so the dog sleeps","Bathe the incision daily with soap"],
 e:"Give instructions verbally and in writing: what the incision should look like, warning signs (swelling, discharge, gaping, vomiting, lethargy, pale gums), medication schedule, activity restriction, when to recheck and an emergency number. Confirm the owner has understood."},
{c:"Surgery Basics", q:"Where and how are surgical instruments sterilized, and how do you know a pack is sterile?",
 o:["Autoclave 121-134 C; indicator tape or strip changed color, pack dry, intact and within date","Boiling water for 10 minutes","Chlorhexidine soak overnight","Alcohol wipe before use"],
 e:"Steam autoclaving (e.g., 134 C for 3-4 min or 121 C for 15-20 min, plus drying) with external indicator tape and an internal chemical indicator; cold sterilization in glutaraldehyde is for items that cannot be autoclaved and needs rinsing with sterile saline. A wet, torn, dropped or expired pack is not sterile. Instruments are cleaned and dried before packing."}

BASIC_QUIZ.push(
// ---- Common presentations: first 10 minutes ----
{c:"Common Presentations", q:"A dog presents for 'vomiting'. The single most useful first question to the owner?",
 o:["Is it true vomiting (retching, abdominal effort) or regurgitation (passive, undigested, tubular)?","What brand of food does the dog eat?","Has the dog ever been vaccinated against rabies?","How many hours does the dog sleep?"],
 e:"Regurgitation (passive, no nausea, often soon after eating, tube-shaped food) points to the esophagus (megaesophagus, stricture, foreign body) and needs thoracic radiographs; vomiting (prodromal nausea, retching, bile) points to the stomach, gut or a systemic cause. Then ask: frequency, blood, appetite, diarrhea, access to foreign bodies/toxins, drugs (NSAIDs), and whether the dog can keep water down."},
{c:"Common Presentations", q:"Vomiting dog, bright, no blood, eating, normal exam, one day of signs. Reasonable first-visit plan?",
 o:["Maropitant, small bland meals, no NSAIDs, recheck if it persists beyond 24-48 h or worsens","Exploratory laparotomy","Full CT scan","A week of oral antibiotics"],
 e:"Acute uncomplicated vomiting in a bright, hydrated adult dog is usually dietary indiscretion or gastritis: antiemetic, bland diet in small portions, water available, no NSAIDs or steroids, and clear red flags for the owner (lethargy, blood, repeated vomiting, abdominal pain, not drinking). Puppies, cats, repeated vomiting, pain or dehydration get a parvo test, bloods and radiographs the same day."},
{c:"Common Presentations", q:"Which finding in a vomiting dog makes abdominal radiographs urgent?",
 o:["Unproductive retching with a distended, tympanic abdomen","A single vomit of grass this morning","Normal appetite and soft stools","Mild halitosis"],
 e:"Non-productive retching plus abdominal distension in a deep-chested dog is gastric dilatation-volvulus: right lateral radiograph (double bubble), IV catheters, shock fluids, decompression and surgery. Other radiograph triggers: palpable mass or foreign body, persistent vomiting over 24 h, pain, history of eating objects, melena or hematemesis."},
{c:"Common Presentations", q:"Diarrhea: which features point to the LARGE intestine rather than the small intestine?",
 o:["Small frequent volumes, mucus, fresh blood, tenesmus and urgency, normal weight","Large volumes, melena, weight loss, steatorrhea","Vomiting with every episode","Polyuria and polydipsia"],
 e:"Large bowel: tenesmus, mucus, hematochezia, small volumes many times a day, no weight loss (colitis, whipworms, stress, dietary). Small bowel: large volumes, melena, weight loss, borborygmi, fewer episodes (parasites, infectious, IBD, EPI). Chronic diarrhea over 3 weeks gets a fecal exam, diet trial and bloods before endoscopy."},
{c:"Common Presentations", q:"Pruritic dog: what must be excluded first, before any allergy workup?",
 o:["Ectoparasites (fleas, Sarcoptes, Demodex, lice) with skin scrapings, flea comb and cytology","Food allergy with a 12-week diet trial","Atopy with intradermal testing","Hypothyroidism with a T4"],
 e:"The pruritus workup is parasites first (and treat empirically for Sarcoptes with an isoxazoline even if scrapings are negative), then secondary infections (cytology: Malassezia, cocci), then an 8-12 week elimination diet, and only then atopic dermatitis as a diagnosis of exclusion. Ask about seasonality, other pets or people itching, distribution and response to steroids."},
{c:"Common Presentations", q:"Lame dog, non-weight-bearing on a hind limb since jumping off the sofa. First 10 minutes?",
 o:["Watch it walk, palpate from toes to hip comparing with the other limb, isolate the painful joint, then sedated orthogonal radiographs","Radiograph the whole dog standing","Prescribe an NSAID and recheck in a month","Apply a Robert Jones bandage to the whole limb before any examination"],
 e:"Observe gait first (which limb, head bob, weight shifting), then palpate systematically distal to proximal, flexing and extending each joint; in the stifle check for effusion, drawer sign and tibial thrust (cruciate rupture is the top cause of acute hind limb lameness in adult dogs), in the hip for pain on extension. Radiograph the suspected joint in two views under sedation; young dogs with a limp need panosteitis, OCD and hip dysplasia in the list."},
{c:"Common Presentations", q:"A 10-year-old intact female dog has been drinking much more for a month. What do you do first in the room?",
 o:["Confirm PU/PD (ask for a measured intake over 24 h; >100 mL/kg/day), check the vulva for discharge, urinalysis with USG, then bloods","Restrict water to see if it stops","Start insulin empirically","Prescribe antibiotics for a presumed urinary infection"],
 e:"PU/PD workup starts with urinalysis (USG under 1.030, glucose, protein, sediment) and a biochemistry/CBC: diabetes, kidney disease, hyperadrenocorticism, pyometra (intact bitch, check discharge and ultrasound), hypercalcemia, liver disease, pyelonephritis. Never restrict water until a diagnosis is made."},
{c:"Common Presentations", q:"Coughing dog: which history feature best separates cardiac from airway causes?",
 o:["A soft moist cough with exercise intolerance and a murmur suggests cardiac; a harsh honking cough on excitement suggests tracheal collapse or kennel cough","Only cardiac coughs happen at night","Only airway coughs produce foam","Breed is irrelevant"],
 e:"Also ask: duration, contact with other dogs or boarding (infectious), vaccination, heartworm prevention, retching after the cough (airway), weight loss or fever. Examine resting respiratory rate (over 40 at home is a red flag), auscultate heart and lungs, palpate the trachea. Thoracic radiographs are the key first test; a sleeping respiratory rate under 30 makes heart failure unlikely."},
{c:"Common Presentations", q:"Cat with hematuria and straining in the litter tray. What is the first thing to establish?",
 o:["Whether the bladder is large and firm (obstructed) or small (non-obstructive cystitis)","The brand of litter used","Whether the cat has fleas","The cat's vaccination history"],
 e:"A male cat straining with a large, firm, painful bladder is an emergency (urethral obstruction: potassium, ECG, fluids, unblock). A small, painful bladder in a young cat is most often feline idiopathic cystitis; in cats over 10 years think infection or stones. Urinalysis by cystocentesis and a radiograph/ultrasound for stones follow."},
{c:"Common Presentations", q:"A lethargic, inappetent cat 'not herself for 3 days'. Which minimum database is appropriate?",
 o:["Temperature and full exam, PCV/TP, glucose, biochemistry with electrolytes, CBC, urinalysis, FeLV/FIV","A single rectal temperature and reassurance","Immediate exploratory surgery","Antibiotics without any testing"],
 e:"Cats hide disease; 'lethargic cat' includes pancreatitis, cholangitis, kidney disease, hyperthyroidism (older), diabetes, FIP (young), lymphoma, pyothorax, urinary obstruction and toxins. The minimum database with a careful exam (mouth, thyroid slip, abdominal palpation, hydration, temperature) narrows it quickly; add imaging and T4 in older cats."},
{c:"Common Presentations", q:"A dog arrives after a seizure that has stopped. The owner is panicked. First steps?",
 o:["Check glucose and temperature, keep calm and dim, take a history (toxins, prior episodes, breed), full neuro exam when stable","Give phenobarbital loading immediately","Send home with no tests since it stopped","Perform an MRI the same hour"],
 e:"A single seizure that has ended needs glucose, calcium, temperature, a toxin history (metaldehyde, permethrin in cats, xylitol, chocolate), a neurological and general exam, bloods and a plan: first seizure in a young healthy dog is often idiopathic epilepsy (diagnosis of exclusion), in dogs over 6 years think structural or metabolic causes. Status epilepticus or clusters are emergencies: IV diazepam or midazolam and hospitalization."},
{c:"Common Presentations", q:"A cat is brought in with open-mouth breathing in the carrier. What do you do first?",
 o:["Oxygen in a quiet cage, minimal handling, brief look at effort and color, then TFAST/thoracocentesis if pleural fluid is suspected","A full physical exam with restraint on the table","Thoracic radiographs in dorsal recumbency immediately","Send the cat home to calm down"],
 e:"Open-mouth breathing in a cat is an emergency with a high risk of arrest during handling. Oxygen first, observe the pattern (inspiratory with short shallow breaths suggests pleural effusion: thoracocentesis is diagnostic and therapeutic; expiratory effort and wheeze suggests asthma: bronchodilator and steroid), butorphanol for anxiolysis, and radiographs only when stable and sternal."},
{c:"Common Presentations", q:"Owner reports a dog 'eating well but losing weight'. Which two systems do you think of first?",
 o:["Maldigestion/malabsorption (EPI, IBD, parasites) and endocrine (diabetes in dogs, hyperthyroidism in cats)","Dental disease and ear infection","Skin disease and conjunctivitis","Anal sac disease and otitis"],
 e:"Weight loss with a good appetite means calories are lost or burned: exocrine pancreatic insufficiency (TLI), protein-losing enteropathy, parasites, diabetes mellitus (glucosuria), hyperthyroidism in cats (T4), and some neoplasms. Weight loss WITH poor appetite points to chronic systemic disease (kidney, liver, neoplasia, chronic infection)."},
{c:"Common Presentations", q:"Dog presented for 'bad breath and dropping food'. What should the first-visit exam always include?",
 o:["A full oral exam looking at gingival index, fractured teeth, masses and tooth mobility, with a dental grade and a plan for a dental under anesthesia","Only a look at the incisors","Antibiotics for a week without looking in the mouth","Extraction of loose teeth in the awake dog"],
 e:"Periodontal disease is the most common disease of adult dogs and cats. Grade it (1-4), look for oronasal fistulas, masses (melanoma, SCC), fractured teeth with pulp exposure, resorptive lesions in cats, and plan a dental with radiographs under anesthesia; awake extractions and 'antibiotic courses' instead of a dental are not acceptable practice."},
{c:"Common Presentations", q:"A dog has a sudden head tilt, nystagmus and falls to one side. Most important first distinction?",
 o:["Peripheral vestibular (otitis media/interna, idiopathic 'old dog') vs central (brainstem: mentation change, vertical nystagmus, other cranial nerve deficits, proprioceptive deficits)","Whether the dog ate breakfast","Right vs left ear","Whether the owner wants an MRI"],
 e:"Peripheral disease (horizontal or rotatory nystagmus that does not change direction, normal mentation and proprioception, often Horner's or facial paralysis with middle-ear disease) has a good prognosis; idiopathic geriatric vestibular disease improves in 72 h. Central signs (vertical or changing nystagmus, depressed mentation, hemiparesis, proprioceptive deficits) point to the brainstem and need imaging. Always do an otoscopic exam."},
{c:"Common Presentations", q:"A 6-week-old kitten with sticky eyes, sneezing and nasal discharge from a shelter. Most likely and what to do?",
 o:["Upper respiratory infection complex (herpesvirus/calicivirus +/- Chlamydia, Mycoplasma): isolate, clean eyes, hydration and nutrition, doxycycline if conjunctivitis/bacterial signs, check for corneal ulcers","Feline infectious peritonitis: euthanize","Allergic rhinitis: antihistamines","Nasal foreign body: rhinoscopy today"],
 e:"'Cat flu' is the most common shelter kitten presentation: supportive care (humidification, warm food, nasal cleaning, fluids if needed), fluorescein stain for herpetic dendritic ulcers (no steroids), topical/oral antibiotics only for mucopurulent signs, doxycycline for Chlamydia/Mycoplasma (follow with water), and isolation from other cats. A kitten that stops eating needs a tube or syringe feeding plan."},
// ---- Extra basics across existing blocks ----
{c:"Exam & Vital Signs", q:"How is body condition score recorded and why does it matter on day one?",
 o:["On a 9-point scale (4-5/9 ideal) at every visit: it sets the weight to dose from and tracks disease","Only in obese dogs","Only by weight in kilograms","Once a year at vaccination"],
 e:"BCS 1-9 (WSAVA): ribs easily felt with slight fat cover, visible waist and abdominal tuck at 4-5/9. Dose lipophilic drugs to lean weight in obese patients, record BCS and muscle condition score at every visit, and treat a loss of two points as a disease signal."},
{c:"Exam & Vital Signs", q:"Which lymph nodes are routinely palpable in a healthy dog?",
 o:["Submandibular, prescapular and popliteal (superficial inguinal and axillary only if enlarged)","Mesenteric and hepatic","Retropharyngeal and iliac","None: all nodes are internal"],
 e:"Palpate the five pairs: submandibular, prescapular (superficial cervical), axillary, superficial inguinal and popliteal; generalized enlargement suggests lymphoma, leishmaniosis or ehrlichiosis, a single enlarged node points to a regional problem (tooth, wound, tumor). Record size in millimeters; aspirate any enlarged node."},
{c:"Restraint & Safety", q:"The clinic cat in the cage hisses, ears flat, tail thrashing, when you approach. Best option?",
 o:["Leave it, lower the stimuli (towel over the cage, quiet), and plan handling later or with sedation; do not push it","Grab it quickly by the scruff before it reacts","Spray water to calm it","Shout to establish dominance"],
 e:"Escalating arousal in a cat means stop: cover the cage, dim light, give time, use pheromones, and plan a 'cat-friendly' approach or a gabapentin/IM sedation protocol. Fighting a cat teaches it that the clinic is dangerous and injures staff. Note the behavior in the record so the next visit is planned."},
{c:"Needles & Catheters", q:"How much saline is used to flush a peripheral catheter and what is checked while flushing?",
 o:["1-2 mL (3-5 mL in large dogs) every 4-6 h; the flush should run freely with no swelling, pain or resistance","20 mL as fast as possible","0.1 mL once a day","Heparin 1000 IU/mL undiluted"],
 e:"Flush gently; resistance, swelling proximal to the catheter or pain mean the catheter is out of the vein or clotted and must be replaced, not forced. Heparinized saline is unnecessary for peripheral catheters; keep caps clean and change injection ports when soiled."},
{c:"Blood & Lab Samples", q:"Which sample is needed for a fecal flotation and how fresh should it be?",
 o:["A walnut-sized fresh sample (under a few hours, or refrigerated under 24 h) in a sealed container; three pooled days increases sensitivity","A dried sample from the garden from last week","A swab of the rectum in formalin","Only diarrhea samples can be tested"],
 e:"Flotation (zinc sulfate for Giardia), direct smear for motile trophozoites, and Baermann for lungworm larvae; antigen or PCR panels when flotation is negative in a symptomatic puppy. Eggs are shed intermittently, so a single negative does not exclude parasites; deworm puppies regardless."},
{c:"Blood & Lab Samples", q:"Which tube is used for serum biochemistry and how long must it stand before centrifuging?",
 o:["Red (plain) or gold (serum separator) tube; 20-30 min at room temperature to clot, then centrifuge and separate the serum","Lavender tube, centrifuged immediately","Blue tube, after 2 hours","Grey tube, without clotting"],
 e:"Serum needs a complete clot before spinning (otherwise fibrin strands jam the analyzer); heparin (green) plasma can be spun at once and is used by many in-house analyzers. Separate serum from cells within an hour to avoid falsely low glucose and high potassium/phosphorus from cell leakage."},
{c:"Drugs & Calculations", q:"A 4 kg cat needs meloxicam 0.1 mg/kg from a 0.5 mg/mL oral suspension. Volume?",
 o:["0.8 mL","0.08 mL","8 mL","0.2 mL"],
 e:"0.1 mg/kg x 4 kg = 0.4 mg; 0.4 / 0.5 = 0.8 mL. Oral meloxicam for cats is a different, lower concentration than the dog suspension (1.5 mg/mL): check the bottle. In cats meloxicam is licensed for a single injectable dose followed by short courses; never with dehydration, kidney disease or steroids."},
{c:"Drugs & Calculations", q:"A dog weighs 18 kg and needs cefazolin 22 mg/kg IV from a vial reconstituted to 100 mg/mL. How much?",
 o:["About 4 mL (396 mg)","0.4 mL","40 mL","18 mL"],
 e:"22 x 18 = 396 mg; 396 / 100 = 3.96 mL, drawn as 4 mL. Reconstituted antibiotic vials carry the concentration you made (write it on the vial), the date and time; most are good for 24 h refrigerated."},
{c:"Drugs & Calculations", q:"Which conversion is correct?",
 o:["1 mg = 1000 ug; 1 g = 1000 mg; 1 L = 1000 mL; 1 kg = 2.2 lb","1 mg = 100 ug","1 g = 100 mg","1 kg = 1 lb"],
 e:"Decimal point errors are the classic 10-fold medication mistake (0.1 vs 1 mL, 50 ug vs 50 mg of dexmedetomidine or levothyroxine). Write a leading zero (0.5, never .5), never a trailing zero (5, never 5.0), spell out 'units' and 'micrograms' and recalculate anything drawn into a syringe that looks too big or too small."},
{c:"Fluids Basics", q:"Which fluid is the usual first choice for rehydration and shock boluses in dogs and cats?",
 o:["A balanced isotonic crystalloid (Lactated Ringer's / Hartmann's or Plasma-Lyte)","5% dextrose in water","Hypertonic 7.5% saline as the only fluid","Sterile water"],
 e:"Balanced isotonic crystalloids are the default. 0.9% saline is acidifying and used for hypercalcemia, hyperkalemia or when a bag must carry certain drugs. 5% dextrose is water once the glucose is metabolized: never for volume. Hypertonic saline is a small-volume shock adjunct (3-5 mL/kg) and synthetic colloids are now used sparingly."},
{c:"Fluids Basics", q:"How do you estimate maintenance fluids for a 30 kg dog using the allometric formula?",
 o:["70 x 30^0.75 = about 900 mL/day (~37 mL/h)","70 x 30 = 2,100 mL/day","30 x 30 = 900 mL/h","30 mL/day total"],
 e:"70 x kg^0.75: 30^0.75 is about 12.8, so ~900 mL/day or ~37 mL/h (about 1.25 mL/kg/h); the linear 2-3 mL/kg/h rule gives 60-90 mL/h and overestimates for large dogs and underestimates for small patients. Follow your clinic's formula consistently and adjust to the patient."},
{c:"Urine & Sampling", q:"Which part of a urine sample must be examined within 30-60 minutes?",
 o:["The sediment: casts and cells lyse, crystals form on standing and refrigeration","The specific gravity","The dipstick pH only","Nothing; urine is stable for days"],
 e:"Analyze fresh, at room temperature: refrigerated urine grows struvite and oxalate crystals artifactually and casts dissolve in dilute or alkaline urine. If it must wait, refrigerate within 30 min and let it warm before reading, note the delay on the form. Culture samples go refrigerated or in a preservative tube."},
{c:"Urine & Sampling", q:"How is a skin scraping taken for Sarcoptes vs Demodex?",
 o:["Sarcoptes: broad superficial scrapes of ear margins/elbows (many sites); Demodex: deep scrapes squeezing the skin until capillary bleeding","Both: a single superficial scrape of the back","Sarcoptes: a biopsy; Demodex: a swab","Neither needs mineral oil"],
 e:"Mineral oil on the blade and slide; Sarcoptes is hard to find (positive in only ~50% of cases), so a negative does not exclude it and a treatment trial is justified; Demodex lives in the follicle, so squeeze and scrape deep, or pluck hairs (trichogram) in periocular or interdigital areas. Scotch-tape preps find Cheyletiella and lice."},
{c:"Anesthesia Basics", q:"What is checked on the anesthetic machine before every patient?",
 o:["Oxygen supply and backup cylinder, flowmeter, vaporizer level, circuit leak test, APL valve open, scavenging connected, suction and ET tubes/cuffs ready","Only the oxygen cylinder pressure","Nothing if it worked for the previous patient","Only the color of the soda lime"],
 e:"Leak test: close the APL, occlude the patient end, fill the circuit to 20-30 cmH2O and check it holds; then OPEN the APL. Check soda lime color and change when two thirds have changed, check the cuff of the tube with a syringe before intubation, and have the monitoring (capnograph, pulse oximeter, blood pressure, temperature) attached before induction."},
{c:"Anesthesia Basics", q:"Which patients are classified as higher anesthetic risk (ASA III or more) and need extra planning?",
 o:["Brachycephalics, geriatric or very young, diabetic, cardiac, renal, dehydrated or in shock patients, and sighthounds","All cats","All dogs over 10 kg","Only patients having orthopedic surgery"],
 e:"ASA I healthy, II mild disease (healthy obese, brachycephalic), III moderate systemic disease, IV life-threatening, V moribund. Risk patients get pre-anesthetic bloods, a stabilization plan, an IV catheter and fluids, a dedicated monitor person, and a recovery plan (brachycephalics: late extubation, oxygen, sternal)."},
{c:"Nursing & Hospital", q:"How is medication given to a hospitalized cat that refuses food and pills?",
 o:["Pill at the tongue base followed by water, or in a pill pocket; compounding to liquid/transdermal if repeated; never crushed into the whole meal of a nauseous cat","Crush everything into its main food","Skip the dose","Mix the tablet with milk"],
 e:"Mixing drugs into the only food offered creates aversion in an already inappetent cat. Use pillers, pill pockets, liquids, transdermal (mirtazapine, methimazole) or injectable alternatives, and record every refused or vomited dose; the vet may need a feeding tube, which also solves medication."},
{c:"Nursing & Hospital", q:"When do you put an Elizabethan collar on a hospitalized patient?",
 o:["Whenever it licks or chews at an incision, bandage, catheter or feeding tube; it is checked and removed only for eating under supervision","Never: they are stressful","Only at the owner's request","Only in dogs, never in cats"],
 e:"Self-trauma undoes surgery and pulls catheters. Fit it so the nose does not reach the problem area, pad the neck edge, make sure the animal can drink and breathe, and use soft or inflatable collars when a rigid one is not tolerated. A patient that still chews needs sedation review and pain reassessment."},
{c:"Imaging Basics", q:"Which structures are normally seen as gas on an abdominal radiograph of a healthy dog?",
 o:["Stomach (fundus in a right lateral), small amounts in the small intestine and colon","Peritoneal cavity","Urinary bladder","Liver parenchyma"],
 e:"Free peritoneal gas (loss of serosal detail with gas against the diaphragm or liver) means a perforated viscus or recent surgery; gas in the bladder (emphysematous cystitis) suggests diabetes; gas in the liver, portal vein or body wall is abnormal. Learn the normal radiograph before hunting lesions."},
{c:"Rescued Animal", q:"A found dog has a chip registered to an owner in another country. What do you do?",

{c:"Zoonoses & Hygiene", q:"Which routine protects staff who handle many stray animals in the UAE?",

{c:"Pharmacy & Records", q:"Which items need written owner consent before you proceed?",

{c:"Surgery Basics", q:"What are the three things checked in a 'surgical safety checklist' before incision?",

function hash(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return (h>>>0).toString(36); }
const mkey = (q) => "h"+hash(q.q);

function migrateStore(st){
  // old versions keyed progress by array index; convert to stable ids
  const mig = (obj, arr, keyFn, pfx) => { if(!obj) return; Object.keys(obj).forEach(k=>{ const mm = k.match(new RegExp("^"+pfx+"(\\d+)$")); if(mm){ const i=+mm[1]; if(arr[i]) obj[keyFn(arr[i])] = obj[k]; delete obj[k]; } }); };
  ["quiz","drugs"].forEach(m=>{ const D = m==="quiz"?QUIZ:DRUGS; mig(st[m].done, D, mkey, "q"); mig(st[m].correct, D, mkey, "q"); });
  mig(st.cases.done, CASES, ckey, "c"); mig(st.lab.done, LAB, lkey, "l"); mig(st.fluids.done, FLUIDS, fkey, "f");
  mig(st.cases.result, CASES, ckey, "c"); mig(st.lab.result, LAB, lkey, "l"); mig(st.fluids.result, FLUIDS, fkey, "f");
  return st;
}
function mergeStore(a, b){
  // union of progress from two sources (local + cloud, or import)
  const out = freshStore();
  Object.keys(out).forEach(m=>{
    out[m].done = Object.assign({}, (a[m]||{}).done||{}, (b[m]||{}).done||{});
    if(out[m].correct!==undefined) out[m].correct = Object.assign({}, (a[m]||{}).correct||{}, (b[m]||{}).correct||{});
    if(out[m].result!==undefined) out[m].result = Object.assign({}, (a[m]||{}).result||{}, (b[m]||{}).result||{});
    if(out[m].exams!==undefined){ const seen={}; out[m].exams = [].concat((a[m]||{}).exams||[], (b[m]||{}).exams||[]).filter(e=>e&&e.t&&!seen[e.t]&&(seen[e.t]=true)).sort((x,y)=>x.t-y.t).slice(-50); }
    if(out[m].best!==undefined) out[m].best = Math.max((a[m]||{}).best||0, (b[m]||{}).best||0);
  });
  return out;
}

const SYNC = {state:"local", doc:null, busy:false, dirty:false, timer:null, lastJson:""};
async function cloudInit(){
  try{
    if(!(window.claude && typeof window.claude.use==="function")) return;
    const user = await window.claude.use("user"); const uid = user && await user.id();
    const db = uid? await window.claude.use("db") : null;
    if(!db || !uid){ SYNC.state="local"; refreshSyncUI(); return; }
    SYNC.doc = db.doc("data/users/"+uid+"/progress");
    const snap = await SYNC.doc.get();
    const cloud = snap.exists? snap.data() : null;
    const before = JSON.stringify(store);
    if(cloud && cloud.quiz){ store = migrateStore(mergeStore(store, cloud)); try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
    SYNC.state="cloud"; SYNC.lastJson = cloud? JSON.stringify(cloud) : "";
    if(JSON.stringify(store)!==SYNC.lastJson) cloudSave(); // push merged/local progress up
    if(JSON.stringify(store)!==before) render(); else refreshSyncUI();
  }catch(e){ SYNC.state="local"; refreshSyncUI(); }
}
function cloudSave(){
  if(!SYNC.doc) return;
  SYNC.dirty=true; clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(cloudFlush, 1500);
}
async function cloudFlush(){
  if(!SYNC.doc || SYNC.busy || !SYNC.dirty) return;
  const json = JSON.stringify(store); if(json===SYNC.lastJson){ SYNC.dirty=false; return; }
  SYNC.busy=true; SYNC.dirty=false; SYNC.state="saving"; refreshSyncUI();
  try{ await SYNC.doc.set(JSON.parse(json)); SYNC.lastJson=json; SYNC.state="cloud"; }
  catch(e){ SYNC.state="error"; SYNC.dirty=true; }
  SYNC.busy=false; refreshSyncUI();
  if(SYNC.dirty) cloudSave();
}

function fluidsStart(shuf){ F.order = shuf? shuffle(range(fData().length)) : range(fData().length); F.pos=0; if(!shuf){ const f=F.order.findIndex(i=>!fSt().done[fkey(fData()[i])]); if(f>0) F.pos=f; } fluidReset(); }

function calcFluids(c){
  const w=parseFloat(c.w)||0, deh=parseFloat(c.deh)||0, hrs=parseFloat(c.hrs)||24, loss=parseFloat(c.loss)||0, factor=parseFloat(c.factor)||0, drop=parseFloat(c.drop)||20;
  const deficit = w*deh*10;
  const maintDay = c.formula==="linear"? factor*w : 70*Math.pow(w,0.75);
  const defH = hrs? deficit/hrs : 0, maintH = maintDay/24, total = defH+maintH+loss;
  const shockLo = (c.sp==="cat"?5:10)*w, shockHi = (c.sp==="cat"?10:20)*w, shockFull=(c.sp==="cat"?55:90)*w;
  return {w,deficit,maintDay,maintH,defH,total,loss,drops:total*drop/60,shockLo,shockHi,shockFull,hrs};
}

function mcqStats(m){
  const D=MCQ[m].data(); const cats={};

  const tot={n:D.length,a:0,ok:0}; Object.values(cats).forEach(c=>{tot.a+=c.a;tot.ok+=c.ok;});
  return {cats,tot};
}

    </div>
    ${weak.length?`<div class="card"><h3>Areas to review</h3><p class="muted" style="font-size:13.5px">Categories with at least 3 answers and accuracy below 75%. Tap to practice.</p>
      <div class="weak">${weak.slice(0,6).map(w=>`<button data-act="mpractice" data-m="${w.m}" data-c="${esc(w.c)}">${esc(w.c)} · ${Math.round(w.p*100)}%</button>`).join("")}</div></div>`:
      (allA>=10?`<div class="card"><h3>Areas to review</h3><p class="muted">No weak categories yet - keep going.</p></div>`:"")}
    ${["quiz","drugs","basic"].map(m=>{ const ex=(store[m].exams||[]).slice(-10).reverse(); if(!ex.length) return ""; const best=Math.max(...(store[m].exams||[]).map(e=>e.ok/e.n)); return `<div class="card ${MCQ[m].cls}"><h3>🎓 ${MCQ[m].title} exams</h3><p class="muted" style="font-size:13px">${store[m].exams.length} taken · best ${Math.round(best*100)}%</p>
      ${ex.map(e=>barRow(new Date(e.t).toLocaleDateString()+" · "+e.n+" q", e.ok, e.n, accColor(e.ok,e.n), `${e.ok}/${e.n} · ${fmtTime(e.sec)}`)).join("")}</div>`; }).join("")}
    <div class="card c-basic"><h3>🧭 Basic Initial Knowledge</h3>${(()=>{ const bc=Object.values(store.bcases.result), bl=Object.values(store.blab.result), bf=Object.values(store.bfluids.result), bd=Object.keys(store.bcyto.done).length, bok=Object.values(store.bcyto.correct).filter(Boolean).length;
      return `<p class="muted" style="font-size:13px">Questions ${pctStr(bq.tot.ok,bq.tot.a)} accuracy (${bq.tot.a}/${bq.tot.n}) · cases ${bc.length}/${BASIC_CASES.length} · lab ${bl.length}/${BASIC_LAB.length} · fluids ${bf.length}/${BASIC_FLUIDS.length} · cytology ${bd}/${BASIC_CYTO.length}</p>${catBars("basic",bq,"var(--sage)")}
      ${barRow("Cases: diagnosis correct", bc.filter(r=>r.d).length, bc.length||1, accColor(bc.filter(r=>r.d).length,bc.length), pctStr(bc.filter(r=>r.d).length,bc.length))}${barRow("Lab: pattern correct", bl.filter(r=>r.ok).length, bl.length||1, accColor(bl.filter(r=>r.ok).length,bl.length), pctStr(bl.filter(r=>r.ok).length,bl.length))}${barRow("Fluids: first attempt", bf.filter(r=>r.ok).length, bf.length||1, accColor(bf.filter(r=>r.ok).length,bf.length), pctStr(bf.filter(r=>r.ok).length,bf.length))}${barRow("Cytology: identified", bok, bd||1, accColor(bok,bd), pctStr(bok,bd))}`; })()}</div>
    <div class="card c-quiz"><h3>📝 Quiz by category</h3><p class="muted" style="font-size:13px">Accuracy · answered/total. Best streak ${store.quiz.best}.</p>${catBars("quiz",q,"var(--teal)")}</div>
    <div class="card c-drugs"><h3>💊 Drug Formulary by category</h3><p class="muted" style="font-size:13px">Accuracy · answered/total. Best streak ${store.drugs.best}.</p>${catBars("drugs",dr,"var(--amber)")}</div>
    <div class="card c-cases"><h3>🩺 Clinical cases</h3><p class="muted" style="font-size:13px">${cr.length} completed · diagnosis correct ${pctStr(cr.filter(r=>r.d).length,cr.length)} · treatment correct ${pctStr(cr.filter(r=>r.t).length,cr.length)} · key tests ordered ${pctStr(cr.reduce((a,r)=>a+r.k,0),cr.reduce((a,r)=>a+r.kt,0))}</p><div class="mini">${caseRows}</div></div>
    <div class="card c-lab"><h3>🧪 Lab Interpreter</h3><p class="muted" style="font-size:13px">${lr.length} panels · pattern correct ${pctStr(labOk,lr.length)} · abnormal values spotted ${pctStr(labHit,labN)}</p>
      ${barRow("Pattern recognition", labOk, lr.length||1, accColor(labOk,lr.length), pctStr(labOk,lr.length))}${barRow("Abnormal values spotted", labHit, labN||1, accColor(labHit,labN), pctStr(labHit,labN))}</div>
    <div class="card c-cyto"><h3>🔬 Cytology Lab</h3>${(()=>{ const d=Object.keys(store.cyto.done).length, ok=Object.values(store.cyto.correct).filter(Boolean).length; return `<p class="muted" style="font-size:13px">${d} fields · ${pctStr(ok,d)} identified correctly</p>${barRow("Correct identification", ok, d||1, accColor(ok,d), pctStr(ok,d))}`; })()}</div>
    <div class="card c-fluids"><h3>💧 Fluid therapy</h3><p class="muted" style="font-size:13px">${fr.length} exercises · first-attempt correct ${pctStr(flOk,fr.length)}</p>${barRow("Correct on first attempt", flOk, fr.length||1, accColor(flOk,fr.length), pctStr(flOk,fr.length))}</div>
    <p class="muted" style="font-size:12.5px;text-align:center">Results are recorded the first time you complete each item (redoing an item does not overwrite it unless you reset progress). Statistics for cases, lab and fluids start from this version.</p>`;
}

// ---------- actions ----------
function act(a, d){
  switch(a){
    case "home": go("home"); break;
    case "btab": B.tab=d.t; window.scrollTo(0,0); render(); break;
    case "go": go(d.v); break;
    case "theme": cycleTheme(); break;
    case "mpractice": MCQ[d.m].st.cat=d.c; mcqStart(d.m,false); if(d.m==="basic") B.tab="questions"; go(d.m); break;
    case "mexams": MCQ[d.m].st.screen="menu"; go(d.m); break;
    case "backup": backupOpen=!backupOpen; backupMsg=""; render(); break;
    case "bkcopy": { const code=exportCode(); const ta=$("bk_out"); const done=()=>{ backupMsg="Copied."; render(); };
        try{ navigator.clipboard.writeText(code).then(done, ()=>{ ta&&ta.select(); backupMsg="Select the code and copy it manually."; render(); }); }
        catch(e){ ta&&ta.select(); backupMsg="Select the code and copy it manually."; render(); } } break;
    case "bkimport": { const v=($("bk_in")||{}).value||""; backupMsg = importCode(v)? "Progress imported and merged." : "That code is not valid."; render(); } break;
    case "reset": if(!resetArmed){ resetArmed=true; render(); } else { store=freshStore(); save(); SYNC.lastJson=""; resetArmed=false; Object.values(MCQ).forEach(M=>{M.st.sessA=M.st.sessC=M.st.streak=0;}); render(); } break;
    // quiz
    case "mans": mcqAnswer(d.m,+d.k); break;
    case "mmenu": MCQ[d.m].st.screen="menu"; MCQ[d.m].st.exam=null; window.scrollTo(0,0); render(); break;
    case "mcat": MCQ[d.m].st.cat=d.c; mcqStart(d.m,false); window.scrollTo(0,0); render(); break;
    case "mrandom": MCQ[d.m].st.cat="All"; mcqStart(d.m,true); window.scrollTo(0,0); render(); break;
    case "mall": MCQ[d.m].st.cat="All"; mcqStart(d.m,false); window.scrollTo(0,0); render(); break;
    case "mexam": examStart(d.m,+d.n); break;
    case "mexans": examAnswer(d.m,+d.k); break;
    case "mexquit": MCQ[d.m].st.exam=null; MCQ[d.m].st.screen="menu"; render(); break;
    case "mnext": { const S=MCQ[d.m].st; S.pos++; S.perm=null; S.answered=null; window.scrollTo(0,0); render(); } break;
    case "mshuffle": mcqStart(d.m,true); render(); break;
    case "mrestart": mcqStart(d.m,false); MCQ[d.m].st.pos=0; render(); break;
    // cases
    case "cstep": C.step=+d.s; window.scrollTo(0,0); render(); break;
    case "ctoggle": C.sel[d.i]=!C.sel[d.i]; render(); break;
    case "cddx": if(C.ddx===null){ C.ddx=+d.k; render(); } break;
    case "ctx": if(C.tx===null){ C.tx=+d.k; const cs=cData()[C.order[C.pos]]; const k=ckey(cs); cSt().done[k]=true;
        cSt().result[k]={d:cs.ddx.options[C.ddxPerm[C.ddx]].ok, t:cs.tx.options[C.txPerm[C.tx]].ok, k:cs.tests.filter((t,i)=>t.key&&C.sel[i]).length, kt:cs.tests.filter(t=>t.key).length}; save(); render(); } break;
    case "cnext": C.pos++; caseReset(); window.scrollTo(0,0); render(); break;
    case "cagain": caseReset(); window.scrollTo(0,0); render(); break;
    case "cshuffle": casesStart(true); render(); break;
    case "crestart": casesStart(false); render(); break;
    // lab
    case "cyans": if(CYS.answered===null){ CYS.answered=+d.k; const it=yData()[CYS.order[CYS.pos]]; const k=ykey(it); const ok=CYS.perm[CYS.answered]===0; if(!ySt().done[k]||ok){ ySt().done[k]=true; ySt().correct[k]=ok; } save(); render(); } break;
    case "cynext": CYS.pos++; CYS.field=null; CYS.answered=null; window.scrollTo(0,0); render(); break;
    case "cyshuffle": cytoStart(true); render(); break;
    case "cyrestart": cytoStart(false); CYS.pos=0; render(); break;
    case "lflag": if(!L.submitted){ L.flags[d.i]=!L.flags[d.i]; render(); } break;
    case "lchoose": if(!L.submitted){ L.choice=+d.k; render(); } break;
    case "lsubmit": if(L.choice!==null){ L.submitted=true; const ex=lData()[L.order[L.pos]]; const k=lkey(ex); lSt().done[k]=true;
        lSt().result[k]={ok:ex.options[L.perm[L.choice]].ok, hit:ex.panel.filter((r,i)=>rowAbn(r)&&L.flags[i]).length, n:ex.panel.filter(r=>rowAbn(r)).length}; save(); render(); } break;
    case "lnext": L.pos++; labReset(); window.scrollTo(0,0); render(); break;
    case "lshuffle": labStart(true); L.pos=0; render(); break;
    case "lrestart": labStart(false); L.pos=0; render(); break;
    // fluids
    case "ftab": F.tab=d.t; render(); break;
    case "fcheck": if(F.input!=="" && !F.checked){ F.checked=true; const ex=fData()[F.order[F.pos]]; const k=fkey(ex); fSt().done[k]=true;
        const v=parseFloat(F.input); const tol=Math.max(Math.abs(ex.answer*ex.tol),0.5); fSt().result[k]={ok:!isNaN(v)&&Math.abs(v-ex.answer)<=tol}; save(); render(); } break;
    case "freveal": F.revealed=true; render(); break;
    case "fnext": F.pos++; fluidReset(); window.scrollTo(0,0); render(); break;
    case "fshuffle": fluidsStart(true); F.pos=0; F.tab="practice"; render(); break;
    case "frestart": fluidsStart(false); F.pos=0; render(); break;
  }
}
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el || !el.dataset.act) return;
  act(el.dataset.act, el.dataset);
});

// ---------- boot ----------
(function(){ const h=location.hash.replace("#",""); if(MODES[h]||h==="stats") view=h; render(); cloudInit(); })();
</script>

if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").then(reg=>{
  reg.addEventListener("updatefound", ()=>{ const nw=reg.installing; nw&&nw.addEventListener("statechange", ()=>{ if(nw.state==="installed" && navigator.serviceWorker.controller){ const b=document.createElement("div"); b.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#2a9d8f;color:#fff;padding:12px 16px;border-radius:14px;font:600 14px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;justify-content:space-between;align-items:center;gap:10px"; b.innerHTML="<span>New version available</span><button style=\"background:#fff;color:#2a9d8f;border:0;border-radius:10px;padding:8px 12px;font-weight:700\">Update</button>"; b.querySelector("button").onclick=()=>location.reload(); document.body.appendChild(b); } }); });
}).catch(()=>{}); }); }
</script>
