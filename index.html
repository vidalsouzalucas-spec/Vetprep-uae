  q:"The marrow is dominated (>20%) by cells with an eccentric 'clock-face' nucleus and a pale perinuclear zone. Diagnosis?", o:["Multiple myeloma","Chronic lymphocytic leukemia","Erythroid hyperplasia","Acute myeloid leukemia"],
  e:"Plasma cells have an eccentric round nucleus with clumped chromatin, deeply basophilic cytoplasm and a pale Golgi zone next to the nucleus. More than 20% plasma cells in the marrow, with a monoclonal gammopathy, Bence-Jones proteinuria or lytic bone lesions, fulfils the criteria for multiple myeloma." },
{ id:"struvite", title:"Urine sediment, dog with recurrent cystitis", mag:"Unstained, 40x", prep:"Centrifuged urine sediment, pH 8.0",
  draw:(F)=>{ for(let i=0;i<9;i++){ const p=F.spot(18); if(p) F.struvite(p.x,p.y); } for(let i=0;i<4;i++){ const p=F.spot(10); if(p) F.rods(p.x,p.y,5); } for(let i=0;i<3;i++){ const p=F.spot(16); if(p) F.neutrophil(p.x,p.y,{degenerate:true}); } const s=F.placed.find(p=>p.r===18); if(s) F.note(s.x,s.y,"'Coffin-lid' prism"); },
  q:"The colorless three- to six-sided 'coffin-lid' prisms in alkaline urine are:", o:["Struvite (magnesium ammonium phosphate)","Calcium oxalate dihydrate","Ammonium biurate","Cystine"],
  e:"Struvite crystals are colorless, 3-8-sided prisms with a coffin-lid appearance, favored by alkaline urine; in dogs they usually accompany a urease-positive infection (Staphylococcus, Proteus - note the rods and neutrophils). Crystals alone do not prove urolithiasis; struvite stones are dissolvable with diet and antibiotics." },
{ id:"oxalate-di", title:"Urine sediment, Miniature Schnauzer with hematuria", mag:"Unstained, 40x", prep:"Centrifuged urine sediment, pH 6.0",
  draw:(F)=>{ for(let i=0;i<12;i++){ const p=F.spot(12); if(p) F.oxalateDi(p.x,p.y); } for(let i=0;i<8;i++){ const p=F.spot(11); if(p) F.rbc(p.x,p.y,{r:8}); } const s=F.placed.find(p=>p.r===12); if(s) F.note(s.x,s.y,"Square 'envelope' with an X"); },
  q:"The square crystals with a central X ('envelopes') are:", o:["Calcium oxalate dihydrate","Struvite","Calcium oxalate monohydrate","Bilirubin"],
  e:"Calcium oxalate dihydrate crystals are colorless octahedra that look like squares with an X in acidic to neutral urine; small numbers can be normal, but with hematuria and a predisposed breed they suggest oxalate urolithiasis (not dissolvable). Monohydrate forms are elongated (picket-fence/dumbbell) and are associated with ethylene glycol." },
{ id:"biurate", title:"Urine sediment, young Yorkshire Terrier with stunted growth", mag:"Unstained, 40x", prep:"Centrifuged urine sediment",
  draw:(F)=>{ for(let i=0;i<9;i++){ const p=F.spot(13); if(p) F.biurate(p.x,p.y); } for(let i=0;i<5;i++){ const p=F.spot(11); if(p) F.rbc(p.x,p.y,{r:8}); } const s=F.placed.find(p=>p.r===13); if(s) F.note(s.x,s.y,"Golden-brown 'thorn apple'"); },
  q:"Golden-brown spherical crystals with radiating spicules ('thorn apples') suggest:", o:["Ammonium biurate - portosystemic shunt or Dalmatian","Struvite - urinary tract infection","Calcium carbonate - normal in herbivores","Cystine - renal tubular defect"],
  e:"Ammonium (bi)urate crystals indicate hyperuricosuria/hyperammonemia: congenital portosystemic shunt or severe hepatic dysfunction in young dogs, or the SLC2A9 mutation of Dalmatians and some Bulldogs. In a small-breed puppy with poor growth, check bile acids and ammonia. Cystine crystals are flat hexagons." },
{ id:"oxalate-mono", title:"Urine sediment, dog with acute kidney injury after garage access", mag:"Unstained, 40x", prep:"Centrifuged urine sediment",
  draw:(F)=>{ for(let i=0;i<12;i++){ const p=F.spot(14); if(p) F.oxalateMono(p.x,p.y); } for(let i=0;i<2;i++){ const p=F.spot(30); if(p) F.cast(p.x,p.y); } const s=F.placed.find(p=>p.r===14); if(s) F.note(s.x,s.y,"Elongated 'picket-fence' monohydrate crystal"); const c=F.placed.find(p=>p.r===30); if(c) F.note(c.x,c.y,"Granular cast: tubular injury"); },
  q:"Elongated six-sided or dumbbell-shaped crystals with granular casts, in a dog with acute kidney injury:", o:["Calcium oxalate monohydrate - ethylene glycol toxicity","Struvite - urinary infection","Calcium oxalate dihydrate - idiopathic","Sulfonamide drug crystals"],
  e:"Calcium oxalate monohydrate crystals (picket-fence, dumbbell or spindle shapes) appear within 3-6 h of ethylene glycol ingestion as glycolic acid is metabolized to oxalate; with casts and an anion/osmolal gap they are strong evidence. Fomepizole (dogs) or ethanol must be given early; once AKI is established the prognosis is poor." },
{ id:"septic-effusion", title:"Abdominal effusion, dog febrile 4 days after enterotomy", mag:"Diff-Quik, 100x oil", prep:"Abdominocentesis fluid, direct smear",
  draw:(F)=>{ for(let i=0;i<10;i++){ const p=F.spot(16); if(p) F.neutrophil(p.x,p.y,{degenerate:true,rods:true}); } for(let i=0;i<3;i++){ const p=F.spot(10); if(p) F.rods(p.x,p.y,6); } for(let i=0;i<3;i++){ const p=F.spot(22); if(p) F.macrophage(p.x,p.y,{}); } const n=F.placed.find(p=>p.r===16); if(n) F.note(n.x,n.y,"Degenerate neutrophil with intracellular rods"); },
  q:"Numerous degenerate neutrophils with intracellular rod-shaped bacteria in the effusion:", o:["Septic peritonitis - surgical emergency","Non-septic exudate - monitor","Chylous effusion","Uroabdomen"],
  e:"Intracellular bacteria inside degenerate neutrophils are diagnostic of a septic effusion regardless of culture; mixed rods after GI surgery point to dehiscence. Supportive findings: effusion glucose >20 mg/dL below blood glucose and effusion lactate higher than blood. Uroabdomen and chyle have bland or lymphocytic cytology." },
{ id:"leftshift", title:"Blood smear, bitch with pyometra", mag:"Wright stain, 100x oil", prep:"Peripheral blood, monolayer",
  draw:(F)=>{ for(let i=0;i<14;i++){ const p=F.spot(12); if(p) F.rbc(p.x,p.y); } for(let i=0;i<5;i++){ const p=F.spot(16); if(p) F.neutrophil(p.x,p.y,{band:true,toxic:true}); } for(let i=0;i<3;i++){ const p=F.spot(16); if(p) F.neutrophil(p.x,p.y,{toxic:true}); } const n=F.placed.find(p=>p.r===16); if(n) F.note(n.x,n.y,"Band neutrophil (U-shaped nucleus) with Dohle bodies"); },
  q:"Several neutrophils with unsegmented U-shaped nuclei and small blue cytoplasmic inclusions:", o:["Regenerative left shift with toxic change","Hypersegmented neutrophils (steroid effect)","Pelger-Huet anomaly","Eosinophilia"],
  e:"Band neutrophils have a smooth, U- or S-shaped nucleus without constrictions; Dohle bodies (blue-grey cytoplasmic inclusions), cytoplasmic basophilia and vacuolation are 'toxic change', reflecting accelerated marrow release during intense inflammation (pyometra, peritonitis). Pelger-Huet is a benign congenital hyposegmentation without toxic change." },
{ id:"vag-estrus", title:"Vaginal cytology, bitch presented for breeding timing", mag:"Diff-Quik, 40x", prep:"Vaginal swab smear",
  draw:(F)=>{ for(let i=0;i<16;i++){ const p=F.spot(22); if(p) F.squame(p.x,p.y,{cornified:true}); } for(let i=0;i<2;i++){ const p=F.spot(22); if(p) F.squame(p.x,p.y,{}); } const s=F.placed.find(p=>p.r===22); if(s) F.note(s.x,s.y,"Anuclear cornified squame"); },
  q:"More than 90% of epithelial cells are large, angular, anuclear squames with no neutrophils. Stage?", o:["Estrus (full cornification)","Proestrus","Diestrus","Anestrus"],
  e:"Estrus: >80-90% superficial/anuclear cornified cells, clear background, no neutrophils; it coincides with the fertile period but the switch to diestrus (abrupt return of parabasal cells and neutrophils, 'D1') is the most reliable landmark for timing. Combine with serial progesterone for precision." },
{ id:"vag-diestrus", title:"Vaginal cytology, bitch 2 days after she stopped accepting the male", mag:"Diff-Quik, 40x", prep:"Vaginal swab smear",
  draw:(F)=>{ for(let i=0;i<12;i++){ const p=F.spot(11); if(p) F.parabasal(p.x,p.y); } for(let i=0;i<8;i++){ const p=F.spot(16); if(p) F.neutrophil(p.x,p.y,{}); } for(let i=0;i<3;i++){ const p=F.spot(22); if(p) F.squame(p.x,p.y,{cornified:true}); } const s=F.placed.find(p=>p.r===11); if(s) F.note(s.x,s.y,"Parabasal cell: small, round, large nucleus"); },
  q:"Abrupt return of small round parabasal/intermediate cells with many neutrophils after full cornification:", o:["Diestrus day 1 (ovulation was ~6 days earlier)","Proestrus (bleeding will start)","Estrus (fertile period now)","Open pyometra"],
  e:"The first day of diestrus (D1) is marked by a sudden shift (>20% drop in cornified cells) to parabasal/intermediate cells with neutrophils; ovulation occurred about 5-7 days earlier, so whelping is expected ~57 days after D1. Pyometra shows degenerate neutrophils with bacteria and a purulent background." }
];
// ===== BASIC INITIAL KNOWLEDGE =====
// Drawn from the "Procedimientos basicos de la clinica de pequenos animales" guide, the
// "Protocolo de actuacion ante un animal rescatado" and the basic chapters of the clinic manual.
const BASIC_QUIZ = [
// ---- Physical exam & vital signs ----
{c:"Exam & Vital Signs", q:"Normal rectal temperature range for a calm dog in the consulting room?",
 o:["38.0-39.2 C","36.5-37.5 C","39.5-40.5 C","37.0-38.0 C"],
 e:"Dogs 38.0-39.2 C and cats 38.0-39.3 C. Above 39.5 C think fever or stress, above 41 C it is an emergency (heatstroke), below 37.5 C hypothermia. Only a lubricated rectal digital thermometer is reliable; ear and infrared thermometers are not."},
{c:"Exam & Vital Signs", q:"Normal heart rate for an adult cat in the clinic?",
 o:["140-220 bpm","60-100 bpm","100-140 bpm","240-300 bpm"],
 e:"Cats run at 140-220 bpm in the clinic (120-160 at home). Dogs 60-140 bpm (giants 60-100, toys up to 180, puppies up to 200). A cat above 240 or below 120, or a dog above 180 or below 50 at rest, needs attention."},
{c:"Exam & Vital Signs", q:"What does a capillary refill time of more than 2 seconds suggest?",
 o:["Poor perfusion: shock or dehydration","Normal finding in cats","Sepsis or heatstroke","Anemia without hypovolemia"],
 e:"CRT is checked by pressing the gum until it blanches; normal is under 2 s. Over 2 s means poor peripheral perfusion (shock, dehydration). A CRT under 1 s with red mucous membranes suggests sepsis or heatstroke. Pale membranes with normal CRT can occur in anemia."},
{c:"Exam & Vital Signs", q:"Why should you count the respiratory rate before handling the animal?",
 o:["Handling and stress raise the rate","It cannot be counted after palpation","The rate falls after handling","Only the owner may count it"],
 e:"Watch the chest for 15 seconds and multiply by 4 before touching the patient: handling, fear and panting falsify the rate. Normal: dogs 10-30, cats 20-40 breaths/min. Over 40 at rest without panting, abdominal effort or open-mouth breathing in a cat are warning signs."},
{c:"Exam & Vital Signs", q:"In what order is a systematic physical examination performed?",
 o:["Observe first, vital signs, then head to tail, painful areas last","Painful area first, then the rest","Abdomen first, then the head","Temperature first, then auscultation only"],
 e:"Always the same order so nothing is missed: observe at a distance (attitude, gait, breathing, body condition), weigh, vital signs, hydration, head, neck, thorax, abdomen, lymph nodes, skin, locomotor, and leave the painful or unpleasant parts (temperature, rectal exam) for the end."},
{c:"Exam & Vital Signs", q:"Where is the skin tent tested and from what degree of dehydration does it appear?",
 o:["Between the shoulder blades; from ~5-6%","On the abdomen; from ~2%","On the ear; from ~10%","On the thigh; from ~1%"],
 e:"The skin fold between the scapulae or over the dorsolumbar area should return in under 2 s. It only becomes abnormal from 5-6% dehydration and misleads in obese, cachectic, very young and old animals; combine it with mucous membrane moisture, eye position and body weight."},
{c:"Exam & Vital Signs", q:"Which pale or discolored mucous membrane finding is an immediate emergency?",
 o:["Cyanotic (blue) membranes: severe hypoxia","Slightly pale membranes in a cat","Brick-red membranes in a sleeping dog","Pigmented (black) membranes in a Chow"],
 e:"Cyanosis means severe hypoxemia and requires oxygen at once. Pale membranes suggest anemia or shock, yellow (icteric) liver disease or hemolysis, congested red membranes sepsis or heatstroke, and petechiae a bleeding disorder. Pigmented gums are normal in some breeds; check the conjunctiva instead."},
{c:"Exam & Vital Signs", q:"Where are the mitral and tricuspid valves best auscultated?",
 o:["Mitral left 5th intercostal space; tricuspid right 4th","Mitral right 3rd; tricuspid left 5th","Both at the thoracic inlet","Mitral left 2nd; tricuspid right 7th"],
 e:"Left side 'PAM 3-4-5': pulmonic 3rd, aortic 4th, mitral 5th intercostal space; tricuspid on the right 4th space. Auscultate in silence with the mouth closed, both sides, and palpate the apex beat and femoral pulse at the same time to detect pulse deficits."},
{c:"Exam & Vital Signs", q:"What systolic blood pressure is considered hypotension in an awake dog or cat?",
 o:["Below 90 mmHg","Below 140 mmHg","Below 120 mmHg","Below 160 mmHg"],
 e:"Below 90 mmHg systolic (or mean below 60) is hypotension: in an awake animal it is shock until proven otherwise. Normal is 110-160; 160-179 is hypertensive and 180 or more severe hypertension (ACVIM 2018). Cuff width must be 40% of the limb circumference in dogs (30-40% in cats)."},
// ---- Restraint & safety ----
{c:"Restraint & Safety", q:"What is the correct way to handle an unknown, frightened cat?",
 o:["Wrap it in a thick towel, leaving out only the part needed","Hold it firmly by the scruff and lift it","Pin it to the table with both hands","Let it roam the room until it calms"],
 e:"Cats are handled with a towel ('burrito'), in silence, without staring, letting them come out of the carrier or removing the carrier lid. Scruffing is no longer routine and never for lifting. If the cat fights after 2-3 attempts, stop and sedate IM through the towel."},
{c:"Restraint & Safety", q:"When must a closed (nylon) muzzle NOT be used on a dog?",
 o:["Dyspnea, vomiting or a brachycephalic in the heat","Any dog over 30 kg","Dogs that have bitten before","During blood sampling"],
 e:"A closed muzzle prevents panting and can cause aspiration if the dog vomits; in those cases use a basket muzzle or sedation. Put the muzzle on before it is needed, not after the first snap. Always two people: the restrainer protects the one working and watches the head, breathing and mucous membranes."},
{c:"Restraint & Safety", q:"Which drug can be given at home 2-3 h before a visit to reduce stress in a cat?",
 o:["Gabapentin","Acepromazine 2 mg/kg","Oral diazepam","Ketamine"],
 e:"Oral gabapentin (50-100 mg per cat) 1-3 h before the visit, together with pheromones in the clinic, markedly reduces stress; if that is not enough, IM sedation without a fight. Oral diazepam has caused fatal hepatic necrosis in cats."},
{c:"Restraint & Safety", q:"Where should a street animal of unknown status be placed on arrival at the clinic?",
 o:["Directly in an isolation cage or room","In the waiting room with other patients","In the general hospital ward","Loose in the consulting room"],
 e:"Until its status is known a rescued animal is a possible source of parvovirus, panleukopenia, distemper, dermatophytes, mange and fleas. It goes straight to isolation, handled with gloves, towel or muzzle, with its own equipment (stethoscope, thermometer, bowls), and the room is disinfected when it moves."},
{c:"Restraint & Safety", q:"What is the first thing to do after a cat bite or scratch to a staff member?",
 o:["Wash with soap and water for several minutes and report it","Apply a tourniquet above the wound","Give the staff member a rabies vaccine immediately","Nothing; cat bites rarely infect"],
 e:"Immediate washing for several minutes, antiseptic, and same-day medical review: cat bites infect in more than half of cases (Pasteurella, Bartonella). In the UAE a bite from an unvaccinated or unknown animal also requires assessment for rabies post-exposure prophylaxis, and the animal is observed for 10 days."},
// ---- Needles, catheters & tubes ----
{c:"Needles & Catheters", q:"With needle gauge (G), a higher number means:",
 o:["A thinner needle","A thicker needle","A longer needle","A blunter needle"],
 e:"Gauge is inverse to diameter: 25 G (orange) is thin, 18 G (pink) is thick. Use the thinnest needle that does the job without damaging the sample or tissue, and the shortest that reaches. Cone colors are standard across brands: 18 pink, 20 yellow, 21 green, 22 black, 23 blue, 25 orange."},
{c:"Needles & Catheters", q:"Which needle is appropriate for blood collection from a cat?",
 o:["22-23 G (black/blue) or a butterfly","18 G (pink)","25 G (orange)","16 G (grey)"],
 e:"Cats and small dogs: 22-23 G; dogs: 21 G (green). A 25 G needle hemolyzes the sample when aspirating, and 18 G is only for drawing up viscous drugs or draining abscesses, never for injecting the animal."},
{c:"Needles & Catheters", q:"Standard peripheral IV catheter for an adult cat?",
 o:["22 G (blue)","18 G (green)","14 G (orange)","26 G (purple)"],
 e:"22 G for cats and dogs under 10 kg, 20 G (pink) for dogs 10-30 kg, 18 G (green) for dogs over 30 kg, shock and transfusions, 16-14 G for giants in shock. 24 G (yellow) is for kittens, puppies and exotics but kinks easily and cannot deliver shock boluses."},
{c:"Needles & Catheters", q:"A dog in shock needs rapid fluid boluses. What is the best vascular access?",
 o:["A short, large-bore catheter in the cephalic vein","A long central jugular catheter","A 24 G catheter in the saphenous vein","Subcutaneous fluids on the back"],
 e:"Flow depends on the radius to the fourth power and inversely on length: a short, thick peripheral catheter delivers far more than a long central line. In severe shock place two large catheters (one in each cephalic) before considering a central line. Subcutaneous fluids are not absorbed in shock."},
{c:"Needles & Catheters", q:"Which syringe must be used for a dose under 1 mL in a cat?",
 o:["A 1 mL (insulin/tuberculin) syringe graduated in 0.01 mL","A 2 mL syringe","A 5 mL syringe","Any syringe with a luer-lock"],
 e:"In a 2 mL syringe the reading error for a small dose is already 10-20%. Doses under 1 mL are drawn in 1 mL syringes. Luer-lock (screw) connections are used for CRIs, chemotherapy and anything under pressure so the needle or extension does not pop off."},
{c:"Needles & Catheters", q:"A clinic stocks Caninsulin (40 U/mL). Which insulin syringe must be used?",
 o:["U-40 syringe (red cap)","U-100 syringe (orange cap)","Any 1 mL syringe","A 3 mL luer-lock syringe"],
 e:"U-40 syringes for Caninsulin/Vetsulin; U-100 (orange cap) for glargine, detemir, NPH and ProZinc. Using a U-100 syringe with Caninsulin gives 2.5 times LESS insulin than prescribed; the reverse gives 2.5 times MORE and a severe hypoglycemia."},
{c:"Needles & Catheters", q:"What route can be used in a 700 g kitten in shock when no vein can be found?",
 o:["Intraosseous (femur or proximal tibia)","Subcutaneous boluses","Intramuscular fluids","Rectal fluids"],
 e:"An 18-22 G spinal or hypodermic needle in the trochanteric fossa of the femur or the proximal tibia accepts the same fluids and drugs as the IV route at the same doses. It is the rescue access in neonates and tiny patients."},
{c:"Needles & Catheters", q:"How often should a peripheral IV catheter be replaced even if it looks fine?",
 o:["Every 72-96 hours","Every 12 hours","Every 7 days","Only when it stops flushing"],
 e:"Check it twice daily and uncover the entry site once a day; pain, heat, swelling, redness, a venous cord or fluid under the bandage mean remove it and place another in a different vein. Flush with 1-2 mL saline every 4-6 h if no fluids are running; heparin is unnecessary."},
// ---- Blood sampling & tubes ----
{c:"Blood & Lab Samples", q:"Which tube is used for a complete blood count (hemogram)?",
 o:["Lavender/purple top (EDTA)","Red top (no additive)","Blue top (citrate)","Grey top (fluoride)"],
 e:"EDTA preserves cell morphology for CBC, smear, reticulocytes, blood typing and PCR of blood parasites. Fill at least halfway (underfilling shrinks cells and lowers the hematocrit) and make the smear within 30 minutes. In cats fill quickly from the jugular so platelets do not clump."},
{c:"Blood & Lab Samples", q:"Which tube is required for coagulation tests (PT/aPTT) and how must it be filled?",
 o:["Blue top (citrate), filled exactly to the line (1:9)","Green top (heparin), any volume","Lavender top (EDTA), filled halfway","Red top (serum), filled completely"],
 e:"Citrate must be in a 1:9 ratio with blood, so the tube is filled exactly to the mark. Never the first tube from a heparinized syringe; discard the first mL if drawing from a catheter; separate and freeze plasma if analysis will be delayed over 2-4 h."},
{c:"Blood & Lab Samples", q:"What is the correct order of filling blood tubes?",
 o:["Blood culture, citrate (blue), serum (red), heparin (green), EDTA (lavender), fluoride (grey)","EDTA first, then serum, then citrate","Fluoride first, then EDTA, then citrate","Any order as long as tubes are inverted"],
 e:"The order prevents additive carry-over. EDTA reaching a biochemistry tube gives a falsely very high potassium and a low calcium, so lavender never goes before red or green. Remove the needle and let the blood run down the tube wall; forcing blood through the needle and stopper hemolyzes it."},
{c:"Blood & Lab Samples", q:"Which laboratory changes are caused by hemolysis of the sample?",
 o:["High potassium, phosphorus, AST, LDH and bilirubin; lower measured hematocrit","Low potassium and high glucose","High sodium and low albumin","High cholesterol and high white cell count"],
 e:"Hemolysis (thin needle, strong aspiration, pushing blood through the needle, shaking) releases cell contents and interferes with colorimetry; pink plasma is the warning sign. Japanese breeds such as Akitas have high-potassium red cells and show a marked pseudohyperkalemia."},
{c:"Blood & Lab Samples", q:"How much blood can safely be drawn from a sick 4 kg cat?",
 o:["About 1 mL/kg (4 mL) without problems","20 mL at once","0.1 mL maximum","Blood cannot be drawn from sick cats"],
 e:"Blood volume is 55-65 mL/kg in cats and 85-90 mL/kg in dogs; 1% of body weight (1 mL/kg) is safe even in a sick animal, and up to 10% of blood volume in a healthy one. Kittens and anemic patients are sampled with pediatric tubes of 0.5-1 mL and microcapillaries."},
{c:"Blood & Lab Samples", q:"A healthy, stressed cat has a glucose of 280 mg/dL in the clinic. First interpretation?",
 o:["Stress hyperglycemia; check fructosamine or urine glucose","Diabetes mellitus confirmed","Insulinoma","Laboratory error, repeat with a human glucometer"],
 e:"Stress can raise feline glucose to 300 mg/dL with a stress leukogram and a high hematocrit from splenic contraction. Fructosamine reflects 2-3 weeks of glycemia and glucosuria supports true diabetes. Human glucometers read low in dogs and cats; use a veterinary one (AlphaTrak)."},
{c:"Blood & Lab Samples", q:"What do a high PCV and high total protein together indicate?",
 o:["Dehydration (hemoconcentration)","Acute hemorrhage","Hemolytic anemia","Chronic kidney disease"],
 e:"PCV and total solids from a spun microcapillary and a refractometer take five minutes: both high = dehydration; both low = acute hemorrhage; low PCV with normal protein = hemolysis or chronic anemia. Also look at the plasma color (yellow icterus, milky lipemia, pink hemolysis) and the buffy coat."},
{c:"Blood & Lab Samples", q:"A positive FIV test in a 4-month-old kitten should be:",
 o:["Repeated after 6 months of age (maternal antibodies)","Taken as confirmed infection","Treated with antivirals immediately","Followed by euthanasia"],
 e:"FIV tests detect antibodies, which kittens can carry passively from the queen until about 6 months. FeLV tests detect antigen; a positive in a healthy cat is confirmed with a second test or PCR before decisions are taken. Parvovirus snap tests can be weakly positive 4-10 days after vaccination."},
// ---- Drug administration & calculations ----
{c:"Drugs & Calculations", q:"Formula for the volume of a drug to inject?",
 o:["mL = (mg/kg x kg) / mg/mL of the vial","mL = mg/kg x mg/mL","mL = kg / (mg/kg)","mL = mg/mL x kg"],
 e:"Always calculate from the vial concentration, never from the drug name (the same drug exists in several strengths). Example: maropitant 1 mg/kg in a 12 kg dog from a 10 mg/mL vial = 12 mg = 1.2 mL. A percentage is converted to mg/mL by multiplying by 10 (2% lidocaine = 20 mg/mL)."},
{c:"Drugs & Calculations", q:"Lidocaine 2% contains how many mg per mL?",
 o:["20 mg/mL","2 mg/mL","200 mg/mL","0.2 mg/mL"],
 e:"Percent x 10 = mg/mL: 2% = 20 mg/mL; 50% glucose = 500 mg/mL; 0.05% chlorhexidine = 0.5 mg/mL. Unit errors (mg vs ug, % vs mg/mL, mL/h vs drops/min) are the most common medication mistakes."},
{c:"Drugs & Calculations", q:"Which is the safe site for an intramuscular injection in a dog?",
 o:["Lumbar epaxial muscles or cranial thigh (quadriceps)","Caudal thigh (hamstrings)","Over the scapula","Between the shoulder blades"],
 e:"Epaxial muscles two fingers from the midline at L3-L5, or the quadriceps on the cranial thigh. Never the caudal thigh, where the sciatic nerve runs. Aspirate first; maximum 0.5-1 mL per site in cats and 2-3 mL in large dogs."},
{c:"Drugs & Calculations", q:"Where are vaccines given in cats, and why?",
 o:["As distally as possible on a limb or the tail, because of injection-site sarcoma","Between the shoulder blades, because it is less painful","Intramuscularly in the thigh, for faster absorption","Intranasally, always"],
 e:"Feline injection-site sarcomas are easier to treat with amputation when the injection was distal on a limb or the tail; record the site of each vaccine. Subcutaneous injections in general go into a tented fold of loose skin, entering parallel to the body."},
{c:"Drugs & Calculations", q:"After giving a doxycycline or clindamycin tablet to a cat, you must:",
 o:["Follow with 3-5 mL of water or food","Withhold water for 2 hours","Give it on an empty stomach only","Crush it and mix with milk"],
 e:"Dry tablets of doxycycline and clindamycin can lodge in the feline esophagus and cause ulceration and stricture. Place the tablet at the tongue base, close the mouth, stroke the throat, then syringe water. Never force the mouth of an animal with dyspnea."},
{c:"Drugs & Calculations", q:"The two emergency doses to know by heart?",
 o:["Epinephrine 0.01 mg/kg; atropine 0.04 mg/kg","Epinephrine 1 mg/kg; atropine 0.4 mg/kg","Epinephrine 0.1 mL/kg of 1 mg/mL; atropine 4 mg/kg","Epinephrine 10 mg total; atropine 1 mg total"],
 e:"Epinephrine 0.01 mg/kg = 0.01 mL/kg of the 1 mg/mL ampoule (or 0.1 mL/kg of a 1:10,000 dilution); atropine 0.02-0.04 mg/kg. Keep a weight-based dosing chart on the crash cart."},
{c:"Drugs & Calculations", q:"Which of these drugs must never be used on or near cats?",
 o:["Permethrin spot-on","Fenbendazole","Praziquantel","Selamectin"],
 e:"Permethrin causes tremors and seizures in cats, even by contact with a recently treated dog (keep them apart 24-48 h). Fenbendazole, praziquantel and selamectin are safe in cats at label doses."},
{c:"Drugs & Calculations", q:"Where are controlled drugs (opioids, ketamine, benzodiazepines) kept and how is each dose recorded?",
 o:["Locked cabinet; log with date, patient, amount, balance and two signatures","On the crash cart; no log needed","In the fridge with the vaccines; one signature","With the owner's file only"],
 e:"In the UAE controlled-substance regulation is strict and registration errors are penalized. Drawn-up doses that are not used are discarded in front of a witness and recorded as well."},
// ---- Fluids basics ----
{c:"Fluids Basics", q:"Maintenance fluid rate commonly used for a hospitalized dog or cat?",
 o:["2-3 mL/kg/h","10 mL/kg/h","0.5 mL/kg/h","20 mL/kg/h"],
 e:"Maintenance is 2-3 mL/kg/h (or 30 x kg + 70 mL/day). The deficit in mL = % dehydration x kg x 10, replaced over 12-24 h, plus ongoing losses (vomiting, diarrhea, polyuria). Cats, small dogs, cardiac and renal patients always run on a pump."},
{c:"Fluids Basics", q:"Initial crystalloid shock bolus for a cat?",
 o:["5-10 mL/kg over 15 min, then reassess","20-30 mL/kg over 5 min","1 mL/kg over 1 h","60 mL/kg as fast as possible"],
 e:"Cats: 5-10 mL/kg boluses (total shock dose ~50-60 mL/kg); dogs: 10-20 mL/kg boluses (total 80-90 mL/kg). Reassess heart rate, pulses, CRT, mucous membranes and blood pressure after each bolus; cats overload easily."},
{c:"Fluids Basics", q:"A 10 kg dog needs 25 mL/h with a 20 drops/mL giving set. Drip rate?",
 o:["About 8 drops/min (one every 7-8 s)","25 drops/min","60 drops/min","2 drops/min"],
 e:"Drops/min = (mL/h x drops/mL) / 60 = 25 x 20 / 60 = 8.3. Macrodrip sets give 20 drops/mL (some 10 or 15: check the packaging), microdrip 60. Animals under 10 kg use a microdrip or, better, a pump; a 150 mL burette is the safety net without a pump."},
{c:"Fluids Basics", q:"Maximum rate of potassium supplementation in IV fluids?",
 o:["0.5 mEq/kg/h, never as a bolus","5 mEq/kg/h","0.05 mEq/kg/h","No limit if diluted"],
 e:"Potassium chloride is added to the bag according to the serum potassium (20 mEq/L for a normokalemic animal that is not eating) and never exceeds 0.5 mEq/kg/h; a bolus can stop the heart. Bags with additives are labeled with additive, concentration, time and initials."},
{c:"Fluids Basics", q:"Which patient should NOT receive subcutaneous fluids?",
 o:["A dog in shock or severely dehydrated","A mildly dehydrated cat with chronic kidney disease","An alert dog with mild gastroenteritis","A cat receiving fluids at home"],
 e:"Subcutaneous fluids (10-20 mL/kg in 2-3 sites, isotonic only) are absorbed slowly and are useless in shock or severe dehydration, where the skin is poorly perfused. Never give irritant or hypertonic solutions subcutaneously."},
{c:"Fluids Basics", q:"Which signs during fluid therapy indicate fluid overload?",
 o:["Weight gain over 5-10%, serous nasal discharge, chemosis, tachypnea, crackles","Weight loss, dry gums, sunken eyes","Bradycardia and hypothermia only","Increased appetite and polyuria"],
 e:"Weigh animals on fluids twice daily. Overload (especially in cats and cardiac patients) shows as weight gain, serous nasal discharge, conjunctival edema, increased respiratory rate and lung crackles: stop the pump and call the veterinarian."},
// ---- Urine & sampling basics ----
{c:"Urine & Sampling", q:"Which method of urine collection is valid for bacterial culture?",
 o:["Cystocentesis","Free catch midstream","Urine from the collection bag of a catheter","Urine from the litter tray"],
 e:"Free-catch urine carries flora from the prepuce or vagina and is fine only for dipstick and specific gravity. Cystocentesis is the only valid sample for culture and a clean sediment. Record the collection method on every label: bacteria in the sediment mean different things depending on how the sample was obtained."},
{c:"Urine & Sampling", q:"Which urine specific gravity indicates adequate concentration in a well-hydrated dog?",
 o:["Above 1.030","Above 1.008","Above 1.015","Above 1.002"],
 e:"Dogs concentrate above 1.030 and cats above 1.035. A specific gravity of 1.008-1.012 in an azotemic animal points to the kidney. It is measured with a refractometer, never with the dipstick; the leukocyte and nitrite pads of the dipstick are unreliable in dogs and cats."},
{c:"Urine & Sampling", q:"When is cystocentesis contraindicated?",
 o:["Coagulopathy, empty bladder, pyoderma over the site or suspected bladder tumor","Male dogs","Cats under 3 kg","Any animal that has eaten in the last 4 hours"],
 e:"The bladder must be palpable or visible on ultrasound. Use a 22 G 25 mm needle (40 mm in large dogs), 45 degrees caudodorsally toward the trigone, aspirate 5-10 mL gently, release the negative pressure before withdrawing and never redirect the needle inside the abdomen."},
{c:"Urine & Sampling", q:"How should a fine-needle aspirate of a lymph node be taken?",
 o:["Non-aspiration technique: needle alone in and out in several directions","Strong aspiration with a 20 mL syringe","With an 18 G needle and a 1 mL syringe","With a biopsy punch in formalin"],
 e:"Lymph nodes, spleen, liver and thyroid bleed: use the needle-only technique with a 22-25 G needle so cells rise by capillarity. Prefer prescapular or popliteal nodes over the submandibular ones, which are always reactive because of the mouth. Air-dry smears, label in pencil and keep slides away from formalin."},
{c:"Urine & Sampling", q:"How is an ear swab cytology taken and read?",
 o:["Swab the horizontal canal, roll on the slide, each ear on one half marked L/R, stain","Swab the pinna only, press hard on the slide","Place the swab in formalin","Swab the vertical canal and read unstained"],
 e:"The sample comes from the horizontal canal (not the opening), is rolled without dragging, heat-fixed briefly and stained with Diff-Quik. More than 5 Malassezia per 40x field, cocci, rods and neutrophils are recorded, and cytology is repeated at every recheck."},
{c:"Urine & Sampling", q:"How should a wound be lavaged?",
 o:["Warm saline in large volume at moderate pressure (35 mL syringe with 18-19 G needle)","Undiluted 2% chlorhexidine into the wound bed","Hydrogen peroxide 3% into the wound","Dry gauze rubbing only"],
 e:"Cover the wound with sterile gel, clip widely, lavage with abundant warm saline or Ringer's at moderate pressure; tap water is acceptable for very dirty wounds. Chlorhexidine diluted to 0.05% (1 part 2% in 40 saline) is for the surrounding skin, not the wound bed."},
// ---- Anesthesia & intubation basics ----
{c:"Anesthesia Basics", q:"Fasting recommendation before elective anesthesia in an adult dog or cat?",
 o:["6-8 h for solids; water until 1-2 h before","24 h for solids and water","No fasting is necessary","12 h for water, 2 h for food"],
 e:"Adults: 6-8 h without food, water until 1-2 h before. Puppies and kittens under 8 weeks only 1-2 h (hypoglycemia risk); diabetics get half their insulin and the first slot of the morning. Place and check an IV catheter before any induction."},
{c:"Anesthesia Basics", q:"Which breathing circuit is used for a 4 kg cat?",
 o:["Non-rebreathing circuit (Bain or T-piece) at 200-300 mL/kg/min","Circle system at 0.5 L/min","Any circuit at 10 L/min","A circle system with the APL valve closed"],
 e:"Non-rebreathing circuits below 7-10 kg; circle systems above, with 1-2 L/min at induction and 0.5-1 L/min after. The reservoir bag matches the patient (0.5 L for a cat). The APL valve is opened again after the leak test: a closed APL with the patient connected causes pneumothorax within minutes."},
{c:"Anesthesia Basics", q:"How do you confirm the endotracheal tube is in the trachea?",
 o:["Capnography shows CO2; fog in the tube; both hemithoraces auscultated","The animal vocalizes","The stomach distends with each breath","The tube advanced easily"],
 e:"No end-tidal CO2 means the tube is in the esophagus: start again. Vocalization means it is NOT in the trachea. Also check fog in the tube, bag movement and bilateral breath sounds; a tube that is too deep enters a bronchus (sounds on one side only)."},
{c:"Anesthesia Basics", q:"What is sprayed on the larynx of a cat before intubation and why?",
 o:["Lidocaine spray (1-2 puffs), wait 30-60 s, to prevent laryngospasm","Chlorhexidine, to disinfect","Epinephrine, to reduce bleeding","Nothing; cats never need laryngeal preparation"],
 e:"Feline laryngospasm is prevented with topical lidocaine, waiting, a deep enough plane and never forcing the tube against a closed glottis. The tube enters on inspiration when the arytenoids open; inflate the cuff with the minimum air that seals (20-30 cmH2O): overinflation can rupture the feline trachea."},
{c:"Anesthesia Basics", q:"Which monitored value during anesthesia should prompt immediate action?",
 o:["Mean arterial pressure below 60 mmHg","Heart rate of 90 bpm in a dog","SpO2 of 97%","End-tidal CO2 of 40 mmHg"],
 e:"Alarm values: HR under 60 (dog) or 100 (cat), MAP under 60 mmHg, SpO2 under 95%, EtCO2 over 55 or under 25 mmHg, temperature under 36 C. Record all values every 5 minutes on the anesthesia sheet."},
{c:"Anesthesia Basics", q:"When is a dog extubated after anesthesia?",
 o:["When the swallowing reflex returns","Immediately after turning off the vaporizer","When it stands up","After 30 minutes, regardless of reflexes"],
 e:"Dogs are extubated when swallowing returns; cats slightly earlier (blink and ear movement) to avoid laryngospasm; brachycephalics as late as possible, sternal, head extended, tongue out, oxygen beside them and someone watching until they sit up. If regurgitation occurred, leave the cuff partly inflated to drag out material."},
{c:"Anesthesia Basics", q:"Most common anesthetic complication in cats and small animals?",
 o:["Hypothermia, starting within the first 20 minutes","Malignant hyperthermia","Hyperglycemia","Hypertension"],
 e:"Hypothermia begins early; monitor with an esophageal or rectal probe and warm actively (warm-air blanket, wrapped warm bags, warmed fluids). Never place an electric heating pad in direct contact with an immobile animal: it burns."},
// ---- Nursing & hospitalization ----
{c:"Nursing & Hospital", q:"How often are vital signs taken in a stable, a sick and a critical hospitalized patient?",
 o:["Every 8 h stable, 4 h sick, 1-2 h critical","Every 24 h for all","Every hour for all","Only on admission and discharge"],
 e:"Also before any drug that changes them, with pain scored every 4-6 h (Glasgow short form in dogs, feline grimace scale in cats) and 30-60 min after each analgesic. Everything done, measured or observed is written with the time and a signature on the hospitalization sheet."},
{c:"Nursing & Hospital", q:"Which disinfectant inactivates parvovirus on surfaces?",
 o:["Diluted bleach 1:32 with 10 minutes of contact","Quaternary ammonium compounds","70% alcohol wipe","Warm soapy water alone"],
 e:"Bleach 1:32 (one part in 31 of water) or a virucidal disinfectant with 10 min contact; quaternary ammonium products do not work. Isolation patients (parvo, panleukopenia, distemper, kennel cough, leptospirosis, dermatophytes, MRSP) have their own equipment and are attended last on each round."},
{c:"Nursing & Hospital", q:"Resting energy requirement (RER) formula used to plan feeding of a hospitalized animal?",
 o:["70 x kg^0.75 kcal/day","30 x kg kcal/day","100 x kg kcal/day","10 x kg + 500 kcal/day"],
 e:"Between 2 and 45 kg, 30 x kg + 70 gives nearly the same value: a 10 kg dog needs about 370 kcal/day, a 4 kg cat about 200. Reach the target over three days (one third, two thirds, full); a cat that does not eat for 2-3 days gets a feeding tube rather than syringe force-feeding, which creates food aversion."},
{c:"Nursing & Hospital", q:"A bandaged limb has cold, swollen, spread toes. What should you do?",
 o:["Remove the bandage immediately: it is too tight","Add another layer to support it","Wait until the scheduled change","Elevate the limb and recheck tomorrow"],
 e:"Every bandage has a contact layer, a thick padding layer (which absorbs and immobilizes) and an outer layer stretched only 50%. Bandage distal to proximal including the foot, leave the two middle nails visible and check them twice daily; keep it dry and change it when wet, dirty, smelly or displaced."},
{c:"Nursing & Hospital", q:"Which enema product is lethal to cats and small dogs?",
 o:["Sodium phosphate (Fleet) enemas","Warm water or saline 5-10 mL/kg","Lactulose enema","Mineral oil enema"],
 e:"Phosphate enemas cause fatal hypernatremia, hyperphosphatemia and hypocalcemia. Use warm water or saline with lubricant through a soft tube, slowly, where the animal can defecate immediately."},
{c:"Nursing & Hospital", q:"Minimum urine output expected in a hospitalized patient on fluids?",
 o:["1-2 mL/kg/h","0.1 mL/kg/h","10 mL/kg/h","5 mL/kg/day"],
 e:"Below 1 mL/kg/h with a catheter, or no urination in 12 h, means obstruction, renal failure or dehydration: call the veterinarian. Closed collection bags are emptied and recorded every 4 h; prophylactic antibiotics for indwelling catheters only select resistance."},
{c:"Nursing & Hospital", q:"Which finding on the ward requires calling the veterinarian immediately?",
 o:["Respiratory rate over 40 at rest or respiratory effort","Eating 50% of the offered food","Sleeping after an analgesic","One soft stool"],
 e:"Also: pale/grey membranes or CRT over 2 s, temperature under 37.5 or over 39.5 C, repeated vomiting or abdominal distension, non-productive retching, pain that does not settle, altered mentation, seizures, a swollen catheter limb, petechiae or bleeding."},
// ---- Imaging basics ----
{c:"Imaging Basics", q:"Minimum requirement for a diagnostic radiographic study?",
 o:["Two perpendicular projections, correctly positioned and labeled","One lateral view","A single view with the owner restraining","A view taken with the collar on"],
 e:"One projection hides half of lesions. Identify the patient, place the left/right marker before exposing, collimate, center the beam. Thorax at end-inspiration, abdomen at end-expiration. Collars, harnesses and wet IV lines leave artifacts."},
{c:"Imaging Basics", q:"Which radiation protection rule is correct?",
 o:["Hands never in the primary beam, even with lead gloves; pregnant staff never restrain","Lead gloves allow holding the limb in the beam","Dosimeters are optional for assistants","Sedation increases staff exposure"],
 e:"Gloves protect from scatter, not the direct beam. Only essential staff in the room, with apron, thyroid shield, gloves and dosimeter. The most effective dose reduction is sedating the patient and positioning with sandbags, foam wedges and ties so nobody has to stand beside it."},
{c:"Imaging Basics", q:"Preparation for an abdominal ultrasound?",
 o:["8-12 h fasting, full bladder, wide clipping, alcohol and warm gel","Full stomach, empty bladder, no clipping","Enema and sedation always","No preparation needed"],
 e:"Gas in the stomach and colon hides the pancreas and kidneys; the animal should not urinate before the scan. Clip from xiphoid to pubis and to mid-flank. AFAST/TFAST in emergencies look only for free fluid, pneumothorax and pericardial effusion in three minutes, without clipping."},
// ---- Rescued animal protocol ----
{c:"Rescued Animal", q:"In a rescued street animal, what is treated before reading the microchip?",
 o:["Life-threatening problems: hemorrhage, shock, hypothermia, heatstroke","Nothing; the chip is always read first","Parasites","Dental disease"],
 e:"Urgent before bureaucratic: stabilize first, but read the chip within the first 15 minutes of any stable animal and before any non-urgent decision. Four principles: staff safety first, the animal does not belong to the finder, urgent before bureaucratic, everything written down with photos."},
{c:"Rescued Animal", q:"How is a microchip read correctly?",
 o:["Remove collar and tags, universal reader slowly in zigzag over the whole body","Scan only between the shoulder blades once","Scan through the collar quickly","Only a veterinarian may scan"],
 e:"Half of 'no chip' results are bad readings. Metal collars interfere; chips migrate (especially in cats and thin animals), so scan neck, shoulders, both sides of the thorax, abdomen and inner limbs, repeat in another position and with a second reader, and record 'negative reading with two readers'."},
{c:"Rescued Animal", q:"The first three digits of a 15-digit microchip number indicate:",
 o:["The country of registration (724 Spain, 784 UAE) or the manufacturer (900-999)","The year of implantation","The species","The veterinarian's license number"],
 e:"The prefix tells you where to search: in Spain the regional registry and REIAC (Europetnet for other European prefixes); in the UAE there is no single public database, so you ask the chip manufacturer, the emirate's pet registry (ADAFSA/TAMM in Abu Dhabi, Dubai Municipality) and local clinics."},
{c:"Rescued Animal", q:"A healthy cat is brought in with the tip of one ear cut straight. What does it mean?",
 o:["Sterilized community cat from a TNR program: return it to its colony","It was attacked by another cat","It must be adopted out","It has ear mites"],
 e:"Ear-tipping marks neutered, vaccinated colony cats in both Spain and the UAE (TNVMR programs in Abu Dhabi, TNVR in Dubai). A healthy ear-tipped cat is returned to the exact place where it was caught, not adopted; a feral cat is handled through the trap/cage and sedated through it, never by hand."},
{c:"Rescued Animal", q:"In the UAE, a street animal that is not claimed by anyone:",
 o:["Follows the municipality or a recognized shelter; it does not become the clinic's or the finder's","Becomes the property of the finder after 24 h","Becomes the clinic's property after a week","May be sold by the clinic to cover costs"],
 e:"Stray animals are the responsibility of each emirate (Abu Dhabi: Department of Municipalities and Transport and ADAFSA via TAMM 800 555; Dubai Municipality 800 900 with its Warsan shelter). The clinic treats, documents and notifies the same day, keeping proof in the file. Numbers and channels change: verify them on official sites."},
{c:"Rescued Animal", q:"Minimum quarantine for a rescued animal before mixing it with other patients?",
 o:["10-14 days with daily checks of temperature, appetite, feces and skin","24 hours","48 hours","No quarantine if it looks healthy"],
 e:"10-14 days covers the incubation of parvovirus, panleukopenia and kennel cough. New diarrhea, vomiting, cough, discharge, fever or skin lesions restart the quarantine and trigger further tests. Deworming and the first vaccine are given at admission once stable: a street animal benefits more from early vaccination than from waiting to be 'perfect'."},
{c:"Rescued Animal", q:"Which tests are done in every rescued cat before contact with other cats or adoption?",
 o:["FeLV/FIV, PCV and proteins, glucose, fecal exam, Wood's lamp and trichogram, ear swab","Only a rabies titer","Radiographs of the whole body","Thyroid panel and ECG"],
 e:"In stray cats in the UAE dermatophytosis is so common that a kitten with alopecic plaques is treated as positive until culture or PCR says otherwise. Dogs get a parvovirus test if vomiting/diarrhea, 4Dx and tick removal; in Spain also Leishmania serology, repeated at 2-3 months if fostered."},
{c:"Rescued Animal", q:"Orphaned 10-day-old kittens arrive cold (34 C). What is the correct order of care?",
 o:["Warm first, then hydrate, then feed","Feed milk immediately","Bathe them in warm water first","Deworm first, then feed"],
 e:"A neonate under 35 C does not digest: warm it (nest at 30-32 C the first week), hydrate, then feed kitten milk replacer (never cow's milk) by bottle in sternal position, 6-8 feeds a day, stimulating the perineum after each feed until 3 weeks. Eyes open at 7-14 days; a kitten that does not gain 10-15 g/day for two days is sick."},
{c:"Rescued Animal", q:"A rescued dog with suspected road-traffic trauma is walking. What should still be done?",
 o:["Treat as polytrauma: analgesia, catheter, chest and abdominal radiographs once stable","Discharge if it walks","Only clean visible wounds","Deep sedation immediately for full radiographs"],
 e:"Pneumothorax, diaphragmatic hernia, pulmonary contusion, bladder rupture and pelvic fractures appear hours after the impact; what kills in the first 24 h is the thorax. No deep sedation or surgery until the thorax and blood volume are controlled. In cats check that it urinates alone after a tail-pull injury."},
{c:"Rescued Animal", q:"Summer in the UAE: a street dog is found collapsed, panting, with red membranes and 42 C. Cooling target?",
 o:["Cool with tepid water and a fan to 39.5 C, then stop","Ice-water bath until 37 C","Antipyretics and wait","Cool slowly over 6 hours to 38 C"],
 e:"Cooling continues on its own after 39.5 C; ice water vasoconstricts and worsens it. Then monitor 48 h for coagulopathy (petechiae, melena), kidney injury (urine output, creatinine), gut injury and glucose: mortality is high even once the temperature normalizes."},
{c:"Rescued Animal", q:"A rescued dog bites a child. What happens to the dog?",
 o:["Identified, isolated and observed for 10 days; authority notified if it dies or shows neurological signs","Released immediately if it has no chip","Euthanized at once without testing if it looks healthy","Vaccinated and returned to the street"],
 e:"The UAE is not declared rabies-free. The person washes the wound and attends a health center the same day for prophylaxis assessment; the animal is observed at least 10 days. A street animal with neurological signs or a behavior change is isolated and reported to ADAFSA/the emirate authority without handling it."},
// ---- Zoonoses & hygiene basics ----
{c:"Zoonoses & Hygiene", q:"Why are gloves worn and cages cleaned daily when handling puppies with roundworms?",
 o:["Toxocara eggs are zoonotic (larva migrans in children)","Roundworms bite through the skin","The worms spread by aerosol","To protect the puppy from the handler"],
 e:"Puppies are infected transplacentally and through milk; deworm from 2 weeks of age every 2 weeks until 12 weeks (fenbendazole from 2 weeks is safe, also in pregnancy), then monthly to 6 months. Hookworm larvae cause cutaneous larva migrans; fleas transmit Dipylidium."},
{c:"Zoonoses & Hygiene", q:"Which of these is a zoonotic skin disease common in stray kittens in the Gulf?",
 o:["Dermatophytosis (Microsporum canis)","Flea allergy dermatitis","Feline acne","Eosinophilic granuloma"],
 e:"Ringworm spreads to people (ring lesions on the arms). A kitten with alopecic scaly plaques is isolated and treated as positive until culture/PCR say otherwise; Wood's lamp detects only ~50% of strains. Sarcoptes and Cheyletiella are also zoonotic (transient papules)."},
{c:"Zoonoses & Hygiene", q:"Correct hand hygiene rule in the isolation ward?",
 o:["Wash hands on entering and leaving, even if gloves were worn","Gloves replace hand washing","Wash only after touching feces","Alcohol gel is enough after parvovirus"],
 e:"Gloves protect the hands but are not a substitute for washing; gown, gloves and equipment stay with the isolation patient. Alcohol gel does not reliably inactivate parvovirus; bleach 1:32 does."},
{c:"Zoonoses & Hygiene", q:"Which precaution applies when a dog with suspected leptospirosis is hospitalized?",
 o:["Gloves and eye protection; urine is infectious; isolate","No precautions; it is not zoonotic","Only a mask is needed","Keep it with the other dogs to save space"],
 e:"Leptospira is shed in urine and infects people through mucous membranes and broken skin. Isolate, use gloves, gown and eye protection when handling urine or bedding, disinfect spills, and treat with penicillin/ampicillin then doxycycline for 2 weeks to clear the carrier state."},
{c:"Zoonoses & Hygiene", q:"A pregnant staff member should not:",
 o:["Restrain animals for radiographs or clean cat litter","Take blood samples","Give subcutaneous vaccines","Auscultate patients"],
 e:"Pregnant and underage staff never restrain for radiographs (radiation). Toxoplasma oocysts need 1-5 days to sporulate, so daily litter changes by someone else, gloves and hand washing make cat contact safe; undercooked meat is the main human source."}
];

  {name:"Temperature, hydration and weight", key:true, result:"39.9 C, ~5% dehydrated, 4.5 kg.", note:"Fever and reduced intake justify fluids and analgesia; the weight sets the drug doses."},
  {name:"Needle aspiration of the swelling (22 G) with cytology", key:true, result:"Thick purulent material; cytology: degenerate neutrophils with intracellular mixed bacteria.", note:"Confirms a septic abscess rather than a hematoma, seroma or tumor, and provides a sample if culture is needed later."},
  {name:"FeLV/FIV test", key:true, result:"Both negative.", note:"Fight wounds transmit FIV (and FeLV); a baseline test now and a repeat FIV test in 60 days are standard for an unvaccinated outdoor cat with bite wounds."},
  {name:"Bacterial culture of the pus", key:false, result:"Mixed oral flora (Pasteurella, anaerobes).", note:"First-episode cat bite abscesses respond predictably to drainage plus amoxicillin-clavulanate; culture is reserved for non-responders."},
  {name:"Skull radiographs", key:false, result:"No bone involvement.", note:"Only if the swelling is firm, chronic or over a bone with suspected osteomyelitis or tooth root involvement."},
  {name:"CBC and biochemistry", key:false, result:"Mild neutrophilia; otherwise normal.", note:"Reasonable pre-anesthetic screen in an older or sicker cat; low yield here."},
  {name:"Rabies antibody titer", key:false, result:"Not performed.", note:"A titer does not diagnose rabies and is irrelevant to abscess management; what matters is the cat's vaccination status and the local rules."}
 ],
 testsSummary:"Clip and inspect, aspirate to confirm pus, check temperature and hydration, and test for FeLV/FIV because of fight exposure. Imaging and culture are for atypical or recurrent cases.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Cat-bite abscess (Pasteurella and oral anaerobes) with fever and mild dehydration; fight exposure to FIV/FeLV", ok:true, fb:"Correct. Outdoor intact male, paired punctures, fluctuant painful swelling, fever and purulent aspirate."},
  {t:"Salivary mucocele", ok:false, fb:"A mucocele is non-painful, non-febrile and contains clear viscous saliva, not pus."},
  {t:"Tooth root abscess", ok:false, fb:"Possible differential for a facial swelling, but the paired bite punctures and the history point to a fight; look in the mouth anyway."},
  {t:"Soft-tissue sarcoma", ok:false, fb:"Tumors are firm, slow-growing and not febrile; the aspirate showed pus."}
 ]},
 tx:{q:"Best treatment plan?", options:[
  {t:"Sedation/analgesia (e.g., buprenorphine or methadone), clip, lance at the most ventral point or open the punctures, flush with warm saline, debride, leave open or place a Penrose drain, amoxicillin-clavulanate 12.5-25 mg/kg PO q12h for 7-10 days (after the first dose with water), subcutaneous fluids for the mild dehydration, flea treatment safe for cats, update vaccines (including rabies as required locally) when recovered, retest FIV in 60 days and recommend castration to reduce roaming and fighting", ok:true, fb:"Correct. Drainage is the treatment; antibiotics support it. Meloxicam can be added once hydrated. Neutering, vaccination and keeping the cat in at night prevent recurrence."},
  {t:"Antibiotics alone without opening the abscess, recheck in a week", ok:false, fb:"A closed abscess re-forms and the cat stays febrile; drainage is the key step."},
  {t:"Apply a permethrin spot-on for the fleas and give amoxicillin", ok:false, fb:"Permethrin is toxic to cats. Use a feline-licensed product (fluralaner, selamectin, imidacloprid)."},
  {t:"Meloxicam immediately at the full dose and send home without draining", ok:false, fb:"NSAIDs are given only once the cat is hydrated, and the abscess still needs draining; the cat also needs an opioid for the procedure."}
 ]},
 pearls:["Paired punctures + fluctuant painful swelling + fever in an outdoor cat = bite abscess; drain it.","Fight wounds = FIV/FeLV exposure: test now and again at 60 days.","Never permethrin in cats; NSAIDs only when hydrated.","Prevention: castration, vaccination, flea control, indoors at night."]

 pe:["T 41.6 C, HR 170, RR 90 panting, mucous membranes brick red, CRT under 1 s","Able to stand, ataxic, no obvious fractures; small abrasions on the left hip","Estimated 8% dehydrated; BCS 3/9; ticks in the ears and between the toes","No bleeding; abdomen soft; bladder palpable and small","Frightened but not aggressive"],
 tests:[

  {name:"Microchip scan (after initial cooling, within 15 minutes of stabilization)", key:true, result:"No chip with two readers after removing nothing (no collar); recorded as 'negative reading with two readers'.", note:"Read the chip as soon as the animal is stable and before any non-urgent decision; record how it was read."},
  {name:"PCV/TP, glucose, electrolytes and creatinine (point-of-care)", key:true, result:"PCV 58%, TP 8.0 g/dL, glucose 70 mg/dL, creatinine 1.9 mg/dL, K 3.6.", note:"Hemoconcentration, borderline glucose and early kidney involvement are typical of heatstroke and set the fluid and monitoring plan."},
  {name:"Record the finder's details and the place/time found; photographs", key:true, result:"Name, phone and ID recorded; location noted; photos of both sides taken.", note:"Everything written down with photos protects the clinic if an owner, a complaint or a claim appears, and it is what the authority will ask for."},
  {name:"Notify the local authority the same day (Abu Dhabi: TAMM 800 555 / ADAFSA)", key:true, result:"Report filed by email with photos and the negative chip reading; reference number kept in the file.", note:"The stray animal is the municipality's responsibility; the clinic treats, documents and notifies, and does not decide adoption or euthanasia on its own."},
  {name:"Chest and abdominal radiographs once breathing is stable (possible road trauma)", key:true, result:"No pneumothorax, no free fluid, no fractures.", note:"Any suspected road-traffic trauma is treated as polytrauma even if the dog walks; imaging is done once the dog breathes well."},
  {name:"4Dx test (Ehrlichia/Anaplasma/Dirofilaria) and tick removal", key:false, result:"Ehrlichia antibody positive; heartworm antigen negative.", note:"Part of the admission tests for a stray dog in the Gulf, but not part of the first-hour emergency plan; do it once the dog is cooled and stable."},
  {name:"Coagulation profile and platelets at 12-24 h", key:false, result:"Platelets 160, PT and aPTT normal.", note:"Heatstroke coagulopathy (DIC) develops in the following 24-72 h; this is the follow-up test, not the admission test."},

  {t:"Heatstroke in a stray dog (July, Abu Dhabi) with hemoconcentration and early kidney involvement; possible road trauma to be excluded; unidentified animal requiring notification to the authority", ok:true, fb:"Correct. Rectal temperature over 41 C with red membranes and collapse in summer is heatstroke until proven otherwise; the stray status adds the identification and reporting duties."},

 ]},
 pearls:["Rescued animal: urgent first, then chip, documentation, same-day notification, quarantine, admission tests, vaccines and deworming once stable.","Heatstroke: tepid water and fan, stop at 39.5 C, monitor kidney and coagulation for 48-72 h.","Record who brought the animal, where and when, and agree who pays before non-urgent care.","In the UAE the stray does not become the finder's or the clinic's; verify the municipality's channels on official sites."]
