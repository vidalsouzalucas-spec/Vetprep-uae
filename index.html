{c:"Analgesics & NSAIDs", q:"Grapiprant mechanism and use?",
 o:["Prostaglandin E2 EP4 receptor antagonist (piprant, not a COX inhibitor) for canine osteoarthritis pain at 2 mg/kg PO q24h; fewer GI/renal effects but still not combined with NSAIDs/steroids","COX-1 selective inhibitor for cats","Opioid agonist for acute pain","NMDA antagonist"],

{c:"Analgesics & NSAIDs", q:"Methadone: dose and advantages over morphine?",
 o:["0.2-0.5 mg/kg IV/IM/SC q4h (dogs and cats); full mu agonist with NMDA antagonism, no histamine release (safe IV) and less vomiting than morphine","1 mg/kg PO q24h; partial agonist","0.01 mg/kg IV; kappa agonist","5 mg/kg IM; no respiratory depression"],
 e:"Methadone is the preferred premedication/analgesic for moderate to severe pain in Europe. Like all full mu agonists, it causes dose-dependent respiratory depression, bradycardia and panting; reverse with naloxone if needed."},
{c:"Analgesics & NSAIDs", q:"Fentanyl - CRI dosing and transdermal patch characteristics?",
 o:["CRI 2-5 ug/kg/h after a 2-5 ug/kg loading dose; patches (2-4 ug/kg/h size) take 12-24 h to reach effect in dogs (6-12 h in cats) and last ~72 h; never apply heat over the patch","CRI 2-5 mg/kg/h; patches act within 1 h","Only oral tablets exist","CRI 0.01 ug/kg/h; patches last 2 weeks"],

 e:"Acepromazine is a long-acting (4-8 h) phenothiazine tranquilizer with antiemetic and antiarrhythmic properties; low doses combined with opioids give excellent premedication in healthy animals. The old contraindication in epileptics is no longer supported."},
{c:"Anesthesia & Sedation", q:"Midazolam in premedication - dose and in which patients it works best?",

 e:"Benzodiazepines have minimal cardiorespiratory effects, are muscle relaxants and anticonvulsants, and reduce induction agent requirements (co-induction with ketamine, propofol or alfaxalone). Diazepam is not water-soluble (propylene glycol; do not give IM)."},
{c:"Anesthesia & Sedation", q:"Which statement about ketamine's physiological effects is correct?",
 o:["Dissociative agent that increases heart rate, blood pressure and intracranial/intraocular pressure, preserves laryngeal reflexes (poor airway protection) and causes apneustic breathing; always combine with a benzodiazepine or alpha-2 agonist","Causes profound hypotension and bradycardia","Provides smooth muscle relaxation when used alone","Is a potent respiratory stimulant with no analgesic effect"],

{c:"Anesthesia & Sedation", q:"Atropine vs glycopyrrolate - key differences?",

 e:"Anticholinergics treat vagally mediated bradycardia (opioids, ocular/laryngeal surgery) and reduce salivation. They are not routinely needed with modern protocols and are contraindicated to treat alpha-2 agonist-induced bradycardia."},
{c:"Anesthesia & Sedation", q:"Lidocaine CRI for analgesia/antiarrhythmic therapy - dosing and species restriction?",
 o:["Dogs: 1-2 mg/kg IV loading then 25-50 ug/kg/min (up to 80 for ventricular arrhythmias); NOT recommended as a CRI in cats because of cardiovascular depression and toxicity","Cats: 100 ug/kg/min is standard","Dogs: 10 mg/kg/h; cats the same","Only epidural"],
 e:"Systemic lidocaine provides MAC reduction, analgesia, prokinetic and anti-inflammatory effects in dogs. In cats, use lidocaine only for local blocks (max ~2-4 mg/kg total)."},
{c:"Anesthesia & Sedation", q:"Bupivacaine for local/regional blocks - maximum dose and characteristics?",
 o:["Max ~2 mg/kg (dogs and cats); onset 15-20 min, duration 4-8 h; never IV (cardiotoxic); liposomal bupivacaine extends analgesia up to 72 h for surgical site infiltration","Max 20 mg/kg; onset 1 min; safe IV","Max 0.1 mg/kg; duration 30 min","Only for topical use"],
 e:"Local blocks (dental nerve blocks, intercostal, line blocks, epidurals, TAP blocks) are the most effective way to reduce intraoperative opioid/inhalant requirements. Lidocaine (max 4-8 mg/kg dogs) has a faster onset and shorter duration; mixing the two offers little benefit."},
{c:"Anesthesia & Sedation", q:"Butorphanol - receptor profile and best use?",
 o:["Kappa agonist / mu antagonist with a ceiling analgesic effect and short duration (1-2 h); good for sedation (with alpha-2 agonists), mild visceral pain and as an antitussive, but inadequate for surgical pain; it can reverse mu agonists","Full mu agonist lasting 8 h; ideal for orthopedic surgery","Pure antagonist","Non-opioid NSAID"],
 e:"Butorphanol (0.2-0.4 mg/kg) is widely used in cats for sedation and in dyspneic patients because of minimal respiratory depression. For moderate-severe pain choose methadone, morphine, fentanyl or buprenorphine (partial mu agonist, 6-8 h)."},
{c:"Anesthesia & Sedation", q:"Approximate MAC of isoflurane and sevoflurane, and the clinical implication?",
 o:["Isoflurane ~1.3% (dog) / ~1.6% (cat); sevoflurane ~2.1-2.4% (dog) / ~2.6% (cat); sevoflurane has lower blood solubility → faster induction and recovery; both cause dose-dependent vasodilation and hypotension","Isoflurane 5%, sevoflurane 0.5%","MAC is identical for both at 1%","Sevoflurane causes hypertension"],
 e:"MAC is reduced by premedication, opioids, CRIs and local blocks (balanced anesthesia) and increased by hyperthermia and young age. Inhalants provide no analgesia; hypotension is managed by reducing vaporizer settings, fluids and, if needed, dopamine/dobutamine."},
// ---------- GASTROINTESTINAL ----------
{c:"Gastrointestinal", q:"Maropitant dosing and administration notes?",
 o:["1 mg/kg SC or slow IV q24h (up to 5 consecutive days on label), 2 mg/kg PO q24h (8 mg/kg PO for motion sickness in dogs); SC injection stings - refrigerate the vial; also provides visceral analgesia","10 mg/kg IM q8h","0.1 mg/kg PO once weekly","Only rectal"],
 e:"Maropitant (NK1 antagonist) is the first-line antiemetic for most causes of vomiting and prevents opioid/alpha-2 induced vomiting when given 1 h before premedication. Use cautiously in neonates (<8 weeks dogs) and in hepatic dysfunction."},
{c:"Gastrointestinal", q:"Ondansetron dose and when it is added to maropitant?",
 o:["0.5-1 mg/kg IV/PO q8-12h; 5-HT3 antagonist added for refractory vomiting (chemotherapy, pancreatitis, parvovirus) or nausea without vomiting","10 mg/kg q24h; dopamine antagonist","0.01 mg/kg; prokinetic","Only in cats"],
 e:"Ondansetron is effective and safe in cats and dogs; oral bioavailability is low in dogs (higher doses PO). Combining different antiemetic classes (NK1 + 5-HT3) is logical for severe cases. Metoclopramide is a weaker antiemetic in cats (few D2 receptors in the feline CRTZ)."},
{c:"Gastrointestinal", q:"Omeprazole - dose, timing and tapering?",
 o:["1 mg/kg PO q12h (q24h for prophylaxis), given 30-60 min before a meal; taper over 1-2 weeks after courses >3-4 weeks to avoid rebound hyperacidity; not needed routinely with NSAIDs or steroids in healthy animals","10 mg/kg q6h with food; stop abruptly","0.05 mg/kg q48h","Only IV (pantoprazole 1 mg/kg IV q12h is the IV alternative)"],
 e:"Indicated for GI ulceration/erosion, reflux esophagitis and gastrinoma. PPIs alter the microbiome and calcium/B12 absorption with long-term use; the ACVIM consensus discourages indiscriminate use. Pantoprazole 1 mg/kg IV q12h for hospitalized patients."},
{c:"Gastrointestinal", q:"Sucralfate - dose and interaction rule?",
 o:["0.5-1 g PO q8h (cats 0.25 g) as a slurry; binds ulcer sites in an acid environment; separate from other oral drugs by at least 2 h because it reduces their absorption (doxycycline, fluoroquinolones, digoxin)","10 mg/kg IV q12h; no interactions","5 g PO q24h with all other drugs","Only rectal"],
 e:"Sucralfate is a sucrose-aluminum complex useful for esophagitis (give as a liquid) and gastric ulcers; it does not require acid suppression to work but is often combined with omeprazole, given at different times."},
{c:"Gastrointestinal", q:"Metoclopramide - CRI dose and contraindications?",
 o:["1-2 mg/kg/day as a CRI (or 0.2-0.5 mg/kg PO/SC q8h); contraindicated in mechanical GI obstruction and after recent GI surgery; extrapyramidal signs (restlessness, tremors) occur at high doses, especially in cats","10 mg/kg IV bolus q4h; no contraindications","0.01 mg/kg q24h","Only in horses"],
 e:"Metoclopramide is a D2 antagonist (central antiemetic in dogs) and a gastric/duodenal prokinetic (useful in ileus, reflux). It crosses the blood-brain barrier; diphenhydramine treats extrapyramidal reactions."},
{c:"Gastrointestinal", q:"Lactulose - dose and purpose in hepatic encephalopathy?",
 o:["0.5-1 mL/kg PO q8-12h, titrated to 2-3 soft stools/day; acidifies colonic contents (traps ammonia as ammonium) and shortens transit; retention enemas (30% solution) for acute crises","10 mL/kg IV q24h to lower ammonia","0.01 mL/kg once weekly","Used only as an antibiotic"],
 e:"Combined with a protein-moderated diet and antibiotics that reduce urease-producing bacteria (amoxicillin, metronidazole at reduced dose), lactulose controls encephalopathy in portosystemic shunts and liver failure. Over-dosing causes diarrhea and dehydration."},
{c:"Gastrointestinal", q:"Cobalamin (vitamin B12) supplementation protocol in a cat with chronic enteropathy and low serum cobalamin?",
 o:["250 ug SC once weekly for 6 weeks, then every 2 weeks for 6 weeks, then monthly, rechecking levels; oral daily supplementation (250 ug/day) is an alternative that also works","1 mg IV once","5 mg PO once a month","Only via diet"],
 e:"Hypocobalaminemia is common in feline IBD/lymphoma, EPI and ileal disease and worsens outcome if uncorrected. Dogs: 250-1500 ug SC by weight. Folate is supplemented if low."},
// ---------- CARDIOVASCULAR ----------
{c:"Cardiovascular", q:"Pimobendan - dose, mechanism and administration?",
 o:["0.25-0.3 mg/kg PO q12h on an empty stomach (1 h before food); inodilator: calcium sensitizer (positive inotrope) + phosphodiesterase III inhibitor (vasodilator)","5 mg/kg q24h with food; beta-blocker","0.01 mg/kg IV; diuretic","1 mg/kg q8h; calcium channel blocker"],
 e:"Indicated in MMVD stage B2 and C and in DCM (occult and overt), and increasingly in cats with CHF with systolic dysfunction. Food reduces bioavailability; an injectable form exists in some countries for acute CHF."},
{c:"Cardiovascular", q:"Furosemide - acute and chronic dosing, and important adverse effects?",
 o:["Acute CHF: 1-2 mg/kg IV repeated q1-2h (or CRI 0.6-1 mg/kg/h) until the respiratory rate improves; chronic: lowest effective dose 1-2 mg/kg PO q12-24h; causes hypokalemia, dehydration, prerenal azotemia and, at high IV doses in cats, ototoxicity","0.01 mg/kg once weekly","10 mg/kg IV bolus every 15 min indefinitely","Only PO, never IV"],
 e:"Torsemide (0.1-0.3 mg/kg q24h; ~10x more potent, longer acting) is used for diuretic resistance. Monitor renal values and electrolytes 5-7 days after dose changes; add spironolactone/ACE inhibitor to counter RAAS activation."},
{c:"Cardiovascular", q:"Benazepril - dose, indications and monitoring?",
 o:["0.25-0.5 mg/kg PO q12-24h for CHF (with pimobendan/furosemide) and for proteinuria/hypertension; check creatinine and potassium 1-2 weeks after starting; avoid in dehydration/hypotension and do not combine with NSAIDs without caution","5 mg/kg q8h; monitor liver enzymes","0.01 mg/kg q24h; no monitoring","Only in cats"],
 e:"ACE inhibitors reduce afterload and aldosterone; a creatinine rise >30% warrants dose reduction. Telmisartan (ARB, 1 mg/kg q24h in cats, 1-2 mg/kg dogs) is now preferred for feline proteinuria/hypertension in many guidelines."},
{c:"Cardiovascular", q:"Clopidogrel dosing in cats and dogs, and the practical problem in cats?",
 o:["Cats: 18.75 mg/cat PO q24h (1/4 of a 75 mg tablet); dogs: 1-2 mg/kg q24h; it is intensely bitter and causes hypersalivation/vomiting in cats - give in a gelatin capsule or with food","Cats 75 mg q12h; tasteless","0.1 mg/kg weekly in both species","Only injectable"],
 e:"Clopidogrel (P2Y12 inhibitor) is the antithrombotic of choice for cats with cardiomyopathy and left atrial enlargement or previous thromboembolism (FAT CAT study) and for dogs with IMHA/PLN. Onset takes ~3 days; aspirin is inferior in cats."},
{c:"Cardiovascular", q:"Amlodipine and telmisartan in cats - doses and indications?",
 o:["Amlodipine 0.625-1.25 mg/cat PO q24h: first-line for feline hypertension (target SBP <160); telmisartan 1 mg/kg (2 mg/kg for hypertension) PO q24h: first-line for proteinuria and an alternative for hypertension","Amlodipine 5 mg/kg q8h; telmisartan 50 mg/kg","Both are diuretics given IV","Both are contraindicated in cats"],
 e:"Amlodipine is a dihydropyridine calcium channel blocker with minimal effect on proteinuria; telmisartan is an ARB that reduces glomerular pressure. Recheck blood pressure 7-14 days after starting and monitor creatinine/potassium with RAAS blockers."},
{c:"Cardiovascular", q:"Sildenafil - use and dose in dogs?",
 o:["1-3 mg/kg PO q8-12h for pulmonary hypertension (PDE5 inhibitor → pulmonary vasodilation); improves exercise tolerance and syncope, does not treat the underlying cause","0.01 mg/kg q24h for systemic hypertension","10 mg/kg IV for CHF","Used as an antiarrhythmic"],
 e:"Pulmonary hypertension in dogs is often secondary to left heart disease, chronic respiratory disease, heartworm or thromboembolism; echocardiographic estimation (tricuspid regurgitation velocity) guides diagnosis. Pimobendan may be added."},
{c:"Cardiovascular", q:"Emergency treatment of sustained ventricular tachycardia in a dog?",
 o:["Lidocaine 2 mg/kg IV bolus (repeat up to 8 mg/kg total), then CRI 25-80 ug/kg/min; correct hypokalemia/hypomagnesemia; procainamide or amiodarone if refractory; oral sotalol or mexiletine for maintenance","Atropine 0.04 mg/kg","Digoxin IV bolus","Calcium gluconate"],
 e:"Lidocaine is first-line for VT in dogs (not in cats, where it is cardiodepressant - use low doses or beta-blockers). Hypokalemia makes VT refractory to lidocaine. Treat only hemodynamically significant or rapid, multiform VT (R-on-T) in GDV, splenic disease, myocarditis, Boxer ARVC."},
// ---------- ENDOCRINE ----------
{c:"Endocrine", q:"Trilostane - starting dose, administration and the owner instruction that prevents a crisis?",
 o:["~1-2 mg/kg PO once daily WITH food in the morning (some dogs need q12h); if the dog vomits, becomes lethargic or stops eating, STOP the drug and contact the clinic (possible hypoadrenocorticism); never adjust the dose based on a single ACTH stim without clinical correlation","10 mg/kg fasting at night; continue regardless of signs","0.01 mg/kg weekly","Only injectable"],
 e:"Trilostane reversibly inhibits 3-beta-hydroxysteroid dehydrogenase; food increases absorption. Iatrogenic hypoadrenocorticism can be transient (stop 1-2 weeks and restart lower) or, rarely, permanent from adrenal necrosis."},
{c:"Endocrine", q:"Levothyroxine - how should it be given and monitored?",
 o:["0.02 mg/kg PO q12h (initially; max 0.8 mg/dose), consistently with or without food (food reduces absorption, so be consistent); measure T4 4-6 h post-pill after 4 weeks aiming for high-normal; once stable, many dogs can be dosed q24h","1 mg/kg q24h with calcium supplements; test immediately","Dose by age only; no monitoring","Only IV"],
 e:"Clinical improvement (activity) appears within 1-2 weeks, dermatologic changes take 1-3 months. Over-supplementation causes PU/PD, panting and weight loss. In dogs with cardiac disease start at 25-50% dose and increase gradually."},
{c:"Endocrine", q:"Methimazole in cats - starting dose and the side effects to warn owners about?",
 o:["2.5 mg PO q12h (1.25-2.5 mg for small cats) or transdermal gel; recheck T4, CBC and chemistry at 2-3 weeks; adverse effects mainly in the first 3 months: vomiting/anorexia (10-20%), facial pruritus/excoriation, hepatopathy, neutropenia/thrombocytopenia, and rarely myasthenia","50 mg q24h; no adverse effects","0.1 mg/kg once weekly","Only injectable"],
 e:"Methimazole blocks thyroid peroxidase; it does not destroy the adenoma, so the dose tends to increase over years. Dose adjustments are in 1.25-2.5 mg steps; aim for T4 in the lower half of the reference range while monitoring creatinine."},
{c:"Endocrine", q:"A clinic stocks porcine lente insulin (Caninsulin/Vetsulin, 40 U/mL) and glargine (100 U/mL). Which syringe error is dangerous?",
 o:["Using a U-100 syringe to draw a U-40 insulin delivers only 40% of the intended dose (and the reverse delivers 2.5x the dose) - syringes must match the insulin concentration","Any syringe can be used because the units are universal","Only the needle length matters","U-40 syringes deliver double the dose of U-100"],
 e:"Insulin unit markings depend on concentration: U-40 syringes for 40 U/mL products, U-100 syringes for 100 U/mL products (glargine, detemir, PZI 40 U/mL in some brands - check!). Owner education on syringe type, storage (fridge, do not shake), and hypoglycemia signs is essential."},
{c:"Endocrine", q:"Desoxycorticosterone pivalate (DOCP) for canine hypoadrenocorticism - dosing and monitoring?",
 o:["~1.5-2.2 mg/kg IM/SC every 25-30 days (many dogs stabilize on lower doses), with electrolytes checked at day 10-14 (peak effect) and day 25-30 (trough) initially; combined with low-dose prednisolone (0.1-0.2 mg/kg/day), increased during stress","10 mg/kg PO daily; no monitoring","0.01 mg/kg once a year","Replaces the need for glucocorticoids"],
 e:"DOCP is a pure mineralocorticoid (unlike fludrocortisone, which has glucocorticoid activity and often causes PU/PD). Owners should carry extra prednisolone for stressful events and never run out of mineralocorticoid."},
{c:"Endocrine", q:"Relative potency and properties of commonly used glucocorticoids?",
 o:["Prednisolone = 1 (anti-inflammatory 0.5-1 mg/kg/day; immunosuppressive 2 mg/kg/day); dexamethasone ~7-10x more potent with no mineralocorticoid activity and longer duration (36-72 h); hydrocortisone has significant mineralocorticoid effect","Dexamethasone is weaker than prednisolone","All glucocorticoids have equal potency","Prednisolone has no mineralocorticoid activity"],
 e:"Dose conversions matter: 0.1 mg/kg dexamethasone ≈ 1 mg/kg prednisolone. Dexamethasone sodium phosphate is used IV in emergencies (Addisonian crisis, anaphylaxis adjunct) and does not interfere with cortisol assays. Avoid long-acting depot steroids (methylprednisolone acetate) in cats prone to diabetes/CHF."},
// ---------- ANTIPARASITICS ----------
{c:"Antiparasitics", q:"Isoxazolines (fluralaner, afoxolaner, sarolaner, lotilaner) - spectrum, duration and the notable safety warning?",
 o:["Kill fleas and ticks (and are effective against Demodex, Sarcoptes, Otodectes off-label/extended label); fluralaner lasts 12 weeks (8 weeks for ticks in some regions), others monthly; label warning: neurological adverse events (tremors, ataxia, seizures) reported rarely, so use with caution in dogs with a seizure history","Kill only intestinal worms; weekly dosing","Prevent heartworm; given once a year","Are contraindicated in all cats"],
 e:"Isoxazolines act on GABA-gated chloride channels of arthropods (selective over mammalian channels). Fluralaner and sarolaner have topical feline formulations; combinations with moxidectin or milbemycin add heartworm and intestinal worm coverage."},
{c:"Antiparasitics", q:"Imidacloprid + moxidectin spot-on (Advocate/Advantage Multi) - what does it cover, and is it safe in MDR1 dogs?",
 o:["Fleas, heartworm prevention, intestinal nematodes, Sarcoptes, Demodex (weekly or monthly protocols), Otodectes, lungworm; safe at label doses in MDR1-mutant dogs (ingestion of the applied product by another dog can cause toxicity)","Only ticks; toxic to all Collies","Tapeworms and heartworm adulticide","Only cats"],
 e:"Topical moxidectin at label doses has an adequate safety margin even in ABCB1 mutants, but large oral exposures (licking a freshly treated dog or horse products) cause ivermectin-type toxicity. It does not kill ticks."},
{c:"Antiparasitics", q:"Praziquantel - dose and the key indication requiring frequent dosing?",
 o:["5 mg/kg PO/SC (single dose) for all cestodes (Taenia, Dipylidium, Echinococcus); dogs with access to raw offal in Echinococcus-endemic areas are dosed every 4-6 weeks","50 mg/kg daily for 5 days; Giardia","0.5 mg/kg; heartworm","1 mg/kg weekly; Toxocara"],
 e:"Praziquantel disrupts tapeworm tegument; it does not treat nematodes (combination products add pyrantel/febantel/milbemycin). Flea control prevents Dipylidium reinfection. Echinococcus multilocularis-endemic areas (not the Gulf) use monthly treatment."},
{c:"Antiparasitics", q:"Fenbendazole - dosing protocols?",
 o:["50 mg/kg PO q24h for 3 days (roundworms, hookworms, whipworms, Taenia), 5 days for Giardia, 10-14 days for lungworm (Aelurostrongylus/Angiostrongylus) and some protozoa; wide safety margin, usable in pregnancy","5 mg/kg single dose for everything","100 mg/kg IV","Contraindicated in puppies"],
 e:"Fenbendazole is a benzimidazole with low toxicity (rare bone marrow suppression reported with prolonged use). It is the preferred Giardia treatment and is used off-label in pregnant bitches (day 40 to 2 days post-whelping) to reduce transplacental Toxocara transmission."},
{c:"Antiparasitics", q:"Milbemycin oxime - what does it prevent/treat and MDR1 safety?",
 o:["Monthly heartworm prevention and treatment of hookworms, roundworms, whipworms (and off-label Demodex at higher doses); safe in MDR1 mutants at preventive doses, but high-dose Demodex protocols require genotyping","Only flea control","Tapeworms only","Contraindicated in all cats"],
 e:"Macrocyclic lactones (milbemycin, moxidectin, selamectin, ivermectin) share the same heartworm mechanism; combinations with praziquantel or isoxazolines provide broad monthly coverage. Test for heartworm before starting in dogs >7 months old in endemic areas."},
{c:"Antiparasitics", q:"Standard first-line protocols for canine leishmaniosis?",
 o:["Meglumine antimoniate 50 mg/kg SC q12h (or 100 mg/kg q24h) for 4 weeks, OR miltefosine 2 mg/kg PO q24h for 28 days - each combined with allopurinol 10 mg/kg PO q12h for 6-12+ months; monitor renal function, UPC, electrophoresis and for xanthine crystalluria","Doxycycline 10 mg/kg for 28 days alone","Imidocarb 6.6 mg/kg once","Prednisolone 2 mg/kg for 3 months"],
 e:"Antimonials are leishmanicidal (nephrotoxic potential, injection site reactions); miltefosine is leishmanistatic (GI side effects, teratogenic - handle with gloves). Allopurinol alone is used in stage I or when the others are unavailable, but resistance is emerging."},
{c:"Antiparasitics", q:"Imidocarb dipropionate - dose, indications and side-effect management?",
 o:["6.6 mg/kg IM or SC, repeated after 14 days, for Babesia (large forms) and Hepatozoon canis; cholinergic signs (salivation, vomiting, bradycardia) are reduced by atropine 0.02-0.04 mg/kg given 15-30 min before; painful injection","50 mg/kg PO daily for 28 days for Ehrlichia","0.1 mg/kg IV for Leishmania","Only in cats"],
 e:"Imidocarb has partial activity against Ehrlichia but is not a substitute for doxycycline. Babesia gibsoni needs atovaquone + azithromycin. Nephro/hepatotoxicity occur at high doses."},
// ---------- EMERGENCY & ANTIDOTES ----------
{c:"Emergency & Antidotes", q:"Naloxone - dose and practical notes?",
 o:["0.01-0.04 mg/kg IV/IM/SC (titrate to effect); duration 30-60 min, so repeat doses may be needed for long-acting opioids; abrupt full reversal removes analgesia - partial reversal with low doses or butorphanol is preferable after surgery","1 mg/kg once; lasts 24 h","0.001 mg/kg PO","Only intranasal"],
 e:"Naloxone is a pure competitive opioid antagonist; used for respiratory depression, neonatal depression after C-section (one drop sublingually) and opioid overdose. It does not reverse alpha-2 agonists or benzodiazepines."},
{c:"Emergency & Antidotes", q:"Flumazenil - dose and use?",
 o:["0.01-0.02 mg/kg IV, repeated as needed; reverses benzodiazepine sedation/respiratory depression (midazolam, diazepam) and is used in hepatic encephalopathy with suspected benzodiazepine-like substances","1 mg/kg IM; reverses opioids","0.1 mg/kg PO; reverses ketamine","Only in cats"],
 e:"Benzodiazepines rarely need reversal; flumazenil may precipitate seizures in epileptic patients or those on chronic benzodiazepines. Short duration (~1 h)."},
{c:"Emergency & Antidotes", q:"Intravenous lipid emulsion (ILE, 20%) - dose and indications?",
 o:["1.5 mL/kg IV bolus over 1-2 min, then 0.25 mL/kg/min for 30-60 min (may repeat once if signs persist); for lipophilic toxins: permethrin (cats), ivermectin/moxidectin, bupivacaine/lidocaine toxicity, baclofen, some NSAID/calcium channel blocker overdoses","10 mL/kg/h for 24 h for all toxins","0.1 mL/kg SC","Only as nutrition"],
 e:"ILE creates a 'lipid sink' that sequesters lipophilic drugs and may provide myocardial energy. Check for lipemia before repeating; adverse effects are rare (pancreatitis, fat overload, hypersensitivity)."},
{c:"Emergency & Antidotes", q:"Activated charcoal - dose and when repeated dosing is indicated?",
 o:["1-4 g/kg PO (with sorbitol as a cathartic for the first dose); repeat 0.5-1 g/kg q4-6h for 24 h for toxins with enterohepatic recirculation (bromethalin, NSAIDs, methylxanthines, cholecalciferol, anticoagulant rodenticides); poorly effective for xylitol, ethanol, ethylene glycol, heavy metals","10 mg/kg once; always repeat","0.01 g/kg IV","Contraindicated in all poisonings"],
 e:"Avoid charcoal in patients with reduced gag reflex (aspiration risk - intubate first), GI obstruction, or after caustic ingestion. Monitor sodium: hypernatremia can develop from sorbitol/water shifts, especially in small dogs."},
{c:"Emergency & Antidotes", q:"Apomorphine in dogs - dose and routes?",
 o:["0.03 mg/kg IV or 0.04 mg/kg IM; or a tablet/crushed portion placed in the conjunctival sac and rinsed out after emesis; emesis in 2-15 min; contraindicated with caustics, hydrocarbons, or CNS depression; ropinirole eye drops (3.75 mg/m2) are a licensed alternative","1 mg/kg PO; emesis in 2 h","0.001 mg/kg SC; safe in cats","Only rectal"],
 e:"Emesis is useful within 1-2 h of ingestion (longer for large meals or chocolate). Hydrogen peroxide 3% (1-2 mL/kg, max 45 mL) is an at-home option in dogs with risk of hemorrhagic gastritis; never in cats. Cats: dexmedetomidine or xylazine."},
{c:"Emergency & Antidotes", q:"Vitamin K1 (phytonadione) - regimen for anticoagulant rodenticide and an administration warning?",
 o:["2.5-5 mg/kg/day PO (divided q12h) with a fatty meal for 4 weeks (second-generation agents) and PT check 48-72 h after stopping; avoid IV (anaphylaxis) - SC with a small needle only for the first dose if the animal cannot take oral medication; vitamin K3 is ineffective","50 mg/kg IV bolus once","0.1 mg/kg once weekly","Only topical"],
 e:"Vitamin K1 takes 12-24 h to restore clotting factors; actively bleeding patients need plasma or whole blood. Short-acting (first generation) agents need 2 weeks of therapy; if the agent is unknown, treat for 4 weeks."},
{c:"Emergency & Antidotes", q:"Mannitol - dose and indications/contraindications?",
 o:["0.5-1.5 g/kg IV over 15-20 min (filter) for raised intracranial pressure or acute glaucoma; repeatable q6-8h up to 3 doses; contraindicated in hypovolemia, dehydration, anuric renal failure and intracranial hemorrhage, and must be followed by fluids","10 g/kg IV bolus for all head trauma","0.01 g/kg PO","Used as maintenance fluid"],
 e:"Mannitol is an osmotic diuretic with rheological/free-radical scavenging effects in the brain; hypertonic saline (4 mL/kg 7.5%) is an alternative in hypovolemic head trauma patients because it also expands volume."},
{c:"Emergency & Antidotes", q:"Epinephrine during CPR - dose and dilution?",
 o:["Low dose 0.01 mg/kg IV/IO every 3-5 min (every other 2-min cycle) = 0.1 mL/kg of a 1:10,000 (0.1 mg/mL) solution, or 0.01 mL/kg of 1:1,000; high dose (0.1 mg/kg) only after prolonged CPR; intratracheal 0.02-0.1 mg/kg diluted if no IV access","1 mg/kg IV every minute","0.1 mg/kg SC","Only for anaphylaxis, never in CPR"],
 e:"RECOVER guidelines: vasopressin 0.8 U/kg is an alternative; atropine 0.04 mg/kg for suspected vagal arrest; defibrillation for VF/pulseless VT; sodium bicarbonate only after >10-15 min of arrest. Keep a dosing chart on the crash cart by body weight."},
{c:"Emergency & Antidotes", q:"Diazepam - appropriate routes and doses for seizures, and a formulation caveat?",
 o:["0.5-1 mg/kg IV, or 1-2 mg/kg rectally / 0.2-0.5 mg/kg intranasally if no IV access; NOT IM (erratic absorption, pain); binds to plastic and is light-sensitive; in cats, oral diazepam is avoided (hepatic necrosis) and midazolam IM is preferred","10 mg/kg IM; stable in any syringe","0.01 mg/kg PO once daily","Only IV, never rectal"],
 e:"Midazolam (0.2-0.5 mg/kg IV/IM/IN) is water-soluble and is now preferred for out-of-hospital and IM use. After two benzodiazepine doses, load levetiracetam (60 mg/kg IV) or phenobarbital (4-16 mg/kg IV in increments)."},
{c:"Emergency & Antidotes", q:"Methocarbamol - dose and indications?",
 o:["44-220 mg/kg/day IV (or PO) divided, not exceeding 330 mg/kg/day; for tremorgenic toxicoses (permethrin, metaldehyde, tremorgenic mycotoxins) and muscle spasm","1 mg/kg q24h; antiemetic","500 mg/kg IV bolus; antiarrhythmic","Only topical"],
 e:"Methocarbamol is a centrally acting muscle relaxant; the injectable is given slowly IV (max 2 mL/min; contains polyethylene glycol). It does not control true seizures - add benzodiazepines/propofol if seizures occur."},
{c:"Emergency & Antidotes", q:"Pralidoxime (2-PAM) and atropine for organophosphate/carbamate toxicity?",
 o:["Atropine 0.2-0.5 mg/kg (1/4 IV, rest IM/SC) titrated to control muscarinic signs (SLUDGE, bradycardia, bronchorrhea); pralidoxime 20 mg/kg IM/slow IV q8-12h for organophosphates (reactivates cholinesterase) - not useful for carbamates and most effective within 24-48 h","Atropine 5 mg/kg IV bolus; pralidoxime 500 mg/kg PO","Neither is used; give naloxone","Pralidoxime only for carbamates"],
 e:"Nicotinic signs (tremors, weakness, paralysis) do not respond to atropine; diphenhydramine 2-4 mg/kg may help, and ventilation support may be needed. Decontaminate the coat with mild detergent and protect staff."},
// ---------- IMMUNOMODULATORS ----------
{c:"Immunomodulators", q:"Ciclosporin - dose, adverse effects and a dietary caution in cats?",
 o:["5 mg/kg PO q24h (dogs and cats; cats 7 mg/kg for atopy), tapered to q48h or twice weekly once controlled; GI upset (give frozen/with food), gingival hyperplasia, hirsutism; in cats, avoid raw meat and hunting (Toxoplasma reactivation) and test FeLV/FIV first","50 mg/kg q12h; no adverse effects","0.1 mg/kg IV weekly","Only topical"],
 e:"Ciclosporin (calcineurin inhibitor) is used for atopic dermatitis, perianal fistulas, IMHA/ITP (second-line), IBD and KCS (topical). Ketoconazole 5 mg/kg can be added to reduce the ciclosporin dose (CYP3A4 inhibition). Blood levels are rarely needed for dermatology."},
{c:"Immunomodulators", q:"Oclacitinib (Apoquel) - dosing and restrictions?",
 o:["0.4-0.6 mg/kg PO q12h for up to 14 days, then q24h; dogs >=12 months old only; monitor CBC/chemistry periodically (rare cytopenias), caution with demodicosis, serious infections or neoplasia; not for use in cats (off-label use exists at higher doses)","5 mg/kg q8h indefinitely in any age","0.01 mg/kg weekly","Injectable monthly"],
 e:"Oclacitinib is a JAK1 inhibitor that blocks IL-31 and other pruritogenic cytokines with onset within hours; it is for allergic/atopic pruritus, not for pyoderma or parasites, which must be controlled first. Twice-daily dosing beyond 14 days increases immunosuppression."},
{c:"Immunomodulators", q:"Lokivetmab (Cytopoint) - what is it and how is it used?",
 o:["A caninized monoclonal antibody against IL-31, 1-2 mg/kg SC every 4-8 weeks; dogs only (species-specific), safe with other drugs, no age restriction, no laboratory monitoring needed; does not treat non-IL-31 pruritus (infections, fleas)","A JAK inhibitor tablet for cats","An antihistamine injection lasting 24 h","A corticosteroid depot"],
 e:"Being a biological, it is eliminated like endogenous IgG, with no hepatic/renal metabolism; it is ideal for dogs with comorbidities or young puppies. ~70-80% response; response seen within 1-3 days."},
{c:"Immunomodulators", q:"Azathioprine - dosing in dogs and the absolute species contraindication?",
 o:["2 mg/kg PO q24h for 2-4 weeks then q48h (dogs); CONTRAINDICATED in cats (fatal, irreversible bone marrow suppression); monitor CBC every 2 weeks initially and liver enzymes (hepatotoxicity), wear gloves (cytotoxic)","10 mg/kg q12h in cats; no monitoring","0.1 mg/kg IV once","Safe in both species at any dose"],
 e:"Azathioprine is a purine antagonist used as a steroid-sparing agent in IMHA, ITP, IBD, IMPA, myasthenia; onset of effect takes 2-6 weeks. Cats lack thiopurine methyltransferase activity. Chlorambucil is the feline alternative."},
{c:"Immunomodulators", q:"Mycophenolate mofetil - dose and main adverse effect?",
 o:["8-12 mg/kg PO q12h (dogs; also IV); diarrhea (dose-related, often resolves with dose reduction) is the main adverse effect; faster onset than azathioprine (days) - used in IMHA, ITP, myasthenia, meningoencephalitis","50 mg/kg q24h; nephrotoxicity","0.01 mg/kg; retinal toxicity","Only in cats"],
 e:"Mycophenolate inhibits inosine monophosphate dehydrogenase (lymphocyte-selective). Limited data in cats (higher diarrhea risk). Gloves for handling; monitor CBC."},
{c:"Immunomodulators", q:"Chlorambucil in cats - typical use and dosing?",
 o:["Small-cell (low-grade) alimentary lymphoma and refractory IBD: 2 mg/cat PO every 48-72 h (or 20 mg/m2 every 2 weeks) with prednisolone; monitor CBC every 2-4 weeks for myelosuppression; gloves and no tablet splitting","20 mg/kg daily; no monitoring","0.1 mg/kg IV weekly","Only in dogs with IMHA"],
 e:"Chlorambucil is an alkylating agent with a good safety profile in cats (median survival 2-3 years in small-cell lymphoma). It is the feline replacement for azathioprine. Rare neurotoxicity (myoclonus) reported at high doses."},
{c:"Immunomodulators", q:"Prednisolone dose tiers and a dosing nuance for large dogs?",
 o:["Physiologic replacement 0.1-0.2 mg/kg/day; anti-inflammatory/antipruritic 0.5-1 mg/kg/day; immunosuppressive 2 mg/kg/day (or 40-60 mg/m2/day in dogs >25-30 kg to avoid excessive doses); always taper after >2 weeks","All indications 5 mg/kg/day","Immunosuppressive 0.1 mg/kg/day","Large dogs need 4 mg/kg/day"],
 e:"Adverse effects: PU/PD, polyphagia, panting, muscle wasting, GI ulceration, infections (UTI), iatrogenic Cushing's, diabetes in cats, and exacerbation of CHF (sodium retention). In cats use prednisolone (not prednisone) and higher mg/kg doses are tolerated."},
// ---------- DOSE CALCULATIONS ----------
{c:"Dose Calculations", q:"A 20 kg dog needs amoxicillin-clavulanate 12.5 mg/kg PO q12h. Tablets contain 250 mg. How many tablets per dose?",
 o:["1 tablet","2 tablets","0.5 tablet","4 tablets"],
 e:"12.5 mg/kg x 20 kg = 250 mg per dose = 1 x 250 mg tablet, twice daily."},
{c:"Dose Calculations", q:"A 4 kg cat needs maropitant 1 mg/kg SC. The injectable contains 10 mg/mL. Volume?",
 o:["0.4 mL","4 mL","0.04 mL","1 mL"],
 e:"1 mg/kg x 4 kg = 4 mg; 4 mg / 10 mg/mL = 0.4 mL. Refrigerate the vial to reduce injection pain."},
{c:"Dose Calculations", q:"A 10 kg dog is to receive dexmedetomidine 5 ug/kg IM from a 0.5 mg/mL (500 ug/mL) solution. Volume?",
 o:["0.1 mL","1 mL","0.01 mL","0.5 mL"],
 e:"5 ug/kg x 10 kg = 50 ug; 50 ug / 500 ug/mL = 0.1 mL. Small volumes should be drawn in an insulin or 1 mL syringe; dilution improves accuracy."},
{c:"Dose Calculations", q:"Maximum lidocaine 2% (20 mg/mL) volume for an intratesticular/line block in a 5 kg cat, using a maximum of 2 mg/kg?",
 o:["0.5 mL","5 mL","0.05 mL","2 mL"],
 e:"2 mg/kg x 5 kg = 10 mg; 10 mg / 20 mg/mL = 0.5 mL. Dilute with saline to increase volume for distribution without exceeding the dose."},
{c:"Dose Calculations", q:"Vincristine 0.7 mg/m2 IV for a 10 kg dog with a body surface area of 0.47 m2. The vial is 1 mg/mL. Volume?",
 o:["0.33 mL","3.3 mL","0.7 mL","0.047 mL"],
 e:"0.7 mg/m2 x 0.47 m2 = 0.33 mg = 0.33 mL. BSA (m2) = 0.101 x kg^(2/3) for dogs. Vincristine is a vesicant: use a clean first-stick catheter and flush well."},
{c:"Dose Calculations", q:"Starting glargine for a 5 kg diabetic cat at 0.25 U/kg q12h using a U-100 syringe. Dose per injection?",
 o:["1.25 U, rounded DOWN to 1 U","2.5 U","5 U","0.25 U"],
 e:"0.25 U/kg x 5 kg = 1.25 U; always round down at the start and never exceed 0.5 U/kg initially; recheck in 1 week with a glucose curve. U-100 syringes with half-unit markings help in cats."},
{c:"Dose Calculations", q:"Fentanyl CRI at 3 ug/kg/h for a 20 kg dog using undiluted fentanyl 50 ug/mL on a syringe driver. Rate?",
 o:["1.2 mL/h","12 mL/h","0.12 mL/h","6 mL/h"],
 e:"3 ug/kg/h x 20 kg = 60 ug/h; 60 ug/h / 50 ug/mL = 1.2 mL/h. For better control, dilute to 10 ug/mL (6 mL/h). Give a loading bolus of 2-5 ug/kg first."},
{c:"Dose Calculations", q:"A 25 kg dog receives prednisolone at an immunosuppressive dose of 2 mg/kg/day divided q12h; tablets are 20 mg. How many per dose?",
 o:["1.25 tablets (25 mg) per dose","2.5 tablets per dose","0.5 tablet per dose","5 tablets per dose"],
 e:"2 mg/kg x 25 kg = 50 mg/day = 25 mg q12h = 1.25 x 20 mg tablets. In dogs >25-30 kg, dosing by body surface area (40-60 mg/m2/day) avoids overdosing; here 50 mg/day equals ~58 mg/m2 - acceptable."},
{c:"Dose Calculations", q:"Doxycycline 10 mg/kg q24h for a 32 kg dog from 100 mg tablets?",
 o:["3 tablets (320 mg, rounded to 300 mg)","1 tablet","5 tablets","10 tablets"],
 e:"10 mg/kg x 32 kg = 320 mg; 3 x 100 mg tablets = 300 mg (9.4 mg/kg, within the acceptable range). Give with food and water."},
{c:"Dose Calculations", q:"A 3 kg kitten needs a single dose of praziquantel at 5 mg/kg. The feline tablet contains 20 mg (praziquantel) and is scored. Dose?",
 o:["15 mg = 3/4 tablet","20 mg = 1 tablet","5 mg = 1/4 tablet","40 mg = 2 tablets"],
 e:"5 mg/kg x 3 kg = 15 mg = 3/4 of a 20 mg tablet. Many combination tablets are dosed by weight bands - always check the product label."}

 testsSummary:"The core panel for a suspected CKD cat: CBC, chemistry with electrolytes/phosphorus, SDMA, urinalysis with UPC, total T4, blood pressure and renal ultrasound. This lets you stage (IRIS) and sub-stage (proteinuria, hypertension).",
 ddx:{q:"What is the most appropriate diagnosis?", options:[
  {t:"Chronic kidney disease, IRIS stage 3, borderline proteinuric, hypertensive", ok:true, fb:"Correct. Creatinine 2.9-5.0 mg/dL (cats) = stage 3 (SDMA 26-38 agrees); UPC 0.2-0.4 = borderline proteinuric; SBP >180 = severely hypertensive. Small irregular kidneys and non-regenerative anemia confirm chronicity. Note: formal staging is done after rehydration."},
  {t:"Acute kidney injury from an unrecognized toxin", ok:false, fb:"The 6-month history, small irregular kidneys, non-regenerative anemia and muscle loss all indicate chronic disease. AKI usually shows normal-to-large kidneys, often painful, and an acute history."},
  {t:"Hyperthyroidism with secondary azotemia", ok:false, fb:"T4 is normal and no nodule is palpable. Hyperthyroid cats are usually tachycardic with polyphagia, and azotemia often appears only after treatment unmasks CKD."},
  {t:"Diabetes mellitus", ok:false, fb:"Glucose is normal and there is no glucosuria. PU/PD here is from loss of concentrating ability."}
 ]},
 tx:{q:"Choose the best initial management plan.", options:[
  {t:"Correct dehydration with IV isotonic fluids over 24-48 h, then transition to a renal diet, amlodipine 0.625 mg/cat PO q24h for hypertension, oral potassium supplementation, phosphate binder if phosphorus stays >5 mg/dL on diet, maropitant for nausea, and recheck in 2-4 weeks", ok:true, fb:"Correct. This covers the IRIS stage 3 priorities: hydration, renal diet (the intervention with the strongest survival evidence), hypertension control (amlodipine first choice in cats), phosphorus and potassium control, and nausea management. Add telmisartan or benazepril if proteinuria becomes persistent (UPC >0.4)."},
  {t:"Methimazole 2.5 mg q12h plus a renal diet", ok:false, fb:"Methimazole is for hyperthyroidism; T4 is normal. Giving it would risk further decline and does nothing for the hypertension."},
  {t:"Prednisolone 1 mg/kg to improve appetite and reduce vomiting", ok:false, fb:"Glucocorticoids increase protein catabolism, PU/PD and GI ulceration risk, and have no role in CKD. Use maropitant/ondansetron for nausea and mirtazapine as an appetite stimulant."},
  {t:"Lifelong aggressive IV fluid diuresis at 3x maintenance", ok:false, fb:"Chronic over-hydration causes volume overload (especially with a murmur) and does not restore nephrons. Once rehydrated, maintenance is oral water intake +/- intermittent SC fluids at home."}
 ]},
 pearls:["Weight loss + PU/PD in a senior cat: always rule out hyperthyroidism, diabetes and CKD together.","Isosthenuria + azotemia + dehydration = renal azotemia until proven otherwise.","Hypertension in cats: amlodipine; proteinuria: telmisartan or benazepril.","Renal diet improves survival; start it once nausea is controlled, never force a diet change on a hospitalized sick cat."]
},

 ],
 testsSummary:"Confirm with ultrasound; CBC and chemistry define the systemic impact (sepsis, renal function) and guide stabilization. Never do cystocentesis on a suspected pyometra.",
 ddx:{q:"Most likely diagnosis?", options:[
  {t:"Open-cervix pyometra with early systemic inflammatory response (sepsis) and prerenal/renal azotemia", ok:true, fb:"Correct. Diestrual intact bitch, PU/PD, vomiting, purulent discharge, inflammatory leukogram with left shift and fluid-filled uterus."},

  {t:"Hydrometra / mucometra", ok:false, fb:"Mucometra is a sterile accumulation in a clinically healthy bitch without leukocytosis or fever."}
 ]},
 tx:{q:"Best treatment plan?", options:[
  {t:"IV crystalloid resuscitation and rehydration, IV amoxicillin-clavulanate or ampicillin (+/- enrofloxacin pending culture), analgesia, then ovariohysterectomy within hours once perfusion improves; submit uterine content for culture", ok:true, fb:"Correct. Pyometra is a surgical emergency: source control (OHE) after rapid stabilization gives the best outcome. Antibiotics are continued 7-10 days if there was peritonitis or sepsis. Monitor renal values post-operatively."},
  {t:"Aglepristone 10 mg/kg SC on days 1, 2 and 8 plus cloprostenol, and recheck in 2 weeks", ok:false, fb:"Medical management is only an option for a stable, young, valuable breeding bitch with an open cervix and no systemic illness. This dog is septic, azotemic and 8 years old, so surgery is indicated."},
  {t:"Oral antibiotics for 3 weeks and recheck ultrasound", ok:false, fb:"Antibiotics alone do not remove the infected uterus; progression to rupture, peritonitis and death is likely."},
  {t:"Immediate surgery without fluids to avoid delay", ok:false, fb:"A dehydrated, tachycardic patient with azotemia must be volume-resuscitated for 1-2 hours first; anesthesia in hypovolemia causes hypotension and worsens AKI."}
 ]},
 pearls:["Any sick intact bitch in diestrus has pyometra until proven otherwise.","Closed-cervix pyometra (no discharge) is more dangerous: faster toxemia and rupture risk.","E. coli endotoxin causes the PU/PD (reversible nephrogenic DI).","Recommend elective spaying of all non-breeding bitches: prevents pyometra and reduces mammary tumor risk if done early."]
},

 id:"parvo", title:"Vomiting puppy with bloody diarrhea", species:"Dog",
 signalment:"10-week-old intact male mixed-breed puppy, 4.2 kg, acquired from a street litter 2 weeks ago.",
 history:"Received one vaccine at 6 weeks of age. 3 days of vomiting (6-8 times/day), profuse foul-smelling hemorrhagic diarrhea since yesterday, anorexia, lethargy. A littermate died last week.",
 pe:["Obtunded, weak but responsive","T 39.8 C, HR 200, pulses weak, CRT 2.5 s, pale mucous membranes","Estimated 9-10% dehydration (prolonged skin tent, sunken eyes, dry membranes)","Abdominal palpation painful, fluid-filled intestinal loops; no discrete mass","Hemorrhagic fecal staining on the perineum"],
 tests:[
  {name:"Fecal parvovirus antigen (SNAP/ELISA)", key:true, result:"Strong positive.", note:"Fast, point-of-care test. False negatives occur early or late in shedding; weak positives can occur 3-10 days after modified-live vaccination (not relevant here: vaccine was 4 weeks ago). PCR confirms if needed."},
  {name:"CBC", key:true, result:"WBC 1.6 x10^9/L (neutrophils 0.4), HCT 33%, platelets 160.", note:"Severe neutropenia/leukopenia from bone marrow involvement and GI consumption - supports parvovirus and indicates high sepsis risk."},
  {name:"Serum biochemistry + electrolytes", key:true, result:"Glucose 54 mg/dL, potassium 3.0 mmol/L, albumin 1.9 g/dL, BUN 36, creatinine 0.9, ALT 60.", note:"Hypoglycemia (sepsis, poor reserves), hypokalemia and hypoalbuminemia - all need correction during fluid therapy."},
  {name:"Blood glucose (point of care, repeated q4-6h)", key:true, result:"54 mg/dL at admission.", note:"Puppies have minimal glycogen reserves; monitor glucose every 4-6 h and supplement dextrose."},
  {name:"Fecal flotation", key:false, result:"Few Toxocara eggs, no Giardia.", note:"Reasonable: concurrent parasitism worsens parvovirus disease; deworm once the puppy is eating."},
  {name:"Abdominal radiographs", key:false, result:"Generalized fluid/gas-filled small intestinal loops consistent with ileus; no foreign body or target sign.", note:"Useful mainly to rule out intussusception (a complication of parvovirus) or foreign body if the abdomen is painful; ultrasound is more sensitive for intussusception."},
  {name:"Abdominal ultrasound", key:false, result:"Diffuse fluid-filled hypomotile loops; no intussusception.", note:"Good choice if pain or a mass persists; rules out intussusception."},
  {name:"Blood culture", key:false, result:"Pending.", note:"Rarely changes management; empirical antibiotics are started regardless because of neutropenia and GI barrier loss."},
  {name:"Thoracic radiographs", key:false, result:"Unremarkable.", note:"Not indicated unless respiratory signs develop (aspiration pneumonia from vomiting)."}
 ],
 testsSummary:"Parvo SNAP + CBC + chemistry/electrolytes/glucose are the minimum. Ultrasound or radiographs if you suspect intussusception. Isolate the puppy immediately and use barrier nursing.",
 ddx:{q:"What is your diagnosis?", options:[
  {t:"Canine parvovirus enteritis with hypovolemic shock, hypoglycemia and neutropenic sepsis risk", ok:true, fb:"Correct. Unvaccinated/incompletely vaccinated puppy, hemorrhagic diarrhea, leukopenia and positive antigen test."},
  {t:"Intussusception", ok:false, fb:"No target sign or mass on imaging; intussusception can complicate parvovirus, so keep palpating daily, but it is not the primary diagnosis."},
  {t:"Giardiasis", ok:false, fb:"Giardia causes soft, pale, malodorous stools without hemorrhage, fever or leukopenia."},
  {t:"Dietary indiscretion / garbage enteritis", ok:false, fb:"Would not explain the severe leukopenia, the dead littermate or the positive antigen test."}
 ]},
 tx:{q:"Best treatment plan?", options:[
  {t:"Isolate; IV catheter; crystalloid bolus 20 ml/kg then rehydration over 12-24 h with dextrose 2.5-5% and KCl supplementation; maropitant 1 mg/kg IV; IV ampicillin or amoxicillin-clavulanate (+/- metronidazole); early enteral nutrition via nasogastric tube within 12-24 h; monitor glucose, K+, PCV/TS; deworm when eating", ok:true, fb:"Correct. Fluid and electrolyte support, antiemetics, broad-spectrum antibiotics for bacterial translocation, and early enteral feeding (improves outcome and mucosal recovery). Survival with intensive care is 80-90%."},
  {t:"Enrofloxacin and loperamide, send home with oral electrolytes", ok:false, fb:"Fluoroquinolones damage growing cartilage in puppies; loperamide is contraindicated in infectious hemorrhagic diarrhea (ileus, bacterial retention, MDR1 risk). Oral rehydration fails in a vomiting, 10%-dehydrated patient in shock."},
  {t:"Prednisolone 2 mg/kg to reduce intestinal inflammation", ok:false, fb:"Glucocorticoids increase GI ulceration and immunosuppression in an already neutropenic septic puppy."},
  {t:"Keep NPO (nothing by mouth) for 5 days until vomiting resolves completely", ok:false, fb:"Prolonged fasting worsens villous atrophy and bacterial translocation. Current evidence supports early enteral nutrition once vomiting is controlled, even if small amounts via NG tube."}
 ]},
 pearls:["Parvovirus survives months in the environment; use diluted bleach (1:30) or accelerated hydrogen peroxide for disinfection.","Vaccinate puppies every 3-4 weeks from 6-8 weeks until 16 weeks or older (maternal antibody interference).","If hospitalization is impossible, an outpatient protocol (SC fluids, maropitant, cefovecin, syringe feeding) can achieve ~75% survival.","Watch for intussusception, aspiration pneumonia and sepsis as complications."]
},
{
 id:"foreign-body", title:"Labrador vomiting after chewing a toy", species:"Dog",
 signalment:"3-year-old intact male Labrador Retriever, 34 kg.",
 history:"Acute onset of vomiting 36 hours ago, now 8 episodes/day, unproductive retching, complete anorexia, no feces for 2 days. Known to chew and swallow pieces of rubber toys; a toy went missing 3 days ago. Fully vaccinated, on monthly parasite prevention.",
 pe:["Quiet, alert, responsive; T 38.6 C, HR 130, RR 28","Estimated 7% dehydration","Cranial-to-mid abdomen painful on palpation; no discrete mass palpable; gas-distended loops suspected","No melena on rectal exam; scant mucus","Mucous membranes pink, CRT 2 s"],
 tests:[
  {name:"Abdominal radiographs (two orthogonal views)", key:true, result:"Several gas- and fluid-distended small intestinal loops; the widest loop is 2.1 times the height of L5 (ratio >1.6 suggests obstruction). Gravel sign in one loop. No radiopaque foreign body.", note:"First imaging step. A SI diameter:L5 ratio >1.6 (dogs) suggests mechanical obstruction; two populations of bowel (dilated vs normal) is a classic sign."},
  {name:"Abdominal ultrasound", key:true, result:"A 3 cm hyperechoic intraluminal structure with strong distal acoustic shadowing in the jejunum; dilated, fluid-filled, hypomotile loops proximal to it; normal loops distal. No free fluid, no plication.", note:"Highly sensitive for obstruction and can identify the foreign body itself and complications (free fluid, loss of wall layering = ischemia/perforation)."},
  {name:"Serum biochemistry + electrolytes + acid-base", key:true, result:"Chloride 98 mmol/L (low), potassium 3.2 (low), sodium 143, HCO3 32 (high), pH 7.52, BUN 38, creatinine 1.5, lactate 2.8, ALT 70.", note:"Hypochloremic, hypokalemic metabolic alkalosis - the classic pattern of upper GI obstruction with loss of gastric HCl. Must be corrected (0.9% NaCl + KCl) before anesthesia."},
  {name:"CBC", key:true, result:"HCT 56% (hemoconcentration), WBC 18 with mild neutrophilia, platelets normal.", note:"Hemoconcentration from dehydration; a left shift or degenerate neutrophils would raise concern for perforation/peritonitis."},
  {name:"Spec cPL", key:false, result:"Mildly elevated (310 ug/L, equivocal zone 200-400).", note:"Mild cPL elevations occur with any abdominal disease; pancreatitis does not explain the imaging findings. Not needed."},
  {name:"Upper GI barium contrast study", key:false, result:"Delayed transit, contrast stops at the jejunal lesion.", note:"Rarely needed once ultrasound confirms obstruction; barium is contraindicated if perforation is possible and delays surgery."},
  {name:"Fecal parvovirus antigen", key:false, result:"Negative.", note:"Adult vaccinated dog with obstructive signs - very low pre-test probability."},
  {name:"Abdominocentesis / fluid analysis", key:false, result:"No fluid obtained.", note:"Indicated only if free fluid is seen on ultrasound (to check for septic peritonitis). None here."},
  {name:"ECG", key:false, result:"Sinus tachycardia.", note:"Reasonable pre-anesthetic check in a patient with electrolyte derangements, but not diagnostic."}
 ],
 testsSummary:"Two-view radiographs then ultrasound confirm mechanical obstruction; chemistry/electrolytes (hypochloremic metabolic alkalosis) guide pre-operative stabilization; CBC screens for sepsis.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Mechanical small-intestinal obstruction by a foreign body, with hypochloremic metabolic alkalosis", ok:true, fb:"Correct. Acute vomiting, no feces, dilated loops with gravel sign, shadowing intraluminal structure, and the classic electrolyte pattern."},
  {t:"Acute pancreatitis", ok:false, fb:"Pancreatitis gives a hypoechoic pancreas with hyperechoic surrounding fat and markedly elevated cPL, not a shadowing intraluminal object with proximal dilation."},
  {t:"Parvovirus enteritis", ok:false, fb:"Adult, vaccinated, no diarrhea, no leukopenia, negative antigen."},
  {t:"Gastric dilatation-volvulus", ok:false, fb:"GDV shows a massively distended, compartmentalized stomach and rapidly progressive shock; here the stomach is not the problem."}
 ]},
 tx:{q:"Best management?", options:[
  {t:"Place IV catheter, correct dehydration and electrolytes with 0.9% NaCl + KCl over 4-6 h, analgesia (methadone/buprenorphine), maropitant, then exploratory laparotomy with enterotomy (or resection-anastomosis if the wall is devitalized), checking the entire GI tract", ok:true, fb:"Correct. Complete obstruction is surgical; a few hours of stabilization reduce anesthetic risk, but prolonged delay increases necrosis and perforation risk. Feed early post-operatively."},
  {t:"Induce emesis with apomorphine to expel the toy", ok:false, fb:"Emesis is only for recent GASTRIC foreign bodies that are small and non-sharp. For an intestinal foreign body it is contraindicated (risk of perforation, aspiration, no chance of retrieval)."},
  {t:"Endoscopic retrieval", ok:false, fb:"Endoscopy reaches the stomach and proximal duodenum only; a mid-jejunal object is not retrievable."},
  {t:"Conservative management: fluids, metoclopramide and wait 48 h for it to pass", ok:false, fb:"Prokinetics are contraindicated with mechanical obstruction (risk of perforation). A complete obstruction with a 2.1 L5 ratio and gravel sign will not pass."}
 ]},
 pearls:["Vomiting + no feces + painful abdomen in a known chewer = obstruction until imaged.","SI diameter / L5 body height >1.6 on radiographs supports obstruction (dogs).","Upper GI obstruction: hypochloremic, hypokalemic metabolic alkalosis; lower/mixed: variable, often acidosis.","Linear foreign bodies: check under the tongue in cats; never pull."]
},
{
 id:"flutd", title:"Male cat straining in the litter tray", species:"Cat",

 pe:["Dull, hypothermic: T 36.7 C, HR 130 (bradycardia for a stressed cat), weak femoral pulses, CRT 2.5 s","Large, firm, painful, non-expressible urinary bladder (~8 cm)","Penis tip erythematous with a small gritty plug visible at the urethral orifice","Mucous membranes pale pink, ~7% dehydrated","Abdomen otherwise unremarkable"],
 tests:[

  {name:"Abdominal radiographs (include the entire urethra)", key:true, result:"Markedly distended bladder; no radiopaque calculi in bladder or urethra.", note:"Struvite and oxalate stones are radiopaque; radiographs rule out cystic/urethral calculi that would need surgery."},

 ],
 testsSummary:"ECG and electrolytes come FIRST (hyperkalemia kills before azotemia does), then blood gas, radiographs of the whole urinary tract, and urinalysis from the catheter sample.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Urethral obstruction (obstructive FLUTD, likely a struvite/matrix plug) with postrenal azotemia, severe hyperkalemia and metabolic acidosis", ok:true, fb:"Correct. Young overweight indoor male on dry food, previous FLUTD episode, large non-expressible bladder, plug visible, no stones on radiographs."},
  {t:"Chronic kidney disease", ok:false, fb:"The azotemia is acute and postrenal: distended bladder, 12 h of anuria, USG 1.038 (kidneys concentrate normally). CKD cats have small kidneys and isosthenuria."},
  {t:"Bacterial cystitis", ok:false, fb:"No bacteria on sediment, culture negative; bacterial cystitis is rare in young male cats and does not cause hyperkalemia."},
  {t:"Ruptured bladder with uroabdomen", ok:false, fb:"The bladder is large and intact on palpation and imaging; uroabdomen would show free fluid with fluid creatinine > serum creatinine."}
 ]},
 tx:{q:"Best immediate management?", options:[
  {t:"IV catheter + isotonic crystalloid bolus 10-15 ml/kg; calcium gluconate 10% 0.5-1 ml/kg IV slowly with ECG; dextrose 0.5 g/kg IV +/- regular insulin 0.25 U/kg; decompressive cystocentesis if needed; sedate (e.g., ketamine/midazolam or alfaxalone +/- coccygeal epidural) and relieve the obstruction by retropulsion with a lubricated catheter; place an indwelling closed-system urinary catheter for 24-48 h; buprenorphine analgesia; monitor K+ and post-obstructive diuresis", ok:true, fb:"Correct. Stabilize the heart and electrolytes before anesthesia, then relieve the obstruction. Fluid rate must match the post-obstructive diuresis (often 2-4x maintenance). Potassium normalizes within hours of relieving the obstruction."},
  {t:"Immediate perineal urethrostomy under general anesthesia", ok:false, fb:"Anesthetizing a hyperkalemic, hypothermic, acidotic cat without stabilization risks cardiac arrest. PU is reserved for recurrent obstructions or when catheterization fails."},
  {t:"Furosemide 2 mg/kg IV to produce urine and lower potassium", ok:false, fb:"Diuretics cannot work when urine cannot leave the bladder; the obstruction must be relieved first."},
  {t:"Amoxicillin-clavulanate and prazosin, send home with canned food", ok:false, fb:"This is a life-threatening obstruction; outpatient treatment is inappropriate. Antibiotics are not indicated without evidence of infection, and evidence for prazosin reducing re-obstruction is weak."}
 ]},
 pearls:["Hyperkalemia: calcium gluconate protects the heart, dextrose/insulin and fluids lower K+, relieving the obstruction fixes the cause.","After unblocking: expect post-obstructive diuresis; match ins and outs, and check K+ (it can fall low after 24 h).","Long-term: canned/wet diet, increased water intake, environmental enrichment (MEMO), weight loss, and litter tray management reduce recurrence.","Recurrence after catheter removal is ~20-40%; owners must monitor urination closely for 2 weeks."]
},

 tx:{q:"Best treatment plan?", options:[

 testsSummary:"A right lateral radiograph confirms volvulus; lactate, ECG, PCV/TS/electrolytes/blood gas and a coagulation profile assess shock severity and prognosis. Do not delay decompression and fluids for extensive testing.",

  {t:"Gastric dilatation-volvulus with hypovolemic/obstructive shock and ventricular arrhythmia", ok:true, fb:"Correct. Giant deep-chested breed, non-productive retching, tympanic cranial abdominal distension and a compartmentalized stomach on the right lateral view."},
  {t:"Simple gastric dilatation (food bloat)", ok:false, fb:"Food bloat shows an enlarged stomach filled with ingesta/gas without compartmentalization and the dog can usually belch/vomit; the double bubble indicates rotation."},
  {t:"Splenic torsion", ok:false, fb:"Splenic torsion causes a painful abdomen with a markedly enlarged spleen on imaging, not a gas-distended, displaced stomach; it can accompany GDV."},
  {t:"Mesenteric volvulus", ok:false, fb:"Mesenteric volvulus shows diffusely gas-distended small intestinal loops and rapid deterioration, mostly in German Shepherds; the stomach is not the primary structure involved."}
 ]},
 tx:{q:"Best management?", options:[
  {t:"Two large-bore cephalic catheters; isotonic crystalloid boluses (10-20 ml/kg, repeated to effect; +/- hypertonic saline or colloid in giant breeds); immediate gastric decompression (orogastric tube under sedation or right paracostal trocarization); analgesia (methadone); lidocaine for sustained ventricular arrhythmias; then surgery: derotation, assessment of gastric and splenic viability (partial gastrectomy/splenectomy if necrotic) and incisional gastropexy; 48-72 h post-operative monitoring", ok:true, fb:"Correct. Resuscitate and decompress, then operate as soon as the dog is a reasonable anesthetic candidate - delay increases necrosis and mortality. Gastropexy reduces recurrence from ~55% to <5%. Use cephalic (cranial) veins because caudal venous return is compromised."},
  {t:"Decompress with an orogastric tube and send home with gastroprotectants", ok:false, fb:"Decompression without surgery leaves the stomach rotated (or at risk of recurrence) and misses necrosis; medical management alone has a very high mortality/recurrence."},
  {t:"Induce emesis with apomorphine to empty the stomach", ok:false, fb:"The gastroesophageal junction is occluded in volvulus; emesis is impossible and the attempt wastes time and risks aspiration."},
  {t:"Immediate laparotomy without fluid resuscitation", ok:false, fb:"Anesthetizing an unresuscitated dog in shock causes cardiovascular collapse; 20-30 minutes of aggressive fluids and decompression dramatically improve survival."}
 ]},
 pearls:["GDV risk factors: giant/deep-chested breeds, first-degree relative with GDV, one large meal a day, fast eating, raised bowls, stress; prophylactic gastropexy is recommended in high-risk breeds.","Right lateral view: pylorus dorsal and cranial to the fundus = volvulus.","Reperfusion injury: continue monitoring the ECG and PCV for 48-72 h; lidocaine CRI if ventricular tachycardia.","Prognostic indicators of necrosis: lactate >6 that does not fall, hypotension at presentation, delay >5-6 h from onset."]
},
{
 id:"ate-cat", title:"Cat screaming and unable to use the hindlimbs", species:"Cat",
 signalment:"8-year-old neutered male Ragdoll, 5.5 kg.",
 history:"Found 30 minutes ago vocalizing in pain and dragging both hindlimbs. No trauma witnessed. The owner mentions the cat has breathed faster than usual for the past week. No previous illness.",
 pe:["Extremely painful, open-mouth breathing, RR 60, HR 220, gallop rhythm, grade III/VI systolic murmur","Both hindlimbs flaccid and cold; paw pads and nail beds pale/cyanotic; femoral pulses absent bilaterally","Gastrocnemius muscles firm and painful","T 36.5 C","No evidence of spinal trauma; tail function intact"],
 tests:[
  {name:"Point-of-care echocardiography", key:true, result:"Left atrial enlargement (LA:Ao 2.4), concentric left ventricular hypertrophy (IVSd 7.5 mm), spontaneous echo contrast ('smoke') in the left atrium.", note:"Confirms hypertrophic cardiomyopathy as the source of the thrombus; LA size and 'smoke' indicate thromboembolic risk. Also assesses for pleural/pericardial effusion and pulmonary edema (B-lines)."},
  {name:"Glucose and lactate from the affected limb vs. a forelimb", key:true, result:"Affected limb: glucose 38 mg/dL, lactate 9.5 mmol/L; forelimb: glucose 160 mg/dL, lactate 2.8 mmol/L.", note:"A large glucose difference (>30 mg/dL) and lactate gradient between the ischemic limb and systemic circulation support the diagnosis of ATE without Doppler."},
  {name:"Thoracic radiographs (after stabilization)", key:true, result:"Cardiomegaly with a 'valentine' shape, mild perihilar interstitial-alveolar pattern, no pleural effusion.", note:"Identifies concurrent congestive heart failure (in ~50% of ATE cats), which changes treatment (furosemide, oxygen). Take once the cat tolerates handling."},
  {name:"Serum biochemistry + electrolytes", key:true, result:"K 5.9 mmol/L, CK 18,000 U/L, AST 540, creatinine 1.8, BUN 44, glucose 160.", note:"Rhabdomyolysis of the ischemic muscles; monitor potassium closely - reperfusion can cause life-threatening hyperkalemia. Mild prerenal azotemia."},
  {name:"NT-proBNP (point of care)", key:false, result:"Abnormal (high).", note:"Supports cardiac disease and helps triage dyspneic cats, but echocardiography already confirmed cardiomyopathy."},
  {name:"Coagulation profile", key:false, result:"PT and aPTT normal.", note:"Usually normal in ATE (it is not a coagulation factor disorder); may serve as a baseline before heparin/thrombolytics."},
  {name:"Spinal radiographs", key:false, result:"No fractures or luxations.", note:"Reasonable to exclude trauma if the history is unclear, but the absent pulses and cold limbs point to a vascular cause."},
  {name:"Total T4", key:false, result:"1.8 ug/dL (normal).", note:"Hyperthyroidism can cause secondary cardiomyopathy and should be checked in older cats; this cat is 8 and the result is normal."},
  {name:"CBC", key:false, result:"Stress leukogram.", note:"Non-contributory."},
  {name:"Abdominal ultrasound", key:false, result:"Reduced/absent flow in the distal aorta at the trifurcation.", note:"Can visualize the thrombus (saddle thrombus) but is not required for diagnosis and prolongs handling of a stressed, dyspneic cat."}
 ],
 testsSummary:"Diagnosis is largely clinical (5 Ps); limb-vs-systemic glucose/lactate confirms ischemia; echocardiography identifies the cardiac source; radiographs and chemistry detect CHF and reperfusion risks (hyperkalemia).",
 ddx:{q:"Diagnosis?", options:[
  {t:"Feline aortic thromboembolism (saddle thrombus) secondary to hypertrophic cardiomyopathy, with probable early congestive heart failure", ok:true, fb:"Correct. Peracute painful paraparesis with absent femoral pulses, cold pale pads and firm muscles, plus HCM with left atrial smoke."},
  {t:"Thoracolumbar intervertebral disc extrusion", ok:false, fb:"Disc disease causes paresis with intact (often increased) femoral pulses and warm limbs; it is also uncommon in cats compared with dogs."},
  {t:"Tick paralysis", ok:false, fb:"Not seen in this region's tick species, and paralysis would be ascending and non-painful with normal pulses."},
  {t:"Pelvic fractures from unobserved trauma", ok:false, fb:"Trauma would show radiographic changes and crepitus; it does not abolish femoral pulses bilaterally or cause a gallop and left atrial smoke."}
 ]},
 tx:{q:"Best treatment plan?", options:[
  {t:"Oxygen and minimal handling; potent analgesia (methadone 0.2-0.3 mg/kg IV/IM or fentanyl CRI); furosemide 1-2 mg/kg IV if pulmonary edema; antithrombotic therapy: clopidogrel 18.75 mg/cat PO q24h (+/- unfractionated or low-molecular-weight heparin in hospital); no IV fluids unless hypovolemic; monitor K+ and ECG for reperfusion hyperkalemia; keep warm; long-term clopidogrel and cardiomyopathy management; discuss prognosis openly (bilateral + hypothermia + CHF = guarded)", ok:true, fb:"Correct. Pain control and treating CHF are immediate priorities; clopidogrel reduces recurrence (FAT CAT study: median recurrence 443 vs 192 days with aspirin). Thrombolytics (tPA) have high complication rates; surgical embolectomy is not recommended. Many cats regain limb function over days to weeks if they survive the first 72 h."},
  {t:"Surgical embolectomy via aortotomy", ok:false, fb:"Associated with very high mortality (reperfusion injury, anesthesia in a cat with HCM/CHF) and not recommended."},
  {t:"Aggressive IV fluid bolus to improve limb perfusion", ok:false, fb:"Fluids precipitate pulmonary edema in a cat with HCM and a large left atrium; perfusion depends on collateral circulation, not on volume."},
  {t:"Aspirin 81 mg PO once daily and discharge", ok:false, fb:"Analgesia, CHF management and monitoring for hyperkalemia are essential in the first days; aspirin is inferior to clopidogrel for prevention of recurrence."}
 ]},
 pearls:["5 Ps of ATE: pain, paralysis, pulselessness, pallor, poikilothermia (cold limbs).","Check femoral pulses and pad temperature in every acutely paraparetic cat before thinking 'spinal'.","Reperfusion syndrome: hyperkalemia, acidosis and myoglobinuria 24-72 h after the event.","Cats with HCM and LA enlargement (LA:Ao >1.8-2.0) or smoke should receive clopidogrel prophylactically."]
},
{
 id:"ivdd", title:"Dachshund suddenly unable to walk", species:"Dog",
 signalment:"5-year-old neutered male Dachshund, 9 kg, slightly overweight.",
 history:"Reluctant to jump and painful when picked up for 2 days; this morning after jumping off the sofa he cried out and his hindlimbs became weak. Over the last 4 hours he has stopped walking altogether. Urinated on himself once. No trauma, no toxins.",
 pe:["Alert; forelimbs normal","Non-ambulatory paraparesis: can move the hindlimbs slightly but cannot bear weight (grade 3/5); conscious proprioception absent in both hindlimbs","Patellar reflexes exaggerated, withdrawal reflexes present; superficial pain absent, DEEP pain present bilaterally (reacts to firm toe-pinch)","Marked pain on palpation of the thoracolumbar spine (T13-L1); kyphosis","Bladder large and difficult to express","Cutaneous trunci reflex cut-off at L1"],
 tests:[
  {name:"Complete neurological examination (localization and grading)", key:true, result:"T3-L3 myelopathy (upper motor neuron signs to the pelvic limbs, intact forelimbs, cutaneous trunci cut-off at L1). Grade 3 (non-ambulatory paraparesis with deep pain present).", note:"Localization and grade drive every decision: deep pain presence is the single most important prognostic factor (>90% recovery with surgery if present)."},
  {name:"MRI of the thoracolumbar spine (or CT if MRI unavailable)", key:true, result:"Extruded, mineralized disc material at T13-L1 compressing the spinal cord by ~60% of the canal diameter, lateralized to the left; mild intramedullary hyperintensity.", note:"Advanced imaging identifies the site and side of extrusion for surgical planning and detects complications (myelomalacia, hemorrhage). CT is faster and adequate for mineralized discs in chondrodystrophic breeds."},
  {name:"Pre-anesthetic blood work (CBC, chemistry, electrolytes)", key:true, result:"All within reference ranges.", note:"Required before general anesthesia and surgery; also rules out metabolic causes of weakness."},
  {name:"Survey spinal radiographs", key:false, result:"Narrowed T13-L1 disc space with a calcified disc in situ at L2-3; no fracture or lysis.", note:"Supports the diagnosis and excludes fractures/discospondylitis, but cannot show spinal cord compression or the exact site of extrusion (narrowed spaces are only ~50-70% accurate). Not a substitute for MRI/CT."},
  {name:"Urinalysis + culture", key:false, result:"No evidence of infection.", note:"Reasonable baseline since bladder retention predisposes to UTI; manage with expression/catheterization."},
  {name:"Thoracic radiographs", key:false, result:"Unremarkable.", note:"Not needed in a young dog without respiratory signs."},
  {name:"CSF analysis", key:false, result:"Mildly increased protein, normal cell count.", note:"Non-specific in disc disease; indicated if MRI suggests inflammatory/infectious myelitis."},
  {name:"Abdominal ultrasound", key:false, result:"Distended bladder, otherwise normal.", note:"Low yield."}
 ],
 testsSummary:"A careful neurological exam (localization + grade, especially deep pain) is the key 'test', followed by advanced imaging (MRI/CT) once the owner commits to surgery, and pre-anesthetic blood work. Radiographs alone are insufficient to plan surgery.",
 ddx:{q:"Diagnosis?", options:[
  {t:"Acute thoracolumbar intervertebral disc extrusion (Hansen type I) at T13-L1 causing a grade 3 T3-L3 myelopathy with deep pain intact", ok:true, fb:"Correct. Chondrodystrophic breed, acute onset after a jump, spinal pain, UMN paraparesis with a cutaneous trunci cut-off and MRI confirmation."},
  {t:"Fibrocartilaginous embolism (FCE)", ok:false, fb:"FCE is typically non-painful, asymmetric and non-progressive after the first hours, more common in large non-chondrodystrophic breeds, and MRI shows an intramedullary lesion without compression."},
  {t:"Discospondylitis", ok:false, fb:"Discospondylitis is usually subacute with fever, systemic illness and radiographic endplate lysis; the acute mechanical onset and extruded disc material argue against it."},
  {t:"Degenerative myelopathy", ok:false, fb:"Degenerative myelopathy is a slowly progressive, non-painful, LMN-then-UMN disease of older large breeds (German Shepherd, Corgi), not an acute painful event."}
 ]},
 tx:{q:"Best treatment plan?", options:[
  {t:"Decompressive hemilaminectomy at T13-L1 within 24-48 h (removing the extruded material), with perioperative analgesia (opioids, gabapentin), bladder management (expression 3-4x daily or catheter), early physiotherapy and 4-6 weeks of restricted activity; NSAIDs once hydrated and not on steroids", ok:true, fb:"Correct. For non-ambulatory dogs with deep pain, surgery gives ~90-95% recovery versus ~50-60% with conservative management, and faster return to walking. Prognosis would drop to ~50-60% if deep pain were lost, and surgery would then be an emergency."},
  {t:"Strict cage rest for 6-8 weeks with NSAIDs and gabapentin, re-evaluating weekly", ok:false, fb:"Conservative management is appropriate for grade 1-2 (ambulatory) dogs or when surgery is impossible; in a non-ambulatory, rapidly progressing dog it carries a higher risk of permanent deficits and of losing deep pain."},
  {t:"High-dose methylprednisolone sodium succinate (30 mg/kg IV) and cage rest", ok:false, fb:"High-dose steroids do not improve neurological outcome in disc extrusion and significantly increase GI ulceration/perforation and infection risk; they are no longer recommended."},
  {t:"Euthanasia because non-ambulatory dogs rarely recover", ok:false, fb:"With deep pain present the prognosis with surgery is excellent; euthanasia is not justified. Even deep-pain-negative dogs recover in about half of cases with prompt surgery."}
 ]},
 pearls:["Grading: 1 pain only; 2 ambulatory paraparesis; 3 non-ambulatory paraparesis; 4 paraplegia with deep pain; 5 paraplegia without deep pain (emergency).","Test deep pain with firm hemostat pressure on the bone of the toe; look for a conscious response (turning, crying), not just withdrawal (a spinal reflex).","Progressive myelomalacia (ascending LMN signs, loss of cutaneous trunci cranially, fever, respiratory failure) occurs in ~10% of deep-pain-negative dogs and is fatal.","Weight control, avoiding jumping, and ramps reduce recurrence; ~15-20% of dogs have a second episode."]
},
