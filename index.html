 e:"Thoracocentesis is both diagnostic and therapeutic; with a bilateral effusion sedate lightly, clip, prepare aseptically and use a butterfly or over-the-needle catheter with a three-way tap. In dyspneic cats, stabilize with oxygen first and avoid restraint-induced decompensation."},
{c:"Emergency", q:"A dog ate a second-generation anticoagulant rodenticide (brodifacoum) 3 days ago and now has epistaxis and a hemothorax. Which clotting test becomes abnormal first, and what is the treatment?",
 o:["Prothrombin time (factor VII has the shortest half-life); vitamin K1 2.5-5 mg/kg/day PO for 4 weeks, plus plasma transfusion if actively bleeding","aPTT only; heparin","Buccal mucosal bleeding time; desmopressin","Platelet count; prednisolone"],
 e:"Anticoagulant rodenticides block vitamin K epoxide reductase; PT prolongs within 36-72 h, then aPTT. Vitamin K1 takes 12-24 h to act, so bleeding patients need fresh frozen plasma or whole blood. Recheck PT 48-72 h after the end of the vitamin K course."},
{c:"Emergency", q:"A dog ate a large amount of onions two days ago and now has pale/icteric mucous membranes and dark urine. Expected blood smear finding?",
 o:["Heinz bodies and eccentrocytes (oxidative hemolytic anemia)","Spherocytes with autoagglutination","Schistocytes","Target cells only"],
 e:"Allium species (onion, garlic, leek) contain thiosulfates that oxidize hemoglobin, forming Heinz bodies and causing intra- and extravascular hemolysis. Treat supportively (fluids, oxygen, transfusion if needed). Grapes/raisins, by contrast, cause acute kidney injury in dogs."},
// ---------- PHARMACOLOGY ----------
{c:"Pharmacology", q:"Which opioid is well absorbed through the oral (buccal) mucosa in cats, making it convenient for outpatient analgesia?",
 o:["Buprenorphine (0.02-0.04 mg/kg OTM q6-8h)","Morphine","Tramadol","Fentanyl tablets"],
 e:"The alkaline feline saliva allows good transmucosal absorption of buprenorphine. Tramadol is bitter and poorly tolerated in cats; morphine is not given OTM; fentanyl is used by patch or injection. Note: tramadol has limited analgesic efficacy in dogs (poor conversion to the active M1 metabolite)."},
{c:"Pharmacology", q:"A cat weighs 4 kg and needs meloxicam at 0.05 mg/kg PO once daily. The oral suspension contains 0.5 mg/mL. What volume should be given?",
 o:["0.4 mL","0.04 mL","4 mL","1 mL"],
 e:"Dose = 0.05 mg/kg x 4 kg = 0.2 mg; volume = 0.2 mg / 0.5 mg/mL = 0.4 mL. In cats, meloxicam is licensed (in the EU) for long-term use at 0.05 mg/kg after a 0.1 mg/kg initial dose, only in well-hydrated animals with normal renal function; robenacoxib is the alternative."},
{c:"Pharmacology", q:"Which adverse effects are characteristic of trimethoprim-sulfonamide combinations in dogs?",
 o:["Keratoconjunctivitis sicca, immune-mediated polyarthritis/hypersensitivity (notably Dobermans), decreased T4 and blood dyscrasias with prolonged use","Retinal degeneration","Cartilage damage","Ototoxicity"],
 e:"Monitor tear production (Schirmer) and thyroid function on long courses; stop at the first sign of fever, joint pain or skin lesions. Retinal toxicity = enrofloxacin in cats; cartilage damage = fluoroquinolones in juveniles; ototoxicity = aminoglycosides."},
{c:"Pharmacology", q:"Which antimicrobial requires gloves and special handling because it can cause idiosyncratic, irreversible aplastic anemia in people?",
 o:["Chloramphenicol","Cefovecin","Clindamycin","Amoxicillin"],
 e:"Chloramphenicol is useful for multidrug-resistant infections (good tissue penetration, including CNS and prostate) but owners and staff must avoid skin contact and inhalation. In cats it can also cause reversible dose-related bone marrow suppression; dose cats at 12.5-20 mg/kg q12h only."},
{c:"Pharmacology", q:"Which emetic is recommended in cats, and why is apomorphine a poor choice in this species?",
 o:["Dexmedetomidine (or xylazine) IM; apomorphine is unreliable in cats because emesis in cats is mediated more by alpha-2 than dopaminergic receptors","Hydrogen peroxide 3% orally; apomorphine is too expensive","Apomorphine works equally well in cats","Ipecac syrup; apomorphine causes blindness in cats"],
 e:"Dexmedetomidine (7-10 ug/kg IM) induces emesis in cats and can be reversed with atipamezole. Hydrogen peroxide causes severe hemorrhagic gastritis in cats and should not be used. In dogs, apomorphine (IV, SC or conjunctival) or ropinirole eye drops are the emetics of choice."},
{c:"Pharmacology", q:"Which anthelmintic is effective against Echinococcus granulosus and other tapeworms (cestodes) in dogs?",
 o:["Praziquantel 5 mg/kg","Pyrantel pamoate","Fenbendazole at the standard 3-day dose","Milbemycin oxime alone"],
 e:"Praziquantel (or epsiprantel) is cestocidal; pyrantel treats roundworms/hookworms; fenbendazole treats Taenia but is unreliable against Echinococcus; milbemycin is for nematodes and heartworm prevention (combination products add praziquantel). Dogs in endemic areas with offal access should be treated every 4-6 weeks."},
{c:"Pharmacology", q:"A fearful cat needs a stress-free clinic visit. Which pre-visit medication is commonly recommended?",
 o:["Gabapentin 50-100 mg per cat PO 1-2 h before the visit (reduce the dose in CKD cats)","Acepromazine 2 mg/kg PO","Diazepam PO daily for a week","Ketamine PO"],
 e:"Oral gabapentin reduces stress and improves handling in cats with minimal adverse effects (transient ataxia/sedation). Oral diazepam has caused fatal hepatic necrosis in cats; acepromazine at that dose is excessive and provides no anxiolysis. Trazodone is an alternative, mostly in dogs."},
// ---------- ZOONOSES & RABIES ----------
{c:"Zoonoses/Rabies", q:"A client wants to move their dog from the UAE to a rabies-free jurisdiction that requires a rabies antibody titer. What is the correct sequence?",
 o:["Microchip first, then rabies vaccination, then a blood sample for the FAVN/RFFIT titer at least 30 days after vaccination (result >=0.5 IU/mL), with the waiting period the destination requires","Titer first, then vaccinate if low","Vaccinate and microchip on the day of travel","The titer can be done before vaccination"],
 e:"Most import rules (EU, UK, Australia, Japan, and the UAE's own MOCCAE import rules for dogs/cats from high-risk countries) demand an ISO microchip implanted BEFORE the rabies vaccine, a primary vaccine at >=12 weeks of age, and a serum neutralization titer >=0.5 IU/mL drawn >=30 days post-vaccination, followed by a waiting period (often 3 months). Always check the destination's current official requirements."},
{c:"Zoonoses/Rabies", q:"Which statement about rabies pathogenesis and clinical disease is correct?",
 o:["The virus travels along peripheral nerves to the CNS; incubation ranges from ~2 weeks to several months depending on bite site and dose, and the disease is virtually always fatal once signs appear","Rabies is transmitted mainly by feces","Only dogs can transmit rabies to humans","Animals recover spontaneously in most cases"],
 e:"Rabies lyssavirus is shed in saliva and transmitted by bites (rarely scratches/mucosal contact). Prodromal, furious (aggression, hyperesthesia) and paralytic (dumb) forms occur; death follows within ~10 days of signs. All mammals are susceptible; in the Gulf region foxes, feral dogs and cats and bats are relevant reservoirs."},
{c:"Zoonoses/Rabies", q:"A breeder asks when to start deworming puppies to prevent Toxocara canis transmission (and zoonotic larva migrans in children). Correct advice?",
 o:["Start at 2 weeks of age and repeat every 2 weeks until 8 weeks (then monthly to 6 months); treat the dam concurrently","Start at 6 months of age","Only if eggs are found on fecal flotation","A single dose at weaning is sufficient"],
 e:"Puppies are infected transplacentally and via milk; patent infections appear by 2-3 weeks of age. Early, repeated anthelmintic treatment (e.g., fenbendazole, pyrantel) reduces egg shedding into the environment, where eggs remain infective for years. Hand hygiene and prompt feces removal protect children."},
{c:"Zoonoses/Rabies", q:"An owner feeds a raw meat diet to their dog. Which zoonotic risk should the veterinarian counsel about?",
 o:["Salmonella (and other enteric pathogens) shedding, including by healthy dogs, posing a risk to children, elderly and immunocompromised household members","Rabies","Dermatophytosis","Heartworm"],
 e:"Raw-fed dogs shed Salmonella, Campylobacter, E. coli and Listeria at higher rates. Counsel on hygiene, avoid raw feeding in households with vulnerable people, and recognize that a dog with diarrhea on raw food is a public-health concern."},
{c:"Zoonoses/Rabies", q:"A veterinary nurse is bitten on the hand by a cat. Which pathogen is the most common isolate from infected cat-bite wounds, and what is the usual empirical antibiotic for the person?",
 o:["Pasteurella multocida; amoxicillin-clavulanate (and prompt medical assessment, tetanus status check and rabies risk evaluation)","Staphylococcus aureus; cephalexin","Bartonella henselae; azithromycin","Clostridium tetani; metronidazole"],
 e:"Cat bites are deep puncture wounds with a high infection rate (up to 50%); Pasteurella predominates, followed by streptococci, staphylococci and anaerobes. Wash immediately, seek medical care within hours, and record the incident; rabies PEP depends on the animal's status and local regulation."},
{c:"Zoonoses/Rabies", q:"Capnocytophaga canimorsus, present in the saliva of healthy dogs, is most dangerous for which people?",
 o:["Asplenic, alcoholic or immunocompromised individuals (fulminant sepsis after a bite or lick on broken skin)","Children under 5 only","Pregnant women only","It is not a human pathogen"],
 e:"C. canimorsus is a commensal in canine oral flora; infections in people are rare but can be fatal in those without a spleen or with impaired immunity. Veterinarians should advise at-risk clients about wound hygiene after bites or licks."},
// ---------- VECTOR-BORNE & HEAT ----------
{c:"Vector-borne/Heat", q:"Which tick is the main vector of Ehrlichia canis, Anaplasma platys, Babesia vogeli and Hepatozoon canis in the Arabian Gulf, and what makes it hard to control?",
 o:["Rhipicephalus sanguineus (brown dog tick); it is endophilic, completing its life cycle inside kennels and homes, with year-round activity in warm climates","Ixodes ricinus; it needs cool humid forests","Dermacentor reticulatus; it is seasonal","Amblyomma americanum; it is only in the Americas"],
 e:"R. sanguineus thrives in hot, dry climates and infests buildings, so control requires both on-animal acaricides (isoxazolines, permethrin/flumethrin products in dogs) and environmental treatment of cracks and kennels."},
{c:"Vector-borne/Heat", q:"A dog has mild, cyclic thrombocytopenia every 1-2 weeks and basophilic inclusions inside platelets on a smear. Most likely agent?",
 o:["Anaplasma platys (infectious cyclic thrombocytopenia); doxycycline 28 days","Ehrlichia canis","Babesia gibsoni","Leishmania infantum"],
 e:"A. platys infects platelets and is transmitted by Rhipicephalus; disease is usually mild unless co-infected with E. canis. Morulae within platelets are diagnostic; PCR confirms. E. canis morulae are in monocytes; Babesia is in erythrocytes; Leishmania in macrophages."},
{c:"Vector-borne/Heat", q:"A cat in a mosquito-rich area has chronic coughing and a bronchial pattern; heartworm antibody is positive and antigen negative. What is the appropriate approach?",
 o:["Consider heartworm-associated respiratory disease (HARD): echocardiography, prednisolone for signs, monthly preventive; do NOT use melarsomine in cats","Melarsomine adulticide protocol as in dogs","Ignore: cats cannot get heartworm","Surgical worm extraction in all cases"],
 e:"Cats are atypical hosts with low worm burdens; antigen tests are often negative, so antibody + imaging are used. Melarsomine is toxic to cats and adult worm death can cause fatal anaphylaxis, so management is supportive, with prevention (selamectin, moxidectin, milbemycin) and steroids for respiratory signs."},
{c:"Vector-borne/Heat", q:"A dog from an endemic region tests negative for Leishmania serology 1 month after arriving in Abu Dhabi. What should the owner be told?",
 o:["Seroconversion can take 3-6 months (or longer); repeat serology in 6 months, and use a deltamethrin/flumethrin repellent collar if the dog travels to or lives in sandfly areas","The dog is definitively free of infection","Leishmania cannot exist in the Middle East","Start allopurinol prophylactically"],
 e:"The incubation of leishmaniosis ranges from months to years; a single negative test shortly after leaving an endemic area is insufficient. Pyrethroid-impregnated collars reduce infection risk by >80%. L. infantum foci exist in the Middle East, and imported cases are common in Gulf practice."},
{c:"Vector-borne/Heat", q:"A Pug presents after a short summer walk with stertor, cyanosis, hyperthermia (41 C) and extreme distress. Besides cooling, what is the key specific intervention?",
 o:["Sedation (e.g., butorphanol +/- low-dose acepromazine or dexmedetomidine), oxygen, and intubation if the airway obstructs - brachycephalic airway crisis","Furosemide 4 mg/kg IV","Antibiotics","Bronchodilators only"],
 e:"In brachycephalic dogs, panting worsens upper airway swelling and obstruction, creating a vicious cycle of hyperthermia. Breaking the cycle with sedation and oxygen (or a temporary tracheostomy if needed), then cooling, is life-saving. Discuss surgical correction of BOAS after recovery."},
{c:"Vector-borne/Heat", q:"A dog that lives near camel farms in the UAE has intermittent fever, anemia, edema and weight loss; a blood smear shows extracellular flagellated protozoa with an undulating membrane. Most likely agent?",
 o:["Trypanosoma evansi (surra), transmitted mechanically by biting flies from camels; treat with diminazene aceturate or melarsomine-type trypanocides","Babesia canis","Leishmania infantum promastigotes","Hepatozoon canis"],
 e:"T. evansi is endemic in dromedaries of the Arabian Peninsula and infects dogs (often severe, with neurological signs); blood smears, PCR or buffy-coat examination are diagnostic. Babesia and Hepatozoon are intracellular; Leishmania appears as intracellular amastigotes in tissues, not as flagellated forms in blood."},
{c:"Vector-borne/Heat", q:"Babesia gibsoni is increasingly reported in Pit Bull-type dogs with no tick exposure. What is the suspected route of transmission in these cases?",
 o:["Direct blood transfer through bite wounds during fighting (and vertical transmission), in addition to tick transmission","Mosquito bites","Ingestion of contaminated water","Aerosol"],
 e:"B. gibsoni (small piroplasm) is transmitted by Haemaphysalis and Rhipicephalus ticks but also directly via bites; treatment is atovaquone + azithromycin for 10 days (imidocarb is less effective). Screen fighting-breed dogs and blood donors by PCR."},
// ---------- CARDIO-RESPIRATORY ----------
{c:"Cardiorespiratory", q:"A 9-year-old asymptomatic Cavalier King Charles Spaniel has a grade IV/VI left apical systolic murmur. Echocardiography shows LA:Ao 1.8 and a normalized LV diameter of 1.9. According to ACVIM guidelines, what is indicated?",
 o:["Start pimobendan (stage B2 myxomatous mitral valve disease; EPIC study showed delayed onset of heart failure)","No treatment until congestive heart failure develops","Furosemide alone","Beta-blocker"],
 e:"Stage B2 = murmur >=3/6 with LA:Ao >=1.6 and LVIDDn >=1.7 (or radiographic VHS >10.5). Pimobendan prolonged the preclinical period by ~15 months in EPIC. Diuretics are reserved for stage C (congestive heart failure)."},
{c:"Cardiorespiratory", q:"A cat presents with sudden, painful hindlimb paralysis, cold pale paw pads and absent femoral pulses. Underlying cause and immediate management?",
 o:["Aortic thromboembolism secondary to cardiomyopathy (usually HCM); analgesia (methadone/fentanyl), clopidogrel +/- heparin, treat concurrent heart failure, no aggressive fluids","Spinal trauma; surgery","Tick paralysis; antitoxin","Hypokalemic myopathy; potassium"],
 e:"ATE causes the 5 Ps: pain, paralysis, pulselessness, pallor, poikilothermia. Echocardiography usually shows an enlarged left atrium with smoke/thrombus. Prognosis is guarded (worse with both limbs, hypothermia, CHF); surgical embolectomy is not recommended. Clopidogrel reduces recurrence (FAT CAT study)."},
{c:"Cardiorespiratory", q:"A dyspneic dog has pulmonary crackles, tachycardia and a thoracic radiograph showing cardiomegaly with a perihilar alveolar pattern. Initial emergency treatment?",
 o:["Oxygen, furosemide 2 mg/kg IV (repeated as needed), pimobendan, minimal handling; avoid IV fluids","IV crystalloid bolus 20 ml/kg","Beta-blocker IV","Thoracocentesis"],
 e:"Acute left-sided congestive heart failure is treated with oxygen, loop diuretics, pimobendan (inodilator), sedation (butorphanol) and, if hypertensive, vasodilators. Fluids worsen edema. Thoracocentesis is for pleural effusion (common in cats with CHF, not for pulmonary edema)."},
{c:"Cardiorespiratory", q:"A young cat has episodic wheezing and coughing; radiographs show a bronchial pattern with hyperinflation and BAL cytology is eosinophilic. Long-term treatment?",
 o:["Inhaled fluticasone via spacer with salbutamol as a rescue bronchodilator (terbutaline in crisis); environmental allergen reduction","Doxycycline for 6 weeks","Furosemide","Enrofloxacin"],
 e:"Feline asthma is an allergic lower airway disease; glucocorticoids are the cornerstone and inhaled delivery minimizes systemic effects. Rule out lungworm (Aelurostrongylus) and heartworm first. Crisis: oxygen, terbutaline 0.01 mg/kg IM/SC, dexamethasone IV."},
{c:"Cardiorespiratory", q:"A cat has a pleural effusion that is opaque and milky; fluid triglycerides are much higher than serum triglycerides. Diagnosis?",
 o:["Chylothorax","Pyothorax","Feline infectious peritonitis effusion","Hemothorax"],
 e:"Chyle has triglycerides higher than serum (and cholesterol lower); causes include cardiomyopathy, neoplasia, trauma and idiopathic. Management: thoracocentesis, low-fat diet, rutin, and surgery (thoracic duct ligation + pericardiectomy) if persistent. Pyothorax is septic (degenerate neutrophils, bacteria); FIP fluid is protein-rich and straw-colored."},
{c:"Cardiorespiratory", q:"A 6-year-old obese Yorkshire Terrier has a chronic 'goose-honk' cough worsened by excitement and collar pressure. Most likely diagnosis and first-line management?",
 o:["Tracheal collapse; weight loss, harness instead of collar, antitussives (e.g., hydrocodone or butorphanol), short courses of anti-inflammatory steroids, treat concurrent airway infection","Kennel cough; doxycycline","Left-sided heart failure; furosemide","Lungworm; fenbendazole"],
 e:"Tracheal collapse is a degenerative cartilage disease of toy breeds; dynamic collapse is seen on fluoroscopy or inspiratory/expiratory radiographs. Medical management works in most; intraluminal stents or extraluminal rings are reserved for refractory cases. Rule out concurrent mitral disease (also common in small breeds)."},
{c:"Cardiorespiratory", q:"A 4-month-old puppy has a continuous 'machinery' murmur loudest at the left heart base with bounding femoral pulses. Diagnosis and treatment?",
 o:["Patent ductus arteriosus; surgical ligation or transcatheter occlusion as early as possible","Ventricular septal defect; pimobendan","Pulmonic stenosis; balloon valvuloplasty","Aortic stenosis; beta-blockers"],
 e:"Left-to-right PDA is the most common congenital heart defect in dogs; untreated, ~65% develop left-sided CHF within a year. Closure before CHF gives a normal life expectancy. Pulmonic stenosis and subaortic stenosis produce systolic basilar murmurs; VSD gives a right-sided systolic murmur."},
// ---------- NEURO / OPHTHO / ORTHO ----------
{c:"Neuro/Ophtho/Ortho", q:"A 12-year-old dog has acute head tilt, horizontal nystagmus with the fast phase away from the tilt, and no proprioceptive deficits. Localization?",
 o:["Peripheral vestibular disease (e.g., idiopathic 'old dog' vestibular syndrome or otitis media/interna)","Central vestibular disease (brainstem)","Cerebellar disease","Forebrain lesion"],
 e:"Peripheral signs: horizontal/rotatory nystagmus that does not change direction, ipsilateral head tilt, normal proprioception and mentation. Central signs: vertical or direction-changing nystagmus, proprioceptive deficits, other cranial nerve deficits, altered consciousness. Idiopathic vestibular disease improves within days with supportive care."},
{c:"Neuro/Ophtho/Ortho", q:"A Dachshund presents with acute non-ambulatory paraparesis that has progressed to absent deep pain perception in the pelvic limbs over 6 hours. Best recommendation?",
 o:["Emergency MRI/CT and decompressive surgery (hemilaminectomy) as soon as possible; success drops sharply after 24-48 h without deep pain","Strict cage rest for 6 weeks","High-dose methylprednisolone and recheck in a week","Acupuncture"],
 e:"Thoracolumbar intervertebral disc extrusion (Hansen type I) is the most common cause. Grade 5 (deep pain negative) is a surgical emergency: ~50-60% recover if decompressed within 24-48 h, far fewer later. Steroids do not improve outcome; monitor for myelomalacia. Grades 1-2 may be managed conservatively."},
{c:"Neuro/Ophtho/Ortho", q:"Which maintenance anticonvulsant is contraindicated in cats because it causes an asthma-like eosinophilic bronchitis?",
 o:["Potassium bromide","Phenobarbital","Levetiracetam","Zonisamide"],
 e:"Bromide causes lower airway disease in 35-40% of cats and should not be used. Phenobarbital is first-line in cats and dogs (monitor levels, liver values); levetiracetam is a safe add-on. Imepitoin is licensed for idiopathic epilepsy in dogs."},
{c:"Neuro/Ophtho/Ortho", q:"A dog has a deep corneal ulcer with a gelatinous, 'melting' edge. Which treatment is absolutely contraindicated?",
 o:["Topical corticosteroids (they inhibit healing and potentiate collagenase, risking perforation)","Topical broad-spectrum antibiotics","Autologous serum eye drops (anti-collagenase)","Atropine for ciliary spasm"],
 e:"Melting (keratomalacia) ulcers are often Pseudomonas or beta-hemolytic Streptococcus infected; treat with frequent antibiotics, serum/EDTA/acetylcysteine (anti-collagenase), atropine and an E-collar, and consider conjunctival graft if >50% depth. Always fluorescein-stain a red or painful eye before ever considering steroids."},
{c:"Neuro/Ophtho/Ortho", q:"A dog presents with an acutely painful, red eye, a dilated unresponsive pupil, corneal edema and an intraocular pressure of 55 mmHg. Emergency treatment?",
 o:["Topical prostaglandin analogue (latanoprost) plus a carbonic anhydrase inhibitor (dorzolamide), +/- IV mannitol, and urgent ophthalmology referral","Topical atropine","Topical corticosteroids only","Warm compresses"],
 e:"Acute primary glaucoma (IOP >25-30 mmHg) causes irreversible retinal damage within hours. Latanoprost lowers IOP rapidly (contraindicated in uveitis/anterior lens luxation); atropine raises IOP and is contraindicated. Breeds: Cocker Spaniel, Basset, Shar-Pei, Husky."},
{c:"Neuro/Ophtho/Ortho", q:"A 5-year-old Labrador has chronic hindlimb lameness; sitting with the limb abducted, positive cranial drawer and tibial compression (thrust) test. Diagnosis and most commonly recommended treatment in medium/large dogs?",
 o:["Cranial cruciate ligament rupture; tibial plateau leveling osteotomy (TPLO) or similar osteotomy, with meniscal inspection","Hip dysplasia; total hip replacement","Patellar luxation; trochleoplasty","Panosteitis; NSAIDs and rest"],
 e:"CCL disease is the most common orthopedic cause of hindlimb lameness in dogs; ~50% rupture the contralateral ligament within 1-2 years. Osteotomies (TPLO, TTA) have the best outcomes in large dogs; extracapsular suture is acceptable in small dogs. Check for meniscal tears (click)."},
{c:"Neuro/Ophtho/Ortho", q:"A 7-month-old German Shepherd has shifting-leg lameness and pain on firm palpation of the diaphyses of long bones; radiographs show patchy medullary opacities. Diagnosis?",
 o:["Panosteitis (self-limiting; NSAIDs and rest)","Osteosarcoma","Hypertrophic osteodystrophy","Septic arthritis"],
 e:"Panosteitis affects young, large-breed dogs (5-18 months) with intramedullary radiographic changes and resolves spontaneously by 2 years. HOD affects metaphyses with a 'double physis' line and fever; osteosarcoma affects older dogs at the metaphyses ('away from the elbow, toward the knee')."},
{c:"Neuro/Ophtho/Ortho", q:"A cat has miosis, ptosis, enophthalmos and third-eyelid protrusion on one side. Which is the most common underlying cause in cats?",
 o:["Horner's syndrome from otitis media/interna (middle-ear disease) or trauma to the sympathetic pathway","Glaucoma","Uveitis","Retinal detachment"],
 e:"Horner's syndrome is a sympathetic denervation of the eye; in cats, middle ear disease (otitis media, polyps), brachial plexus avulsion and idiopathic causes predominate. Localize with phenylephrine testing; examine the ear canal and bulla (radiographs/CT)."},
{c:"Neuro/Ophtho/Ortho", q:"A 4-month-old Labrador puppy shows a 'bunny-hopping' gait and a positive Ortolani sign on examination. Most likely diagnosis?",
 o:["Hip dysplasia with coxofemoral laxity","Legg-Calve-Perthes disease","Osteochondritis dissecans of the shoulder","Patellar luxation"],
 e:"A positive Ortolani sign indicates hip subluxation/laxity typical of dysplasia in large breeds. PennHIP or distraction radiographs quantify laxity; juvenile pubic symphysiodesis (<20 weeks) or double/triple pelvic osteotomy are options before arthritis; weight control and NSAIDs for conservative management. Legg-Calve-Perthes affects toy breeds (avascular necrosis of the femoral head)."}
);
// ===== QUIZ DATA - BLOCK 3 =====
QUIZ.push(
// ---------- GI ----------
{c:"GI", q:"A 5-year-old Miniature Schnauzer presents with peracute hemorrhagic diarrhea, vomiting and a PCV of 68% with total protein 6.0 g/dL; she is bright and not febrile. Most appropriate management?",
 o:["IV fluid resuscitation and supportive care without antibiotics (acute hemorrhagic diarrhea syndrome); antibiotics only if signs of sepsis appear","Amoxicillin-clavulanate for 7 days in every case","Prednisolone","Exploratory laparotomy"],
 e:"AHDS (formerly HGE) shows marked hemoconcentration with a relatively low total protein; most dogs recover in 2-3 days with fluids. A randomized trial showed no benefit from amoxicillin-clavulanate in dogs without signs of sepsis (fever, left shift, hypotension). Clostridium perfringens netF toxin is implicated."},
{c:"GI", q:"A 6-month-old Yorkshire Terrier shows dullness and circling after meals, is small for its age, and has ammonium biurate crystals in urine, BUN 4 mg/dL and markedly elevated post-prandial bile acids. Diagnosis and initial treatment?",
 o:["Congenital portosystemic shunt; lactulose, a moderately protein-restricted diet, and antibiotics (amoxicillin or metronidazole) to control hepatic encephalopathy, then surgical attenuation (ameroid constrictor) if extrahepatic","Idiopathic epilepsy; phenobarbital","Hydrocephalus; prednisolone","Hypoglycemia of toy breeds; frequent meals only"],
 e:"PSS causes post-prandial hepatic encephalopathy, low BUN/albumin/cholesterol, microcytosis and urate crystals. Bile acid stimulation is the screening test; CT angiography defines the anatomy. Surgical attenuation gives the best long-term outcome in extrahepatic shunts; intrahepatic shunts in large breeds may need interventional coiling."},
{c:"GI", q:"An 8-year-old obese cat has recurrent obstipation; radiographs show a markedly dilated colon packed with feces without an obstructing mass. Long-term management?",
 o:["Idiopathic megacolon: deobstipation under anesthesia, then lactulose + cisapride, a low-residue or psyllium-supplemented diet, increased water; subtotal colectomy if refractory","Repeated enemas with sodium phosphate (Fleet)","Metoclopramide alone","Long-term loperamide"],
 e:"Cisapride is the most effective colonic prokinetic in cats (metoclopramide acts on the upper GI tract). Sodium phosphate enemas cause fatal hyperphosphatemia/hypocalcemia in cats. Rule out pelvic canal narrowing (old fractures) and Manx sacral anomalies. Subtotal colectomy has a good outcome."},
{c:"GI", q:"A terrier swallowed a piece of bone 6 hours ago and is now gagging, hypersalivating and regurgitating. Radiographs show the bone lodged at the thoracic inlet. Best approach?",
 o:["Prompt endoscopic retrieval (or gentle advancement into the stomach if retrieval is impossible), then assess the mucosa and treat esophagitis; thoracic radiographs to check for perforation/pneumomediastinum","Wait 48 h for it to pass","Induce emesis with apomorphine","Oral barium to lubricate the bone"],
 e:"Esophageal foreign bodies lodge at the thoracic inlet, heart base or hiatus; delay increases pressure necrosis, stricture and perforation risk. Emesis can worsen injury. After removal, give sucralfate, omeprazole, and watch for stricture (recurrent regurgitation 1-3 weeks later) which is treated by balloon dilation."},
{c:"GI", q:"Fecal antigen test is positive for Giardia in a puppy with soft stools. Which treatment protocol is appropriate?",
 o:["Fenbendazole 50 mg/kg PO q24h for 3-5 days (or metronidazole), bathing the puppy to remove cysts from the coat and cleaning the environment; retest only if signs persist","Praziquantel single dose","Ivermectin","Antibiotics are never needed; Giardia is a commensal"],
 e:"Fenbendazole is the first choice (safer than metronidazole in young animals). Cysts on the coat cause reinfection, hence bathing. Treatment of asymptomatic positives is debated; retesting healthy puppies is not recommended because antigen can remain positive. Most canine assemblages (C, D) are host-adapted with low zoonotic potential."},
{c:"GI", q:"A German Shepherd has chronic painful perianal ulcerated tracts with tenesmus and a foul odor. Best medical treatment?",
 o:["Perianal fistulas (anal furunculosis): ciclosporin (+/- ketoconazole to reduce dose) or topical tacrolimus, a novel-protein diet, and treatment of secondary infection","Repeated surgical excision as first line","Enrofloxacin alone for 8 weeks","Prednisolone 4 mg/kg"],
 e:"Anal furunculosis is immune-mediated, strongly breed-associated and responds to calcineurin inhibitors in ~85% of dogs; many have concurrent colitis/food sensitivity. Surgery is reserved for residual tracts and causes fecal incontinence if extensive."},
// ---------- DERMATOLOGY ----------
{c:"Dermatology", q:"A kitten has pruritic ears with dark, dry, 'coffee-ground' debris; microscopy of the debris shows mobile white mites. Treatment?",
 o:["Otodectes cynotis: clean the ears, apply a licensed acaricide (selamectin, moxidectin spot-on or an isoxazoline), and treat ALL in-contact cats and dogs","Oral amoxicillin for 10 days","Topical corticosteroids alone","Nothing; it resolves spontaneously"],
 e:"Ear mites are highly contagious and cause ~50% of otitis in kittens; secondary bacterial/yeast otitis is common and may need topical therapy. Mites also live on the body, so systemic/spot-on products are preferred over ear drops alone."},
{c:"Dermatology", q:"A cat has symmetrical ventral abdominal alopecia with no visible skin lesions. Trichogram shows hair shafts with broken, fractured tips. Interpretation and first step?",
 o:["Self-induced (barbering) alopecia; pursue allergy work-up (flea control, elimination diet) and pain/pruritus causes BEFORE labeling it 'psychogenic'","Endocrine alopecia; test T4","Dermatophytosis; start itraconazole","Telogen effluvium; no action"],
 e:"Broken hair tips prove the cat is licking the hair off (allergic pruritus, flea allergy, pain such as cystitis). True psychogenic alopecia is a diagnosis of exclusion and much rarer than previously thought. Endocrine alopecia shows epilation of intact telogen hairs."},
{c:"Dermatology", q:"A middle-aged dog has pustules and thick crusts on the nasal planum, pinnae and footpads; cytology from a pustule shows non-degenerate neutrophils and rounded, detached keratinocytes (acantholytic cells) without bacteria. Diagnosis and treatment?",
 o:["Pemphigus foliaceus; confirm by biopsy and treat with immunosuppressive prednisolone (2 mg/kg/day) +/- azathioprine or ciclosporin","Superficial pyoderma; cephalexin","Dermatophytosis; terbinafine","Zinc-responsive dermatosis; zinc supplementation"],
 e:"Pemphigus foliaceus is the most common autoimmune skin disease of dogs and cats; acantholytic keratinocytes on cytology are highly suggestive (histopathology confirms). Rule out drug triggers; treat secondary infection before immunosuppression. Zinc-responsive dermatosis affects Nordic breeds with crusting around mucocutaneous junctions."},
{c:"Dermatology", q:"A 7-year-old Labrador has slowly progressive, bilaterally symmetric, non-pruritic truncal alopecia with hyperpigmentation and a dull coat. Which first-line screening is most appropriate?",
 o:["Total T4 with TSH, serum biochemistry (ALP, cholesterol) and urinalysis to screen for hypothyroidism and hyperadrenocorticism","Skin biopsy as the first step","Intradermal allergy testing","Elimination diet"],
 e:"Non-pruritic symmetric alopecia is the hallmark of endocrine dermatoses. Hypothyroidism (low T4, high TSH, hypercholesterolemia) and Cushing's (high ALP, dilute urine, PU/PD) are the main causes; alopecia X (Pomeranians) and sex-hormone imbalances are considered after. Biopsy helps when endocrine tests are normal."},
{c:"Dermatology", q:"A Collie has depigmentation, erosions and crusting of the nasal planum that worsens in summer; biopsy shows lichenoid interface dermatitis. Diagnosis and treatment?",
 o:["Discoid (cutaneous) lupus erythematosus; sun avoidance/sunscreen, topical tacrolimus or steroids, oral tetracycline-niacinamide or low-dose immunosuppression","Mucocutaneous pyoderma; antibiotics only","Nasal aspergillosis; clotrimazole","Pemphigus vulgaris; chlorambucil"],
 e:"DLE is a photo-aggravated immune-mediated disease of the nasal planum in Collies, Shelties and GSDs; it is benign but disfiguring. Rule out mucocutaneous pyoderma (responds to antibiotics) first. Sun protection is essential in the UAE climate."},
// ---------- RENAL / UROLOGY ----------
{c:"Renal/Urinary", q:"According to ISCAID guidelines, what is the recommended management of a first episode of sporadic bacterial cystitis in an otherwise healthy bitch?",
 o:["Urinalysis + culture by cystocentesis; amoxicillin or trimethoprim-sulfonamide for 3-5 days (short course), with NSAIDs for dysuria if appropriate","Enrofloxacin for 14 days","Cefovecin injection without culture","Prophylactic antibiotics for 6 months"],
 e:"Sporadic cystitis is treated with short courses of first-line drugs; fluoroquinolones and third-generation cephalosporins are reserved for culture-documented resistance or pyelonephritis/prostatitis. Recurrent cystitis (>=3 episodes/year) requires a search for predisposing causes (stones, incontinence, Cushing's, diabetes, anatomy)."},
{c:"Renal/Urinary", q:"A dog has fever, lumbar pain, azotemia, pyuria and renal pelvic dilation on ultrasound. Most appropriate treatment?",
 o:["Pyelonephritis: fluoroquinolone (or amoxicillin-clavulanate/cefpodoxime based on culture) for 10-14 days plus IV fluids; reculture 1 week after finishing","Amoxicillin for 3 days","Furosemide to flush the kidneys","Nephrectomy"],
 e:"Upper urinary tract infection requires drugs reaching high renal tissue concentrations (fluoroquinolones excreted in urine; amoxicillin-clavulanate is acceptable). Duration has been shortened to 10-14 days in recent guidelines. Check for ureteral obstruction (pyonephrosis) as a surgical emergency."},
{c:"Renal/Urinary", q:"A cat with IRIS stage 3 CKD has a serum phosphorus of 7.2 mg/dL after 8 weeks on a renal diet. Next step?",
 o:["Add an intestinal phosphate binder (e.g., lanthanum carbonate, aluminum hydroxide or calcium-based binders) with meals, aiming for phosphorus <5.0 mg/dL in stage 3","Increase the dietary protein","Give calcitriol immediately","Furosemide"],
 e:"IRIS phosphorus targets: stage 2 <4.6, stage 3 <5.0, stage 4 <6.0 mg/dL. Diet first, then binders. Calcitriol is considered only once phosphorus is controlled and ionized calcium is normal (risk of calcification). Hyperphosphatemia drives renal secondary hyperparathyroidism and progression."},
{c:"Renal/Urinary", q:"A Dalmatian has recurrent radiolucent cystic calculi. Composition and management?",
 o:["Urate (ammonium urate) uroliths from an SLC2A9 mutation causing hyperuricosuria; low-purine diet, urine alkalinization (pH ~7) and allopurinol, with surgical removal if obstructive","Struvite; antibiotics and dissolution diet","Calcium oxalate; thiazide diuretics","Cystine; surgical removal only"],
 e:"Dalmatians (and dogs with portosystemic shunts) form urate stones, which are radiolucent and need ultrasound or contrast to detect. Dissolution is possible with diet + allopurinol in dogs without shunts; male Dalmatians obstruct easily, so scrotal urethrostomy is sometimes performed."},
{c:"Renal/Urinary", q:"A 12-year-old asymptomatic dog with no lower urinary tract signs has a routine urine culture growing 10^5 CFU/mL of E. coli from a cystocentesis sample. Appropriate action?",
 o:["Subclinical bacteriuria: do NOT treat with antibiotics in the absence of clinical signs (exceptions: immunosuppressed or before urinary tract surgery)","Treat with amoxicillin-clavulanate for 14 days","Enrofloxacin for 4 weeks","Cystotomy"],
 e:"ISCAID guidelines advise against treating asymptomatic bacteriuria; it is common in older dogs and cats and treatment does not improve outcomes but drives resistance. Treat only when signs appear or in specific high-risk situations."},
{c:"Renal/Urinary", q:"A cat with CKD develops a progressive non-regenerative anemia (HCT 17%) with normal iron status. Which treatment is most effective?",
 o:["Darbepoetin alfa SC once weekly until target HCT, then every 2-3 weeks, with iron supplementation and monitoring of blood pressure/HCT","Repeated blood transfusions as sole therapy","Anabolic steroids (nandrolone)","Vitamin B12 only"],
 e:"Anemia of CKD is due to erythropoietin deficiency (plus shortened RBC survival and GI blood loss). Darbepoetin produces less anti-erythropoietin antibody formation than recombinant human EPO; monitor for hypertension and pure red cell aplasia. Transfusions are for acute crises only."},
// ---------- ENDOCRINE ----------
{c:"Endocrine", q:"Two days after bilateral thyroidectomy a cat develops facial twitching, muscle tremors and a total calcium of 6.1 mg/dL. Treatment?",
 o:["Iatrogenic hypoparathyroidism: slow IV calcium gluconate for signs, then oral calcium carbonate plus calcitriol (active vitamin D) with calcium monitoring","Oral vitamin D3 (cholecalciferol) only","Furosemide","Bisphosphonates"],
 e:"Hypocalcemia from parathyroid damage occurs 1-7 days post-thyroidectomy; calcitriol is required because PTH is needed to activate vitamin D. Many cats recover parathyroid function within weeks to months, so taper under monitoring. Preserving at least one external parathyroid gland prevents this."},
{c:"Endocrine", q:"A diabetic dog on lente insulin 0.5 U/kg q12h is doing well, but a continuous glucose monitor shows a nadir of 45 mg/dL at 4 h post-injection followed by glucose >400 mg/dL before the next dose. Correct interpretation and action?",
 o:["Insulin-induced hypoglycemia with rebound hyperglycemia (Somogyi effect); REDUCE the insulin dose by 25-50%","Insulin underdosing; increase the dose by 25%","Insulin resistance; change to glargine","The insulin has expired"],
 e:"Chasing the pre-insulin hyperglycemia by increasing the dose would be dangerous. Always interpret glucose curves by the nadir: if <80 mg/dL reduce the dose. Continuous glucose monitors (e.g., flash sensors) make these patterns easy to detect at home."},
{c:"Endocrine", q:"A 12-year-old dog has episodic collapse, panting, tachycardia and systolic blood pressure of 240 mmHg; ultrasound shows a 3 cm adrenal mass invading the caudal vena cava. Which test and pre-operative treatment are most appropriate?",
 o:["Plasma/urine metanephrines and normetanephrines for pheochromocytoma; phenoxybenzamine (alpha-blockade) for 1-2 weeks before adrenalectomy","LDDST; trilostane before surgery","ACTH stimulation; mitotane","Insulin:glucose ratio; diazoxide"],
 e:"Pheochromocytomas secrete catecholamines causing episodic hypertension and arrhythmias; alpha-blockade (then beta-blockade if tachycardic) before surgery markedly reduces anesthetic mortality. Vena cava invasion is common with pheochromocytoma and adrenocortical carcinoma; avoid fine-needle aspiration (hypertensive crisis)."},
{c:"Endocrine", q:"A young dog has severe PU/PD with a urine specific gravity of 1.003 that fails to rise during a carefully monitored water-deprivation test, then concentrates to 1.025 after desmopressin. Diagnosis?",
 o:["Central diabetes insipidus; treat with desmopressin (conjunctival or oral)","Nephrogenic diabetes insipidus","Psychogenic polydipsia","Hyperadrenocorticism"],
 e:"Failure to concentrate on water deprivation excludes psychogenic polydipsia (which concentrates); response to DDAVP distinguishes central (ADH-deficient) from nephrogenic DI (no response). Always rule out other causes of PU/PD (Cushing's, pyometra, hypercalcemia, renal disease, liver disease) before water deprivation, which is dangerous if done carelessly."},
{c:"Endocrine", q:"A 13-year-old cat has cervical ventroflexion, hindlimb weakness, systolic BP 210 mmHg, potassium 2.5 mmol/L, CK 2,000 U/L and a unilateral adrenal mass. Most likely diagnosis?",
 o:["Primary hyperaldosteronism (Conn's syndrome); confirm with high plasma aldosterone, treat with adrenalectomy or spironolactone + amlodipine + potassium","Hyperthyroidism","Chronic kidney disease","Hypokalemic periodic paralysis of Burmese cats"],
 e:"Hyperaldosteronism is the most common adrenal disease of older cats and is underdiagnosed; hypokalemic myopathy plus hypertension with retinal lesions is the typical presentation. Adrenalectomy is curative for unilateral adenomas; medical therapy is palliative."},
{c:"Endocrine", q:"A 10-year-old Poodle develops bilateral cataracts 4 months after diabetes mellitus was diagnosed. What should the owner be told?",
 o:["Diabetic cataracts are extremely common in dogs (up to 80% within 16 months, from sorbitol accumulation in the lens) and can progress rapidly; phacoemulsification restores vision if the retina is functional","Cataracts mean the diabetes is poorly controlled and will reverse with better regulation","They are unrelated to diabetes","Cats develop cataracts equally often"],
 e:"Aldose reductase converts glucose to sorbitol, which draws water into the lens; this is independent of glycemic control and is rare in cats (low lens aldose reductase activity). Lens-induced uveitis must be controlled before surgery; secondary glaucoma is a risk if cataracts are left to mature."},
// ---------- INFECTIOUS ----------
{c:"Infectious", q:"A 1-year-old cat is diagnosed with effusive FIP. The owner asks about the current treatment of choice and expected outcome.",
 o:["Oral nucleoside analogue antiviral (GS-441524, or remdesivir IV initially, or molnupiravir) for 84 days; >85% of cats achieve sustained remission","Prednisolone and interferon; survival is a few weeks","Doxycycline; 50% survive","No treatment exists; euthanasia is the only option"],
 e:"Since 2019-2021, GS-441524-class antivirals have transformed FIP from a fatal disease to a treatable one, with remission rates of 85-95% in effusive, non-effusive and even neurological/ocular forms (higher doses). Legal availability varies by country (licensed formulations exist in the UK and Australia; others use compounded forms)."},
{c:"Infectious", q:"Which Bordetella bronchiseptica vaccine route provides the fastest onset of protection for a dog going to a boarding kennel in 4 days?",
 o:["Intranasal (or oral) modified-live vaccine; mucosal IgA protection within ~72 h and a single dose","Parenteral killed vaccine; two doses 3 weeks apart","Any route; onset is identical","Vaccination is useless for Bordetella"],
 e:"Mucosal vaccines produce local immunity quickly and do not require boosters for the primary course; parenteral vaccines need two doses and take longer. Combine with parainfluenza (and consider CAV-2) for CIRDC coverage; vaccination reduces severity rather than preventing infection completely."},
{c:"Infectious", q:"A healthy 6-month-old kitten tests FeLV antigen positive on a point-of-care test. Correct next step?",
 o:["Confirm with a second test (PCR for proviral DNA or repeat antigen test in 4-6 weeks) to distinguish progressive from regressive/transient infection, and keep the kitten indoors away from other cats meanwhile","Euthanasia immediately","Vaccinate against FeLV to clear the virus","Ignore the result; kittens cannot be infected"],
 e:"Many young cats clear or contain the infection (regressive: antigen negative, provirus positive). Persistent antigenemia after 16 weeks indicates progressive infection (median survival ~2-3 years with lymphoma, anemia, immunosuppression). Vaccinating an infected cat has no benefit; test before vaccinating."},
{c:"Infectious", q:"A 4-year-old Labrador has chronic unilateral mucopurulent nasal discharge with epistaxis, depigmentation and ulceration of the nasal planum; CT shows turbinate destruction without a mass. Most likely diagnosis and treatment?",
 o:["Sino-nasal aspergillosis (Aspergillus fumigatus); debridement of fungal plaques and topical clotrimazole or enilconazole infusion, +/- oral itraconazole","Nasal adenocarcinoma; radiotherapy","Lymphoplasmacytic rhinitis; prednisolone","Foreign body; rhinoscopic removal only"],
 e:"Nasal planum depigmentation with turbinate lysis in a dolichocephalic dog is classic for aspergillosis; rhinoscopy shows white-green plaques, culture/serology support it. Topical azoles after debridement cure ~85%. Neoplasia causes a mass with facial deformity in older dogs; rhinitis is usually bilateral without destruction."},
{c:"Infectious", q:"A cat with uveitis, fever and dyspnea has a rising Toxoplasma gondii IgM/IgG titer and interstitial lung pattern. Treatment of choice?",
 o:["Clindamycin 12.5 mg/kg PO q12h for 4 weeks (or trimethoprim-sulfonamide), with topical anti-inflammatories for the uveitis","Praziquantel","Fenbendazole","Doxycycline"],
 e:"Clinical toxoplasmosis is uncommon but affects immunosuppressed or young cats (pneumonia, hepatitis, uveitis, CNS). Clindamycin is the standard; oocyst shedding has usually ended by the time of clinical disease, so the zoonotic risk from the sick cat itself is low."},
{c:"Infectious", q:"Several 2-week-old puppies in a litter become weak, cry, stop nursing and die within 24 h; necropsy shows multifocal renal and hepatic hemorrhages. The breeder asks how to protect the remaining pups.",
 o:["Canine herpesvirus: keep the puppies warm (environmental 32-35 C / rectal >37.5 C) because the virus replicates poorly above 36 C; hyperimmune serum from recovered bitches may help","Amoxicillin for the litter","Fenbendazole","There is nothing to do"],
 e:"CHV-1 causes 'fading puppy' deaths in the first 3 weeks, typically in litters of naive bitches; warming is the key intervention, and future litters are protected by maternal immunity or (where available) a bitch vaccine given during pregnancy. Antivirals have limited efficacy."},
// ---------- REPRODUCTIVE ----------
{c:"Reproductive", q:"Eight weeks after estrus an unmated bitch shows nesting, mammary enlargement with milk and carries toys. Owner wants treatment. Drug of choice?",
 o:["Cabergoline (dopamine agonist, 5 ug/kg PO q24h for 5-7 days); avoid milking/stimulating the glands; recommend spaying after the signs resolve","Oxytocin","Progestogens (medroxyprogesterone)","Antibiotics"],
 e:"Pseudopregnancy results from the prolactin rise as progesterone falls at the end of diestrus. Cabergoline suppresses prolactin with few side effects (vomiting). Progestogens are contraindicated (pyometra, mammary tumors). Spaying during overt pseudopregnancy can prolong it; wait until it resolves."},
{c:"Reproductive", q:"A cat spayed 2 years ago shows typical estrus behavior (vocalizing, lordosis). Which test confirms ovarian remnant syndrome?",
 o:["Anti-Mullerian hormone (AMH) or a progesterone measurement after inducing ovulation (hCG/GnRH stimulation); treat by exploratory laparotomy to remove the remnant","Vaginal cytology alone during anestrus","Urine specific gravity","Total T4"],
 e:"AMH is produced by granulosa cells and is undetectable in fully spayed animals, making it a convenient single test. Remnants usually lie at the ovarian pedicle; they must be removed because they predispose to pyometra of the uterine stump and mammary tumors."},
{c:"Reproductive", q:"Why is colostrum intake within the first 12-24 hours of life critical for puppies and kittens?",
 o:["Intestinal absorption of maternal IgG closes after ~24 h; without passive transfer the neonate has little protection until its own immunity develops","Colostrum is the only source of water","It prevents hypothermia","Milk after 24 h contains no nutrients"],
 e:"Dogs and cats have an endotheliochorial placenta, so >90% of maternal antibodies come via colostrum. Orphans or neonates with failure of passive transfer can receive serum from a healthy adult (SC or oral within 24 h) and need strict hygiene and early vaccination plans."},
{c:"Reproductive", q:"A bitch in labor has had weak, infrequent contractions for 3 hours with one puppy already delivered; a radiograph shows two normally sized fetuses and no malposition; the cervix is dilated. Appropriate treatment?",
 o:["Low-dose oxytocin (0.5-2 IU per dog IM/SC, repeatable every 30 min up to 2-3 times) after calcium gluconate if ionized calcium is low; cesarean section if no response","High-dose oxytocin 20 IU IV bolus","Immediate cesarean without trying medical management","Prostaglandin F2-alpha"],
 e:"Secondary uterine inertia with no obstruction can be treated medically. High oxytocin doses cause tetanic uterine contractions that reduce placental blood flow and can rupture the uterus. Obstruction, fetal distress (heart rate <180 bpm) or failure of medical therapy indicate cesarean section."},
{c:"Reproductive", q:"An owner asks why their unmated indoor queen keeps coming into heat every 2-3 weeks during spring and summer. Explanation?",
 o:["Cats are seasonally polyestrous induced ovulators: without mating (or another ovulation stimulus) no corpus luteum forms, so estrus recurs until the days shorten; spaying is the solution","She has a hormone-producing ovarian tumor","She is pregnant","She has pyometra"],
 e:"Feline ovulation is triggered by coital stimulation (vaginal stimulation, sometimes spontaneous). Long photoperiod drives cyclicity, which is why indoor cats under artificial light may cycle all year. Repeated unmated cycles predispose to cystic endometrial hyperplasia; progestogens for suppression are not recommended."},
// ---------- EMERGENCY / TOXICOLOGY ----------
{c:"Emergency", q:"A dog ingested a rodenticide and the label shows bromethalin. The owner is told there is no antidote. What is the mechanism and the key early intervention?",
 o:["Uncoupling of oxidative phosphorylation causing cerebral edema (tremors, paresis, seizures); early decontamination with repeated doses of activated charcoal (enterohepatic recirculation) and supportive care","Vitamin K antagonism; vitamin K1","Cholecalciferol hypercalcemia; bisphosphonates","Zinc phosphide; antacids"],
 e:"Bromethalin and cholecalciferol baits are replacing anticoagulants in many markets, so always identify the active ingredient. Bromethalin signs appear 24 h to days later; mannitol and anticonvulsants are palliative. Cholecalciferol causes hypercalcemia/hyperphosphatemia and renal mineralization."},
{c:"Emergency", q:"A dog that ate slug/snail bait 2 hours ago presents with severe muscle tremors, hyperesthesia and a temperature of 41.5 C. Toxin and treatment?",
 o:["Metaldehyde; methocarbamol or diazepam/propofol for tremors, active cooling, IV fluids, gastric lavage under anesthesia (emesis is unsafe in a tremoring dog) and activated charcoal","Organophosphate; atropine","Chocolate; beta-blockers","Permethrin; ivermectin"],
 e:"Metaldehyde causes 'shake and bake': tremors/seizures with secondary hyperthermia, acidosis and possible hepatic injury days later. There is no antidote; survival is good with early intensive care. Organophosphates would show SLUDGE signs (salivation, miosis, bradycardia) and are treated with atropine +/- pralidoxime."},
{c:"Emergency", q:"A cat presents with open-mouth breathing and a respiratory rate of 70. What is the correct initial approach?",
 o:["Oxygen (cage or flow-by) with minimal handling first; brief thoracic point-of-care ultrasound/auscultation once calmer; butorphanol for sedation; empirical furosemide or thoracocentesis based on findings; radiographs only when stable","Immediately restrain for full radiographs and blood work","IV fluid bolus","Oral bronchodilators and send home"],
 e:"Dyspneic cats decompensate and die with stress; the 'hands-off' rule applies. Differentiate pleural effusion (muffled ventral sounds, POCUS fluid: thoracocentesis), pulmonary edema (crackles, B-lines, gallop: furosemide), asthma (expiratory effort, wheezes: terbutaline/steroid) and upper airway obstruction (stridor). NT-proBNP helps triage cardiac causes."},
{c:"Emergency", q:"A 10-year-old German Shepherd collapses with pale mucous membranes, a distended abdomen and a positive abdominocentesis for non-clotting blood (PCV of fluid similar to peripheral PCV). Most likely cause and plan?",
 o:["Hemoabdomen from a ruptured splenic mass (hemangiosarcoma is most likely); stabilize with fluids +/- transfusion, thoracic radiographs/abdominal ultrasound for staging, then splenectomy; histopathology determines prognosis","Pancreatitis; fluids only","Uroabdomen; urinary catheter","Anticoagulant rodenticide; vitamin K1 only"],
 e:"Spontaneous hemoabdomen in older large-breed dogs is neoplastic in ~80% (hemangiosarcoma ~2/3, with a median survival of 1-3 months with surgery alone, ~6 months with doxorubicin). Benign hematomas account for the rest, so surgery is still justified if staging is clean. Check coagulation to exclude rodenticide."},
{c:"Emergency", q:"A dog hit by a car is stuporous with anisocoria and a systolic BP of 80 mmHg. Which management principle is most important for traumatic brain injury?",
 o:["Avoid hypotension and hypoxemia: fluid resuscitation to normotension (hypertonic saline is useful), oxygen, head elevated 15-30 degrees without jugular compression, mannitol for signs of raised intracranial pressure; no corticosteroids","Restrict fluids to prevent cerebral edema","Methylprednisolone 30 mg/kg IV","Place the head below the body to improve cerebral blood flow"],
 e:"Cerebral perfusion pressure = MAP - ICP, so hypotension is the most damaging secondary insult. Steroids worsen outcomes (CRASH trial, extrapolated). Monitor the modified Glasgow coma scale; a Cushing reflex (hypertension + bradycardia) signals critical ICP."},
{c:"Emergency", q:"What is the appropriate dose and use of 7.2-7.5% hypertonic saline in a 40 kg dog in hemorrhagic shock?",
 o:["4 ml/kg (~160 ml) IV over 5-10 minutes to rapidly expand intravascular volume with a small volume, followed by isotonic crystalloids; avoid in dehydrated or hypernatremic patients","20 ml/kg as a fast bolus","1 ml/kg SC","Use as the sole maintenance fluid for 24 h"],
 e:"Hypertonic saline draws interstitial fluid into the vessels (small-volume resuscitation), useful in large dogs, head trauma and GDV; its effect lasts ~30-60 min, so it must be followed by isotonic fluids. Rapid infusion causes bradycardia and hypotension."},
// ---------- PHARMACOLOGY ----------
{c:"Pharmacology", q:"A dog sedated with dexmedetomidine becomes profoundly bradycardic and the procedure is finished. Which drug reverses the sedation?",
 o:["Atipamezole IM (an alpha-2 antagonist), at a volume equal to the dexmedetomidine volume given","Naloxone","Flumazenil","Atropine as the reversal agent"],
 e:"Atipamezole reverses alpha-2 agonists within 5-10 minutes. Atropine is NOT recommended to treat alpha-2-induced bradycardia (it causes severe hypertension and arrhythmias); the bradycardia is a baroreceptor response to vasoconstriction. Naloxone reverses opioids, flumazenil benzodiazepines."},
{c:"Pharmacology", q:"Which local anesthetic must never be injected intravenously because of its cardiotoxicity, and what is the maximum safe dose of lidocaine in cats?",
 o:["Bupivacaine must never be given IV; lidocaine in cats should not exceed ~2-4 mg/kg total (dogs tolerate ~6-8 mg/kg)","Lidocaine must never be given IV; bupivacaine is safe at any dose","Both can be given IV freely","Procaine; 50 mg/kg"],
 e:"Bupivacaine binds cardiac sodium channels strongly and causes refractory arrhythmias/arrest if given IV; intravenous lipid emulsion is the rescue therapy. Cats are more sensitive to lidocaine (CNS signs, methemoglobinemia); always aspirate before injecting any local anesthetic."},
{c:"Pharmacology", q:"Why is prednisolone, rather than prednisone, recommended in cats?",
 o:["Cats poorly convert prednisone to the active metabolite prednisolone in the liver, so prednisolone achieves far higher and more reliable plasma levels","Prednisone causes blindness in cats","Prednisolone is cheaper","Prednisone is a prodrug only in dogs"],
 e:"Oral prednisone gives low and variable prednisolone concentrations in cats (and in horses). Likewise, cats need higher glucocorticoid doses per kg than dogs because they have fewer glucocorticoid receptors. Dexamethasone and methylprednisolone are also active without conversion."},
{c:"Pharmacology", q:"A 20 kg dog needs enrofloxacin 5 mg/kg PO q24h. Tablets contain 50 mg. How many tablets per dose?",
 o:["2 tablets","1 tablet","4 tablets","0.5 tablet"],
 e:"5 mg/kg x 20 kg = 100 mg per dose = 2 x 50 mg tablets. Remember fluoroquinolones are reserved for culture-based indications, avoided in growing dogs (cartilage) and in cats limited to <=5 mg/kg/day because of retinal toxicity."},
{c:"Pharmacology", q:"A cat with CKD has a poor appetite and nausea. Which appetite stimulant is licensed/commonly used in cats, with its typical regimen?",
 o:["Mirtazapine (transdermal 2 mg per cat on the inner pinna q24h, or 1.88 mg PO every 48 h in CKD) or capromorelin oral solution; control nausea with maropitant first","Cyproheptadine IV","Diazepam PO","Dexamethasone daily"],
 e:"Transdermal mirtazapine avoids pilling and improved weight in CKD cats; the dosing interval is lengthened in renal/hepatic disease. Oral diazepam is hepatotoxic in cats. Address uremic gastritis (maropitant, omeprazole only if needed) and offer warmed, palatable renal diets."},
{c:"Pharmacology", q:"Which antimicrobials are classed as 'highest priority critically important' for human medicine and should be reserved as second- or third-line drugs in small animal practice?",
 o:["Fluoroquinolones, third/fourth-generation cephalosporins (e.g., cefovecin) and macrolides; carbapenems and vancomycin should essentially not be used in animals","Amoxicillin and clindamycin","Tetracyclines and sulfonamides","Metronidazole"],
 e:"Antimicrobial stewardship: use culture and susceptibility, choose first-tier agents (amoxicillin, amoxicillin-clavulanate, cefalexin, clindamycin, TMS, doxycycline), limit injectable long-acting cephalosporins for convenience, and never use carbapenems or vancomycin without specialist justification. Gulf-region regulators increasingly audit antimicrobial prescribing."},
// ---------- ZOONOSES & RABIES ----------
{c:"Zoonoses/Rabies", q:"What is the earliest recommended age for the first rabies vaccination of a puppy or kitten, and when is the first booster due?",
 o:["12 weeks of age (some products from 8-12 weeks per label); booster at 1 year, then according to the product label and local law (annual registration vaccination in UAE emirates)","6 weeks; booster at 6 months","6 months; booster every 5 years","At birth"],
 e:"Maternal antibody interference and product licensing determine the 12-week minimum; the animal is considered immunized 28 days after the primary vaccine. Travel and municipal registration require documentation (microchip number on the certificate) and valid dates."},
{c:"Zoonoses/Rabies", q:"A family returns from a beach holiday with serpiginous, itchy tracks on their feet. Which canine parasite is responsible and how does the veterinarian help prevent it?",
 o:["Ancylostoma spp. (hookworm) larvae causing cutaneous larva migrans; regular deworming of dogs and removal of feces from beaches/parks","Toxocara canis","Dirofilaria immitis","Giardia"],
 e:"Hookworm larvae in sand penetrate human skin. Dogs in warm climates should be dewormed regularly (monthly products often include milbemycin/pyrantel) and feces picked up promptly. Toxocara causes visceral/ocular larva migrans via egg ingestion, not skin tracks."},
{c:"Zoonoses/Rabies", q:"A client receiving chemotherapy asks what precautions to take with their cat. Which zoonoses are most relevant for immunocompromised owners and what practical advice applies?",
 o:["Bartonella (flea control, avoid scratches/bites), Toxoplasma (litter hygiene, no raw feeding), Salmonella/Campylobacter (no raw diets), dermatophytes; keep the cat indoors, control fleas, wash hands, and never advise rehoming as a first step","Rabies only","No zoonoses are relevant for cat owners","Leishmania via direct contact"],
 e:"Pet ownership benefits outweigh risks with simple measures; veterinarians should coordinate with the client's physician. Cats should be screened and treated for parasites, kept indoors, fed commercial diets, and litter should be changed daily by someone else with gloves."},
{c:"Zoonoses/Rabies", q:"Methicillin-resistant Staphylococcus pseudintermedius (MRSP) is cultured from a dog's chronic pyoderma. What is the public health counseling?",
 o:["MRSP rarely causes human infection but can colonize owners and staff; treat the dog with topical antiseptics (chlorhexidine) +/- a culture-guided systemic drug, practice hand hygiene and glove use, and inform clients with wounds or immunosuppression","The dog must be euthanized","No precautions are needed","Treat with cefovecin because it is methicillin-resistant"],
 e:"Methicillin resistance means ALL beta-lactams (including cefovecin) are ineffective. MRSP is a veterinary hospital hygiene concern; topical therapy alone often suffices for superficial pyoderma. Humans are colonized transiently; reverse zoonosis from MRSA-positive owners also occurs."},
{c:"Zoonoses/Rabies", q:"A toddler passes motile rice-grain segments in the stool; the family dog has fleas. Which parasite and which advice?",
 o:["Dipylidium caninum acquired by accidental ingestion of an infected flea; praziquantel for the dog and strict flea control for pets and home, medical treatment for the child","Echinococcus granulosus from dog feces","Toxocara canis","Giardia"],
 e:"Dipylidium needs the flea (or louse) as intermediate host; the dog's proglottids are not directly infective. Flea control breaks the cycle. Echinococcus eggs cause hydatid disease, not tapeworm segments in the child."},
{c:"Zoonoses/Rabies", q:"What is the recommended rabies protection for veterinary staff working in a rabies-endemic region such as the Gulf?",
 o:["Pre-exposure vaccination (primary series), with periodic titer checks and a booster if the titer falls below 0.5 IU/mL; any bite from a suspect animal still requires wound washing and medical evaluation (PEP without immunoglobulin for vaccinated people)","No vaccination is necessary for staff","A single lifetime dose","Vaccinate only after a bite"],
 e:"Pre-exposure prophylaxis simplifies PEP (two booster doses, no rabies immunoglobulin) and protects against unrecognized exposures. Clinics should keep staff vaccination records, PPE for handling suspects (catch poles, gloves, eye protection) and reporting protocols."},
// ---------- VECTOR-BORNE & HEAT ----------
{c:"Vector-borne/Heat", q:"Which clinical findings distinguish the ACUTE phase of canine monocytic ehrlichiosis from the chronic phase?",
 o:["Acute (1-3 weeks post-tick bite): fever, lymphadenopathy, thrombocytopenia with normal or mildly low WBC, often responsive to doxycycline; chronic: pancytopenia from bone marrow hypoplasia, hyperglobulinemia, bleeding, poor prognosis","Acute phase has pancytopenia; chronic has thrombocytosis","There is no difference","Acute phase shows hyperglobulinemia only"],
 e:"After the acute phase, dogs enter a subclinical phase (months to years, persistent thrombocytopenia) and some progress to the chronic severe form. Morulae in monocytes are seen only in the acute phase; serology lags 1-3 weeks, so PCR is preferred early. Treat all seropositive clinically or hematologically abnormal dogs with doxycycline for 28 days."},
{c:"Vector-borne/Heat", q:"A heartworm-positive dog presents with acute weakness, hemoglobinuria, a right-sided murmur and marked jugular distension. Diagnosis and treatment?",
 o:["Caval syndrome (worms in the right atrium/tricuspid valve causing intravascular hemolysis); emergency surgical extraction via the jugular vein with flexible forceps, then adulticide therapy later","Babesiosis; imidocarb","IMHA; prednisolone","Standard melarsomine protocol immediately"],
 e:"Caval syndrome is a mechanical obstruction with hemolysis and shock; melarsomine without extraction is fatal. Echocardiography shows the worm mass. Prevent with year-round macrocyclic lactones, which is practical in the Gulf where mosquito activity is prolonged."},
{c:"Vector-borne/Heat", q:"A dog on long-term allopurinol for leishmaniosis develops hematuria and radiolucent cystoliths. Most likely cause and management?",
 o:["Xanthine urolithiasis (allopurinol blocks xanthine oxidase); reduce/stop allopurinol if the dog is in remission, feed a low-purine diet, increase water intake, and remove obstructive stones","Struvite; antibiotics","Calcium oxalate; stop the renal diet","Cystine; tiopronin"],
 e:"Xanthine stones occur in up to 15% of dogs on allopurinol; monitor urine sediment for xanthine crystals every 3-6 months. Allopurinol dose reduction must be balanced against relapse risk; follow-up serology, electrophoresis and UPC guide decisions."},
{c:"Vector-borne/Heat", q:"A police K9 unit in Abu Dhabi asks how to reduce the risk of exertional heatstroke in working dogs during summer. Best advice?",
 o:["Gradual acclimatization over 2-3 weeks, work in the coolest hours, frequent breaks with shade and water, pre-/post-exercise cooling (wetting), monitoring rectal temperature, and excluding dogs with previous heatstroke or airway disease from heavy work","Give NSAIDs before exercise","Shave the coat completely","Restrict water before work to avoid vomiting"],
 e:"Exertional heatstroke is the most common form in working and sporting dogs; acclimatization improves thermoregulation, and previous heatstroke is a strong risk factor for recurrence. Shaving double-coated breeds can impair insulation from radiant heat; water restriction is dangerous."},
{c:"Vector-borne/Heat", q:"When are Phlebotomus sandflies most active, and what practical advice reduces Leishmania exposure for dogs in endemic areas?",
 o:["From dusk to dawn in the warm months; keep dogs indoors at night, use pyrethroid-impregnated collars (deltamethrin, flumethrin) or permethrin spot-ons, and avoid organic debris/damp microhabitats where sandflies breed","Midday in winter; use mosquito nets only","They are active year-round indoors only","Sandflies are not relevant to leishmaniosis"],
 e:"Sandflies are weak fliers active in low wind at night; they breed in organic matter rather than water. Repellent products reduce infection by >80-90% and are also advised for cats and ferrets in endemic regions. Vaccines (where licensed) reduce clinical disease but not infection."},
{c:"Vector-borne/Heat", q:"A dog with Rhipicephalus ticks develops fever, lethargy and polyarthritis; PCR is positive for Rickettsia conorii. Why is this clinically important beyond the dog?",
 o:["R. conorii causes Mediterranean spotted fever in people; dogs act as sentinels/reservoir-amplifiers and bring infected ticks into homes; treat with doxycycline and enforce tick control","It is not zoonotic","It is transmitted by sandflies","Only cats are affected"],
 e:"Spotted fever group rickettsioses are endemic around the Mediterranean, Middle East and Africa; the brown dog tick transmits R. conorii to humans. Dogs are usually subclinical but can show fever, thrombocytopenia and arthritis. Doxycycline is effective; tick control protects the family."},
// ---------- CARDIO-RESPIRATORY ----------
{c:"Cardiorespiratory", q:"A 4-year-old asymptomatic cat has a grade II/VI systolic murmur detected at vaccination. Which statement is correct?",
 o:["Murmurs in cats are often dynamic/physiologic, but a gallop sound or arrhythmia is highly specific for cardiac disease; echocardiography (or NT-proBNP as a screen) is recommended before anesthesia or breeding","All feline murmurs indicate HCM","No murmur means no cardiomyopathy","Treatment with furosemide should start now"],
 e:"About 20-50% of murmurs in healthy cats are not associated with structural disease, while many HCM cats have no murmur. Gallops (S3/S4) and arrhythmias are red flags. Screening echocardiography identifies subclinical HCM, which matters for anesthetic planning and clopidogrel prophylaxis when the LA is enlarged."},
{c:"Cardiorespiratory", q:"A 6-year-old Dobermann presents with lethargy and an episode of collapse; echocardiography shows a dilated, poorly contractile left ventricle (FS 12%), and the Holter shows 2,000 VPCs/24 h. Which treatment has evidence to delay heart failure in preclinical DCM?",
 o:["Pimobendan (PROTECT study), plus an ACE inhibitor; antiarrhythmics (sotalol/mexiletine) if ventricular arrhythmias are complex","Furosemide and digoxin only","Beta-blocker alone","No treatment until signs of CHF appear"],
 e:"Dobermann DCM is a genetic disease (PDK4 and titin variants) with sudden death risk; annual Holter and echo screening from 3 years of age is advised. Taurine-responsive DCM occurs in Cockers/Golden Retrievers and with certain diets; diet history is essential."},
{c:"Cardiorespiratory", q:"An owner describes a Boxer that 'faints' during excitement: sudden flaccid collapse, pale gums, no urination, and recovery within seconds. Which features point to syncope rather than a seizure?",
 o:["Brief, exercise/excitement-triggered, flaccid collapse with rapid full recovery and no pre- or post-ictal phase or autonomic signs (salivation, urination)","Tonic-clonic movements with hypersalivation","A prolonged post-event disorientation","Occurrence during sleep"],
 e:"Syncope results from transient cerebral hypoperfusion (arrhythmias such as Boxer ARVC ventricular tachycardia, sick sinus syndrome, outflow obstruction, pulmonary hypertension). Workup: ECG, Holter/event monitor, echocardiography. Seizures show pre/post-ictal phases and rhythmic motor activity."},
{c:"Cardiorespiratory", q:"A Great Dane in heart failure has an irregularly irregular rhythm with absent P waves at 220 bpm. Appropriate rate control?",
 o:["Atrial fibrillation: diltiazem +/- digoxin for ventricular rate control (target <125-140 bpm on Holter), plus CHF therapy; electrical cardioversion only in lone AF with structurally normal hearts","Lidocaine IV","Atropine","Beta-blocker IV bolus at high dose"],
 e:"AF in giant breeds is usually secondary to DCM/atrial enlargement; rate control is the goal. Beta-blockers given aggressively worsen systolic failure; lidocaine is for ventricular arrhythmias. Combination diltiazem + digoxin controls rate better than either alone."},
{c:"Cardiorespiratory", q:"A 15-year-old cat is presented for acute blindness; fundic examination shows retinal detachment and hemorrhages, and systolic BP is 230 mmHg. Treatment and prognosis?",
 o:["Amlodipine 0.625-1.25 mg/cat PO q24h (adding telmisartan if needed) to lower BP below 160 mmHg, and investigate underlying CKD/hyperthyroidism/hyperaldosteronism; vision may partially return if treated within days","Prednisolone","Furosemide","No treatment; blindness is permanent in all cases"],
 e:"Systemic hypertension (>160-180 mmHg) damages target organs: eyes, kidneys, brain, heart. Amlodipine is first-line in cats; in dogs with proteinuric hypertension ACE inhibitors/ARBs come first. Reattachment can occur with rapid control but photoreceptor loss limits recovery."},
{c:"Cardiorespiratory", q:"A 12-year-old Labrador has progressive inspiratory stridor, exercise intolerance, a changed bark and heat intolerance; laryngoscopy under light anesthesia shows absent arytenoid abduction. Diagnosis and management?",
 o:["Laryngeal paralysis (often part of geriatric-onset laryngeal paralysis-polyneuropathy); unilateral arytenoid lateralization ('tie-back') for severe cases, with lifelong aspiration pneumonia risk; avoid heat, use a harness, sedation in crises","Tracheal collapse; stent","Feline asthma; inhalers","Kennel cough; antibiotics"],
 e:"Laryngeal paralysis causes life-threatening airway obstruction crises in hot weather (very relevant in the Gulf). Emergency: sedation (butorphanol/acepromazine), oxygen, cooling, intubation or temporary tracheostomy if needed. Surgery relieves obstruction but increases aspiration risk (~20%)."},
// ---------- NEURO / OPHTHO / ORTHO ----------
{c:"Neuro/Ophtho/Ortho", q:"A dog develops exercise-induced weakness that improves with rest, plus regurgitation from megaesophagus. Which diagnostic test confirms the most likely cause?",
 o:["Serum acetylcholine receptor antibody titer (acquired myasthenia gravis); edrophonium (Tensilon) response test supports the diagnosis; treat with pyridostigmine","Electromyography alone","MRI of the brain","Creatine kinase"],
 e:"Acquired MG is autoimmune (anti-AChR antibodies, >98% specific); focal forms (megaesophagus/pharyngeal) and generalized forms occur. Thymoma must be excluded (thoracic radiographs). Aspiration pneumonia is the main cause of death; immunosuppression (prednisolone, mycophenolate) is added when needed."},
{c:"Neuro/Ophtho/Ortho", q:"A Shih Tzu has bilateral mucoid ocular discharge, conjunctival hyperemia and a dull cornea; Schirmer tear test is 4 mm/min in both eyes. Diagnosis and long-term treatment?",
 o:["Keratoconjunctivitis sicca (immune-mediated dry eye); topical ciclosporin or tacrolimus (lacrimostimulant) long term plus tear substitutes, antibiotics for secondary infection","Bacterial conjunctivitis; antibiotics for 7 days","Entropion; surgery","Glaucoma; latanoprost"],
 e:"Normal STT is >=15 mm/min; <10 with compatible signs confirms KCS. Most cases are immune-mediated (brachycephalics, Cockers, Westies); other causes include TMS toxicity, neurogenic KCS and previous cherry-eye gland excision. Parotid duct transposition for refractory cases."},
{c:"Neuro/Ophtho/Ortho", q:"A dog has a unilateral drooping lip and ear, inability to blink, and a dry eye on the same side. Localization and common causes?",
 o:["Facial nerve (CN VII) paralysis; otitis media/interna, idiopathic (Cocker Spaniels), hypothyroidism, trauma; protect the cornea with lubricants","Trigeminal (CN V) paralysis; dropped jaw","Vestibular disease","Horner's syndrome"],
 e:"CN VII supplies facial muscles and parasympathetic fibers to the lacrimal gland (hence KCS). Check the ear (otoscopy, bulla imaging) and T4. Trigeminal neuropathy causes a dropped jaw with inability to close the mouth; Horner's affects the eye (miosis, ptosis) without facial droop."},
{c:"Neuro/Ophtho/Ortho", q:"An 8-year-old Rottweiler has progressive lameness and a painful swelling of the distal radius; radiographs show a lytic-proliferative lesion with a sunburst periosteal reaction. Most likely diagnosis, staging and treatment?",
 o:["Appendicular osteosarcoma; thoracic CT/radiographs for metastases, biopsy optional; amputation (or limb-sparing) followed by carboplatin chemotherapy gives a median survival of ~10-12 months","Panosteitis; NSAIDs","Hypertrophic osteopathy; treat the thoracic mass","Osteomyelitis; antibiotics"],
 e:"Osteosarcoma affects the metaphyses of large/giant breeds ('away from the elbow, toward the knee'); amputation alone gives ~4-5 months, chemotherapy extends survival; pulmonary metastasis is the usual cause of death. Pathologic fracture risk is high - avoid stress on the limb."},
{c:"Neuro/Ophtho/Ortho", q:"A young adult dog has fever, shifting lameness and multiple swollen joints; arthrocentesis shows non-degenerate neutrophils with negative culture, and radiographs show no erosions. Diagnosis and treatment?",
 o:["Immune-mediated polyarthritis (non-erosive, type I idiopathic); after excluding infection, tick-borne disease and neoplasia, immunosuppressive prednisolone +/- a second agent (ciclosporin, leflunomide)","Septic arthritis; cefazolin","Osteoarthritis; NSAIDs","Rheumatoid arthritis; gold salts"],
 e:"Non-erosive IMPA is the most common cause of sterile polyarthritis; septic arthritis is usually monoarticular with degenerate neutrophils and bacteria. In the Middle East always run Ehrlichia/Leishmania/Rickettsia testing before steroids. Erosive (rheumatoid-like) arthritis shows radiographic destruction."},
{c:"Neuro/Ophtho/Ortho", q:"A 10-month-old Beagle has cyclic fever, severe cervical pain and a stiff neck; CSF shows marked neutrophilic pleocytosis with negative culture. Diagnosis and treatment?",
 o:["Steroid-responsive meningitis-arteritis (SRMA); prednisolone starting at 2-4 mg/kg/day and tapered over 6 months; serum/CSF IgA elevated","Bacterial meningitis; ampicillin","Cervical disc disease; surgery","Discospondylitis; antibiotics for 8 weeks"],
 e:"SRMA is an immune-mediated vasculitis of young dogs (Beagles, Boxers, Bernese Mountain Dogs, Weimaraners); it responds dramatically to glucocorticoids but relapses in ~20%. Bacterial meningitis is rare in dogs; discospondylitis shows endplate lysis on radiographs/MRI."},
{c:"Neuro/Ophtho/Ortho", q:"A 6-month-old Bulldog has a smooth pink mass protruding from the medial canthus ('cherry eye'). Recommended treatment?",
 o:["Surgical replacement (pocket or anchoring technique) of the prolapsed nictitans gland, never excision, to preserve ~30-40% of tear production","Excision of the gland","Topical antibiotics until it shrinks","Enucleation"],
 e:"The third-eyelid gland contributes substantially to the aqueous tear film; excising it predisposes to KCS later in life, particularly in brachycephalic breeds already prone to dry eye."}
);

{c:"Antimicrobials", q:"Trimethoprim-sulfonamide dose and monitoring?",

{c:"Antimicrobials", q:"Amikacin: dosing regimen and safety requirements?",
 o:["15-20 mg/kg (dogs) / 10-14 mg/kg (cats) IV/SC ONCE daily; only in well-hydrated patients with normal renal function, monitoring urine sediment for casts; never with NSAIDs or furosemide","5 mg/kg q8h; safe in dehydrated patients","50 mg/kg PO q12h","2 mg/kg IM weekly"],

{c:"Analgesics & NSAIDs", q:"Carprofen: dose and a well-known idiosyncratic adverse effect?",
